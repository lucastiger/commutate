name: audit
# Tripwire for the one privileged actor: the orchestrator's bot may push state commits directly
# to main. This job fails (and GitHub emails you) if any direct commit touched anything else.
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      # Own interpreter: ubuntu-latest is moving to Ubuntu 26, whose system Python refuses a bare `pip install`
      # (PEP 668); the job then failed on every push from 2026-11-02 11:48 UTC while the audit itself was clean.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml && python scripts/audit_main.py --since "2 days ago"
