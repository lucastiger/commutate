name: ci
on:
  pull_request:
  push:
    branches: [main]
    # The orchestrator commits state ticks (project/, experiments/) to main many times a day. They change no code,
    # so they do not need the 20-minute full gate; .github/workflows/state.yml runs `mfos doctor --ci` on them.
    # A push that also touches code still runs this workflow. Pull requests and the nightly run are unchanged.
    paths-ignore:
      - "project/**"
      - "experiments/results/**"
      - "experiments/specs/**"
      - "experiments/drafts/**"
      - "experiments/registry.jsonl"
  schedule:
    - cron: "17 6 * * *"   # nightly full gate on main
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q tests
      - run: uv run python scripts/check_licenses.py
      - run: uv run mfos doctor --ci
