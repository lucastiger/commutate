subject: '[O006] approve initial plan (8 tasks)'
summary: 'O006 is active with no build work yet: no thermal solver, no die-attach or SiC layers, and pyamg,
  scikit-fem and sympy are not dependencies. Of $90, $78.70 remains, and only the draft-review tasks exist.
  The most likely ways the hypothesis dies are A4 and A3. A4 needs a grid convergence index of at most
  0.025 K, which is 2.5e-4 of a 100 K rise. That is hard to reach on affordable grids, because the die,
  die-attach and copper corners lower the observed order and push Fs to 3. A3 has the same risk on the
  scikit-fem side: at about 7.7 kB per DOF it may not converge to 0.025 K on this Mac, and the fallback
  would then fail its own test. So this plan front-loads both kill shots. The FV layout task (n3) and
  the scikit-fem task (n5) each ship a convergence and cost benchmark on the two A3 layouts (seed 20261101)
  at a 60-110 K rise. The next plan reads those results before E006 is designed. The analytic references
  (n4: Muzychka series and the N-layer series; n6: the symbolic manufactured solution) are separate scientist
  tasks. They must pass their own F1 self-checks and never import the solver, so they stay independent.
  Pilots P3 and P4 start now (P3 has no dependencies) because D0009''s day-60 band input (2026-11-27)
  depends on them; P4 reuses P3''s 2D_Case_4 reconstruction so both compare the same geometry. The limit
  of 8 tasks leaves some work for the next plan: the E006 design task, the E006 experiment, P1 (needs
  n3) and P2. evidence_complete is therefore false. That plan should also check whether A3''s condition
  on scikit-fem''s own GCI and A4''s column maximum can be recomputed with the existing mfos.metrics functions;
  if not, it raises a founder request for a protected change. Budget is tight: these 8 tasks total $49.50
  before critic reviews, which leaves about $29 for the E006 design, P1, P2 and repairs.'
