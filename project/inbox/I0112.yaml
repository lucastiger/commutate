  run that has a single evaluation. The exposure on E009''s fresh layouts looks low, because every lateral
  geometry edge from the generator lies on the 0.5 mm design grid and layout mode adds no mandatory lines.
  The reference-case grids are the same ones T0207 now screens under the founder''s >300-iteration eligibility
  rule. The guard is still cheap and the diagnosis recommends it. It has to live in production thermal_fem,
  not in a runner patch, because O003 inherits this code under code_must_match. So the plan adds one small
  builder task that only exposes CG iterations and final residuals; it changes no numerics. Two founder
  requests cover the rest: wiring the guard into the held T0208 brief and its dependencies, which I cannot
  amend myself, and the orchestrator bookkeeping gap in a protected path. Evidence is complete: E009 already
  has its design task (T0208) and its experiment task (T0209).'
