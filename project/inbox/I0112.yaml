summary: 'O007 has no evaluation yet ($40.41 of $70 spent, 0 of 1 evaluations used, replans 3/3). The
  trigger was T0216''s attempt 3, which diagnosis T0218 put in the infrastructure class: the founder stopped
  the run on purpose, and the orchestrator recorded the stop as agent_error. T0216 is done, and its DoD
