  2026-11-22 start)'
recommendation: Option 1. It meets 'at least 4 pairs' with measured values, it keeps the 2026-11-22 start,
  and the near-0.02 values are already recorded as a risk to F1(c). Approve only the registration item
  filed after T0324 merges, and close the older ones as superseded.
