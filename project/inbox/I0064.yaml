- Add (a)-(c) as specified
- Add them under other names (n2 will use whatever is in METRICS)
- 'Exempt A1/A3/A4 from recompute with written reasons (not recommended: weaker evidence)'
recommendation: Add (a)-(c) with tests before T0150/T0152 finish, so n2 is not blocked.
status: approved
