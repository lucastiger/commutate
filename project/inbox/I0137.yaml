  in absolute terms, not by a fixed count per layer (T0198): (a) reproduces the frozen, converged reference
  solutions of O006 (Muzychka, Culham & Yovanovich 2003 Cases 1a, 1b, 2 and 3; the N-layer Fourier series
  for the default stack with die attach and SiC die and several die-sized sources; the 3D manufactured
  solution on the default stack geometry with patterned top copper and k varying by at least 30 % within
  one layer, k_max/k_min - 1 >= 0.30) within 1 % of each case''s scale and within 0.05 K; (b) agrees with
  the in-house finite-volume L2 of D0006 (solvers.thermal_fv / thermal_layout at its own frozen rule,
