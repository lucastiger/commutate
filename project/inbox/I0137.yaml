  O003''s operating point (hottest die 60 K above the coolant), within the two solvers'' combined conservative
  discretisation estimates; and (c) has a conservative discretisation estimate (O006''s A4 estimator,
  D0012/D0013) of at most 0.5 K for every reported value. On generator geometry the 0.5 K bounds the discretisation
