summary: 'Path (a) rests on an extrapolation: T0225 put the N-layer L2 error at 0.039 K against a 0.040
  K margin, which requires the observed order to stay at or above 1.93. Two kill shots can be measured
  now, before any agent spend, with commands that are already on main. (1) The probe burst, scripts/burst_gcp.sh
  --cmd "uv run python research/scripts/o007_probe.py --full" research/o007_probe (about 57 GB peak; resumes
  from cache). It measures N-layer L2 for options (a) and (b) under the probe''s pre-registered go rule:
  measured error at most 0.040 K and CG at most 300. (2) The L2 cross-check burst, scripts/burst_gcp.sh
  --cmd "uv run python research/scripts/o007_l2_preview.py --full --out research/o007_l2/full.json" research/o007_l2.
  It measures F5, the in-house L2''s GCI at levels 1-3, on the dev layouts; F5 has only been predicted
  so far and would cap A3. If (1) shows (a) no_go at level 2, I recommend cancelling n1-n4 and taking
  the I0115 (c)/(d) decision, since no replans remain. If (b)''s measured L2 is good in that case, (b)
  still needs a snap-policy builder task that is outside this plan. Later, n2''s own burst (its plan.json
  burst_command; the script must be on main first) is needed before n3 can start, because n3''s done-check
  requires frozen_config feasible: true. Budget: about $19 of tasks plus about $6 of reviews against $29.50,
  so there is little margin for a repair attempt.'
