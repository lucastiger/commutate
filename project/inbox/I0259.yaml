summary: 'Draft statement (the hypothesis): On DRC-valid wire-bonded half-bridge layouts from moduleforge.generate
  on the default DBC stack (with die-attach and SiC die layers), with one die size per (family, dies)
  stratum (the derivative regime: the die is fixed), in steady state with temperature-dependent conductivity,
  coolant at 65 °C and a uniform heat-transfer coefficient of 5000 W/(m² K) at the baseplate, at two load
  levels (P_ref, equal power per die such that the hottest node of the stratum''s development layout rises
  60 K above the coolant at the reference''s level 0, the calibration rule of claim C004; and 0.5 P_ref),
  a fast L1 thermal model (median at most 1 s per evaluation on one core) predicts, against the verified
  scikit-fem thermal reference of claim C004 and at each load level, for the die-average junction temperature
  (the yardstick): the difference between two layouts of the same stratum within 0.5 K; each die''s value
  within 3 % of its die-local rise; and the spread across each switch''s paralleled dies within 1 K and
  within half the error of a stratum-mean predictor (each as a 95th percentile, upper 95 % bound), on
  fresh sealed seeds. The claim is for these criteria jointly: A3 (spread within 1 K) and A5 (speed) are
  each met by a layout-ignorant predictor on their own; A1 and A4 are the criteria that separate L1 from
  the F2 nulls (reviews T0371, T0372).

  Scope from the sampled domain: Sampled: coolant_K: 338.15; cpu: x86_64; die_size_mm: 4.0, 4.5, 5.0,
  5.5; dies_per_switch: 2, 3, 4, 5, 6; family: interleaved, side_by_side, u_shaped; h_W_m2K: 5000.0; judged_level:
  1; load: P_ref, half_P_ref; stack: default DBC (Al2O3 0.38 mm) with SAC305 die attach and 4H-SiC die.
  Declared scope_in (not checked against the samples): generator families of moduleforge.generate, 2-6
