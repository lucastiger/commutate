  h = 5000 W/(m² K) at the baseplate bottom; equal power per die, uniform over each die''s top area, at
  P_ref and 0.5 P_ref per stratum, P_ref fixed before any judged solve by the calibration rule above;
  Tj at P_ref within the SiC rating (sanity check); the yardstick is each die''s average junction temperature
  over its top face (a Galerkin integral on the reference, the L1 model''s own average), with the spread
  per switch over its paralleled dies; the hottest die of a layout is the die the reference ranks hottest
