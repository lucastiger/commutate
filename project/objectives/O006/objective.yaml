id: O006
title: The thermal L2 reference matches converged analytic solutions and an independent FEM, and design pilots measure what O002-O004 must fix
kind: build
priority: 1
risk: medium
depends_on: []
unlocks: [O002, O003, O004]
hypothesis:
  statement: >-
    The in-house finite-volume thermal L2 solver of D0006 (steady state, k(T) by Picard iteration, uniform h at the
    baseplate, layer- and edge-conforming rectilinear grid, numpy/scipy/pyamg), with die-attach and SiC die layers added
    to LayerStack, on grids from its frozen grid rule: (a) reproduces frozen, converged reference solutions (the
    single- and two-layer rectangular flux-channel series of Muzychka, Culham & Yovanovich 2003, Cases 1a, 1b, 2 and 3; an
    N-layer Fourier series for the default stack with die attach and SiC die and several die-sized sources; a 3D
    manufactured solution on the default stack geometry with patterned top copper and k varying by at least 30 % within
    one layer, k_max/k_min - 1 >= 0.30) within
    1 % of each case's scale and within 0.05 K; (b) agrees with an independent scikit-fem solution on five generator
    layouts with discrete die islands, die-attach footprints and patterned copper (two development layouts and three
    fresh layouts, one per generator family), at O003's operating point (hottest die 60 K above the coolant), within the
    two solvers' combined conservative discretisation estimates; and (c) has a conservative discretisation estimate (grid
    convergence index with assumed order at most 1, D0012 and D0013) of at most 0.5 K for every reported value on those
    layouts. On generator geometry the 0.5 K bounds the discretisation error; accuracy there is checked by (b).
  null_hypothesis: >-
    The in-house thermal L2 cannot be verified on generator geometry at O003's operating point to 0.5 K per Tj value (at
    most 1 K on a two-layout difference); D0006's fallback (scikit-fem) or another reference is required.
  why_it_matters: >-
    O003 judges a re-layout's Tj max against its reference's within +2 K at a 60 K hottest-die rise (D0010). The error
    of that judgement lives in the spreading part of the rise, set by die islands, die-attach footprints and copper
    edges, whose corner singularities (exponents 0.84 and 0.52) hold the attainable grid order near 1 (T0170, T0181).
    With 0.5 K per value, O003's two-layout difference inherits up to 1.0 K, which O003 deducts in its Tj check
    (GCI_ref + GCI_best, D0013). This objective verifies the thermal reference to that precision on that geometry, and
    runs the design pilots as exploratory work so O002, O003 and O004 can be finalised with measured parameters
    (founder decision 2026-11-01). It does not verify O002's draft precision (0.5 K pair differences); O002 is
    re-derived from this objective's output (D0012). Draft reviews T0137-T0140 and re-reviews T0184/T0185 shaped the
    criteria.
  decision_if_pass: >-
    Use the verified thermal L2 (code_must_match on this evaluation) and its grid rule as the thermal reference of O003,
    each run carrying its own GCI (meta['solver_tol'], computed with A4's estimator) into O003's Tj check; re-derive O002 against this verified
    precision before it uses the L2 as its reference; finalise O002 and O004 from the pilot notes and run one final
    draft review of each.
  decision_if_fail: >-
    Switch the thermal reference to D0006's fallback (scikit-fem) and verify it under a new experiment id; the pilots'
    findings still inform O002, O003 and O004.
  decision_if_inconclusive: >-
    If A1, A2 and A4 are met and only A3 is not: diagnose which solver is wrong (mf-diagnosis, e.g. a finer scikit-fem
    grid or a third method on the worst die) before any switch; founder decision. If only A2 is missed, only on the
    manufactured case, by less than K2's 0.25 K, and that case's own GCI is at least the miss: a discretisation shortfall
    on a smooth case rather than a model error; founder decision on refining that case under a new experiment id
    instead of the fallback. Otherwise same as fail.
scope_in:
  - steady-state conduction; laterally uniform multilayer stacks and the default DBC stack plus die attach and SiC die
    with patterned top copper, die islands and die-attach footprints; constant and temperature-dependent k
  - the reference solutions named in the hypothesis, each implemented independently of the solver (own code, converged,
    frozen before the first solver comparison)
  - grids produced by the solver's grid rule (cells per layer thickness, lateral cell size relative to sources and copper
    features), frozen in the solver before E006 registration and reused unchanged by O002 and O003; the solver's own
    meta['solver_tol'] computes A4's estimator (thermal_layout.gci_three_grid identical to mfos.metrics.gci_capped,
    tested) before E006 registration, so that code_must_match carries the verified estimator
  - O003's operating point on every generator layout (the A3 layouts and A4's fresh layouts), namely 65 °C coolant,
    h = 5000 W/(m² K), k(T), equal power per die fixed per layout before the comparison from an L2 level-0 solve so that
    the hottest die rises 60 K (+/- 1 K) above the coolant, then used unchanged by both solvers and on every grid
scope_out:
  - transient conduction; convection inside the cold plate; the L1 thermal model (O002)
  - any sealed evaluation of O002, O003 or O004 (the pilots below are exploratory design work, never evidence)
evidence_plan: [E006]
acceptance:
  required_experiments: [E006]
  pass_all:
    - {id: A1, metric: E006.max_case_scaled_err, comparator: "<=", threshold: 0.01, uncertainty: {use: point},
       description: "max over the reference cases of (max over the case's reported points of |T_L2 - T_ref|) / the case's scale; scale = the largest spreading rise (rise above the 1D uniform-flux solution, taken at each source's maximum) among the case's sources, or for the manufactured case the range of the manufactured field; points = each source's centroid and mean and the reference field's maximum over each source, the L2 value at a point taken from the reconstructed surface temperature (T_c + q dz / 2k) interpolated bilinearly (second order); finest grid only. A2 usually binds first; A1 guards cases with small rises"}
    - {id: A2, metric: E006.max_abs_err_K, comparator: "<=", threshold: 0.05, uncertainty: {use: point},
       description: "max over the same cases and points of |T_L2 - T_ref| in K, the N-layer and manufactured cases at O002-like rises of 60-110 K. These fields are corner-free (laterally uniform series, smooth manufactured solution), so A1/A2 measure the solver's accuracy where the exact answer is known; the corner-dominated error on generator geometry is bounded by A3 and A4"}
    - {id: A3, metric: E006.max_skfem_consistency, comparator: "<=", threshold: 1.0, uncertainty: {use: point},
       description: "max over two generator layouts and every die of |Tj max (L2) - Tj max (scikit-fem)| / (GCI_L2 + GCI_skfem), each GCI by the A4 estimator from that solver's own three grids and recomputed from the grid values in the rows (recompute: mfos.metrics max_gci_consistency, params pred_levels and ref_levels naming the three grid columns of each solver, coarsest first, and ref_extra naming scikit-fem's through-thickness term; a divergent sequence on either side, or a zero summed estimate with a nonzero difference, gives +inf, A3 not met): the two independent solvers agree within their combined conservative error estimates; at O003's operating point (scope_in), with k(T); scikit-fem's estimate is its lateral three-grid GCI plus 1.25 |dTj_z|, the change in each die's Tj max when every layer's through-thickness cell count is doubled on its level-1 lateral grid (column skfem_z); layouts: the two development layouts (the first DRC-valid side_by_side layout with dies_per_switch = 6 and the first u_shaped layout with dies_per_switch = 2 from dev seed 20261101) and A4's three fresh sealed-seed layouts; per die, the detectable bias (summed estimate - |difference|) is reported; scikit-fem builds its mesh, materials and boundary conditions from the Layout with its own code (not the FV grid builder), on a refined conforming hexahedral grid, with its own Picard loop; its convergence is a sanity check (F5), not a criterion; covers die islands, die-attach footprints, copper edges and the baseplate overhang the analytic cases lack"}
    - {id: A4, metric: E006.max_conservative_gci_K, comparator: "<=", threshold: 0.5, uncertainty: {use: point},
       description: "max over every reported L2 value of its grid convergence index, recomputed from the three grid values in the rows (recompute: mfos.metrics max_gci_capped, params levels naming the three grid columns, coarsest first); reported values: the finest-grid values of the reference cases, the dies of the two A3 layouts, and the dies of three fresh layouts (the first DRC-valid layout of each generator family from E006's sealed seed, dies per switch as drawn) at O003's operating point; with f0, f1, f2 the values at levels 0 (coarsest), 1 and 2 (finest) of the frozen rule (r = 2), d1 = f1 - f0, d2 = f2 - f1: if d1 = d2 = 0, GCI = 0; otherwise, with rho = d2 / d1 (rho = +inf when d1 = 0), (i) |rho| >= 1 (divergent or stagnant): GCI = +inf, A4 not met (not INVALID); (ii) -1 < rho < 0 (oscillatory): GCI = 1.25 max(|d1|, |d2|); (iii) 0 <= rho < 1/4 (observed order p_obs = ln(1/rho)/ln 2 above 2, a possibly lucky grid): GCI = 1.25 max(|d2|, |d1|/4), order 2 credited from the coarser step; (iv) 1/4 <= rho < 1 (monotone convergence, p_obs <= 2): GCI = 1.25 |d2| / (2^p - 1), p = min(p_obs, 1). The value is continuous in rho on [0, 1) and never below the order-1-capped form. D0012: the order is capped at 1 because the bimaterial die-attach and copper-on-ceramic corners (exponents 0.84 and 0.52) make the observed order drift toward 1 under refinement; on every 2D corner case with a 21 M-cell reference (T0181) this estimator bounded the true error, where the previous rule did not. D0013: branches (i)-(iii) close the cases the D0012 wording left undefined (re-reviews T0184/T0185), branch (iii) made continuous by the D0013 addendum (re-reviews T0187/T0188); 0.5 K per value bounds O003's two-layout difference by up to 1.0 K, half its +2 K budget, which O003 deducts in its Tj check. A solver that cannot meet A4 on affordable grids does not meet it (INCONCLUSIVE, the decision is then the fallback), rather than an INVALID run"}
  fail_any:
    - {id: K1, metric: E006.max_case_scaled_err, comparator: ">", threshold: 0.05, uncertainty: {use: point},
       description: "the solver misses some reference case by more than 5 % of its scale: a model or implementation error"}
    - {id: K2, metric: E006.max_abs_err_K, comparator: ">", threshold: 0.25, uncertainty: {use: point},
       description: "the solver misses some reference point by more than 0.25 K"}
  max_evaluations: 1
failure_modes:
  - id: F1
    description: "Reference solution wrong (series truncation, transcription, own implementation bug), or tuned toward the solver"
    detection: "gated sanity checks, all before the first solver comparison: each series converged (doubling the terms changes every reported value by < 1e-7 relative, by series acceleration where needed); the own Muzychka implementation truncated at the paper's 50 terms reproduces the paper's printed Case 3 values to their printed digits, and its converged Case 2 values agree with an independent scikit-fem run within 0.02 K; the N-layer series reduces to the two-layer series when layers share a conductivity and agrees with an independent scikit-fem run on the laterally uniform default stack within 0.02 K at a rise of 60-110 K; in both scikit-fem checks scikit-fem's own GCI (A4 estimator) is at most 0.01 K, refined until it is; the manufactured source term is derived symbolically and checked numerically; every reference value is frozen and hashed in the spec, and a reference change after the first comparison voids the run"
    response: "experimental failure (INVALID): fix the reference under a new experiment id"
  - id: F2
    description: "Discretisation error hidden by a lucky grid"
    detection: "A4 is a criterion; three grids from the frozen rule refined by a constant ratio; observed order and A4 branch reported per value, values with p_obs outside [0.5, 2] flagged as non-asymptotic; energy balance |Q_out/Q_in - 1| <= 1e-6 (manufactured case: against the integrated manufactured source and boundary fluxes); Picard iteration until the largest temperature change is below 1e-4 K"
    response: "a failed A4 alone gives INCONCLUSIVE, which leads to the same decision as FAIL (fallback); a failed energy balance is INVALID"
  - id: F3
    description: "The k(T) case cannot discriminate"
    detection: "declared null baseline: the column dT_const_k (every row solved with constant k at the layer-mean temperature; identical to the L2 value on constant-k cases) must fail A1 and A2"
    response: "design error: strengthen the manufactured case before registration"
  - id: F4
    description: "Pilots leak into later sealed evaluations"
    detection: "pilots and A3 use dev seeds and geometry outside O003's and O004's judged sets only (PowerSynth 2D_Case_4, which has no published values, is the EM pilot module and is excluded from both); pilot outputs are research notes, not evidence"
    response: "a leaked layout or seed is excluded from O002, O003 and O004 evaluation"
  - id: F5
    description: "The scikit-fem cross-check is itself not converged, so A3 cannot tell which solver is wrong"
    detection: "gated sanity check: scikit-fem's own estimate (mfos.metrics max_gci_capped on its three grid columns, plus its through-thickness term skfem_z as in A3) at most 0.5 K on every A3 die"
    response: "experimental failure (INVALID): refine the cross-check under a new experiment id, on this Mac first (docs/INFRASTRUCTURE.md memory rule), a burst VM only if it cannot fit; a failed cross-check is never a verdict on the L2"
budget: {usd: 90, cpu_hours: 80, wall_days: 14}
require_plan_approval: true
notes: >-
  Draft by the founder session of 2026-11-01 (founder decision: pilots before finalising O002 and O004; D0009), revised
  after draft reviews T0137/T0138 (round 1, both reject) and T0139 (statistics, accept with caveats) / T0140 (physics,
  reject: a per-point spreading denominator is near zero at weak sources; no denominator for the manufactured case; the
  paper's Case 2 table is not reproducible at 50 terms; a 1e-9 series gate is impractical; no re-entrant corners; a
  failed convergence gate ended INVALID instead of reaching the fallback). Round 3 (T0143, T0144: both accept with
  caveats) led to the defined GCI estimator at 0.025 K, the reconstructed surface temperature, the A3 layout rule and
  independent scikit-fem geometry, and the load level of F1's agreement checks; approved without a further review round. O002's draft A1 (E006.max_rel_err_vs_analytic)
  is superseded by this objective and is removed when O002 is finalised.
  Build work (planner): (1) die-attach (cited material and k(T), e.g. SAC305 or sintered Ag) and SiC die layers in
  moduleforge.geometry.stack; (2) the thermal L2 solver of D0006 in moduleforge.solvers, with its grid rule and an honest
  discretisation bound in meta['solver_tol']; (3) independent reference implementations (Muzychka 2003 series with
  acceleration; an N-layer Fourier series after Albers 1995 / Bagnall, Muzychka & Wang 2014 / Choudhury & Rogers 2019; a
  symbolic manufactured solution); (4) a scikit-fem hexahedral cross-check on the same geometry (D0006 fallback); (5) E006
  (scientist; E001 pattern): rows per case, point and grid (case, point, grid_level, T_l2, T_ref, case_scale, rich_est,
  dT_const_k) and per cross-check die (layout, die, tj_l2, tj_skfem, skfem_rich_est); recompute entries for the four
  metrics (new mfos.metrics functions where needed: protected path, founder approval), sanity checks per F1/F2, the F3
  null.
  Pilots (investigate tasks; outputs are research notes under research/notes/, never evidence): P1 thermal envelope
  (Tj max on generator layouts, all families, 2-6 dies, die sizes 4.0-5.5 mm, 65 °C coolant, h = 5000 W/(m² K), versus
  power per die with and without k(T); the highest power keeping Tj max <= 175 °C on >= 95 % of layouts per die size;
  recommended load levels for O002 and the O003 operating point); P2 thermal nulls (per-stratum errors of the
  stratum-mean, die-size cell-mean and die-position lookup predictors at those load levels); P3 EM convergence
  (l2_layout on PowerSynth 2D_Case_4 per D0007 and two perturbations, 0.5/0.25/0.125 mm and thickness/filament
  refinement, 10 and 20 MHz: absolute and pair-ratio discretisation estimates and observed order); P4 FastHenry
  feasibility (the same geometry through a Layout -> FastHenry exporter in SI metres per D0002, direct and multipole
  solves at increasing refinement on a burst VM: memory, time, crashes, extrapolated L, and the L2-FastHenry difference
  and ratio difference, the band input of D0009). D0013 (2026-11-02, after re-reviews
  T0184/T0185, both reject): hypothesis (b) no longer states 0.05 K (A3 tests consistency within the summed GCIs);
  null, why_it_matters and decision_if_pass restated at the tested precision (0.5 K per value, up to 1.0 K on O003's
  difference, deducted by O003); A3 and A4's layouts run at O003's operating point (60 K hottest-die rise); A4's
  estimator defined for every sequence (divergent -> not met; oscillatory or p_obs > 2 -> max step) and recomputed
  by the evaluator from the grid values (new mfos.metrics functions max_gci_capped and max_gci_consistency: protected
  path, founder approval); A4 adds three fresh sealed-seed layouts, one per family; scikit-fem's convergence moved from
  A3b to sanity check F5 (INVALID, not a verdict); an A3-only failure leads to diagnosis, not an automatic switch;
  F1's scikit-fem checks require scikit-fem's own GCI <= 0.01 K. D0013 addendum (2026-11-02, after
  re-reviews T0187/T0188, both reject): A4's lucky-grid branch made continuous (1.25 max(|d2|, |d1|/4); on 52
  development Tj max sequences at 60 K the maximum is 0.306 K, against 0.932 K with the jump); A3 extended to A4's three
  fresh sealed-seed layouts and scikit-fem's estimate includes its measured through-thickness term; dies_per_switch
  written explicitly; meta['solver_tol'] aligned with A4's estimator before registration; the 30 % k variation defined;
  0.5 K stated as a discretisation bound on generator geometry; an A2 miss confined to the manufactured case within its
  own GCI is routed to a founder decision on refinement. No kill criterion on A3 (T0187 suggested one): a gross
  cross-check disagreement cannot tell which solver is wrong, so it leads to diagnosis (INCONCLUSIVE), not to the
  fallback. E006 also reports, as secondary values, GCI / |T_L2 - T_ref| per reference-case point.
