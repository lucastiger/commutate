id: O004
title: The L2 inductance reference agrees with an independent field solver on the inductance ratios of re-layouts of real public modules
kind: hypothesis
priority: 1
risk: high
depends_on: [O001]
unlocks: []
hypothesis:
  statement: >-
    solvers.l2_layout at 0.25 mm, the level every headroom judgement uses (E010, O008, the planned O009), agrees with the
    pinned FastHenry build (D0002), run on a burst VM as a separate executable on the identical exported geometry, for
    the module-internal commutation loop (DC+ terminal to DC- terminal, dies as ideal shorts) at 10 and at 20 MHz, on the
    reconstructed PowerSynth public samples 2D_Case_2R, 2D_Case_6 and 2D_Case_4 (frozen T0263 reconstructions) and on
    derivative-scale re-layouts of them: (a) the inductance ratio r = L(re-layout) / L(reference) of every
    pre-registered pair agrees within 2 %; and (b) the absolute loop inductance of every layout agrees within the two
    solvers' combined conservative discretisation estimates.
  null_hypothesis: >-
    On real module geometry, l2_layout's inductance ratios differ from an independent field solver's by more than the
    2 % that a headroom verdict at O009's 10 % and 20 % lines tolerates; no headroom figure judged by l2_layout can be
    stated as more than provisional.
  why_it_matters: >-
    Every headroom figure is a ratio judged by l2_layout. Until an independent solver agrees on real modules, a pass
    elsewhere stays provisional (D0009), and customers will check our numbers in their own Q3D flow (A-T4). A relative
    ratio error d moves headroom h = 1 - r by r d, so near r = 0.8-0.9 a 2 % ratio error moves h by under 2 points,
    inside the gap between the 10 % and 20 % lines. Absolute values cannot be judged as tightly: l2_layout's own
    estimate at 0.5 mm is about 7.7 % of L on Case 4, while its pair-ratio estimates are 0.1-0.2 % (O006 P3), and
    FastHenry agreed with it within 0.8-2.5 % at two levels there (O006 P4).
  decision_if_pass: >-
    l2_layout at 0.25 mm (code_must_match on this evaluation's files) is the inductance judge of O008 and O009 on
    single-substrate wire-bonded half-bridges of the kind validated here, with the same loop definition and at 10 or
    20 MHz; claims cite this objective's ratio agreement, and absolute inductances are stated with their combined
    estimate. The capability brief may then say the inductance reference agrees with FastHenry on public modules.
  decision_if_fail: >-
    Diagnose solver versus exporter model (mf-diagnosis); fix under a new experiment id with freshly drawn perturbations
    (a pair whose FastHenry ratio is known is never re-used for judgement). No validation run (O009) and no sprint uses
    l2_layout as judge until the discrepancy is diagnosed and fixed (plan, risks table). The reference set is never
    narrowed after the outcome is known.
  decision_if_inconclusive: >-
    If (a) holds and only (b) is not resolved because FastHenry's estimate is too wide at the affordable level, record
    the ratio agreement as the result and state absolute values as provisional; founder decision on a finer FastHenry
    run. Otherwise same as fail.
scope_in:
  - >-
    references: the frozen T0263 reconstructions of PowerSynth 2D_Case_2R, 2D_Case_6 and 2D_Case_4, the public
    references already loaded (plan section 5), development geometry under D0023. One public source only: the result
    is stated for these samples' construction (single DBC substrate, one die row per switch, no separate diode dies)
  - >-
    re-layouts, at least 4 per reference, from frozen rules with parameters drawn from E004's sealed seed: a die-row
    shift, a power-trace width change, a terminal-near copper change, and, on 2D_Case_2R and 2D_Case_4 where a twin
    exists, a designer-proxy re-layout (O008's proxy rule: a frozen L1 descent from the twin under the reference's own
    rules), so that optimiser-selected re-layouts are in the sample. Pairs must span L1 ratios of at least
    [0.65, 0.98]; the proxy pairs reached 0.63-0.93 at L1 in O008's probe
  - >-
    the module-internal commutation loop, DC+ terminal to DC- terminal with dies as ideal shorts, at 10 and 20 MHz; the
    stack of the reconstructions (as T0263 froze it)
  - >-
    discretisation: l2_layout on its three-level ladder (0.5 / 0.25 / 0.125 mm, with the thickness and filament terms
    of O006 P3); FastHenry on three refinement levels on a burst VM (the founder launches it; P4 projected about 10 GB
    and 2.4 h per run at the third level); each value carries its solver's conservative estimate
scope_out:
  - gate loops, current sharing, thermal; full-wave effects; measured double-pulse waveforms
  - agreement with published measurements or published simulations (the UTK, CPES and Aalborg reconstructions this
    draft once planned do not exist, D0019)
  - modules with separate diode dies, several substrates or several die rows (not in the sample)
  - model choices both tools share through the exporter (ideal die shorts, point-contact terminals, mitred wire
    polylines, lattice snapping); their size is reported by the F6 diagnostic, not judged
evidence_plan: [E004]
acceptance:
  required_experiments: [E004]
  pass_all:
    - {id: A1, metric: E004.max_ratio_diff_vs_fasthenry, comparator: "<=", threshold: 0.02, uncertainty: {use: point},
       description: "max over pre-registered pairs and both frequencies of |r_L2 / r_FastHenry - 1|, l2_layout at 0.25 mm and FastHenry at its finest level, raw values whatever a diagnosis attributes a difference to. A 2 % ratio error moves headroom by under 2 points near r = 0.8-0.9. Declared nulls, which must fail: a constant ratio (the median registered L1 ratio) and the L1 model's own ratio"}
    - {id: A2, metric: E004.max_abs_consistency, comparator: "<=", threshold: 1.0, uncertainty: {use: point},
       description: "max over layouts and both frequencies of |L_L2 - L_FastHenry| / (E_L2 + E_FastHenry), each E the solver's conservative discretisation estimate from its own three levels (lateral, thickness and filament terms for l2_layout, as O006 P3); a divergent sequence on either side gives +inf, A2 not met. As O007's A3 for thermal"}
  fail_any:
    - {id: K1, metric: E004.max_ratio_diff_vs_fasthenry, comparator: ">", threshold: 0.05, uncertainty: {use: point},
       description: "some pair's ratio differs by more than 5 % between the solvers: a headroom figure judged by l2_layout could be off by 4-5 points at r = 0.8-0.9, which O009's 10-point gap between its lines cannot absorb"}
    - {id: K2, metric: E004.max_rel_diff_vs_fasthenry, comparator: ">", threshold: 0.15, uncertainty: {use: point},
       description: "some layout's absolute L differs by more than 15 % between the solvers, about twice l2_layout's own 0.5 mm estimate on Case 4: a model or exporter defect, not discretisation"}
  max_evaluations: 1
failure_modes:
  - id: F1
    description: "Discretisation error mistaken for agreement or disagreement"
    detection: "gated sanity checks per layout: both three-level sequences are monotone or their estimate is stated as +inf; each pair ratio's l2_layout estimate is at most 0.5 % and FastHenry's at most 1 % (ratios cancel most of the error, P3: 0.1-0.2 %); a pair whose ratio estimates fail this is excluded and reported, and E004 is INVALID if fewer than 3 pairs per reference remain. Absolute estimates are reported and enter A2, not a gate (T0133: a 1.5 % absolute gate fails on every existing ladder)"
    response: "experimental failure (INVALID): refine under a new experiment id"
  - id: F2
    description: "Perturbations or reconstructions tuned toward agreement (leakage)"
    detection: "the reconstructions are the frozen T0263 ones (fingerprints checked); the perturbation rules, their parameter ranges and the proxy rule are frozen and hashed in E004's spec, and each pair's parameters are drawn from E004's sealed seed, so no pair is seen before its solves; development work uses development seeds and gen2_0 only"
    response: "a change after registration voids the run: new experiment id, freshly drawn pairs"
  - id: F3
    description: "Model mismatch between the tools rather than error"
    detection: "differences are attributed per conductor group in a diagnostic; A1, A2, K1 and K2 are judged on the raw values regardless"
    response: "diagnose; a model choice that changes L by more than 1 % needs a founder decision"
  - id: F4
    description: "Sample too small or too clustered"
    detection: "at least 3 references, at least 4 pairs per reference (at least 12), pairs spanning L1 ratios of at least [0.65, 0.98] with at least 3 below 0.90; fewer is a sanity failure (INVALID). The result is stated for one public source"
    response: "add pairs under a new experiment id"
  - id: F5
    description: "Licence breach in using GPL sample designs"
    detection: "D0007 rules: geometry re-modelled in ModuleForge's own format; GPL files never committed; commit and sha256 of every file read recorded"
    response: "stop and remove; founder decision"
  - id: F6
    description: "Shared model choices dominate the real modules' inductance"
    detection: "diagnostic on two references: die modelled as a distributed contact instead of an ideal short, and terminal tabs modelled physically instead of as point contacts; the change in L and in each pair ratio is reported"
    response: "if a shared choice moves a pair ratio by more than 2 %, founder decision before O009 relies on l2_layout"
  - id: F7
    description: "FastHenry does not converge at the affordable level (O006 P4: only two levels fit in 6 GB)"
    detection: "before registration, a founder-run burst of FastHenry's third level on one development pair (P4's plan: n2-highmem-32 or a smaller E2 machine sized by memory) shows its three-level ratio estimate at most 1 % and its run time per layout; E004's cost plan is set from that run"
    response: "if FastHenry's third level does not resolve ratios to 1 %, founder decision before registration (a finer plane mesh, or the ratio test at FastHenry's own estimate)"
budget: {usd: 100, cpu_hours: 260, wall_days: 21}
require_plan_approval: true
notes: >-
  Refreshed by the founder session of 2026-11-15 (handoff step 5, plan section 5) from the draft of 2026-10-31, which
  was rejected by T0133 (statistics) and accepted with caveats by T0134 (physics) before O003 changed course. What
  changed and why: the references are the three PowerSynth reconstructions already loaded, because the UTK, CPES and
  Aalborg reconstructions were never built and D0019 found no other usable public module; the ratio test is primary and
  absolute L is judged within the combined estimates, because l2_layout's absolute estimate is about 7.7 % at 0.5 mm
  (P3) and a 1.5 % absolute gate fails on every ladder (T0133 blocker); the judged level is pinned at 0.25 mm (T0133);
  pairs are drawn from a sealed seed so a successor never re-uses known pairs (T0133); designer-proxy pairs bring
  optimiser-selected re-layouts into the sample, so O009 needs no separate FastHenry re-check of its winners; published
  comparators (old K2) are dropped, since their reconstructions do not exist and they judged shared exporter choices
  (T0134); the diode-die loop question does not arise (no sample has diode dies, T0134); FastHenry's convergence and
  cost at the third level are checked by a pilot burst before registration (F7, T0134). O003 no longer depends on this
  objective (D0023); the judge it validates serves O008 and O009.
  Cost: $9.51 spent of $100. VM: P4 projected about 2.4 h per FastHenry third-level run; with about 15 layouts, one
  run per layout covering both frequencies, that is about 36 VM-hours, about $25-75 depending on the machine
  (e2-highmem-16 at $0.73/h to n2-highmem-32 at $2.10/h, project/memory/lessons.md), plus the l2_layout ladders at
  about $0.24 per 0.25 mm solve. The plan estimated $15-30; the F7 pilot sets the figure.
  For the founder to set at approval: the 2 % ratio tolerance (A1), K1's 5 % and K2's 15 %, the pair count and the
  ratio span. Build work (planner, after approval): (1) the Layout -> FastHenry exporter in src/ (P4's research
  exporter `research/scripts/o006_p4/fh_export.py` as the starting point, SI metres per D0002); (2) l2_layout on the
  reconstructions' stacks and outlines if not already covered by E010's runner; (3) the perturbation rules and the proxy
  rule (shared with O008's build); (4) E004 design (scientist), the F7 pilot burst (founder), review, registration,
  run, evaluation.
