id: O004
title: The L2 inductance reference is accurate on reconstructed public modules, so it can judge O003's headroom
kind: hypothesis
priority: 1
risk: high
depends_on: [O001]
unlocks: [O003]
hypothesis:
  statement: >-
    solvers.l2_layout, extended to the layer stacks, substrate outlines, terminals and die/bond-wire placements of the
    reconstructed public benchmark modules (research/notes/o003-public-benchmarks.md, D0007), agrees with the pinned
    FastHenry build (D0002), run as a separate executable on the identical exported geometry, for the module-internal
    commutation loop (DC+ terminal to DC- terminal, dies as shorts) at 10 and at 20 MHz: (a) within 3 % in loop
    inductance on every reconstructed layout and (b) within 2 % in the inductance ratio of every pre-registered
    derivative-scale layout pair (a reconstructed reference and a rule-based perturbation of it whose L1 ratio at
    registration lies between 0.75 and 0.95); and no pinned published simulation ratio is missed by more than 30 %.
  null_hypothesis: >-
    L2, validated so far on the generator's own lattice, default stack and housing (E001, E002's in-run checks), is not
    accurate enough on externally defined geometry for a 20 % versus 10 % headroom verdict; O003 cannot use it as its
    judge without further solver work or a different reference.
  why_it_matters: >-
    O003's day-60 kill criterion (charter) is headroom h = 1 - r on public benchmarks, r = L(re-layout) / L(reference),
    judged by L2. The hypothesis is h >= 20 % and the kill line h < 10 %. A relative ratio error d moves h by r*d, so
    near r = 0.8-0.9 a 2 % ratio error moves h by under 2 points, well inside the 10-point gap. Published data cannot
    resolve that precision (within one source, simulated and measured ratios differ by 35-48 %, and DC versus AC by
    24-31 %), so published values serve only as a gross-error check. models.CodeMatch makes O003's experiments use the
    L2 code this objective validates.
  decision_if_pass: >-
    O003 uses the validated l2_layout (code_must_match on the files of this evaluation) as its judge, only on
    reference layouts that are among this objective's validated references, with the same loop definition and at 10 or
    20 MHz; before the day-60 verdict it re-checks the ratio of its winning re-layout to its reference with FastHenry
    (within 2 %), because optimizer-selected re-layouts lie outside this objective's sample.
  decision_if_fail: >-
    Diagnose solver versus exporter model; fix under a new experiment id with new reconstructions and perturbations
    (layouts whose FastHenry values are known are never re-used for judgement). The benchmark set is never narrowed
    after the outcome is known.
  decision_if_inconclusive: Same as fail.
scope_in:
  - wire-bonded half-bridge layouts reconstructed from the public sources of research/notes/o003-public-benchmarks.md
    (PowerSynth sample designs per D0007, UTK conventional and P/N-cell modules, CPES SiC phase legs and the
    commercial module they compare against, the Aalborg/Danfoss 4-die module if its dimensions suffice), plus
    rule-based perturbations of each
  - the module-internal commutation loop, DC+ terminal to DC- terminal with dies as ideal shorts, at 10 and 20 MHz
  - the stacks those publications state (Al2O3 or AlN DBC, Cu thicknesses), baseplate as stated or omitted as stated
scope_out:
  - gate loops, current sharing, thermal; full-wave effects; measured double-pulse waveforms
  - agreement with published measurements (reported only)
  - optimizer-selected re-layouts (covered by the FastHenry re-check required of O003)
  - model choices both tools share through the exporter (ideal die shorts, point-contact terminals, mitred wire
    polylines, lattice snapping); their size is reported by the F6 diagnostic, not judged
evidence_plan: [E004]
acceptance:
  required_experiments: [E004]
  pass_all:
    - {id: A1, metric: E004.max_rel_diff_vs_fasthenry, comparator: "<=", threshold: 0.03, uncertainty: {use: point},
       description: "max over reconstructed layouts and both frequencies of |L_L2 / L_FastHenry - 1|, on the raw values whatever any diagnosis attributes a difference to; deterministic, judged on the point value with both tools' discretisation estimates reported"}
    - {id: A2, metric: E004.max_ratio_diff_vs_fasthenry, comparator: "<=", threshold: 0.02, uncertainty: {use: point},
       description: "max over pre-registered derivative-scale pairs and both frequencies of |r_L2 / r_FastHenry - 1|, r = L(perturbed) / L(reference); a 2 % ratio error moves headroom by under 2 points near r = 0.8-0.9. A constant-ratio null (the median registered L1 ratio) is declared and must fail"}
  fail_any:
    - {id: K1, metric: E004.max_rel_diff_vs_fasthenry, comparator: ">", threshold: 0.10, uncertainty: {use: point},
       description: "L2 and FastHenry disagree by more than 10 % on some reconstructed layout (raw values, no reclassification)"}
    - {id: K2, metric: E004.max_ratio_err_vs_published, comparator: ">", threshold: 0.30, uncertainty: {use: point},
       description: "gross-error check only (a topology-only constant ratio also passes it; it is not a test of geometry fidelity): L2 misses some pinned published simulation ratio by more than 30 %, comparators, frequency and loop pinned in notes"}
  max_evaluations: 1
failure_modes:
  - id: F1
    description: "Discretisation error mistaken for disagreement"
    detection: "sanity checks per layout: l2_layout three-level estimate (0.5/0.25/0.125 mm) of the absolute discretisation error at most 1.5 % and of each pair ratio's at most 0.5 % (both tools on aligned lattices, so errors largely cancel in ratios); FastHenry refined over at least three meshes with an extrapolated error estimate at most 1 % absolute and 0.5 % on ratios; both reported; failure is an experimental failure (INVALID)"
    response: "experimental failure: refine under a new experiment id"
  - id: F2
    description: "Reconstruction or perturbation tuned toward a target (leakage), or too uncertain for the published comparison"
    detection: "every reconstruction (source table/figure, assumed dimensions, lattice snapping), every perturbation rule and each pair's L1 ratio band are frozen and hashed in E004's spec before any L2 or FastHenry solve on them; the combined (root-sum-square) sensitivity of each published comparator's ratio to the assumed dimensions is screened with L1 and comparators above 5 % are excluded from K2 by that rule only (A1/A2 keep all layouts)"
    response: "a reconstruction changed after registration voids the run: new experiment id"
  - id: F3
    description: "Model mismatch between the tools rather than error"
    detection: "differences are attributed per conductor group in a diagnostic; A1, A2 and K1 are judged on the raw values regardless"
    response: "diagnose; a model choice that changes L by more than 1 % needs a founder decision"
  - id: F4
    description: "Sample too small or too clustered to support the claim"
    detection: "spec requires at least 4 reconstructed references from at least 2 sources, at least 3 perturbations per reference (>= 12 pairs), at least one registered pair ratio in [0.75, 0.85) and one in [0.85, 0.95], and at least 2 pinned published comparators from 2 sources; fewer is a sanity failure (INVALID)"
    response: "add reconstructions under a new experiment id"
  - id: F5
    description: "Licence breach in using GPL sample designs"
    detection: "D0007 rules: geometry re-modelled in ModuleForge's own format; GPL files never committed; commit and sha256 of every file read recorded"
    response: "stop and remove; founder decision"
  - id: F6
    description: "Shared model choices dominate the real modules' inductance"
    detection: "diagnostic on two references: die modelled as a distributed contact instead of an ideal short, and terminal tabs modelled physically instead of as point contacts; the change in L and in each pair ratio is reported"
    response: "if a shared choice moves a pair ratio by more than 2 %, founder decision before O003 relies on it"
budget: {usd: 100, cpu_hours: 260, wall_days: 21}
require_plan_approval: true
notes: >-
  Draft by the founder session of 2026-10-31, revised after draft reviews T0125/T0126 (round 1, both reject) and
  T0129 (statistics, accept with caveats) / T0130 (physics, reject: a 0.5 % absolute convergence gate fails on every
  existing three-level L2 ladder, whose 0.25 -> 0.125 mm step is still 0.7-1.2 %). Founder answers of 2026-10-31 kept:
  FastHenry plus published values; 3 % on absolute L. Changed in round 2: absolute convergence gate 1.5 % and ratio
  convergence 0.5 %; both 10 and 20 MHz; loop pinned; one evaluation; A2 spread and constant-ratio null; Aalborg added.
  Pinned K2 comparators (authors' own simulations; measured values reported, not judged): UTK dissertation (S2) Table 5.1
  simulated, dummy-module geometry, proposed / conventional, Loop1 7.2/20.5 = 0.351 and Loop2 8.6/20.3 = 0.424 (one
  comparator family), compared at 10 MHz (the dissertation's 1-10 MHz measurement band) with that dissertation's loop
  definitions; CPES dissertation (S3) Q3D substrate-associated loop inductance, CPES / commercial, 4.8/9.7 = 0.495,
  compared at 20 MHz as the high-frequency proxy for Q3D AC values with the substrate-only loop.
  Build work first (planner): (1) extend solvers.l2_layout to arbitrary stacks, outlines, baseplates and terminals on its
  lattice (today the baseplate box is fixed at -8..78 x -8..48 mm); (2) a Layout -> FastHenry deck exporter producing the
  identical conductor geometry in SI metres (D0002: the provisioned build mis-scales under .units mm), run as a separate
  executable per D0002/D0004 (D0002 records intermittent multipole segfaults: use the direct solver where it fits);
  (3) a pilot L2-vs-FastHenry comparison on generator layouts only (never on benchmark geometry before registration) to
  show A1's 3 % is attainable; (4) the reconstructions and perturbation rules (move a die by a fixed step, widen a trace,
  change terminal-near copper), frozen per F2. E004 design (scientist): rows per layout and frequency (layout_id, source,
  freq_hz, L_l2, L_l2_err, L_fh, L_fh_err), per pair and frequency (pair_id, r_l1_registered, band, r_l2, r_fh, and the
  constant-ratio null column), per published comparator (r_l2, r_pub, table, freq_hz, excluded_by_F2); recompute entries
  with mfos.metrics.max_rel_err on each row set; domain via run.domain(stacks, sources, freq_hz). Cost: about 16-20
  layouts at about 9-11 CPU-hours each for the three L2 levels (0.125 mm on a burst VM, D0005 precedent) plus FastHenry.
  The day-60 gate is 2026-11-27 and O003 depends on this objective.
