id: O002
title: A fast L1 thermal model predicts per-die Tj max, spread and layout-to-layout differences well enough to drive search
kind: hypothesis
priority: 2
risk: high
depends_on: []
unlocks: [O003]
hypothesis:
  statement: >-
    On DRC-valid wire-bonded half-bridge layouts from moduleforge.generate on the default DBC stack (with die-attach and
    SiC die layers), with one die size per (family, dies) stratum (the derivative regime: the die is fixed), in steady
    state with temperature-dependent conductivity, coolant at 65 °C, a uniform heat-transfer coefficient of
    5000 W/(m² K) at the baseplate and 30 and 60 W per die dissipated uniformly over the die's top area, a fast L1 thermal
    model (median at most 50 ms per evaluation on one core) predicts, against the verified L2 thermal reference of D0006
    and at each load level: the difference in maximum junction temperature between two layouts of the same stratum
    within 0.5 K; each die's Tj max within 3 % of its die-local rise; and the Tj spread across each switch's paralleled
    dies within 1 K and within half the error of a stratum-mean predictor (each as a 95th percentile, upper 95 % bound),
    on fresh sealed seeds.
  null_hypothesis: >-
    L1 thermal is too inaccurate to enforce A-T3's +2 K Tj budget during search, or no better than a lookup on die
    position; search needs L2 thermal in the loop or a better fast model.
  why_it_matters: >-
    The thesis promises bounded junction temperature (A-T2), and A-T3's headroom is stated at <= +2 K Tj. Search
    compares layouts with the same dies, so L1 must resolve their Tj differences well below 2 K at the operating point;
    absolute Tj and the spread across paralleled dies are what customers verify in Icepak. Under D0008, L1 thermal
    screens and L2 thermal audits the finalists.
  decision_if_pass: >-
    O003 uses L1 thermal as the search constraint among candidates in the generator's families on the default stack,
    with L2 thermal audits of final candidates; comparisons of a candidate with a reconstructed benchmark reference on
    another stack or housing are made with L2 thermal only (outside this objective's scope).
  decision_if_fail: >-
    Diagnose (missing physics: lateral spreading, k(T), patterned copper); if not fixable within budget, O003 checks
    Tj with L2 thermal on shortlisted candidates only (founder decision on compute).
  decision_if_inconclusive: Same as fail.
scope_in:
  - generator families of moduleforge.generate, 2-6 parallel dies per switch, the default DBC stack and housing with
    die-attach and SiC die layers added; one die size drawn per stratum and used for every layout in it
  - steady state; k(T) for every layer material from cited sources; coolant 65 °C; uniform h = 5000 W/(m² K) at the
    baseplate bottom; 30 and 60 W per die, all dies equal, uniform over each die's top area (the operating point O003
    adopts); Tj at the top level must stay within the SiC rating (sanity check)
  - per-die Tj max taken from the die surface field (not the centroid); spread per switch over its paralleled dies
scope_out:
  - transient thermal impedance (Zth); bond-wire heat paths; solder voids or fillets; non-uniform h; TIM layers
  - electro-thermal coupling (losses fixed per die); AMB and other stacks; comparisons across die sizes; reconstructed
    benchmark layouts
evidence_plan: [E006, E007]
acceptance:
  required_experiments: [E006, E007]
  pass_all:
    - {id: A1, metric: E006.max_rel_err_vs_analytic, comparator: "<=", threshold: 0.002, uncertainty: {use: point},
       description: "L2 thermal verification: max relative error of the temperature rise against the analytic benchmarks (1D series resistance; Muzychka, Culham & Yovanovich 2003 multi-source cases; Bagnall, Muzychka & Wang 2014 N-layer surface field; manufactured solutions for k(T)); E007's own accuracy is carried by F1's 0.05 K gate"}
    - {id: A2, metric: E007.dtj_pair_err_p95_K_max_load, comparator: "<=", threshold: 0.5, uncertainty: {use: ci},
       description: "max over the two load levels of the 95th percentile over same-stratum (same-die) layout pairs of |(Tj,max,a - Tj,max,b)_L1 - (...)_L2| in K, upper 95 % bound per level (layout-clustered bootstrap, self-pairs excluded); a quarter of the +2 K budget"}
    - {id: A3, metric: E007.tjmax_local_rel_err_p95_max_load, comparator: "<=", threshold: 0.03, uncertainty: {use: ci},
       description: "max over load levels of the 95th percentile over dies of |Tj,max,L1 - Tj,max,L2| / (Tj,max,L2 - mean baseplate-bottom temperature), upper 95 % bound (clustered by layout); 3 % because a lookup on die position alone reaches about 5.6 % (review T0132)"}
    - {id: A4, metric: E007.switch_spread_err_p95_K_max_load, comparator: "<=", threshold: 1.0, uncertainty: {use: ci},
       description: "max over load levels of the 95th percentile over layouts and switches of |spread_L1 - spread_L2| in K, spread = max - min of Tj max over one switch's paralleled dies, upper 95 % bound"}
    - {id: A5, metric: E007.switch_spread_err_ratio_vs_stratum_mean, comparator: "<=", threshold: 0.5, uncertainty: {use: ci},
       description: "A4's statistic at the top load level divided by the same statistic for the stratum-mean-spread predictor, upper 95 % bound: L1 must capture at least half of the layout-dependent spread variation, so A4 cannot pass on a uniform stratum alone"}
    - {id: A6, metric: E007.l1_eval_ms_p50, comparator: "<=", threshold: 50.0, uncertainty: {use: point},
       description: "median wall time per L1 thermal evaluation on one core, as O001's A6 for L1 EM"}
  fail_any:
    - {id: K1, metric: E007.dtj_pair_err_p95_K_max_load, comparator: ">", threshold: 1.5, uncertainty: {use: ci},
       description: "at some load level L1 cannot enforce a +2 K budget (lower 95 % bound above 1.5 K)"}
    - {id: K2, metric: E007.tjmax_local_rel_err_p95_max_load, comparator: ">", threshold: 0.15, uncertainty: {use: ci},
       description: "L1's per-die Tj max definitely off by more than 15 % of the die-local rise at some load level"}
  max_evaluations: 1
failure_modes:
  - id: F1
    description: "L2 thermal wrong or not converged at the resolution A2 needs, or operating point outside the physical envelope"
    detection: "E006 (A1); in E007, gated sanity checks: energy balance |Q_out/Q_in - 1| <= 1e-6; three-grid Richardson estimate of every reported Tj below 0.05 K (0.1 K on a pair difference); the scikit-fem cross-check (D0006) on a subset within 0.1 K; Tj max at 60 W at most 175 °C on at least 90 % of layouts"
    response: "experimental failure; repair L2 or lower the load under a new experiment id (founder decision for the load); the hypothesis is untouched"
  - id: F2
    description: "A layout-ignorant predictor meets a criterion"
    detection: "null baselines at the top load level: (a) a die-size-aware isolated-die spreading model without inter-die coupling; (b) a dev-trained lookup on (family, dies, die size, load) returning the cell mean; (c) a dev-trained lookup on die position (family, dies, die size, load, switch, die index); (d) the stratum mean for A2 and the stratum-mean spread for A4/A5. On dev rows, `mfos exp check E007 --rows <dev rows>` must show each null failing A2-A5 at its point estimate before registration"
    response: "design error: revise E007's design; a threshold change is a founder decision on the objective"
  - id: F3
    description: "The sample cannot resolve the thresholds, or the CI undercovers"
    detection: "E007's design-time simulation on dev rows, with per-layout errors drawn both normal and heavy-tailed (Student t, 3 degrees of freedom) and clustered by layout: at least 10 layouts per stratum; an L1 whose true p95 is 0.6 x each threshold passes A2-A5 with power >= 0.8; simulated coverage of each upper bound >= 0.95 under both error models; per-stratum results reported"
    response: "redesign under a new experiment id before registration"
  - id: F4
    description: "k(T) effects untested"
    detection: "a constant-k L1 ablation reported at both load levels; if it does not exceed any threshold, k(T) is reported as not tested at this operating point"
    response: "report; founder decision on a higher-envelope stack or load under a new objective"
  - id: F5
    description: "Overfitting to seen data"
    detection: "sealed seeds; the L1 thermal model is frozen (code_under_test) before E007 registration; one evaluation"
    response: "never re-evaluate on data that has been seen"
budget: {usd: 120, cpu_hours: 60, wall_days: 28}
require_plan_approval: true
notes: >-
  Draft by the founder session of 2026-10-31, revised after draft reviews T0127/T0128 (round 1, both reject) and
  T0131/T0132 (round 2, both accept with caveats). Founder answers of 2026-10-31 kept: dTj 0.5 K, spread 1 K, steady
  state with k(T) and uniform h. Changed in round 2 and to be confirmed at approval: load levels 30 and 60 W per die
  instead of 50 and 100 (at 100 W the default Al2O3 stack puts Tj at about 172-244 °C, above the SiC rating; T0132); A3
  3 % instead of 5 % of the die-local rise (a die-position lookup reaches about 5.6 %); spread per switch; A5 relative to
  the stratum-mean predictor; heat source uniform over the die top; one evaluation. Requires founder-approved additions
  to tools/mfos (protected): quantile-of-relative-error, quantile-of-absolute-error, median and ratio-to-null functions
  in mfos.metrics, a per-level max aggregation, and self-pair exclusion in the layout-clustered pairwise bootstrap.
  Build work first (planner): (1) the L2 thermal solver of D0006 in moduleforge.solvers; (2) die-attach (e.g. SAC305 or
  sintered Ag, cited) and SiC die layers in LayerStack with cited k(T) for every material; (3) E006 verification (E001
  pattern) with an honest discretisation bound as meta['solver_tol']; (4) the L1 thermal model (spectral / N-layer Green's
  function with a patterned-copper correction), frozen before E007; (5) a generator option fixing one die size per
  stratum; (6) E007 on fresh sealed layouts, 15 strata x >= 10 layouts x 2 load levels, rows per die (with switch and die
  index) and per layout, recompute entries for A2-A6, nulls per F2, code_must_match tying E007's L2 to the code E006
  verified. Thermal solves are cheap (about 3 M unknowns in 7 s on the M5); runs above 5 M unknowns go to a burst VM. Id
  note: E006 and E007 are new ids; E004 belongs to O004 and E005 to O005 (shelved, D0008).
