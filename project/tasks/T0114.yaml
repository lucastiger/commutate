  summary: 'O901 is active with no evaluations yet (0/2 used), and replans are at 2/3. The previous plan
    was rejected for one reason only: T0112''s --smoke mode wrote to /tmp. The sandbox (policy.toml [sandbox])
    only allows writes to the checkout, $TMPDIR and the uv cache. Writing to /tmp would have caused sandbox
    denials, which is exactly failure mode F1, and would have broken the smoke check in the definition
    of done. I checked the existing runners (e000–e003): all of them hard-code /tmp, and e002 also points
    MFOS_ARTIFACT_STORE at /tmp, so a scientist copying e000_canary.py would repeat the mistake. The redesign
    task therefore says explicitly that smoke output goes to tempfile.gettempdir()/e901-smoke (artifacts
    included), and two automated checks enforce it: the literal string "/tmp" must not appear'
