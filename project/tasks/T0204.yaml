description: 'Purpose: an early check on F5, and the VM sizing for E009. It needs no new code. In E009
  the in-house L2 (solvers.thermal_layout at its frozen rule, unchanged; scope_out forbids changes) runs
  levels 1, 2 and 3. F5 requires its own A4 GCI (mfos.metrics.gci_capped, floor 1e-3 K, three grids r
  = 2) to be at most 0.25 K on every die.


  Write research/scripts/o007_l2_preview.py with two modes.

  (1) `--dry-run --out research/o007_l2/preview.json` (local, no level-3 solve). For the two dev layouts
  only (dev seed 20261101: side_by_side with dies_per_switch = 6, u_shaped with dies_per_switch = 2; assert
  the fingerprints in experiments/specs/E006.yaml), compute the L2 cell counts at levels 1, 2 and 3. Use
  thermal_layout.build_layout_grid, or count from the grid lines if the level-3 material array is too
  large. Estimate memory at E006''s fv_bytes_per_cell = 1500 B/cell, plus the measured wall time and peak
  RSS of the level-1 solve if it fits locally. From the dev-layout crosscheck rows of E006 run E006-20261102T145940-2815
  (experiments/results/E006/.../rows.json, columns f_lv0..f_lv2; use only the side_by_side_6 and u_shaped_2
  rows; E006''s fresh layouts are O006''s held-out data and must not be used), compute per die: d1, d2,
  p_obs and branch. Then predict the levels 1-3 GCI under a stated assumption (e.g. observed order held).
  Report the prediction''s sensitivity to that assumption.

  (2) `--full --out research/o007_l2/full.json` (for a founder-run burst VM). Solve the L2 at levels 1,
  2 and 3 on the same two layouts at O003''s operating point: 65 °C coolant, h = 5000 W/(m² K), k(T),
  and E006''s recorded per-layout equal power per die from those rows, labelled as a proxy because E009
  calibrates on scikit-fem level 0. Write per die: the three Tj max values, gci_capped (floor 1e-3 K),
  branch, p_obs and convergence direction. Write per solve: cells, wall time, peak RSS, energy balance
  and Picard residual. Add a memory preflight that refuses a solve above 0.85 x physical memory, as in
  e006_run.preflight.


  preview.json schema: {"layouts": {name: {"cells": {"1": int, "2": int, "3": int}, "mem_gb_est": {"1":
  float, "2": float, "3": float}, "dies": [{"die": int, "e006_f_lv0_2": [..], "p_obs": float|null, "branch":
  str, "pred_gci_13_K": float}]}}, "assumptions": [...], "recommended_vm_ram_gb": float}.


  In research/notes/o007-l2-crosscheck-preview.md, give the exact burst command (scripts/burst_gcp.sh
  --cmd "uv run python research/scripts/o007_l2_preview.py --full --out research/o007_l2/full.json" research/o007_l2),
  the predicted F5 margin per die and the recommended VM RAM. This is a diagnostic, not evidence: no ExperimentRun.
  Never read data/holdout/ or use any seed other than the dev seeds.'
