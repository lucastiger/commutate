    summary: 'The dry run predicts that F5 passes on both dev layouts: the largest predicted levels 1-3
      GCI is 0.155 K (u_shaped_2 die 3), a margin of at least 0.095 K, but this assumes the levels 0-2
      step ratio holds for one more level. Recommended VM RAM is 256 GB, which is burst_gcp.sh''s default
      n2-highmem-32.


      **What was built.** research/scripts/o007_l2_preview.py has two modes:

      - `--dry-run` (local, about 27 s, exits 0) writes research/o007_l2/preview.json.

      - `--full` is for the founder''s burst VM. Each solve runs in its own child process, so peak RSS
      is measured cleanly. A preflight refuses any solve above 0.85 x physical memory, as e006_run.preflight
      does, and each solve is checkpointed under research/o007_l2/full_ckpt so an interrupted run resumes.


      The note is research/notes/o007-l2-crosscheck-preview.md.


      **Cell counts** (active cells, all four levels built with build_layout_grid; each level has exactly
      8x the previous; E006''s recorded counts for levels 0-2 match):


      | layout | L1 | L2 | L3 | memory at 1500 B/cell (L1 / L2 / L3) |

      |---|---|---|---|---|

      | side_by_side_6 | 907,424 | 7,259,392 | 58,075,136 | 1.36 / 10.9 / 87.1 GB |

      | u_shaped_2 | 560,528 | 4,484,224 | 35,873,792 | 0.84 / 6.7 / 53.8 GB |


      **Level-1 solves on this Mac**, at E006''s power:

      - side_by_side_6: about 5 s, peak RSS 1.55-1.74 GB.

      - u_shaped_2: about 3 s, peak RSS 1.11 GB.

      - Both use about 1.78 kB/cell, which is more than E006''s 1500 B/cell planning figure.

      - Both reproduce E006''s f_lv1 within 2e-10 K, which shows the solver code is unchanged since E006.


      **Prediction per die.** From E006''s dev rows only, I computed d1, d2, p_obs and branch for each
      die, then assumed the observed step ratio holds for one more level:

      - side_by_side_6: predicted GCI 0.021-0.052 K, margin at least 0.198 K.

      - u_shaped_2: dies 0-1 at 0.051-0.056 K. Dies 2-3 converge at order about 0.96 and are predicted
      at 0.151 and 0.155 K, margins 0.099 and 0.095 K. These two dies decide F5.


      **Sensitivity:**

      - Every scenario where the next step keeps its sign passes. That includes order 2, order 1, two-term
      fits and a step below the 1e-3 K floor; the worst is 0.155 K.

      - Dies 2-3 fail only if their step ratio rises from 0.51 to above about 0.6 (order below about 0.75).

      - Rescaling for E009''s different power calibration adds 1-2 %.

      - The fragile case is a sign change in the next step. The A4 rule then charges 3 times the level
      1→2 step, and F5 would fail on 8 of 12 side_by_side_6 dies and all 4 u_shaped_2 dies. No die changed
      sign at levels 0-2.


      **RAM sizing.** The preflight alone needs 102.5 GB of physical memory. Sizing at the locally measured
      1.78 kB/cell needs about 122 GB, which is just over a 128 GB VM, so I recommend 256 GB. A 128 GB
      VM (n2-highmem-16) would probably work at the lower rate E006 measured on Linux, but has no margin.


      **Wall time.** About 0.9-1.4 h on E006''s VM type, extrapolated from E006''s recorded dev-layout
      solve times.'
