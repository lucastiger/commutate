definition_of_done:
- cmd: uv run python -c "import sys, glob, os, importlib, yaml; sys.argv = ['x']; sys.path.insert(0, 'experiments/runners');
    import e008_run; spec = yaml.safe_load(open('experiments/drafts/E008.yaml')); listed = {p for pat
    in spec['code_under_test'] for p in glob.glob(pat) if os.path.isfile(p)}; [importlib.import_module(p[4:-3].replace('/',
    '.').removesuffix('.__init__')) for p in sorted(listed) if p.startswith('src/') and p.endswith('.py')];
    used = {os.path.relpath(m.__file__) for n, m in list(sys.modules.items()) if n.startswith('moduleforge')
    and getattr(m, '__file__', None)}; miss = sorted(used - listed); assert not miss, miss; print(len(used),
    'imported src files, all in code_under_test')"
  exists: null
  timeout_s: 600
- cmd: uv run python -c "from mfos.store import Store; from mfos import models as m; from mfos.evaluate
    import load_rows, null_check; from mfos.experiments import runner_files, code_hashes; s = Store();
    spec = s.read_yaml(s.spec_path('E008', draft=True), m.ExperimentSpec); lines, bad = null_check(s,
    spec, load_rows(s.root / spec.dev_rows)); print(chr(10).join(lines)); assert not bad, bad; assert
    any('A1' in x and 'satisfied' in x for x in lines), lines; assert runner_files(s.root, spec.runner);
    n = len(code_hashes(s.root, spec.code_under_test)); assert n >= 26, n; print('registration dry run
    OK,', n, 'code files')"
  exists: null
  timeout_s: 900
- cmd: uv run python experiments/runners/e008_run.py --verify-freeze
  exists: null
  timeout_s: 300
- cmd: uv run mfos exp check E008
  exists: null
  timeout_s: 600
- cmd: git diff --quiet "$(git merge-base HEAD main)" -- src tests/acceptance tools project/objectives
    project/decisions experiments/runners research/scripts/o003_powersynth_references.py research/o003/references
    scripts/burst_gcp.sh
  exists: null
  timeout_s: 60
- cmd: uv run mfos gate --fast
  exists: null
  timeout_s: 900
