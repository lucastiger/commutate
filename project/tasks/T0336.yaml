description: "Founder decision (founder session, 2026-11-13): before E008 is registered, complete its\
  \ code_under_test (review\nT0335 finding 1). code_under_test lists the repository files whose sha256\
  \ every run records (provenance.code), and the\nevaluation checks them against the run's commit. Importing\
  \ the runner, plus every src module code_under_test lists, loads\n25 moduleforge files. These 11 are\
  \ not listed: src/moduleforge/__init__.py, drc/__init__.py, generate/__init__.py,\ngeometry/__init__.py,\
  \ geometry/conductors.py, geometry/layout.py, geometry/units.py, optimize/__init__.py,\nphysics/__init__.py,\
  \ solvers/__init__.py, solvers/l2_dd.py.\n\nRequired:\n1. Add every src file the E008 code path imports\
  \ to code_under_test: the 11 above, plus any that are imported only\n   lazily (function-level imports\
  \ in the runner or in the listed modules: search for them, and also run --plan and\n   inspect sys.modules).\
  \ Prefer explicit paths, or a glob that names exactly one package, over broad globs. Remove\n   nothing\
  \ that is listed now.\n2. The spec is generated by research/o003/e008_dev/make_spec.py (its code_under_test\
  \ entry). Change it there and\n   regenerate experiments/drafts/E008.yaml with it, so the two agree,\
  \ as T0334 did. Change nothing else in the spec.\n3. One short paragraph in research/notes/e008-design.md\
  \ listing the added files and how the list was derived.\nNo runner change is needed; if you find one\
  \ is, stop and say why instead of making it. Change nothing gated: no\ncriterion, metric, parameter,\
  \ tolerance, gate, stop rule, F3 order or cost model rate.\n\nHard limits: no change to src/, tests/acceptance,\
  \ tools/, experiments/runners, the frozen reconstruction script,\nresearch/o003/references/ or scripts/burst_gcp.sh.\
  \ No twin(), degrade(), prepare(), L1, l2_layout, thermal or search run\non 2D_Case_2R or 2D_Case_6.\
  \ Never run gcloud or start a VM. Never read data/holdout/. Do not run `mfos approve`,\n`mfos exp register`\
  \ or anything else that registers."
