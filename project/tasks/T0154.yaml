    - 'Base geometry, 10 / 20 MHz: lat1.0 23.4659 / 23.3234 nH; lat0.5 22.9609 / 22.8174; thk_c 23.2346
      / 23.0108; thk_f 22.9444 / 22.8020; fil_f 23.0336 / 22.9065; fil_f_phi12 22.9592 / 22.8188.'
    - 'Cost on this Mac: lat0.5 took 206 s, 3.9 GB, 1.02 M unknowns; thk_f took 856 s, 8.1 GB, 2.04 M
      unknowns. The machine was already swapping heavily at 8 GB.'
    - Thickness refinement converges monotonically at observed order 4.05 (10 MHz) and 3.65 (20 MHz);
      the thickness term is 0.022 nH.
    - 'Discriminating test for the filament shift: radial-only bisection (6 per ring) moves L by +0.07
      to +0.09 nH; the same annuli with 12 per ring move it by −0.0017 / +0.0014 nH on all three geometries.
      This supports the artefact explanation (Fb) over under-resolved skin effect (Fa).'
    - 'Pair ratios: die_shift 0.986943 at 1.0 mm vs 0.986445 at 0.5 mm, change −5.0e-4; trace_width 0.969067
      vs 0.969138, change +7e-5. The trace_width ratio oscillates under thickness refinement, so it gets
      the conservative 3 × max term (5.7e-4 at 10 MHz).'
    - The observed lateral order on the six earlier aligned generator ladders is 0.685, 0.713, 0.716,
      0.729, 0.789, 0.803 (median 0.72), recomputed from research/l2_layout_vm*, l2_layout_diag. This
      is prior data, not Case 4; it is used only as a labelled assumed order.
    - The PowerSynth figure initial_layout_I1.png supports reading the script coordinates as absolute
      in the baseplate frame (an inference).
    alternative_explanations:
    - explanation: 'The 1.0 mm level is pre-asymptotic: trace gaps are only 2 cells and the near zone
        spans 18 mm. If so, the two-level lateral estimate could be wrong in either direction. If the
        true order were below 0.415, 3|Δ| would not bound the remaining error.'
      how_to_discriminate: Run lat0.25 and lat0.125 on a burst VM. A monotone sequence with order between
        about 0.6 and 1 confirms the two-level estimate is conservative; oscillation, or an order below
        0.42, refutes it.
    - explanation: The filament shift comes from wire filaments under-resolving the 19 µm skin depth of
        the Al wire at 20 MHz (Fa).
      how_to_discriminate: 'Already run: with 12 filaments per ring, L returns to within 0.008 % of production,
        which refutes Fa at 0.5 mm. A further step (for example 24 per ring) moving L by more than 0.05
        % would reopen it.'
    - explanation: Discretisation errors cancel in pair ratios for any perturbation (a smooth multiplicative
        bias).
      how_to_discriminate: 'Partly refuted: die_shift cancels only about 40× (its ratio estimate is about
        13 % of the 1.36 % effect), while trace_width cancels about 300×. Perturbations as large as real
        O003 re-layouts are needed to bound the ratio band.'
    discriminating_tests:
    - 'lat0.25 and lat0.125 on all three geometries on a burst VM (founder): gives the observed order
      for Case 4, an observed-order Richardson value, and a three-level ratio estimate.'
    - 'fil_f_phi12 versus fil_f versus lat0.5: already run; supports Fb (artefact of radial-only refinement).'
    - 'Pair-ratio estimate on a perturbation as large as an O003 re-layout (10–20 % change in L): tests
      whether ratio errors grow with the size of the change.'
