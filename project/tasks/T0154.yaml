  report:
    summary: 'The three deliverables are written and committed in bde77ab: the Case 4 layout script, results.json
      and the research note. The requested 0.5 / 0.25 / 0.125 mm lateral ladder could not be completed
      on this Mac. Only 0.5 mm ran, plus an extra 1.0 mm level, so the observed lateral order is not measured
      and every lateral estimate is a two-level (1.0 / 0.5 mm) estimate. Every definition-of-done command
      exited 0. This is a research note, not evidence (O006 F4).


      **Geometry.** PowerSynth 2D_Case_4 (e3da/PowerSynth2-pkg, commit a1de7ced949c0fd0105d166767b1de8705eb65ab)
      is rebuilt as a ModuleForge Layout from hand-transcribed numbers. The sha256 of all 12 files read
      is recorded. No GPL file was committed, copied or imported. The two perturbations were fixed before
      any solve:

      - **die_shift:** the high-side dies D3/D4 move −1 mm in y, so their wires shorten from 16.15 to
      15.16 mm.

      - **trace_width:** the DC− trace T4 widens from 5 to 7 mm.


      **Levels.** Each solve calls loop_inductance at 10 and 20 MHz, with the mesh constants changed inside
      a fresh research process; `src/` is untouched. Levels run:

      - lateral cell 1.0 and 0.5 mm;

      - thickness layers (top/backside/baseplate) 5/3/3, 10/6/6 and 20/12/12 at 0.5 mm (layer count ×2
      per step);

      - wire annuli bisected radially (25 → 55 filaments per wire) at 0.5 mm.


      The 0.25 mm (about 16 GB) and 0.125 mm (21–85 GB) levels are marked not_run, with projected memory,
      time and VM-hours.


      **Results, base geometry:**

      - **L at 0.5 mm:** 22.961 nH at 10 MHz and 22.817 nH at 20 MHz. Going from 1.0 to 0.5 mm changes
      L by −2.15 %.

      - **Absolute discretisation estimate (rules fixed before the solves):** 1.75 nH (7.6 %) at 10 MHz
      and 1.81 nH (7.9 %) at 20 MHz. It sums a lateral term of 3 × the 1.0 → 0.5 mm change, a thickness
      term of 0.02 nH (observed order about 4), and a filament term of 0.22–0.27 nH.

      - **Filament term is an artefact.** I added a diagnostic after seeing the filament result: the same
      annuli with 12 filaments per ring instead of 6. It lands within 0.008 % of production on all three
      geometries. So the +0.3–0.4 % shift from radial-only refinement is not real, and the estimate without
      it would be 1.54 nH (6.7 %).

      - **Pair ratios cancel most of the error.** The frozen ratio estimate is 1.7–1.8e-3 for die_shift
      and 0.9–1.1e-3 for trace_width (0.5–1.5e-3 with the corrected filament term). That is a factor of
      about 40–90 below the relative error on L.


      **Classification:** experimental limitation, not a solver fault. Every GMRES solve converged (flag
      0), and solver_tol relative to L stayed at or below 3.2e-5.'
    failure_class: experimental
    root_cause: 'The finer lateral levels do not fit on this machine. The 0.25 mm level needs about 16
      GB, projected from Case 4''s own measured memory per unknown (6.9–26 GB by other projection methods);
      the 0.125 mm level needs 21–85 GB. Case 4''s 80 × 110 mm baseplate gives about twice the unknowns
      of a generator layout. Agents may not launch burst VMs: docs/INFRASTRUCTURE.md has the founder run
      scripts/burst*.sh with the founder''s cloud credentials, and this task was not given credentials.
      As a result the observed order and an observed-order Richardson value cannot be measured. A separate,
      smaller finding: refining the wire annuli radially while keeping 6 filaments per ring is not a convergent
      refinement path and adds a spurious +0.3–0.4 % to L.'
    confidence: 0.6
    evidence:
    - 'Commands run and exit codes: `uv run python research/scripts/o006_case4_layout.py --check --sources
