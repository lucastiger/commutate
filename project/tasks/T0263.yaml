description: 'Only after the F3 freeze (n7 merged); the first step is to run experiments/runners/e008_run.py
  --verify-freeze. Reconstruct the D0010 public fallback references in research/scripts/o003_powersynth_references.py,
  following research/scripts/o006_case4_layout.py exactly (D0007). Download the GPL-3.0 files of e3da/PowerSynth2-pkg
  at a pinned commit to a temporary directory outside the repository, record the sha256 of every file
  read, transcribe geometry facts by hand, and never commit or copy a PowerSynth file.

  For each reference:

  - Copper islands and nets: DC+, PHASE, DC- and the commutation-loop port. Gate and Kelvin copper as
  fixed keep-out traces; 2D_Case_2R has no Kelvin source per its README.

  - Dies, source/gate/Kelvin pads, power wires, and gate/Kelvin wires as n1''s signal wires.

  - The stack, with ceramic material ''AlN'' (n2''s law).

  - Modelling choices stated with an M-number as in Case 4: loop height assumption, die attach (a non-zero
  thickness thermal_fem accepts; state the choice), terminal pads at lead footprints.

  - A ReferenceSpec via spec_from_layout (n3).

  - Snapping by geometry/snap.py at 0.5 mm, plus the 0.25 and 0.125 mm variants for the pre-registration
  snapping check, with every snap recorded. Report whether each reference is already on the 0.5 mm grid
  (then s_ref = 0).

  - Design rules measured by measure_rules on the snapped reconstruction.

  - L_term = 7 nH (S3).

  - Admissibility: public references, no diode dies (verify, and report any diode die).

  - A reconstruction hash (Layout fingerprint).

  Write outputs to research/o003/references/<ref>.json, with no customer data and no PowerSynth file.
  --check mode, exit 0 iff all pass: DRC-clean under its own measured rules; exact on the l2_layout lattice
  at 0.5 and 0.25 mm; thermal_fem.layout_grid level 0 accepts; the sha256 list complete; no PowerSynth
  file name inside research/. Write research/notes/o003-reference-reconstructions.md with sources, facts,
  choices, snap records, measured rules and each reference''s unknown count from l2_layout at 0.25 mm
  (mesh only, no solve).

  Run no inductance or thermal solve on these references, and no search, generator or twin call on them.
  Solves happen only in the registered E008 or the founder-run pre-registration snapping check. These
  reconstructions are shared with O004 and frozen.'
