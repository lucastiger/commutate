description: "Build item (4) of the objective notes. E011 is O008's id (E012 is O009's); experiments/specs\
  \ and drafts hold no E011.\n\n(a) experiments/drafts/E011.yaml, pre-registered and development-only.\n\
  \   - Counted layouts: 2D_Case_2R and 2D_Case_4; gen2_0 reported, not counted. Rules: each layout's\
  \ e008_rules, with no relaxed floor.\n   - Frozen and hashed (F5): the search config (move set, L1 budget,\
  \ shortlist K), the proxy rule and its step limit, the degradation family with its bounds, L1 target\
  \ and redraw limit, the null step limits, 8 draws per layout, sub-seed derivation from the sealed seed,\
  \ the band rule (D0008 ratio_band_estimate) and the band bound (median b_j <= 0.01 and max b_j <= 0.02,\
  \ value to be filled from the dev L2 run).\n   - code_under_test hashes: derivative.py, twin.py, optimize/local.py,\
  \ control.py, nulls.py.\n   - Metrics: control_layout_pass_min, reach_outside_max, null_beaten_min,\
  \ control_shortfall_median_max, with recompute entries naming n7's function names as placeholders for\
  \ the founder's mfos.metrics port.\n   - Sanity checks: F1(a) seed null fails A1; F2 per layout (W rebuilt\
  \ from params_of(W) DRC-clean with its fingerprint reproduced; in_domain(W) True under reach and False\
  \ for 2R under E010's generator; the twin-versus-reconstruction symmetric difference; T0349's coordinate-range\
  \ and attached-form tests; the L1 lower tail of the random screen's pool relative to W per D0023); F6\
  \ (at least 2 counted layouts); W*'s DRC.\n   - Reported: W, W* and best_j hottest-die Tj at the thermal\
  \ reference's coarsest level, with the 2 K fallback to the die-fixed proxy; ablations (c) and (e) with\
  \ their A1 and A3 values; F4's rank correlations.\n   - A section that states how the joint operating\
  \ characteristic of A1, A3 and not-K1 is computed from the development draws' s_j and b_j at L2, including\
  \ the common-mode error of the single L_sub(W*) solve per layout. The numbers are filled after the dev\
  \ L2 run.\n   - The cost estimate and an expected-outcome block.\n(b) experiments/runners/e011_run.py.\
  \ Reuse e010_run by import for references, rules, cost model, scheduler, phase split and thread pinning\
  \ rather than copying it. Modes:\n   - --selftest: fake solvers and planted outcomes, through the full\
  \ row and recompute path with e011_metrics. A passing search gives PASS. A null recovering W* on one\
  \ layout gives INCONCLUSIVE. A seed null meeting A1 gives INVALID. Fewer than 2 layouts gives INVALID.\
  \ Every registered artifact must resolve exactly as tools/mfos/mfos/evaluate.py resolves it: fix T0349's\
  \ defect by registering run-dir-relative names.\n   - --smoke: real code on gen2_0 locally, with a reduced\
  \ budget and coarse L2 cells.\n   - --dev: development seeds only. Runs the L1 stages locally, then\
  \ writes experiments/drafts/E011.dev_jobs.json, the L2 job manifest for a burst VM with a cost estimate\
  \ per job.\n   Rows follow n7's schema.\n\nThe dev L2 analysis (band bound, joint operating characteristic,\
  \ dev_rows) is a later task, after the founder's burst run.\n\nNote from the founder session (2026-11-16):\
  \ O008's one parameter set is the frozen objective's 'columns, slots, die rows, landing lines': Params.NAMES[twin.WALK_FIRST:twin.WALK_END]\
  \ (indices 4-39), the set the L1 probe (research/o008_probe) and the T0376 kill shot used. The four\
  \ power-wire foot offsets foot_{HS,LS}_land_{du,dv} are not in it (founder decision 2026-11-16, recorded\
  \ by the founder session). E011's spec and runner name this set, and the runner records movable_indices()\
  \ in each row's provenance.\n\nReview T0414 of T0378 (founder session, 2026-11-16): E011 gates each\
  \ draw on the search's stats['seed_in_domain'] (a D_j outside in_domain(reach=True) is a defect of the\
  \ degradation family, reported and redrawn within the frozen limit, never scored), and development mode\
  \ checks that the 2D_Case_2R and 2D_Case_4 twins are in the domain (A2). The l_sub checkpoint key carries\
  \ the resolution (T0379), so development (0.5 mm) and judged (0.25 mm) solves never share a cached value.\
  \ The unit tests use separable scores, so E011's development rows are the first evidence the search\
  \ recovers inductance headroom.\n\nT0379's report (founder session, 2026-11-16): (1) twin._net_side\
  \ reads the DC- column as side tuple (-1,-1,1), but the replay certifies both (-1,-1,1) and (-1,1,1)\
  \ in all 18 tested states on 2D_Case_2R and in 6 of 17 on 2D_Case_4, and nothing in the repository says\
  \ which is intended. In development mode, run the proxy descent and one search draw per layout under\
  \ both DC- readings and report whether W*, L1(W*)/L1(W) and the search's best differ; if they differ,\
  \ the spec states which reading is frozen and why. (2) The proxy descent's minimum gain per step (control.MIN_GAIN_H\
  \ = 1e-12 H, which reproduces the probe's 27 steps and L1 ratio 0.8979 on 2R; without it the descent\
  \ walks noise-level gains to 0.875 in 43 steps) is a frozen-rule choice the founder confirms at T0379's\
  \ merge. Whatever is frozen, E011's development rows report the descent without the threshold as a sensitivity\
  \ row (steps, L1 ratio, and L_sub at the development resolution) beside the frozen proxy.\n\nT0380's\
  \ report (founder session, 2026-11-16): optimize.nulls records each null's changed-parameter count and\
  \ Manhattan distance from D_j, because a null must not see W*. O008 (F-nulls detection) reports, per\
  \ draw, the parameter-space distance from W* for the search and for every null: the runner computes\
  \ it after each run from the returned layout and W*'s parameters, over movable_indices(). Nulls (b)\
  \ and (d) stop at their own local optimum or at nulls.NULL_STEP_LIMIT = 200 steps; a capped null is\
  \ recorded as capped (the A3 metric's capped column) and is never a resolved failure; development mode\
  \ reports how many null runs hit the cap.\n\nFounder decision 2026-11-16 20:30 UTC on the proxy rule\
  \ (reviews T0421/T0422 of T0379): E011 freezes the designer proxy as T0379 built it: control.proxy_descent\
  \ with reach=True, i.e. a steepest single-parameter L1 descent from W over movable_indices() whose moves\
  \ are the search's own single-parameter moves (+-0.5 mm steps and the twin's reach jumps), every state\
  \ DRC-clean under the reference's measured rules and inside in_domain(reach=True), minimum gain per\
  \ step control.MIN_GAIN_H = 1e-12 H, to a local optimum or the frozen step limit. The spec names the\
  \ reach jumps and the in-domain test explicitly, because O008's text says '0.5 mm steps'; the reason\
  \ is O008's 'the target is an optimum of the search's own domain' (review T0358): the probe's DRC-only\
  \ proxy on 2D_Case_2R lies outside the domain (in_domain fails at row_LS_gap, the die-row gap cap gmin\
  \ + 2 mm), so the search could not reach it. Measured by the reviewers: L1(W*)/L1(W) = 0.914 on 2R (probe\
  \ 0.898) and 0.653 on 2D_Case_4 (probe 0.628).\nConsequences for the design:\n1. The probe's null margins\
  \ and T0376's L2 figures were measured against the deeper probe proxy and do not carry over: development\
  \ mode re-measures the null margins ((b), (d), and (d) compaction on 2R in particular) and the joint\
  \ operating characteristic against this in-domain proxy, on development draws (the I0205 burst), and\
  \ the spec's registration check uses those rows.\n2. Report the threshold-free descent and the probe's\
  \ DRC-only proxy (reach=False) as sensitivity rows, with the die-row gap cap named as a known limit\
  \ of the search (it is recorded for O009 and the thesis review).\n3. Pin the reach=True proxy's terminal\
  \ values (steps, L1 ratio) on both development layouts in a regression test; only the reach=False path\
  \ is pinned today.\n4. Seed streams: numpy's SeedSequence drops trailing zero entropy words, so [seed,\
  \ li, j, 0] equals [seed, li, j]. Put a nonzero domain tag first in every entropy list in control.py\
  \ (degradation) and keep the search's sealed seed distinct from the degradation's, as O008 already requires;\
  \ add a test that the streams differ.\n5. The degradation family can stall below the 1.3875 L1 target\
  \ (2 of 4 draws on 2R at 400 proposals; 1.14-1.16 from an unoptimised W on Case 4) or overshoot in one\
  \ move: report per counted layout the L1 stop distribution, the rate of reaching the target and the\
  \ L2 redraw rate (F6), and cost the r_d_at_l2 calls made for draws that missed the L1 target.\n6. State\
  \ ablation (e)'s step limit (proxy_alone defaults to 100000, so only the L1 budget ends it).\n7. In\
  \ tests/unit/optimize/test_control.py, replace the vacuous no-L2 assertion with an import check (ast\
  \ or inspect) that moduleforge.solvers.l2_layout is not imported by control.\n\nReview T0425 of T0380\
  \ (founder session, 2026-11-16): in src/moduleforge/optimize/nulls.py, record seed_in_domain and the\
  \ number of valid neighbours at step 0 in NullResult.stats, and give nulls (b) and (d) a distinct terminal\
  \ 'no_moves' when the first neighbourhood is empty (today they return D_j unchanged labelled 'local_optimum');\
  \ add a test with an out-of-domain D_j. E011 never scores a null run whose D_j is outside in_domain(reach=True)\
  \ (it cannot happen with T0379's family, which keeps every D_j in the domain; the runner asserts it).\
  \ Development mode reports the step counts of nulls (b) and (d) on 2D_Case_4 draws, where the probe's\
  \ nulls hit a 60-step cap on 8 of 10 runs, to show whether NULL_STEP_LIMIT = 200 reaches a local optimum\
  \ there; the A3 margins are re-measured in-domain (the probe filtered by DRC only).\n\nReview T0426\
  \ of T0380 (numerics, accept with caveats; founder session, 2026-11-16). In src/moduleforge/optimize/nulls.py\
  \ and tests/unit/optimize/test_nulls.py:\n1. A null that reaches its local optimum on exactly step NULL_STEP_LIMIT\
  \ is labelled step_limit (on the test's own 70x40 fixture, seed 5, compact reaches its optimum at exactly\
  \ step 200). When the limit is hit, examine the neighbourhood once more and label the run local_optimum\
  \ if no feasible move improves; add a test whose step_limit equals the known optimum step count. The\
  \ returned layout does not change, only the label.\n2. The compaction constraint (no copper lost, no\
  \ wire lengthened) bound on no step of any layout T0426 tried, so no test protects it: add a unit test\
  \ with a hand-picked or synthetic candidate where the steepest A-W move reduces copper, and assert null_compact\
  \ rejects it.\n3. Nulls (b) and (d) move descend's default set, movable_indices(): the frozen set, die\
  \ rows included. Give both an optional dies_fixed argument (default False) passed through to descend,\
  \ so that a dies-fixed arm, if E011 has one, moves the same set for the search and every null; E011's\
  \ spec states which arms keep die rows free.\n4. test_nulls.py takes about 125 s and runs in the fast\
  \ suite: mark the long tests slow and keep a fast smoke test.\n5. Development mode reports, for each\
  \ null, layout and draw from T0379's family at the registered R_D range [1.25, 1.60], the step count\
  \ and terminal kind. T0426 measured only up to R_D(L1) of about 1.15 on 2D_Case_4, where compact took\
  \ 107 of the 200 steps; if any development run is capped, say so before the limit is frozen in the spec.\n\
  6. Ablation (c) counts its budget in draws: report l1_evals beside n_draws.\n\n\nFounder session, 2026-11-17,\
  \ for the next attempt (after reviews T0430 and T0431 rejected attempt 1; read their findings in the\
  \ packet). Order the work so that the development rows come from the code that will be frozen:\n1. Source\
  \ fixes first; they are in this task's scope (touches: control.py, nulls.py and their tests), not another\
  \ task's: the nonzero domain tag in every entropy list in control.py, with a test that the streams differ\
  \ (review T0414 item 4); every T0425 and T0426 item for nulls.py listed above; the reach=True proxy's\
  \ terminal values pinned in a regression test on both development layouts (2R: 25 steps, L1 ratio 0.9138\
  \ before the seed change, re-measure after); mark the long tests in tests/unit/optimize/test_nulls.py\
  \ slow, keeping a fast smoke test.\n2. Runner fixes from T0430/T0431: key dev_solve's jobs by (fingerprint,\
  \ level) or job id and assert that the number submitted equals totals.jobs_wave1; record every purpose\
  \ of a deduplicated job and rebuild the shortlist groups from it, selecting the best by (L, L1 rank);\
  \ reuse E010's convergence predicate in em_ok (a missing gmres record or a non-finite L_H is not converged);\
  \ add a selftest case that runs write_manifest and dev_solve on a small fake manifest and asserts every\
  \ (fingerprint, level) job is submitted.\n3. The seed-tag change alters every degradation draw, so attempt\
  \ 1's development checkpoints are stale: move research/o008_e011_dev/work aside (do not reuse it), make\
  \ the runner refuse a checkpoint written with a different code hash, and rerun --dev for both layouts.\
  \ A single background command is limited to 2 hours; resume from the checkpoints across several commands\
  \ until the manifest's status reads complete for 2D_Case_2R and 2D_Case_4.\n4. Report, per layout, the\
  \ search's improvement curve: the share of its final L1 gain made in the last 10 % and the last 25 %\
  \ of the 2000-evaluation budget (attempt 1 on 2R was still improving in its last 10 %). The founder\
  \ decides the budget before registration from this; do not change it.\n5. Then `e011_run.py --freeze-report`\
  \ to refresh code_sha256 and frozen_sha256, and state the manifest's VM sizing from the measured unknowns\
  \ (Case 4's 0.25 mm solves at about 25 GB each).\n\n\nAttempt 3 (founder session, 2026-11-17, resolving\
  \ I0234): attempt 2 was right to block. The source fixes are not a scientist's; builder task T0437 makes\
  \ them, and this attempt starts only after T0437 has merged. Keep attempt 2's runner work (dev_solve\
  \ keyed by (fingerprint, level), purposes per job, E010's convergence predicate, code-stamped checkpoints,\
  \ real seed-stream check, improvement curve); merge current main into this branch first. Then do the\
  \ following, which was briefed as T0439 and is folded into this task:\n\nE011's development L1 run on\
  \ the code that will be frozen, and the complete burst job list for I0205 (O008). It runs after T0437\
  \ (source prerequisites: the seed-stream tag changes every degradation draw) and T0382 (the runner fixes:\
  \ dev_solve keyed by (fingerprint, level), purposes per job, E010's convergence predicate, code-stamped\
  \ checkpoints). Read T0382's research/o008_e011_dev/attempt2.md and reviews T0430, T0431 and T0432 first.\n\
  \n1. Rerun `uv run python experiments/runners/e011_run.py --dev` from scratch for 2D_Case_2R and 2D_Case_4\
  \ (development seeds only, never a sealed seed). A single background command is limited to 2 hours:\
  \ resume from the checkpoints across several commands until the manifest's status reads complete for\
  \ both layouts. Attempt 1's checkpoints (research/o008_e011_dev/work.attempt1-stale) are refused by\
  \ the code stamp; do not reuse them.\n2. `e011_run.py --freeze-report`, then fill code_sha256 and frozen_sha256\
  \ in experiments/drafts/E011.yaml.\n3. experiments/drafts/E011.dev_jobs.json: status complete, every\
  \ job with its level and purposes, totals per level, and the VM sizing from the measured or modelled\
  \ unknowns: 2D_Case_4's 0.25 mm solves are about 25 GB each (T0382), so state how many run at once on\
  \ the proposed machine, the makespan and the cost, and whether the registered run fits its timeout (T0382\
  \ estimated about 91-136 h for the registered run's Case 4 solves against timeout_min = 120 h, and about\
  \ $80-105). Check that `--dev-solve` on the manifest would submit every job (the selftest's manifest\
  \ check, run on the real manifest in a dry mode if the runner has one).\n4. Report per layout: (a) the\
  \ search's improvement curve, the share of its final L1 gain made in the last 10 % and the last 25 %\
  \ of the 2000-evaluation budget (attempt 1 on 2R was still improving in its last 10 %); the founder\
  \ decides the budget before registration from this, so do not change it; (b) for each null and draw,\
  \ the step count and terminal kind (local_optimum, step_limit or no_moves) and seed_in_domain, at the\
  \ registered R_D range [1.25, 1.60] (review T0426 item 5); (c) the in-domain proxy's steps and L1 ratio;\
  \ (d) the ablation's l1_evals beside n_draws.\n5. `mfos exp check E011` exits 0 and the selftest passes.\
  \ Write the facts to research/notes/e011-dev-run.md.\n\n\nFounder session, 2026-11-17: the founder accepted\
  \ decision record D0026 (project/decisions/, commit 9a54cdb0). The spec and notes cite D0026 for the\
  \ pre-registration decisions it records, instead of the objective's state log.\n\n\nReview T0444 of\
  \ T0437 (founder session, 2026-11-17): nulls.py now returns the terminal kind 'no_moves' (the first\
  \ neighbourhood was empty: D_j had no valid in-domain neighbour), but experiments/runners/e011_metrics.py's\
  \ TERMINAL_KINDS does not include it and its validator raises on it. Map it in the runner and the metrics,\
  \ and state in E011's spec how a no_moves null draw counts for A3. My reading: it is not a resolved\
  \ failure, because the null never moved; it counts like a capped null and is reported. The founder confirms\
  \ it with the spec. Do the same for the search's existing 'no_moves' stop reason. T0437 also changed\
  \ every degradation draw (the seed tag), so no development row or pin from before T0437 carries over.\n"
