  \ those cases as\n   violations. Prefer raising; add tests for both cases.\n3. tests/unit/geometry/test_stack.py\
  \ line ~131: correct the comment to match the stack.py docstring (319 W/(m K) is Slack\n   et al.'s\
  \ estimated intrinsic value; the 400 K and 480 K values are the 1/T law, not data).\n4. stack.py AlN\
  \ docstring (T0272 note 3): cite Watari et al., J. Mater. Res. 17(11) (2002), AlN ceramic 4-1000 K\n\
  \   (272 W/(m K) at room temperature, high purity, not a commercial 170-180 grade), and remove the claim\
  \ that no AlN-ceramic\n   k(T) data were found. Do not change the law itself.\nKeep every existing test\
  \ passing; do not weaken any test or tolerance."
