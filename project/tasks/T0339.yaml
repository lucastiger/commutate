description: "Founder decision D0021 (project/decisions/D0021-o003-e008-not-runnable-successor-e009.md,\
  \ accepted 2026-11-14), items 2-4 and 7. Design the successor experiment E009 for\nO003. E009 is the\
  \ registered E008 (experiments/specs/E008.yaml, the content to start from) with three changes only:\n\
  (a) the repaired generator sampler (merged by the task this one depends on; research/notes/e009-generator.md);\n\
  (b) SearchInfeasible: a reference whose main or control screen cannot draw a DRC-valid candidate (derivative.generate's\n\
  RuntimeError) is excluded and reported (reason SearchInfeasible, stage screen), like a TwinError, instead\
  \ of aborting\nthe run; E009 is INVALID only if no reference remains;\n(c) new freeze hashes. Everything\
  \ else stays as in E008's registered spec: the gated criteria and their parameters,\nthe metrics and\
  \ recompute entries, the null baselines, stop rules, F3 order, budgets, bands, the D0019 reference set,\n\
  the D0020 Tj rule and readings, the twin construction, the degradation rule, the search driver, the\
  \ cost model rates and\nthe sealed-seed policy (a new mint gives E009 its own seeds). 2D_Case_6 is still\
  \ expected to be excluded (TwinError).\n\nRequired:\n1. experiments/drafts/E009.yaml, generated by research/o003/e009_dev/make_spec.py\
  \ (start from\n   research/o003/e008_dev/make_spec.py; leave that file and every E008 file unchanged).\
  \ Record D0021 in the spec where E008\n   records D0019/D0020. research/o003/e009_dev/spec_diff.md lists\
  \ every key that differs from the registered\n   experiments/specs/E008.yaml, with the reason for each.\
  \ Nothing may differ beyond (a)-(c), the experiment's own id and\n   paths, and the cost lines that\
  \ --plan changes.\n2. experiments/runners/e009_run.py, from e008_run.py (e008_run.py stays unchanged):\
  \ implement (b) in the registered\n   path and the dev path, and report it in the evaluation report's\
  \ 'excluded'. Selftest: a synthetic reference whose\n   screen cannot draw is excluded with reason SearchInfeasible,\
  \ the run continues, and every gated row, metric and check of\n   the other references is byte-identical\
  \ with and without it. Re-stamp every hash, as T0324 did.\n3. experiments/drafts/E009.dev_rows.json:\
  \ rebuild with --replay-only from a temp copy of\n   /Users/lukeskywalker/mf/drafts/e008-dev-run-2026-11-13/full_work\
  \ (read only), as T0334 did. No solve may start. Its rows\n   must equal E008's development rows (the\
  \ generator fix keeps development draws identical).\n4. --check-references (pre-registration, D0021\
  \ item 4): add a generator/DRC-only feasibility check for every judged\n   reference that has a twin:\
  \ the sampler draws DRC-valid candidates for its main and control housing, with the draw\n   rate and\
  \ the estimated time to draw 20 000 candidates. Use it in --plan's screen time for that reference. Use\
  \ the same\n   numbers as research/o003/e009_dev/feasibility_2r.py. Update --plan, state the expected\
  \ and upper billed vCPU-hours, and\n   confirm the 320 vCPU-hour cap still holds.\n5. research/o003/e009_dev/burst_full.sh,\
  \ from research/o003/e008_dev/burst_full.sh: EID E009, E009's spec and runner, state dir\n   ~/.cache/mf-burst/e009_full.\
  \ Commit it executable (git mode 100755).\n6. research/notes/e009-design.md: a short note on what differs\
  \ from E008 and why (D0021).\n\nHard limits (D0021 item 4). On 2D_Case_2R and 2D_Case_6, before E009\
  \ is registered, only generator/DRC feasibility work:\nreference reconstruction by the frozen T0263\
  \ script, spec_from_layout, twin() geometry fit, derivative sampling/build and\ndrc.check. No L1, l2_layout,\
  \ EM, thermal, FV, degrade() or search run on them. Never read anything under\nexperiments/results/E008/E008-20261114T095904-2c22/work/*/solves/\
  \ or any L_sub or Tj of 2R or 6. E009 reuses no data from E008's run. No change to src/,\ntests/acceptance,\
  \ tools/, experiments/specs/, e008_run.py, the frozen reconstruction script, research/o003/references/,\n\
  research/o003/e008_dev/burst_full.sh or scripts/burst_gcp.sh. Never write\n/Users/lukeskywalker/mf/drafts/,\
  \ experiments/results/E008/E008-20261114T095904-2c22, the main checkout's untracked research/o003/e008_dev/full_work\
  \ and tj_osc/vm_work,\nor anything under /private/tmp. Never run gcloud or start a VM. Never read data/holdout/.\
  \ Do not look at Hopkins / NC\nState PREES or 2D_Case_5 geometry. Do not run `mfos approve`, `mfos exp\
  \ register` or anything else that registers. Do\nnot commit generated data over 1 MB."
