id: T0235
objective: O007
title: 'O007 sliver discriminator (labelled diagnostic): Cases 1a and 1b under graded Q1 candidate 1 with
  the sliver-forming lines removed, L0-L2 (L2 by founder burst)'
type: investigate
agent: scientist
status: proposed
depends_on: []
description: 'Founder I0124 (c), step 1. Decide, before any production change, whether T0228''s CG-only
  miss comes from sliver cells next to near-coincident grid lines or from conditioning of the plates.
  The miss was Case 1a 204/252/316 and Case 1b 198/247/318 at L0/L1/L2 against the pre-registered 300.
  This is a LABELLED DIAGNOSTIC. It is not a candidate configuration, and none of its temperatures enters
  any criterion, freeze or spec. Make no production code change.


  Write research/scripts/o007_sliver.py, reusing by import from research/scripts/o007_dev_study2.py, o007_dev_study.py
  and o007_probe.py: rule_of(''a_q1h4_graded''), load_refs (check sha256 befc5efa... and ca05847b... first),
  box_problem, the child-process worker, the memory gate and watchdog, _lines_stats/min_cell_ratio, and
  the cg_only counter alongside thermal_fem meta[''cg_iterations''] (T0222). Outputs go under research/o007_sliver/.


  (1) Grid-only survey. This is allowed before pre-registration; it computes no temperature. For Cases
  1a and 1b at L0 under candidate 1 exactly (research/o007_dev2/frozen_config.json, the production GridRule
  with edge_grading), list every lateral interval whose neighbour width ratio is below 0.1. For each,
  name the lines that bound it: source centroid line, frozen-maximum extra line, grading line, source
  edge or domain end. Also give its width and its neighbours'' widths. T0228 data to explain: 1a min cell
  28.6 um (ratio 0.013), 1b 50 um (ratio 0.031, possibly the 100 um grading first offset rather than a
  maximum line), Case 2 ratio 0.010 but CG only 162.


  (2) Pre-registration. Write section 0 of research/notes/o007-sliver.md and commit it before any solve.
  Record the hash in discriminator.json as preregistration_commit. Section 0 fixes:

  - Variant centroid_only: candidate 1 with the frozen-maximum extra_lines removed, built-in centroid
  lines kept (T0225 part 1, I0124).

  - Optional, at most one more variant, sliver_free: allowed only if the survey shows that centroid_only
  leaves a case''s minimum lateral ratio below 0.1. It also removes or merges the survey-named lines,
  by a rule that depends on geometry only and is written down in full.

  - decisive_variant per case (centroid_only or sliver_free), fixed in section 0.

  - Verdict rule: ''slivers'' iff, on both case1a and case1b, the decisive variant''s CG maximum over
  every Picard step is <= 300 at every level measured, with L2 measured. ''conditioning'' iff any decisive-variant
  count exceeds 300 at any level, the 400 cap included. ''unmeasured'' otherwise, i.e. while a decisive
  L2 is missing and no count exceeds 300.


  (3) Records per case and variant: levels_run, cg_max_per_level, DOF, min_ratio_lateral_l0 (min of the
  x and y ratios at L0, float), min ratios per level, final true relative residual, and wall time. The
  variant max_lines holds T0228''s values, copied from research/o007_dev2/dev_study.json and plan.json
  and not re-solved. Do not compare any variant temperature with a reference; maximum points are not nodes
  in centroid_only.


  (4) Runs. L0 and L1 run locally under T0228''s memory rule. Add a --full mode that runs the missing
  L2 solves and then --report. Write burst_command ''scripts/burst_gcp.sh --cmd "uv run python research/scripts/o007_sliver.py
  --full" research/o007_sliver'' into research/o007_sliver/plan.json, with the estimated peak GB and wall
  time per L2 solve. --report is deterministic and writes research/o007_sliver/discriminator.json with
  keys verdict, preregistration_commit, survey, and cases.{case1a,case1b}.{decisive_variant, variants.{max_lines,
  centroid_only[, sliver_free]}}. Before the founder''s burst, the expected state is verdict ''unmeasured''.
  That is a valid completion. Label every post-data change as such.'
