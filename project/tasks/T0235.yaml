definition_of_done:
- cmd: null
  exists: research/o007_sliver/discriminator.json
  timeout_s: 60
- cmd: uv run python -c "import json; d = json.load(open('research/o007_sliver/discriminator.json'));
    ds = json.load(open('research/o007_dev2/dev_study.json'))['chosen']['cases']; assert d['verdict']
    in ('slivers', 'conditioning', 'unmeasured'); assert len(d['preregistration_commit']) >= 7; cs = d['cases'];
    C = ('case1a', 'case1b'); assert set(C) <= set(cs); assert all(cs[c]['decisive_variant'] in cs[c]['variants']
    and cs[c]['decisive_variant'] != 'max_lines' and cs[c]['variants']['max_lines']['cg_max_per_level']
    == ds[c]['cg_max_per_level'] for c in C); assert all(len(x['cg_max_per_level']) == len(x['levels_run'])
    >= 2 and isinstance(x['min_ratio_lateral_l0'], float) for c in C for x in cs[c]['variants'].values());
    dv = [cs[c]['variants'][cs[c]['decisive_variant']] for c in C]; assert d['verdict'] != 'slivers' or
    all(x['levels_run'] == [0, 1, 2] and max(x['cg_max_per_level']) <= 300 for x in dv); assert d['verdict']
    != 'conditioning' or any(max(x['cg_max_per_level']) > 300 for x in dv); assert d['verdict'] != 'unmeasured'
    or (any(x['levels_run'] != [0, 1, 2] for x in dv) and all(max(x['cg_max_per_level']) <= 300 for x
    in dv))"
  exists: null
  timeout_s: 120
- cmd: uv run python -c "import subprocess, sys; f = 'research/o007_sliver/discriminator.json'; a = open(f).read();
    subprocess.run([sys.executable, 'research/scripts/o007_sliver.py', '--report'], check=True); assert
    open(f).read() == a, 'report is not deterministic'"
  exists: null
  timeout_s: 900
- cmd: uv run python -c "import json; p = json.load(open('research/o007_sliver/plan.json')); assert 'o007_sliver.py
    --full' in p['burst_command']"
  exists: null
  timeout_s: 60
- cmd: null
  exists: research/notes/o007-sliver.md
  timeout_s: 60
- cmd: uv run ruff check research/scripts/o007_sliver.py
  exists: null
  timeout_s: 300
