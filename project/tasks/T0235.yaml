    >= 2 and isinstance(x['min_ratio_lateral_l0'], float) for c in C for x in cs[c]['variants'].values());
    dv = [cs[c]['variants'][cs[c]['decisive_variant']] for c in C]; assert d['verdict'] != 'slivers' or
    all(x['levels_run'] == [0, 1, 2] and max(x['cg_max_per_level']) <= 300 for x in dv); assert d['verdict']
    != 'conditioning' or any(max(x['cg_max_per_level']) > 300 for x in dv); assert d['verdict'] != 'unmeasured'
    or (any(x['levels_run'] != [0, 1, 2] for x in dv) and all(max(x['cg_max_per_level']) <= 300 for x
    in dv))"
  exists: null
  timeout_s: 120
