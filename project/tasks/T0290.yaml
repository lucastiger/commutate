    summary: "I made all four T0288 fixes in the generator and committed them as 6919a5ae. All DoD commands\
      \ exit 0 (see checks_run). `_quick_ok` and the `_draw_feet` ilo/ihi now use the DRC's 1e-9 m tolerance.\
