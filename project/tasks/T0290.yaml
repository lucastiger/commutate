      \ is removed. `_ls_foot_distance_bound` is now a proven upper bound. The throughput figures in the\
      \ docstring are replaced by new measurements.\n\n1. **Tolerances.** I imported the DRC's `TOL` into\
      \ `derivative.py` as `DRC_TOL`.\n   - `_quick_ok` now accepts a signal wire if `length <= limit\
      \ + TOL`. It accepts a signal-to-power wire distance if `distance >= min_wire_pitch - TOL`. Copper\
      \ containment and net spacing already had it.\n   - The ilo/ihi indices in `_draw_feet` use ceil/floor\
      \ with ±1e-9.\n   - I found one other strict comparison, the `land + ldv` window in `_sample`, and\
      \ gave it 1e-9 as well.\n   - The audit list is in the module docstring.\n   - No DRC rule was changed.\n\
      2. **Tests.**\n   - `test_draw_feet_clear_branch_accepts_exact_fit` uses a scripted rng to drive\
      \ the `clear()` branch of `_draw_feet` on the k=3 exact fit (0.625 mm pitch, signal feet at ±0.25\
      \ mm). The companion test, with `CLEAR_TOL_MM` patched to 0, shows the same call rejecting it.\n\
      \   - `test_quick_ok_float_tolerance_pitch_and_length` runs `_quick_ok` with a pitch rule and a\
      \ gate-length limit 5e-10 m tighter than the layout's real distance/length. It also checks the 0.02875\
      \ vs 0.029375 m shapely distance (below 0.625 mm) and that a 1e-6 m shortfall is still rejected.\
      \ The companion test sets `DRC_TOL` to 0 and shows both being rejected.\n   - I confirmed the `_quick_ok`\
      \ pair fails against the original source. For the `_draw_feet` pair, the original source already\
      \ had the tolerance, so I could only show the failure by patching `CLEAR_TOL_MM` to 0.\n   - The\
      \ existing k=3 generation test still passes but cannot detect a removed tolerance (T0288 finding\
      \ 0). I added a docstring note saying so.\n3. **`_ls_foot_distance_bound`.** It now uses endpoint-inclusive\
      \ grids (h ≤ 0.1 mm) with a stated Lipschitz margin.\n   - It relies on `sup min(d_g, d_k) = sup_p\
      \ min(sup_g d_g, sup_k d_k)`, because the gate and Kelvin feet are independent.\n   - The bound\
      \ is per die centre. The scan over centres is still a grid, and the docstring says so.\n   - The\
      \ largest bound is 1.96 mm at (25, 30), which is above T0288's fine-grid supremum of 1.820 mm and\
      \ below 2 mm. The docstrings carry the corrected numbers.\n   - The test now asserts `1.820 <= best\
