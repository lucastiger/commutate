      - test_control.py: 70 s in the fast run and 23 s for the slow anchor.

      - With test_local_search.py: about 103 s.'
    - A descent that runs out of its `max_evals` budget mid-step takes the best improving candidate found
      so far and then ends with kind BUDGET. This is the more favourable reading for ablation (e). It
