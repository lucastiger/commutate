description: "Build item (3a) of the objective notes. Create src/moduleforge/optimize/control.py, built\
  \ on local.descend.\n\n(a) proxy_descent(spec, W_params, l1, step_limit, dies_fixed=False):\n   - the\
  \ steepest single-parameter L1 descent from W in 0.5 mm steps, DRC-clean, to a local optimum or the\
  \ step limit, over the same parameters the search moves, die rows included;\n   - dies_fixed=True is\
  \ the Tj fallback (scope_in, review T0359);\n   - choose_proxy(W, W_desc, l_sub) returns W* as the one\
  \ of W and W_desc with the lower L_sub, and records L1(W*)/L1(W), L_sub(W*)/L_sub(W), the steps and\
  \ the terminal kind.\n(b) The randomised degradation family, degrade_draw(spec, Wstar_layout, rng, l1,\
  \ cfg):\n   - stochastic L1 ascent by joint moves of several parameters over the search's parameter\
  \ set, as in the probe;\n   - each accepted state is DRC-clean and in_domain;\n   - it stops at a frozen\
  \ L1 target;\n   - it takes no L2 callable, so it cannot use l2_layout (scope_in);\n   - draw_degradations(spec,\
  \ Wstar, sealed_seed, layout_index, n_draws, r_d_at_l2, redraw_limit) derives sub-seeds as SeedSequence([seed,\
  \ layout_index, draw, attempt]), calls the injected r_d_at_l2 only to accept or reject a whole draw\
  \ against [1.25, 1.60], redraws up to the limit, and records the attempts and the achieved R_D (F6).\n\
  (c) Ablation (e), proxy_alone(spec, D_layout, l1, budget): the proxy rule run from D_j with the search's\
  \ L1 budget and no L2 shortlist.\n\nTests, in tests/unit/optimize/test_control.py:\n- degradation and\
  \ proxy never call L2: inject an l_sub that raises;\n- determinism per seed;\n- outputs are DRC-clean\
  \ and in_domain;\n- the redraw logic respects the limit and the [1.25, 1.60] window with a fake r_d;\n\
  - dies_fixed leaves the row_* parameters bit-identical;\n- choose_proxy returns W when W_desc's L_sub\
  \ is not lower (F3);\n- regression anchor: with reach off and the probe's movable set, proxy_descent\
  \ on 2R's twin reproduces the probe's L1(W*)/L1(W) = 0.898 and 27 steps (research/o008_probe/probe_2R_proxy.json)\
  \ to 1e-9. Mark it slow if it exceeds 60 s, and run it explicitly in the definition of done.\n\nFounder\
  \ session, 2026-11-16 (from T0377's reviews T0402 and T0403): twin._net_side can misread a column's\
  \ side for straddling slots that the reach domain allows. Add a test that the proxy and the degradation\
  \ build the intended column sides on 2R and Case 4 (Case 4's twin is also outside the legacy domain),\
  \ and report any case where the reading is ambiguous.\n\nNote from the founder session (2026-11-16):\
  \ O008's one parameter set is the frozen objective's 'columns, slots, die rows, landing lines': Params.NAMES[twin.WALK_FIRST:twin.WALK_END]\
  \ (indices 4-39), the set the L1 probe (research/o008_probe) and the T0376 kill shot used. The four\
  \ power-wire foot offsets foot_{HS,LS}_land_{du,dv} are not in it (founder decision 2026-11-16, recorded\
  \ by the founder session). T0378's optimize.local.movable_indices() also moves the foot offsets. If\
  \ it still does when you start, remove them as this task's first change: _FOOT_LAND and its use in movable_indices,\
  \ the foot step in _step_of if nothing else needs it, and the module docstring's mention; update tests/unit/optimize/test_local_search.py\
  \ so that it asserts movable_indices() == tuple(range(twin.WALK_FIRST, twin.WALK_END)) and that no foot_*\
  \ parameter moves. This corrects the scope to the frozen objective; it does not weaken a test. The proxy\
  \ descent and the degradation family call local.movable_indices(); do not hard-code a set.\n\nReview\
  \ T0414 of T0378 (founder session, 2026-11-16): fix these in optimize/local.py together with the foot-offset\
  \ removal above, each with a test.\n1. descend(movable=...) does not restrict the reach jumps: _Space.neighbours\
  \ always appends every twin._walk_candidates(..., reach=True) jump, so a restricted movable set can\
  \ still move column and slot u-coordinates. Drop a jump whose changed parameters are not all in the\
  \ movable set; test that descend(movable=[i]) changes only parameter i.\n2. The search moves only inside\
  \ in_domain(spec, ., reach=True), and a DRC-clean seed outside it usually stops after one evaluation\
  \ (stop_reason 'no_moves'). O008's move set is the parameterisation's DRC-feasible domain, i.e. in_domain(reach=True)\
  \ and DRC-clean. So the degradation family must keep every D_j inside in_domain(reach=True) (reject\
  \ or redraw a move that leaves it; twin.degrade checks DRC only, so do not use it as is), and a test\
  \ asserts that every D_j it produces on the development layouts is in the domain. The designer proxy\
  \ descent uses descend, which already stays in the domain.\n3. Store keys local:{fingerprint}:l1 / :lsub\
  \ do not identify the solver: E011 runs l_sub at 0.5 mm in development and 0.25 mm when judged, so a\
  \ reused workdir would silently return the wrong resolution. Put a solver/config tag in the key (or\
  \ a header record checked on resume); test that a changed tag re-solves.\n4. LocalConfig: validate budget\
  \ >= 1 and shortlist >= 1 in __post_init__."
