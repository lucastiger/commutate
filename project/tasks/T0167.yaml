description: 'Pilots P1 and P2 of the O006 notes, merged into one task because P2 is computed on P1''s
  data. Outputs are research notes, never evidence (F4).


  Layouts and seeds:

  - Use dev seeds only, and none named in the O003/O004 judged sets (read project/objectives/O003 and
  O004). Record every seed used.


  Script research/scripts/o006_p1/thermal_envelope.py, using solvers.thermal_layout at one fixed level
  of its frozen grid rule:

  - Run every generator family, 2-6 dies per switch, and die sizes 4.0-5.5 mm, with at least 20 layouts
  per die-size bin.

  - Coolant 65 C, h = 5000 W/(m2 K).

  - Record Tj max against power per die with constant k (linear, one solve) and with k(T).

  - On at least 10 layouts, also solve at the finest level and report the level bias.

  - If research/notes/o006-kT-citations.md (T0157) lists corrections not yet in stack.py, report the sensitivity
  of the power limit to each correction.


  P1 outputs:

  - the highest power per die keeping Tj max <= 175 C on >= 95 % of layouts per die size, with and without
  k(T);

  - two recommended load levels for O002 (60-110 K spreading-relevant rises);

  - an O003 operating point.


  P2, on the same data at those load levels and per O002 stratum ((family, dies), one die size per stratum):

  - define in the note, before computing, three null predictors of per-die Tj max: stratum mean, die-size
  cell mean and die-position lookup;

  - report per stratum each predictor''s p95 absolute error and the within-stratum spread of Tj max and
  of pairwise Tj max differences.


  Write research/o006_p1/results.json {seeds, layouts: [...], power_limit_W_by_die_size, recommended_load_levels_W,
  o003_operating_point, level_bias_K, nulls: [{stratum, predictor, p95_abs_err_K, n_layouts}]}, research/notes/o006-p1-thermal-envelope.md
  and research/notes/o006-p2-thermal-nulls.md. Keep the total compute to about 3 CPU-hours and state every
  sample size. Founder amendment 2026-11-02 (T0157 citation check, revised after review T0174): the 4H-SiC
  and SAC305 k(T) laws are not settled. Report the P1 envelope (the highest power per die keeping Tj max
  <= 175 C) also at the low and high ends of the ranges given in T0157''s final note, research/notes/o006-kT-citations.md:
  for 4H-SiC use the c-axis (through-die) conductivity and exponent range it states, not in-plane values
  (review T0174: the coded -1.49 is a 6H in-plane exponent, Burgemeister 1979, and k along c is about
  30 % lower); for SAC305 use its slope range, or the coded slope halved and doubled if it gives none.
  State whether the recommended load levels change. Do not edit geometry/stack.py; vary the laws locally
  in the pilot script only. Founder amendment 2026-11-02 (memory): this Mac has 16 GB. Run at most 2 solver
  processes at a time, keep each below 5 M unknowns (docs/INFRASTRUCTURE.md), and keep the total resident
  memory of your processes under 8 GB; check with `ps` before adding a parallel job. A 10-shard parallel
  run used about 50 GB and was killed by the founder session on 2026-11-02; results already written to
  disk are kept, so resume from them.'
