    failure_class: planning
    root_cause: 'D0021 (items 2, 5 and 7) and T0339 gave O003''s successor experiment the id E009, which
      D0014 had already given to O007 (registered and completed 2026-11-07; C004 supported; O003 has requires_passed
      O007 and code_must_match on EV-O007-01).


      mfos keys the spec path, frozen runner, results directory, minted runs and metric names by the id
      alone, and register() overwrites specs/<id>.yaml without checking. So the DoD cannot pass without:

      - replacing O007''s pinned runner experiments/runners/e009_run.py (sha256 7397e871…), which lacks
      the required --selftest, --verify-freeze, --check-references and --plan flags;

      - on registration, overwriting O007''s registered spec.


      Both attempts blocked correctly. The "implementation" label is an artefact of a routing defect:
      ScienceReport has no status field (extra=forbid), and loop._verify only recognises out[''status'']
      == ''blocked''. The block was therefore routed as dod_failed, which maps to implementation, then
      auto-repaired with the identical packet, then sent to diagnosis instead of to the founder.'
