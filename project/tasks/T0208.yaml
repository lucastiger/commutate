id: T0208
objective: O007
title: 'E009 design: draft spec and runner (scikit-fem at the frozen configuration against O006''s frozen
  references, and against the L2 at levels 1-3 on five layouts; A1-A4, K1/K2, F1-F5)'
type: design_experiment
agent: scientist
status: cancelled
depends_on:
- T0204
- T0207
- T0222
description: "Write experiments/runners/e009_run.py and experiments/drafts/E009.yaml. Reuse E006's machinery\
  \ by import from e006_run.py, e006_series.py and e006_mms.py (unchanged): load_refs, series_checks,\
  \ mms_checks, Checks, Stats, dev_layouts, fresh_layouts, preflight. Swap the roles: scikit-fem is under\
  \ test, the L2 is the cross-check.\n\nConfig:\n  - `fem_rule` copied verbatim from research/o007_dev/frozen_config.json\
  \ (the DoD checks equality);\n  - the reference paths and sha256 values (befc5efa..., ca05847b...);\n\
  \  - gci_floor_K 1e-3, energy_tol 1e-6, picard_tol_K 1e-4;\n  - coolant 338.15 K, h 5000, target rise\
  \ 60 with operating_point_tol 1 K;\n  - the dev seed and the two dev fingerprints;\n  - l2_levels [1,\
  \ 2, 3], f5_max_K 0.25;\n  - the dev-study A1/A2/A4 values recorded at freeze;\n  - sealed_seed true;\n\
  \  - honest cpu_hours_est and timeout_min from the dev study and the cross-check preview.\n\nRows:\n\
  \  - Case rows (kind=case, is_finest): T_fem, T_ref, case_scale, fem_lv0..fem_lv2, d1, d2, p_obs, a4_branch,\
  \ a non-asymptotic flag (p_obs outside [0.5, 2]), the stencil per level, and dT_const_k. Box-stack mandatory\
  \ lines come from the frozen references; the manufactured points are nodes.\n  - Crosscheck rows (kind=crosscheck,\
  \ is_finest), one per die of the five layouts: the two dev layouts plus the first DRC-valid layout per\
  \ family from E009's sealed seed. Columns: fem_lv0..2 and l2_lv1..3, both GCIs and branches, convergence\
  \ directions and a same_side flag, layout_set (dev or fresh), the Tj-max node per level and its move\
  \ count, power_w and calibration rise, dT_const_k, and its A3 ratio against the L2.\n  - Power: calibrated\
  \ per layout on scikit-fem level 0, then used unchanged by both solvers on every grid.\n\nMetrics and\
  \ recompute entries, exactly as the objective states:\n  - max_case_scaled_err: max_scaled_abs_err,\
  \ T_fem vs T_ref, scale case_scale, where kind=case and is_finest;\n  - max_abs_err_K: max_abs_err on\
  \ the same rows;\n  - max_l2_consistency: max_gci_consistency with pred_levels [fem_lv0, fem_lv1, fem_lv2],\
  \ ref_levels [l2_lv1, l2_lv2, l2_lv3], floor 0.001, where kind=crosscheck;\n  - max_conservative_gci_K:\
  \ max_gci_capped with levels [fem_lv0, fem_lv1, fem_lv2], floor 0.001, where is_finest.\nSecondary metrics:\
  \ A3 and A4 on the fresh and the dev subsets, the constant-k A3 ratio, n_oscillatory, n_non_asymptotic\
  \ and n_same_side. Null baseline: the dT_const_k column for A1/A2 (F3).\n\nGated sanity checks:\n  -\
  \ reference_sha256, series_converged, case3_printed_values, nlayer_reduces_to_two_layer, mms_numeric_check\
  \ (F1; the scikit-fem-against-series checks are dropped);\n  - node_persistence (every reported point\
  \ is a node on all three grids, stencils reported);\n  - node_count_growth (8 +/- 15 % per level);\n\
  \  - constant_refinement_ratio (x, y and z, both solvers);\n  - energy_balance (manufactured case also\
  \ against 64.648 W);\n  - picard_converged, operating_point, layout_fingerprints (F4).\nF5 (L2 GCI at\
  \ most 0.25 K on every die) must NOT be a gated sanity check. Per O007 an F5 failure makes A3 count\
  \ as not met (INCONCLUSIVE), with no redraw. Encode it through the mechanism the founder approves in\
  \ the open F5-encoding request (preferred: a `ref_gci_cap: 0.25` parameter of mfos.metrics.max_gci_consistency\
  \ in A3's recompute entry), and report F5 per die as a diagnostic. If no approved mechanism exists when\
  \ you start, stop and report rather than improvise.\n\nAlso:\n  - code_under_test: thermal_fem.py, thermal_fv.py,\
  \ thermal_layout.py, geometry/stack.py, e006_series.py, e006_mms.py and e009_run.py;\n  - a memory preflight\
  \ per solve (FV at 1500 B/cell, scikit-fem at the measured bytes per DOF);\n  - a `--smoke` mode on\
  \ coarsened rules, using a non-sealed dev seed for its 'fresh' layouts.\nUse the dev-burst results under\
  \ research/o007_dev/ and research/o007_l2/full.json if they exist, and state in research/notes/o007-e009-design.md\
  \ which dev values were measured and which extrapolated.\n\nFounder amendment (2026-11-04, I0110 option\
  \ a; diagnosis T0218 rec. 3):\n- Depends on T0222. E009 runs on thermal_fem's instrumented solve, which\
  \ reports meta['cg_iterations'],\n  'cg_max_iterations', 'linear_rel_residual_max' and 'cg_hit_maxiter'.\n\
  - Rows record, for every reported value, the cg_max_iterations and linear_rel_residual_max of each of\
  \ its three grid\n  solves (columns per grid level), for scikit-fem and for the L2 where the L2 reports\
  \ them.\n- Gated sanity check 'linear_solver_headroom': no solve that feeds a reported value has cg_hit_maxiter\
  \ True. A capped\n  solve makes the run INVALID (fixed under a new experiment id), so linear-solver\
  \ error can never pass silently into\n  the GCIs of A3 or A4.\n- Diagnostic (not gated): the count of\
  \ solves above 300 iterations, matching T0207's eligibility rule; report it in\n  the design note and\
  \ the run's notes."
