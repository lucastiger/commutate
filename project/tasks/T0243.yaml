description: 'Founder path (A), I0128, step 2. Replaces T0237 (cancelled). This is a pre-registered re-freeze
  of T0228''s candidate 1 with n1''s order-1 AMG option. Write research/scripts/o007_dev_study3.py, reusing
  o007_dev_study2.py by import (Runner2, worker, memory gate, report and e009_table machinery). Outputs
  go under research/o007_dev3/. Make no production code change.


  (1) Pre-registration. Write section 0 of research/notes/o007-dev-study3.md and commit it before any
  solve; only grid construction is allowed beforehand. Record the commit hash in dev_study.json as preregistration_commit.
  Section 0 fixes:

  - One candidate, a_q1h4_graded_gs2: research/o007_dev2/frozen_config.json copied key for key (only candidate_id,
  feasible, levels_missing and rationale may differ), plus amg_gs_sweeps = 2. That is the founder''s value:
  no tuning and no second candidate. Every solve goes through production thermal_fem with a GridRule that
  carries amg_gs_sweeps = 2. No monkeypatching of _sa_solver.

  - Eligibility: T0228 note sec. 0.2, criteria 1-4, unchanged. That means: its gates; CG at most 300 on
  every L0-L2 solve, calibration and constant-k solves included (I0124: the 300 rule is kept); A1 <= 0.008;
  A2 <= 0.040 K; A4 <= 0.40 K on the cases and <= 0.25 K on the dev-layout dies; every E009 finest solve
  within 217.6 GB, with fresh layouts taken at 1.5 x the larger dev layout. feasible is true only if every
  criterion is measured at L2 on all six cases and both dev layouts and holds.

  - No reuse. The solver changed and the founder requires every level re-measured, so every level of every
  problem is re-solved. No cached T0225, T0228, T0235 or founder-diagnostic solve feeds any value, and
  reused_levels is [] in every record.

  - Disclose the prior data: T0228''s counts and values at L0-L2; T0235''s centroid_only burst (305/314
  at L2); the founder diagnostic''s two-sweep L0/L1 counts on Cases 1a/1b (145/180, 141/177). Also state
  the founder''s projection of about 225-232 at L2, labelled as speculation.

  - A consistency diagnostic (not a criterion and not a gate): per problem, level and reported value,
  |T_new - T_T0228| wherever T0228 measured that value, with both Picard iteration counts. Flag any value
  above 1e-6 K where the Picard counts agree.


  (2) Problems, records and checks are as T0228. In addition, every case/layout record carries amg_gs_sweeps
  (from the production result meta) and reused_levels, and every solve records cg_max_iterations and linear_rel_residual_max
  (T0222). Keep the die-centroid-node diagnostic GCI.


  (3) Local runs follow T0228''s memory rule, one child process at a time. Provide a --full mode. Put
  burst_command ''scripts/burst_gcp.sh --cmd "uv run python research/scripts/o007_dev_study3.py --full"
  research/o007_dev3'' in research/o007_dev3/plan.json, listing every solve the burst must run with its
  memory and wall estimates (the extra wall time of two sweeps measured locally).


  (4) --report is deterministic. It writes dev_study.json (T0228''s keys) and frozen_config.json (T0228''s
  keys plus amg_gs_sweeps). Before the founder''s burst the expected state is feasible: false with levels_missing.
  That is a valid completion.


  (5) Update the E009 cost table, and record the dev A1/A2/A4 values at L2 for E009''s K1/K2 regression
  guard. Label every post-data change as such.'
