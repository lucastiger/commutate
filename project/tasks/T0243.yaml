rationale: scope_in requires one scikit-fem configuration frozen before E009 registration. T0228's freeze
  failed only the CG rule, and a solver setting is part of the frozen configuration. A pre-registered
  re-freeze under unchanged eligibility is therefore the only route to a feasible configuration. Re-solving
  every level also guards against the N-layer A2 margin (0.0386 K of 0.040 K) or any other margin moving.
