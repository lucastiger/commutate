history:
- attempt: 1
  outcome: agent_finished
  summary: 'The dev run''s crash came from labelling rows through a fingerprint-keyed map. gen2_0''s twin
    W is its reconstruction R (same fingerprint), so both layout rows were labelled ''reconstruction''.
    Because the search keeps one thermal record per fingerprint, W also had no die rows. Fixed: assemble_rows
    labels by role via thermal_subjects(). The audit found a second collision bug: the F6(e) spot check
    selected the thermal record by role ''reference'', which would raise when W = R. It now selects by
    the reconstruction''s fingerprint. Selftest full_orchestration case 4 runs the registered path with
    W = R on both references and plants a candidate equal to W; it passes, and the old code fails it.
    Added --replay-only, which raises in Scheduler.step() before any launch. The packet''s exact replay
    command rep'
  report:
    summary: 'The dev run''s crash came from labelling rows through a fingerprint-keyed map. gen2_0''s
      twin W is its reconstruction R (same fingerprint), so both layout rows were labelled ''reconstruction''.
      Because the search keeps one thermal record per fingerprint, W also had no die rows. Fixed: assemble_rows
      labels by role via thermal_subjects(). The audit found a second collision bug: the F6(e) spot check
      selected the thermal record by role ''reference'', which would raise when W = R. It now selects
      by the reconstruction''s fingerprint. Selftest full_orchestration case 4 runs the registered path
      with W = R on both references and plants a candidate equal to W; it passes, and the old code fails
      it. Added --replay-only, which raises in Scheduler.step() before any launch. The packet''s exact
      replay command replayed the whole gen2_0 search, assemble_rows, evaluate() and the Case 4 gates
      without asking for a solve, so no key changed. It then stopped on 20 jobs: gen2_0''s 4 band-check
      pairs x 5 levels, which dev() solves after evaluate() and the VM never reached. The rows were written
      with gen2_0::0 (same seeds, 0 solves started). Case 4 matches the job log exactly (a1 False, a2
      True, pairs e_R [0.00956, 0.01254, 0.00635, 0.01785]). Dev facts, the founder decisions of 2026-11-12
      (F6(e) on n2d-custom-8-499712-ext) and 2026-11-13 (F1(a1) kept as frozen), the --plan result with
      1 dev near tie (83 solves, 97.0 billed vCPU-h, rates unchanged), measured per-solve costs and review
      T0323 findings 0-3 are in the spec and in design note section 12. The runner hash is re-stamped
      (36ea5f43...). Every DoD command exits 0. Committed as f39e81a4.'
    failure_class: none
    confidence: 0.85
    root_cause: 'assemble_rows built lid = {fpw: ''twin'', fpr: ''reconstruction'', fpd: ''D''}. When
      fpw == fpr (gen2_0: W is the reconstruction), the second key overwrote the first, so both layout
      rows were labelled ''reconstruction'' and mfos.metrics._hr_tables raised. search._Run.thermal also
      de-duplicates thermal rows by fingerprint, so the twin had no die rows of its own. Same class of
      bug: evaluate''s F6(e) spot check looked up the reconstruction''s record by role ''reference'';
      it is absent when W = R, so StopIteration on a non-default stack type.'
