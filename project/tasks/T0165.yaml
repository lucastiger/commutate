description: 'Draft experiments/drafts/E006.yaml (evidence rules v2) and experiments/runners/e006_run.py
  on mfos.evidence.ExperimentRun, following the E001 pattern.


  (1) Cases and points, exactly as A1/A2 define them:

  - Muzychka 2003 Cases 1a, 1b, 2 and 3, and the N-layer default stack: values from research/e006_refs/series_values.json.

  - The manufactured case: values from research/e006_refs/mms_values.json.

  - Points per source: centroid, source mean, and the reference maximum over the source. The L2 value
  is the reconstructed surface temperature (T_c + q dz/2k), bilinearly interpolated at the reference point;
  the mean is the area mean.

  - Case scale per A1 (manufactured case: the range of the field).

  - Build the analytic and manufactured L2 cases from the frozen references'' own parameters (not from
  a later stack.py). Grids come only from thermal_layout''s frozen grid rule, at three consecutive levels.
  No hand-built or tuned grids.


  (2) Rows. Every reported value carries its three grid values (levels 0, 1, 2 of the frozen rule, coarsest
  first)

  in the shared columns f_lv0, f_lv1, f_lv2, with is_finest=true on the row that reports it (the evaluator
  recomputes

  each GCI from them; the runner must not supply its own GCI for judging).


  - Case rows: kind=case, case, point, grid_level, is_finest, T_l2 (= f_lv2 on finest rows), T_ref, case_scale,

  f_lv0, f_lv1, f_lv2, gci, a4_branch, p_obs, dT_const_k. gci and a4_branch are reported with mfos.metrics.gci_capped

  (branches as in A4, floor 1e-3 K). Report d1 and d2 too. dT_const_k is the constant-k solve at the layer-mean
  temperature: the same units and datum as

  T_l2, and identical to it on constant-k cases.


  - Cross-check rows (A3): kind=crosscheck, is_finest=true, layout, layout_set (dev or fresh), die, power_w,
  tj_l2

  (= f_lv2), f_lv0, f_lv1, f_lv2, gci, a4_branch, tj_skfem (= skfem_lv2), skfem_lv0, skfem_lv1, skfem_lv2,
  skfem_gci,

  skfem_a4_branch, skfem_z0, skfem_z1, detectable_bias, l2_direction, skfem_direction. Both solvers use
  three grids of their own refinement by r = 2 (scikit-fem

  laterally, zrefine=False, as in its benchmark). skfem_z0 and skfem_z1 are the die''s Tj max on scikit-fem''s
  level-1

  lateral grid with the base and with doubled through-thickness cell counts (one extra solve per layout);
  the

  evaluator forms 2.5 |skfem_z1 - skfem_z0| itself (mfos.metrics two_grid_term). detectable_bias = gci
  + skfem_gci +

  2.5 |skfem_z1 - skfem_z0| - |tj_l2 - tj_skfem|. l2_direction and skfem_direction are ''from_above''
  or ''from_below''

  (sign of each solver''s finest step); same-side pairs are flagged in the note as weak for A3. A3 runs
  on five layouts: the two development

  layouts and the three fresh layouts below. The fresh layouts get one cross-check row per die. Do not
  add separate

  fresh rows for them, so that A4 sees each value once.


  - Fresh layouts: the first DRC-valid layout of each generator family from the run''s sealed seed (spec
  sealed_seed:

  true), dies per switch as drawn; development rows use a dev seed, never the sealed one. They appear
  as cross-check

  rows with layout_set=fresh, plus family and dies_per_switch.


  - Operating point for every generator layout (A3 and fresh), per O006 scope_in: 65 C coolant, h = 5000
  W/(m2 K), k(T),

  equal power per die fixed per layout from an L2 level-0 solve so that the hottest die rises 60 K (+/-
  1 K) above the

  coolant, then used unchanged by both solvers and on every grid; record power_w. A3 layouts follow A3''s
  rule

  (generate_layouts dev seed 20261101; side_by_side with dies_per_switch = 6, u_shaped with dies_per_switch
  = 2), with

  fingerprints frozen in config.


  (3) Metrics, exactly the four of O006 as restated by D0012 and D0013

  (project/decisions/D0013-o006-restatement-corrections.md): max_case_scaled_err (A1, K1), max_abs_err_K
  (A2, K2),

  max_skfem_consistency (A3) and max_conservative_gci_K (A4). All are point values, written without a
  CI, at level 0.0.

  The runner computes them with the same mfos.metrics functions the evaluator uses. Recompute entries:


  - A1: max_scaled_abs_err, pred T_l2, ref T_ref, params {scale: case_scale}, where {kind: case, is_finest:
  true}.


  - A2: max_abs_err, pred T_l2, ref T_ref, where {kind: case, is_finest: true}.


  - A3: max_gci_consistency, params {pred_levels: [f_lv0, f_lv1, f_lv2], ref_levels: [skfem_lv0, skfem_lv1,

  skfem_lv2], ref_zpair: [skfem_z0, skfem_z1], floor: 0.001}, where {kind: crosscheck}.


  - A4: max_gci_capped, params {levels: [f_lv0, f_lv1, f_lv2], floor: 0.001}, where {is_finest: true}
  (case and

  cross-check rows).


  A diverging sequence gives +inf, which means the criterion is not met. That is a legitimate outcome,
  not an error: do

  not catch it, clip it or replace it.


  (4) Null baseline: kind=column, column dT_const_k, applies_to the A1 and A2 metrics (F3).


  (5) Gated sanity checks, the full lists of F1 and F2:

  - the five A3 layout fingerprints equal to the spec''s list (two frozen dev fingerprints; the three
  fresh ones

  recorded at run time from the sealed seed);


  - reference sha256 equal to the config values (series befc5efa…, mms from its JSON), checked before
  any solve;

  - series convergence and the Case 3 printed values;

  - Case 2 against scikit-fem within 0.02 K, with FE source means integrated exactly over each source,
  not nodally averaged;

  - N-layer reduces to two-layer;

  - N-layer against scikit-fem on the laterally uniform default stack within 0.02 K at a 60-110 K rise;


  - in both scikit-fem agreement checks (Case 2, uniform stack), scikit-fem''s own GCI at most 0.01 K
  (refine until it is).

  - the manufactured case''s numeric check;

  - constant refinement ratio;

  - energy balance <= 1e-6 (manufactured case: against the integrated source and boundary fluxes);

  - Picard max|dT| < 1e-4 K;

  - skfem GCI reported; F5: scikit-fem''s own estimate (mfos.metrics.gci_capped on skfem_lv0..2 with floor
  1e-3 K, plus

  two_grid_term(skfem_z0, skfem_z1)) at most 0.25 K on every die of all five layouts, a gated sanity check
  (INVALID if missed, never a verdict on the L2).

  Case 1a/1b converged values against scikit-fem: INFO only, not gated.


  (6) Pre-registration reference validation, with no L2 involved: `--refcheck` runs F1''s reference-only
  checks at full resolution (series/manufactured self-checks; scikit-fem against Case 2 and against the
  uniform default stack, each with its own GCI) and writes research/e006/refcheck.json {checks: [{name,
  value, threshold, passed}], all_passed}. Commit its output.


  (7) `--smoke`: reduced levels on all cases, writing only the dev rows (`--rows-out PATH`). It never
  creates an evidence run. Commit research/e006/dev_rows.json and set the spec''s dev_rows to it.


  (8) Spec fields (memory: scikit-fem''s finest level is about 6.5 GB per layout; run solves one at a
  time on this Mac

  per the agent memory rule; level-1 z-doubled solves are smaller):

  - code_under_test: thermal_fv.py, thermal_layout.py, and stack.py as provenance; code_must_match as
  decision_if_pass needs;

  - timeout_min and cpu_hours_est from the T0150/T0152 benchmark timings (objective cap 80 CPU-h).


  (9) research/notes/o006-e006-design.md: secondary values reported per reference-case point, GCI / |T_L2
  - T_ref|

  (the estimator against a known error), the count of oscillatory values, and every value with p_obs outside
  [0.5, 2]. How each metric maps to A1-A4/K1/K2 and F5, the operating-point powers,

  the fresh-layout rule, the point list, F1-F3 coverage, and the runtime/memory plan. Treat any refcheck
  failure as an F1 reference problem: report it and do not loosen it. Founder amendment 2026-11-02 (review
  T0173 of T0153): define O006''s ''k varying by at least 30 %'' as k_max/k_min - 1 >= 0.30 within one
  layer of the manufactured case (T0153 reaches 0.3227 in Al2O3); record this reading, the measured value
  and its margin in the E006 spec, and report the k_max-normalised value (0.244) alongside. This fixes
  the interpretation before registration.'
