description: 'Draft experiments/drafts/E006.yaml (evidence rules v2) and experiments/runners/e006_run.py
  on mfos.evidence.ExperimentRun, following the E001 pattern.


  (1) Cases and points, exactly as A1/A2 define them:

  - Muzychka 2003 Cases 1a, 1b, 2 and 3, and the N-layer default stack: values from research/e006_refs/series_values.json.

  - The manufactured case: values from research/e006_refs/mms_values.json.

  - Points per source: centroid, source mean, and the reference maximum over the source. The L2 value
  is the reconstructed surface temperature (T_c + q dz/2k), bilinearly interpolated at the reference point;
  the mean is the area mean.

  - Case scale per A1 (manufactured case: the range of the field).

  - Build the analytic and manufactured L2 cases from the frozen references'' own parameters (not from
  a later stack.py). Grids come only from thermal_layout''s frozen grid rule, at three consecutive levels.
  No hand-built or tuned grids.


  (2) Rows.

  - Case rows: kind=case, case, point, grid_level, is_finest, T_l2, T_ref, case_scale, rich_est, conv_type,

  p_obs, dT_const_k. rich_est is A4''s order-capped GCI (D0012), from the three grids of the frozen rule
  (r = 2),

  with f0, f1, f2 the values at levels 0 (coarsest), 1 and 2 (finest): GCI = 1.25 |f2 - f1| / (2^p - 1),

  p = min(p_obs, 1), when the sequence is monotone; GCI = 1.25 max(|f2 - f1|, |f1 - f0|) when it is oscillatory

  or non-monotone. conv_type records which (monotone / oscillatory / nonmonotone). dT_const_k is the constant-k

  solve at the layer-mean temperature: the same units and datum as T_l2, and identical to it on constant-k
  cases.


  - Cross-check rows: kind=crosscheck, is_finest=true, layout, die, tj_l2, tj_skfem, rich_est (L2), conv_type,

  skfem_rich_est, skfem_conv_type, gci_sum (= rich_est + skfem_rich_est). Both GCIs by the same A4 estimator,
  each

  from three grids of its own solver; tj_l2 and tj_skfem are the finest-level values.


  - A3 layouts follow A3''s rule (generate_layouts dev seed 20261101), with fingerprints frozen in config.
  Use 65 C coolant, h = 5000 W/(m2 K), k(T), and the power per die recorded by T0150''s benchmark, the
  same for both solvers.


  (3) Metrics, exactly the five of the objective as restated by D0012 (project/decisions/D0012-o006-a3-a4-criteria-change.md):

  max_case_scaled_err (A1, K1), max_abs_err_K (A2, K2), max_skfem_consistency (A3), max_skfem_gci_K (A3b)
  and

  max_conservative_gci_K (A4). All are point values, written without a CI, at level 0.0. Recompute entries
  use the

  existing mfos.metrics functions:


  - A1: max_scaled_abs_err, pred T_l2, ref T_ref, scale case_scale, where {kind: case, is_finest: true}.


  - A2: max_abs_err, pred T_l2, ref T_ref, where {kind: case, is_finest: true}.


  - A3: max_scaled_abs_err, pred tj_l2, ref tj_skfem, scale gci_sum, where {kind: crosscheck}.


  - A3b: max_col on skfem_rich_est, where {kind: crosscheck}.


  - A4: max_col on rich_est, where {is_finest: true} (every reported L2 value: the finest case rows and
  the

  cross-check rows).


  There is no 0.025 K gate and no new mfos.metrics function to wait for (max_abs_err_gated is not used).


  (4) Null baseline: kind=column, column dT_const_k, applies_to the A1 and A2 metrics (F3).


  (5) Gated sanity checks, the full lists of F1 and F2:

  - reference sha256 equal to the config values (series befc5efa…, mms from its JSON), checked before
  any solve;

  - series convergence and the Case 3 printed values;

  - Case 2 against scikit-fem within 0.02 K, with FE source means integrated exactly over each source,
  not nodally averaged;

  - N-layer reduces to two-layer;

  - N-layer against scikit-fem on the laterally uniform default stack within 0.02 K at a 60-110 K rise;

  - the manufactured case''s numeric check;

  - constant refinement ratio;

  - energy balance <= 1e-6 (manufactured case: against the integrated source and boundary fluxes);

  - Picard max|dT| < 1e-4 K;

  - skfem GCI reported.

  Case 1a/1b converged values against scikit-fem: INFO only, not gated.


  (6) Pre-registration reference validation, with no L2 involved: `--refcheck` runs F1''s reference-only
  checks at full resolution (series/manufactured self-checks; scikit-fem against Case 2 and against the
  uniform default stack, each with its own GCI) and writes research/e006/refcheck.json {checks: [{name,
  value, threshold, passed}], all_passed}. Commit its output.


  (7) `--smoke`: reduced levels on all cases, writing only the dev rows (`--rows-out PATH`). It never
  creates an evidence run. Commit research/e006/dev_rows.json and set the spec''s dev_rows to it.


  (8) Spec fields:

  - code_under_test: thermal_fv.py, thermal_layout.py, and stack.py as provenance; code_must_match as
  decision_if_pass needs;

  - timeout_min and cpu_hours_est from the T0150/T0152 benchmark timings (objective cap 80 CPU-h).


  (9) research/notes/o006-e006-design.md: how each metric maps to A1-A4/K1/K2, the point list, F1-F3 coverage,
  and the runtime/memory plan. Treat any refcheck failure as an F1 reference problem: report it and do
  not loosen it. Founder amendment 2026-11-02 (review T0173 of T0153): define O006''s ''k varying by at
  least 30 %'' as k_max/k_min - 1 >= 0.30 within one layer of the manufactured case (T0153 reaches 0.3227
  in Al2O3); record this reading, the measured value and its margin in the E006 spec, and report the k_max-normalised
  value (0.244) alongside. This fixes the interpretation before registration.'
