  report:
    summary: 'Partial. The draft spec, runner, dev rows and design note are done, committed in c77c274.
      Two things block E006 from going ahead.


      **1. The F1 reference pre-check fails.** `research/e006/refcheck.json` has `all_passed = false`,
      so the refcheck definition-of-done check exits 1. All reference-only checks pass:

      - reference sha256 (series befc5efa…, mms ca05847b…);

      - series convergence: frozen values reproduced to 1e-15 after doubling every knob;

      - the printed Case 3 values at 50 terms;

      - N-layer reduces to two-layer (2e-16);

      - all manufactured-case self-checks; ceramic k_max/k_min − 1 = 0.3227;

      - scikit-fem agrees with the series within 0.02 K: 0.0033 K on Case 2 and 0.0114 K on the uniform
      stack.


      What fails is scikit-fem''s own GCI, which must be ≤ 0.01 K: it is 0.0155 K (Case 2) and 0.044 K
      (uniform stack). I refined its mesh four times (uniform, then graded at source edges, then near/far
      zones, then finer z); the best results were 0.0155 K and 0.0192 K, in different attempts. I did
      not loosen the threshold. This is not a reference error: the order-capped GCI needs the finest grid
      step to be ≤ 0.008 K, while scikit-fem''s actual errors are about 0.003 to 0.005 K. On the uniform
      stack, refining laterally made the centroid worse, which points to a through-thickness error in
      the thin layers.


      **2. The full registered run does not fit this Mac.** I counted the cells the frozen rule gives
      at level 2: Case 1a 11.6 M, Case 1b 23.2 M, the N-layer case 18.9 M. At the measured 1.1 to 1.5
      kB per cell, that projects to about 17, 30 and 21 GB per solve. These cases have no axis mirror
      symmetry to crop, the levels are frozen, and chunked assembly would need a change to production
      code. The runner refuses any solve estimated above 0.85 × RAM, so it stops with an error instead
      of swapping.


      **What the deliverables do:**

      - **Runner:** `e006_run.py` writes every reported value with its three grid values (f_lv0 to f_lv2)
      in the case and cross-check rows. It computes the four metrics with the evaluator''s own `mfos.metrics`
      functions, as point values with no CI, and lets +inf through unchanged. It also writes the constant-k
      null column `dT_const_k`.

      - **Spec:** `E006.yaml` has the F1, F2 and F5 sanity checks, `sealed_seed: true`, the five layout
      fingerprints and the founder''s 30 % reading (0.3227, margin +0.0227; max-normalised value 0.244).

      - **Smoke:** `--smoke` runs every case and both development layouts on a coarsened copy of the grid
      rule (60 s, 2.9 GB). It writes only the dev rows and never creates an evidence run.


      On the dev rows the null fails both A1 and A2 (0.063 and 2.56 K), so it discriminates. The fast
      gate printed "all gates passed", but its exit code was not captured.


      **Commands and exit codes:**

      - smoke: exit 0 (re-run with the final runner);

      - `mfos exp check E006 --rows research/e006/dev_rows.json`: exit 0;

      - `ruff check .`: exit 0;

      - both spec-content checks: exit 0;

      - refcheck `all_passed`: exit 1;

      - `mfos gate --fast`: "all gates passed", exit code not captured;

      - refcheck runs: exit 1, four times, peak 6.9 GB.'
    failure_class: none
    confidence: 0.7
    root_cause: 'Neither problem is a design error in E006 or a reference error.

      (1) The F1 failure is cross-check resolution. Scikit-fem''s GCI with the order capped at 1 is 1.25·|d2|,
