description: "Follow-up to T0287, from review T0291 (project/reviews/T0287/T0291.json; read it first)\
  \ and T0287's own concern. Lands\nbefore E008's code freeze (T0262). A frozen degradation rule that\
  \ raises on a judged reference makes F1(b), and so E008,\nINVALID. Develop only on generator layouts\
  \ and Case 4 (F3); never load 2D_Case_2R, 2D_Case_6 or customer data. Do not edit\nsrc/moduleforge/solvers/thermal_fem.py\
  \ (sha256 a216d5fe...). Do not relax any DRC rule.\n1. Degradation at minimum-width bands (T0291 caveat\
  \ 1; T0287 concern 1). After moves 1-3, add a deterministic fallback: a\n   walk over the generator's\
  \ own parameters (die-row positions, slot positions and widths, landing lines, columns) that\n   at\
  \ each step applies, in a fixed documented order and step size (0.5 mm grid), the DRC-valid single-parameter\
  \ change\n   that raises L1 most, until L1(D)/L1(W) >= 1.25 (1 + DEGRADE_MARGIN). Dies, die count, wires\
  \ per die and terminals stay as\n   the generator space allows; the record lists every move. Raise DegradeError\
  \ only when no single-parameter change raises\n   L1 further, and record that state. Stress tests: 72\
  \ generator housing layouts at a 2 mm minimum copper width (n = 2, 3,\n   4 dies; 1, 2, 3 wires per\
  \ die; seeds stated), the 54-layout default-rule population and Case 4: every layout reaches the\n \
  \  target and is DRC-clean, or the test shows the walk's terminal state for each failure (it must be\
  \ zero on the default\n   population and Case 4; report the 2 mm count). Lock the min, median and max\
  \ ratios in the tests (T0291 finding 4).\n2. Exact merged-band split (finding 0). When both probes see\
  \ the same interval, choose the split on the 0.5 mm grid that\n   minimises the symmetric difference\
  \ with the reference copper (deterministic tie order), not the midpoint. Tests: merged\n   generator\
  \ layouts where the probes see equal intervals recover the generator's slots (symdiff < 1e-6 m^2).\n\
  3. centre_landing (finding 1): when no shift admits the minimum width, skip the move and record why\
  \ (never leave the band\n   off the wires' landing point); raise DegradeError, not TypeError, when no\
  \ width fits.\n4. Docstrings and record (findings 2-3): state the margin's worst case correctly (twin\
  \ biased 14 % low, D 5 % low), say\n   that die rows move under the spread and walk moves, describe\
  \ with_l1=False exactly, and make rec['widths'] report only\n   the move applied.\nDeterminism. Keep\
  \ every existing test passing; do not weaken any test or tolerance."
