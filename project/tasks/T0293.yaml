  failure_output: '- [blocker] The merged-band split is wrong on rectangular merged PHASE bands: every
    split ties, the lowest grid line wins, and the landing line ends up outside its own slot: When the
    two adjacent PHASE slots have the same u-extent, the merged band is a plain rectangle. Every candidate
    boundary then gives the same symmetric difference, so `_best_split` takes the lowest one (lo + 0.5
    mm). It never considers what each slot has to contain (the landing line, the die row), which the replaced
    rule did. The result is a twin whose copper is identical (symdiff 0, so no twin gate can catch it),
    but whose HS-landing PHASE slot is 0.5 mm tall and lies below its own landing line. Example: generator
    v = [(16.5, 19.5), (19.5, 30.5)], twin v = [(16.5, 17.0), (17.0, 30.5)], landing line at 17.5. This
    is a regression: the removed midpoint-of-needs rule recovered the generator''s boundary in 47/179
    cases and always placed it between the needs. It also corrupts move 1 of the degradation rule, which
    is to be frozen in E008. From the twin''s slots, `narrow_landing` reports the PHASE landing band as
    ''before_mm 0.5 -> after_mm 1.0'' and leaves the copper essentially unchanged, so the L1 ratio is
    1.40 / 1.92 / 1.70 / 1.60 instead of 2.24 / 2.87 / 2.71 / 2.61 from the generator''s own slots. A
    rectangular PHASE pad that carries the LS dies and receives the HS wires is the usual half-bridge
    DBC pattern, so judged references are likely to hit this case. The generator''s sampler happens never
    to produce equal ends (0 of 974 sampled merged layouts), which is why the tests pass. The claim of
    an ''exact merged-band split ... so that the slots are those of the generator'' is false for this
    class.

    - [minor] The tie test does not test a tie, and no test covers a flat symmetric difference: `test_best_split_is_the_minimum_symmetric_difference_boundary_with_lower_tie`
    uses an L-shaped band with a unique minimum at v = 3. No tie occurs, so the tie rule (the source of
    the blocker) is never exercised. `test_equal_interval_merged_bands_recover_the_generators_slots` only
    samples generator layouts, which never have equal slot ends.

    - [minor] The comment in `_fit` still describes the removed rule: The comment at twin.py lines 311-313
    still says equal or partly overlapping intervals are split at ''the grid line between what each slot
    needs, inside the overlap''. That was the old rule. The code now takes the minimum-symmetric-difference
    boundary over the whole union.

    - [minor] The walk hill-climbs on the screen it is judged by and stops just above the target: The
    walk picks whichever single-parameter change raises L1 most, so it actively selects changes where
    L1 may be biased. The 0.11 margin was derived from the bias band of generator layouts, not from walk
    outputs. The reached ratios sit just above the target (1.3875; confirmed median 1.3943), so the L2
    ratio of a walk-produced D has almost no slack beyond the margin. In my single walk case the ratio
    was stable under L1 mesh refinement (1.3940 / 1.3903 / 1.3919 at hmax 4 / 2 / 1 mm). The docstring
    already defers verification to E008''s L2 ratio.

    - [note] Small issues in the stress test: The first alternative of the terminal-state assertion, ''no
    single-parameter change raises'', can never match: the message reads ''no single-parameter change
    of N DRC-valid raises''. A failure with no walk steps is recorded as ratio 1.0, not the ratio after
    moves 1-3. The test is marked slow and is not part of the definition-of-done commands, so the gate
    does not check the locked 63/72 figure. I ran it separately and it passes.'
