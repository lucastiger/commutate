  report:
    status: completed
    summary: 'This attempt fixes the review''s blocker: the twin fit put the landing line outside its
      own slot on rectangular merged PHASE bands. It also covers the review''s minor points. All definition-of-done
      checks pass, and the 63-of-72 result at the 2 mm minimum width is unchanged.


      **Blocker: merged-band split (`_best_split` in src/moduleforge/generate/twin.py).** The fit now
      only considers boundaries on the 0.5 mm grid at which each slot still holds what it carries:

      - a die slot holds its die row with `rules.die_edge_margin`;

      - a landing slot holds its landing line with `rules.wire_landing_margin`.


      If no grid line meets those margins, the fit falls back to boundaries between the die row and the
      landing line themselves; if that is also empty, to every grid line. Among the candidates it takes
      the boundary with the smallest symmetric difference from the reference copper. Ties go to the grid
      line nearest the midpoint between the die row and the landing line, then to the lower one.

      - **L-shaped bands** (the two slots have different widths): the best boundary is unique and is the
      generator''s own.

      - **Rectangular bands:** every boundary gives the same copper, so the copper cannot show where the
      generator put it. The midpoint rule picks one, and the docstring now says so.

      - **Scratch check:** I built 25 rectangular merged layouts from generator layouts. With attempt
      1''s code, the landing line was outside its slot in all 25. Now that happens in none, and the degradation
      ratio starting from the twin is close to the one from the generator''s own slots. The review''s
      example went from 1.50 against 2.61 to 2.695 against 2.61.


      **Tests added:**

      - An L-shaped band, checked at three positions of the step.

      - A real tie test on a rectangular band, using the review''s example (boundary at 17.5 mm), including
      the two fallback cases.

      - 18 rectangular merged layouts. Each checks that each slot holds its die row or landing line with
      the margins, that the tie choice matches one computed independently in the test, and that degradation
      from the twin reaches the target. 8 of the 18 recover the generator''s exact boundary.


      **Walk record and stress test:**

      - `record[''walk'']` now holds the ratio at the start of the walk (after moves 1-3), the terminal
      kind (`target_reached`, `local_maximum` or `step_limit`), the terminal ratio and a message.

      - The stress test (tests/regression/test_degrade_walk_stress.py, marked slow, about 11 min) now
      checks the terminal kind instead of a message that could never match. It no longer records a failure
      with no walk steps as 1.0, and it locks both start and terminal ratios for the 9 failures.

      - At the 2 mm minimum width, 63 of 72 layouts reach the target (min 1.3875, median 1.3943, max 2.0866)
      and all are DRC-clean. The other 9 end at a local maximum, at 1.206-1.372 after 48-64 walk steps,
      starting from 1.003-1.225.

      - The 54-layout default-rule population and Case 4 have no failures.


      **Other changes:**

      - `widths_by_move` gives each applied landing move''s widths, measured on the layout state it was
      applied to; `widths` is the last of them.

      - Docstrings now state exactly what `with_l1=False` does, what moves under degradation, and the
