description: 'This is pilot P4 of the O006 notes; it is input (b) of D0009''s day-60 error band. Write
  research/scripts/o006_p4/fh_export.py, a Layout-to-FastHenry exporter that writes decks in SI metres
  (never `.units mm`, D0002), starting from benchmarks/infra/fh_gen.py. It covers traces, the die shorts,
  bond wires, and the backside-Cu and baseplate planes as the l2_layout model has them; state every modelling
  difference. Refinement knobs: nwinc/nhinc, plane segmentation, wire segmentation. `--selftest` checks
  the deck structure without running FastHenry (units in metres, node and segment counts, a single port
  between the DC+ and DC- terminal centres). Reuse P3''s reconstruction (research/scripts/o006_case4_layout.py)
  and its two perturbations unchanged. Run FastHenry 3.0wr, built outside the uv environment per D0002,
  with direct and multipole-accelerated iterative solves at increasing refinement at 10 and 20 MHz, on
  a burst VM if agents may use one (docs/INFRASTRUCTURE.md); otherwise record the runs not done. Report
  memory, time and crashes per run, L per level, extrapolated L, the L2-FastHenry difference (absolute
  and relative) against P3''s extrapolated l2_layout values, and the pair-ratio difference. State explicitly
  whether FastHenry is usable at module scale; if it is not, D0009 doubles l2_layout''s discretisation
  estimate instead. Outputs are a research note, not evidence (F4). Write research/o006_p4/results.json
  with the schema {fasthenry_version, usable, geometries: [{name, runs: [{mode, refinement, freq_hz, status,
  wall_s, peak_mem_mb, L_H}], L_extrap_H, diff_vs_l2_rel}], ratio_diff}, and research/notes/o006-p4-fasthenry-feasibility.md.'
