definition_of_done:
- cmd: uv run python -c "from mfos.store import Store; from mfos import models as m; from mfos.evaluate
    import load_rows, null_check; from mfos.experiments import runner_files, code_hashes; s = Store();
    spec = s.read_yaml(s.spec_path('E008', draft=True), m.ExperimentSpec); lines, bad = null_check(s,
    spec, load_rows(s.root / spec.dev_rows)); print(chr(10).join(lines)); assert not bad, bad; assert
    any('A1' in x and 'satisfied' in x for x in lines), lines; assert runner_files(s.root, spec.runner);
    n = len(code_hashes(s.root, spec.code_under_test)); assert n >= 15, n; print('registration dry run
    OK,', n, 'code files')"
  exists: null
  timeout_s: 900
- cmd: uv run python -c "import json; d = json.load(open('experiments/drafts/E008.dev_rows.json')); assert
    d['meta']['smoke'] is False, 'smoke rows'; rows = d['rows']; assert {r['reference_id'] for r in rows
    if r['kind'] in ('reference', 'layout', 'die')} == {r['reference_id'] for r in rows if r['kind'] ==
    'reference'}, 'metric rows without a reference row'; assert any(r['reference_id'] == '2D_Case_4' for
