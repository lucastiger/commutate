      - Attempt 1 applied the three nulls (die_position, stratum_mean, isolated_die) to A2 and A3 as well.
      The evaluator would then have marked A3 non-discriminating, and E007 could never PASS.

      - Each null now applies to A1 and A4 only, as O002 F2 and the hypothesis text require. A3 and A5
      are each met by a layout-ignorant predictor by the objective''s own statement.

      - On main''s evaluator, `null_check` on the fake m = 20 rows flags nothing and applies the nulls
      to A1 and A4 only. On the same rows the stratum-mean null''s A3 upper bound is 0.413 K, so attempt
      1''s design would have been non-discriminating there.

      - A new gated sanity check, `f2_null_discrimination`, applies F2''s rule at P_ref: each null''s
      point estimate must fail A1 (> 0.5 K) and A4 (> 0.5). Mutation tests show it catches a null that
      meets A1 and an `applies_to` that goes beyond A1 and A4.


      **Real reference path in the selftest:**

      - The selftest now runs one real level-0 P_ref calibration through a real child process, on side_by_side/2''s
      development layout at 4.0 mm. P_ref came out at 38.979 W, with a rise of 59.967 K after 3 solves
      in 25 s.

      - On that run: energy balance at most 5.2e-14; the Q1 baseplate-bottom mean equals T_c + Q_out/(hA)
      to 9 decimals; Picard residual 3.6e-5 K; CG at most 96 iterations; the DOF estimator is exact; peak
      memory 0.57 GB against an estimate of 0.66 GB.

      - Real DOF growth on the 12 level-2 subset layouts is 7.33-7.66 per level, inside 8 ± 15 %. The
      fake-mode bypass of `node_count_growth` is removed.


      **Other fixes:**

      - Every derived seed stream (six streams; per stratum or pool where they apply) is recorded and
      checked. Mutations show a forbidden timing_order, l2_subset or die_size seed is caught.

      - F7 draw fingerprints are checked against C004, T0393 and the P_ref layouts too.

      - The F7 selection and its half-load L1 runs moved inside the single-threaded L1 phase. The main
      process re-derives the selection and refuses a mismatch. The energy balance check now covers every
      L1 evaluation, and the Tj rating check covers the F7 layouts.

      - The A5 timing wording is corrected.

      - Six more imported modules are added to the code freeze, and `geometry/*.py` to `code_under_test`.

      - The per-stratum A2 report now flags whether each bound carries information, with counts.

      - The spec now states the F6 scope (the hottest-node estimate exists only on the subset), that the
      die-position null''s A4 is close to the stratum-mean null''s by construction, and which scenario
      each power figure (0.898 and 0.531) belongs to.

      - The cost summary was regenerated from `--plan`: 717 reference solves, 1,693 L1 evaluations, 56.7
      CPU-h expected (61.1 upper), Option A $15.54 and Option B $13.84.


      **D0025 (new on main):** the spec cites it for the bound, the sample, the CPU-hour convention and
      the frozen L1. The recompute entries now carry `ci: woodruff, level 0.94, cluster layout` (all except
      A5). `--dev` reports D0025 decision 4''s per-stratum check: implied calibration factor beside c(s),
      HS and LS die bias, A2 against 1.8 %, and A4 against 0.3.


      **Founder decisions before registration** (also listed in the spec):

      - m is still provisional (20).

      - Registration waits for T0398''s development rows, the D0025 check, and `mfos exp check E007 --rows`
      on them.

      - Whether all three nulls apply to A4.

      - Whether F2 is gated or only reported.

      - Compute location (all on the VM, or local then VM).

      - Fixed parameters of null (a) and F7; A5 warm-up; pair rows; the yardstick.


      The fake physics is not evidence that the nulls fail on real data. Only the development-row null
      check before registration can show that.'
