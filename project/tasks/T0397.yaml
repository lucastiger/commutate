objective: O002
title: 'E007 design: draft spec and runner (sealed seeds, per-stratum P_ref, level-1 judging with a level-2
  subset, F2 nulls, F4/F6/F7 reports, code freeze, cost plan)'
type: design_experiment
agent: scientist
status: done
depends_on:
- T0393
- T0394
- T0395
