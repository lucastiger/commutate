description: 'Draft experiments/drafts/E007.yaml and experiments/runners/e007_run.py on mfos.evidence.ExperimentRun,
  following experiments/specs/E009.yaml with e009_run.py, and experiments/specs/E008.yaml with e008_run.py.


  Spec, provenance and freeze:

  - requires_passed [O007].

  - code_must_match on src/moduleforge/solvers/thermal_fem.py with O007''s EV-O007-01 (sha256 a216d5fe...);
  the frozen GridRule of research/o007_dev3/frozen_config.json, key for key.

  - code_under_test: src/moduleforge/thermal/*.py (the L1, frozen, F5), generate/halfbridge.py, geometry/stack.py
  and drc.

  - Sealed seeds for layout generation, the per-stratum die-size draw (draw_die_size_mm), the F7 draws
  and the timing order.


  Sample and operating point:

  - The allocation of research/o002_e007/f3_simulation.json, with every (family, band) cell drawn and
  the layouts per stratum fixed.

  - Per stratum, a development layout with the stratum''s die size, from a recorded development seed.
  P_ref comes from its level-0 reference solve (hottest node 60 K above 65 C coolant within C004''s tolerance,
  h = 5000), fixed before any judged solve. The second load is 0.5 P_ref.


  Judging and sanity checks:

  - Judge at level 1, as n2 found. If n2 refuted level 1, stop and say so: under F1''s response that is
  a founder decision.

  - A level-2 subset chosen by a frozen rule from the sealed seed before any solve (at least 2 layouts
  per cell), with F1''s gates as gated sanity checks, using the step-floor rule.

  - Energy balance <= 1e-6 on every solve; Tj at P_ref <= 175 C.


  Rows and recompute:

  - Rows follow research/o002_e007/e007_row_contract.md: per die, switch, layout and pair, with family,
  dies, stratum, die size, switch, die index, load, L1 and reference tj_mean, die-local rise, and reference
  tj_max (L1''s too if it has one). No geometry in rows (F5).

  - Recompute entries for A1-A5 and K1-K3, under the objective''s metric names, through the n5 functions.


  Nulls per F2, at P_ref:

  - (c) die-position lookup and (d) stratum mean / stratum-mean spread, both per (stratum, switch) and
  leave-one-layout-out;

  - (a) a die-size-aware isolated-die spreading model without inter-die coupling (for example solvers.thermal_series);

  - each with A1 and A2 per stratum.


  Reported, not gated:

  - A1 with each model''s own hottest die;

  - per-stratum A2 beside the die-position null;

  - A4 per die-count band;

  - the F4 constant-k ablation at both loads;

  - F6: the hottest node of every die, with its estimate on the three-level subset, and the largest hottest-node
  minus die-average gap per stratum;

  - F7: per cell, two L1-optimised layouts (lowest L1 hottest-die average among a fixed number of sealed
  random draws), solved by the reference, with their A1-type errors against same-stratum random layouts.


  A5 is the median L1 wall time per evaluation on one thread.


  Modes:

  - --selftest: fake solvers, full row assembly and recompute through research/o002_e007/e007_metrics.py,
  including a mutation check that a wrong hottest die is caught;

  - --verify-freeze;

  - --plan: every solve with its memory and time, cpu_hours_est and $, and local or burst per policy local_cpu_hours_max;

  - --dev: development geometry only, used by n7.


  Run every reference solve in a subprocess with checkpoint and resume. C004''s development and fresh
  layouts are never judged. List open choices the objective leaves undecided under a ''founder decisions
  before registration'' heading in the spec instead of deciding them.


  Do not edit src/, tools/ or tests/acceptance. Never start a VM.


  T0395''s report (founder session, 2026-11-16): E007 freezes moduleforge.thermal at T0395''s merged design
  (lateral grid cap 1.5 mm, the four-size calibration table c = 0.98544/0.98284/0.98298/0.98402 from benchmarks/thermal_l1_calibration.py)
  by code hash. The spec states that T0395''s fresh-seed rows (seed 20261395) chose the grid and are development
  rows, never judged evidence, and that sealed seeds must differ from every development seed used so far
  (E009''s, 20261395, and T0398''s).


  Review T0420 of T0396 (accept with caveats; founder session, 2026-11-17): (1) The spec names the bound
  exactly: CISpec(scheme=''woodruff'', level=0.94, cluster=''layout''), one-sided 97 % bounds for A1-A4
  and K1-K3, with K1/K2''s lower bounds at 98.5 % per load. This is more conservative than O002''s ''upper
  95 % bound'', so the spec flags it as a founder decision (the founder''s answer, when given, is recorded
  in O002''s state log). Correct the coverage_definition in research/o002_e007/f3_simulation.json, which
  still says ''one-sided 95 % bound''. (2) The selection rule was amended after round 1 was seen, and
  V4 was added then. The registration record discloses both and keeps round 2''s fresh-seed confirmation
  (SEED + 1) and round 1''s numbers. (3) F3 asks that per-stratum values be reported by a rule fixed before
  the run: the spec fixes it (A2 per (family, dies) stratum, A4 per die-count band, with the statistic
  and bound for each). (4) A3''s power is trivially 1.0 in the alt scenario, so the joint power of 0.898
  (t3, m = 20) is really A1, A2 and A4''s power: state it so. (5) The sample size was resolved only on
  the grid {12, 16, 20, 24, 32}: state it, and do not pick an m between 16 and 20 without a fresh simulation.



  Founder decision 2026-11-17T01:26:21+00:00 (recorded by the founder session): accept the one-sided 97
  % bound (CISpec(scheme=''woodruff'', level=0.94, cluster=''layout'')) for A1-A4 and K1-K3, and the sample
  of 300 layouts (20 per (family, dies) stratum, 15 strata, f3_simulation.json''s fixed allocation). The
  spec cites this decision (O002 state log) where it states the bound and the allocation.



  Reviews T0423 and T0424 of T0395 (founder session, 2026-11-17), for E007''s freeze: (1) add a unit test
  of the k(T) path against the exact 1D Kirchhoff limit (all seven layers on their K_LAWS, brentq on the
  integral of k dT = q t; T0423 found agreement to 1.6e-5 to 2.4e-4 at 20-60 W), in tests/unit/thermal/test_l1.py;
  (2) the grid rule and the calibration table are frozen together: add a test that pins GRID_RULE and
  the CALIBRATION values together, with a failure message saying a grid-rule change needs a refit (test-only:
  no change to src/moduleforge/thermal before the freeze unless you stop and say why); (3) correct docs/thermal_l1.md:
  energy balance is at most 2.85e-13 over all cached solves (not 2.1e-13), and the speed maximum is about
  0.79 s under load (median 0.41-0.48 s); (4) E007''s spec notes that T0395 changed src/moduleforge/solvers/thermal_layout.py
  (keyword overrides, defaults unchanged), whose hash E006, E008, E009 and E010 record: a re-run of those
  experiments records a new hash for it with no change in behaviour.


  Founder decision 2026-11-17T04:25:17+00:00: O002''s cpu_hours budget counts process CPU time (what run
  records measure), not burst-VM vCPU-hours; VM time is costed in dollars. E007''s spec states this convention
  beside its cost plan.

  '
