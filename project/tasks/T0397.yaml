    O002 says the opposite should be tolerated: ''A3 (spread within 1 K) and A5 (speed) are each met by
    a layout-ignorant predictor on their own'' (objective.yaml line 20), and ''A stratum-mean spread may
    meet A3 alone ... A4 carries the spread test'' (A3 description). F2 requires the nulls to fail only
    A1, and the spread nulls to fail A4. The repository''s own development data confirm the conflict.
    research/notes/o002-l1-design.md (null table) gives the stratum_mean and die_position nulls A3-type
