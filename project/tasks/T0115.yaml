description: 'Add harmonic2(n: int) -> float to src/moduleforge/canary.py returning H_n^(2) = sum_{k=1}^{n}
  1/k^2 as float64, mirroring harmonic(): same TypeError/ValueError input validation (reject bool, n<1),
  math.fsum over 1.0/(k*k) terms, and a docstring citing the definition (Concrete Mathematics §6.3 / Basel
  problem limit pi^2/6, skill mf-conventions). Extend tests/unit/test_canary.py with: harmonic2(1)==1.0,
  harmonic2(2)==1.25 exactly; agreement with the exact fractions.Fraction sum for n in {3,10,50,200} within
  1e-15 relative; asymptotic check |harmonic2(n) - (pi^2/6 - 1/n + 1/(2n^2) - 1/(6n^3))| / (pi^2/6) <
  1e-12 for n=1e4 (and 1e6 if marked slow); monotonic increase; input-validation errors. Do not modify
  harmonic() or existing tests. Any scratch files go inside the checkout or under tempfile.gettempdir(),
  never /tmp (sandbox). Read src/moduleforge/canary.py and tests/unit/test_canary.py first.'
