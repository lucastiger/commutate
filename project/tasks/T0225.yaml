  timeout_s: 900
- cmd: uv run python -c "import json; d=json.load(open('research/o007_probe/probe.json')); assert isinstance(d['preregistration_commit'],
    str) and len(d['preregistration_commit']) >= 7; cg=d['cg_discriminator']; assert all(isinstance(cg[c][v]['cg_max_iterations'],
    int) for c in ('case1a','case2') for v in ('with_max_lines','centroid_only')); n=d['nlayer']; assert
    len(n) >= 2 and all(len(v['levels_run']) >= 2 and len(v['max_abs_err_K']) == len(v['levels_run'])
    and len(v['dof']) == len(v['levels_run']) and 'cg_max_iterations' in v and 'gci_K' in v for v in n.values());
    assert set(d['cost']) == set(n) and all('e009_finest_peak_GB' in v and 'cpu_hours' in v and 'fits_burst_vm'
    in v for v in d['cost'].values()); assert all(d['go_no_go'][k] in ('go','provisional_go','no_go')
    for k in ('option_a','option_b'))"
  exists: null
  timeout_s: 120
- cmd: null
  exists: research/notes/o007-probe.md
  timeout_s: 900
- cmd: uv run python -c "s=open('research/notes/o007-probe.md').read(); assert '## 0' in s and 'go' in
    s and 'befc5efa' in s"
  exists: null
  timeout_s: 120
- cmd: uv run ruff check research/scripts/o007_probe.py
  exists: null
  timeout_s: 300
