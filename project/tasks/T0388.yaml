description: 'Draft experiments/drafts/E004.yaml and start experiments/runners/e004_run.py with the registration
  stage. Follow skill mf-evidence (ExperimentRun) and E010''s spec and runner as the pattern. Contents:
  (1) Load the frozen T0263 reconstructions of 2D_Case_2R and 2D_Case_6, checking their fingerprints and
  the reconstruction script''s sha256 before anything else (F2, a sanity check that does not depend on
  any solve), under D0007 (no GPL file read or committed). (2) Freeze hashes in the spec: perturb.rules_sha256(),
  the exporter and run adapter sources, l2_layout''s source_sha256, and the proxy rule source once it
  exists. (3) Draw 6 pairs per reference from E004''s sealed seed with a pre-registered allocation over
  the four move types (at least one per type per reference). Draw nothing from the sealed seed in smoke
  or dev modes. (4) The 2D_Case_2R designer-proxy pair uses O008''s proxy rule implementation. It is built
  by O008, not here, and is not yet on main. Registered mode refuses to run without it. Smoke mode records
  it as pending, with the reason. Its lattice compatibility and denominator are with the founder (founder
  request). (5) Registration checks, before any solve: at least two references; at least 6 pairs per reference;
  each move type on each reference; every layout on the lattice at 1.0, 0.5 and 0.25 mm; L1 ratios spanning
  [0.75, 0.98] with at least 3 below 0.90. Report, per move type, whether a pair has |1 - r| >= 6 % at
  L1 (coverage rule). (6) Declare the metric names the criteria use (max_ratio_diff_vs_fasthenry, max_abs_consistency,
  max_ratio_diff_vs_fasthenry_all, max_rel_diff_vs_fasthenry) and the sanity checks. The solve stage is
  a stub for the next task. Use the F7 findings in research/notes/o004-f7-l2-pilot.md. If they fire F7''s
  response trigger, stop and report blocked for a founder decision; do not redesign around it. `--smoke
  --stage registration` runs the whole stage on a development seed with L1 only.


  Founder decision I0207 (2026-11-16, answered): the 2D_Case_2R designer-proxy pair uses the proxy descent
  with 1 mm steps (on the 1 mm lattice by construction), and its ratio is taken against the frozen 2R
  reconstruction, as O004 defines r. State it in E004''s spec as a declared scope note: this is not exactly
  O008''s 0.5 mm proxy rule. Expose the descent''s step size as a parameter rather than copying O008''s
  code.


  Founder decision 2026-11-16 on T0386''s partial result (recorded by the founder session): the span [0.75,
  0.98] may be narrowed by the founder before registration, from T0387''s span_reach.json (Case 4''s floor
  is 0.7616). Write the registration check with the span''s lower end as one named constant read from
  the objective''s text in a single place, so a founder amendment changes one line; do not assume a value
  other than the frozen 0.75.


  Review T0416 of T0386 (founder session, 2026-11-16): before E004''s spec freezes the perturbation-rules
  hash, fix these in src/moduleforge/generate/perturb.py, each with a test in tests/unit/test_perturb.py:

  1. rules_sha256() must cover every input that decides which layouts a seed yields: add NETS (its order
  is indexed by the rng), SIGNAL_NET, SIGNAL_PADS, and the sources of Die.box, BondWire.length and SignalWire.length;
  E004''s spec also pins the commit and the shapely/numpy versions.

  2. long_sides depends on the polygon''s vertex list (collinear splits), so a compound that canonicalises
  a net changes the trace_width edge set for the same geometry: compute it on _canonical(poly), or state
  the representation dependence in the frozen rule text.

  3. The whole-mm construction rounds absolute coordinates: draw/measured_rules assert that the reference
  coordinates are whole mm (all three references are), or reject draws that fail on_lattice.

  4. test_terminal_copper_declared_changes_closed_form''s positive case is vacuous (its slab lies inside
  the PHASE column): add a positive-delta case whose slab adds copper, with the closed-form area gain.

  Compound pairs are authorised by the founder''s I0217 answer (project/inbox/I0217.yaml); every step
  of a compound is DRC-clean (the stagewise rule, founder to confirm at the T0386 merge).


  Founder 2026-11-16 17:55 UTC: the stagewise rule confirmed (every step of a compound DRC-clean, not
  only the final layout); E004''s frozen rule text states it. The span''s lower end is set by the founder
  from T0387''s span_reach.json (2D_Case_4 and gen2_0 only, per F2); the registration check on the judged
  references stays as O004 states it.'
