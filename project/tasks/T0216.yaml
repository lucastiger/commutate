description: 'Fix the findings of review T0215 on T0206 (project/reviews/T0206/T0215.json) in src/moduleforge/solvers/thermal_fem.py,

  before the O007 development study (T0207) freezes the configuration.


  (1) Major: _merge_lines merges a mandatory line into an existing grid line only within 1e-10 m laterally
  (1e-12 m in

  z). A mandatory line between that and a few micrometres from an existing line is kept, creates sliver
  cells and

  crashes the solve. Make the merge tolerance relative to the local cell size (for example a small fraction
  of h0

  laterally and of the layer''s dz in z, stated and justified in the docstring). Snap a near-coincident
  mandatory line

  onto the existing line and record the snap distance, so a reported point never moves by more than that
  recorded

  distance. Add tests: a mandatory line 1e-9, 1e-7 and 1e-6 m from an existing line, in both modes and
  both element

  orders, solves without error. The snapped position and the reported point coordinates are checked.


  (2) Minor: extra_lines must accept the same inputs (scalar or sequence per axis) in layout and box-stack
  mode; add a

  test.


  (3) Note: box-stack mode now always adds each source''s centroid lines, so the legacy h0= grid changed
  and the

  legacy-equality test cannot see it. Either keep the legacy call''s grid unchanged when no rule is given,
  or update the

  test and docstring to say the legacy grid now includes centroid lines (state which).


  Do not change the element order, the dz_max rule, the node-only point rule or anything O007 froze; Q1
  and Q2 results on

  grids without near-coincident lines must be unchanged (assert it on one case per mode).'
