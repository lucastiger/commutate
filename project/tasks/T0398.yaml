id: T0398
objective: O002
title: 'E007 development rows: local dev run, F2 null check via mfos exp check, F3 coverage re-run on
  the dev structure'
type: design_experiment
agent: scientist
status: todo
depends_on:
- T0397
description: 'Prerequisite: the founder has applied research/o002_e007/e007_metrics.patch to the protected
  tools/mfos. If the functions are not on main, stop and say so.


  Run `e007_run.py --dev` and write experiments/drafts/E007.dev_rows.json:

  - development geometry only: the per-stratum development layouts and further layouts from recorded development
  seeds, never a sealed seed;

  - judged level 1, full fidelity (meta.smoke false);

  - locally, within the policy''s local_cpu_hours_max (6 CPU-hours);

  - one solve at a time.


  Then:

  (1) Run `uv run mfos exp check E007 --rows experiments/drafts/E007.dev_rows.json`.

  (2) F2: record in meta.f2_nulls, for each null (die_position, stratum_mean, isolated_die), its A1 point
  estimate at P_ref (A1_point_K), its A4 point estimate (A4_point) if it predicts spreads, and per-stratum
  A1 and A2. Each null''s A1 point estimate must exceed 0.5 K, and each spread null''s A4 point estimate
  must exceed 0.5. If any null meets A1 or A4, stop and report it: F2''s response is a design revision,
  not a fix here.

  (3) Re-run n5''s coverage simulation with the selected bound on the dev rows'' actual structure and
  record it in meta.f3_dev.coverage[statistic][normal|t3].

  (4) Record A5 on the dev rows (meta.l1_eval_s_p50).

  (5) Update cpu_hours_est in the spec if --plan changes, and say why.


  Change nothing gated (criteria, thresholds, bound, allocation) without saying so.


  Founder session, 2026-11-16 (from review T0410 of T0392): T0392''s F2 check was partial. Include null
  (a), the isolated-die spreading model, and compute the stratum-mean A1 null per (stratum, switch), as
  O002''s F2 says.


  T0395''s report (founder session, 2026-11-16): T0395 changed n1''s design: lateral grid cap 1.5 mm instead
  of 4 mm, chosen on the fresh development seed 20261395 by a rule fixed before scoring. Those 18 rows
  chose the grid, so they are no longer out of sample, and A4 was validated only on 2-die strata with
  5.0 mm dies. The development run therefore reports A1, A2, A4 and A5 per stratum (every die count and
  every die size E007 draws: 4.0, 4.5, 5.0, 5.5 mm) on a development seed not used by T0392 or T0395,
  and states per stratum whether A4 <= 0.3 holds. The calibration factor''s family spread at 4.0 mm (0.0059,
  above the design note''s 0.005 line) is re-measured on these rows and reported, with its effect on A2.


  Review T0420 of T0396 (founder session, 2026-11-17): (1) Before registration, record cpu_s and wall_s
  for one level-2 reference solve (the cost plan''s 100 CPU-hour check assumes level-2 CPU time equals
  wall time; above about 2.7 effective threads the budget would be exceeded under strict CPU accounting).
  If no level-2 solve fits the local limit, say so and list it for the burst. (2) Re-run research/o002_e007/stats_sim.py
  with error scales measured on the frozen L1''s development rows in all six (family, band) cells (only
  side_by_side/6 and u_shaped/2 were measured in n1), and report whether V4 still covers and the power
  at m = 20.



  Founder decision 2026-11-17T02:35:20+00:00 (recorded by the founder session; reviews T0423 and T0424
  of T0395): T0395''s 1.5 mm grid rule and c(s) table are accepted although c(s) varies between families
  by 0.0059 at 4.0 mm, above the design note''s 0.005 transfer line. The development rows are the check.
  They include every family (interleaved too) at every die size, with 4.0 mm and the 3-5-die strata included,
  and report per stratum: the implied factor (mean over dies of reference rise / coarse-FV rise) beside
  the table''s c(s); the per-die bias separately for HS and LS dies (T0423 and T0424 each saw LS dies
  off by 0.35-0.43 K where HS dies were off by about 0.1 K on interleaved/3 at 4.0 mm); A2-type against
  the model''s 1.8 % guard; and A4 against 0.3. If any stratum misses the 1.8 % guard or A4 <= 0.3, stop
  and report it: the founder decides before E007 freezes.



  Review T0434 of T0396 (founder session, 2026-11-17): the founder''s choice of 300 layouts (m = 20 per
  stratum) rested on joint power 0.898 for an L1 at 0.6 x each threshold under t3 errors. For the L1 as
  measured on development rows (A4 = 0.366, about 0.73 x A4''s 0.5 threshold), f3_simulation.json''s cells
  give joint power 0.531 under t3 (0.967 under normal) at m = 20, with A4 alone causing the shortfall;
  that scenario was simulated only at m = 20. When re-running stats_sim.py on this task''s development
  rows: (1) report joint power, and A4''s power alone, for the as-measured L1 (n1''s values, and again
  with A1-A4 as measured on this task''s development rows) at m = 20, 24, 32 and 40 under normal and t3
  errors, beside power_joint in the summary; (2) report, for a scenario somewhat beyond each kill threshold,
  the probability that K1, K2 and K3 each fire (no kill-side power is on record). The founder decides
  m before registration from these figures; keep m = 20 in the files until then.


  Founder decision 2026-11-17T04:25:17+00:00: O002''s cpu_hours budget counts process CPU time (what run
  records measure), not burst-VM vCPU-hours; VM time is costed in dollars. E007''s spec states this convention
  beside its cost plan.



  Review T0435 of T0397 (physics, accept with caveats; founder session, 2026-11-17). Fix in experiments/runners/e007_run.py
  and the spec before the development run: (1) sealed_seeds_fresh: record all six derived stream seeds
  (layouts, die_size, f7, f7_strata, l2_subset, timing_order) in sub_seeds and check every one against
  the forbidden list; (2) layouts_distinct_and_unseen: intersect the F7 draw fingerprints with the C004,
  other-development and P_ref sets too; (3) run the half-P_ref L1 evaluations of the F7 layouts inside
  run_l1_phase (after the timed block), so the energy_balance check covers every L1 evaluation, and apply
  tj_max_within_rating to F7 layouts as well (O002 F1: every layout); (4) reword the A5 timing text to
  ''after the P_ref calibration and before any judged reference solve, with none running''; (5) regenerate
  config.compute.plan_summary and design note section 6 from the current --plan output (local part 22.2
  h, side_by_side/6 judged above the 5 GB local cap at the upper size); (6) add src/moduleforge/geometry/*.py
  and src/moduleforge/generate/__init__.py to config.freeze.files and code_under_test; (7) state as scope
  limits that the die-position null is not independent of the stratum-mean null for A4 (it is at most
  the mean spread by construction), and that hottest-node estimates (F6) exist only on the level-2 subset.
  Also: the A1-A4 recompute entries can now carry ci: {scheme: woodruff, level: 0.94, cluster: layout};
  the founder merged the mfos.metrics patch (da2118fc).

  '
