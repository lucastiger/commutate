definition_of_done:
- cmd: null
  exists: experiments/drafts/E007.dev_rows.json
  timeout_s: 900
- cmd: uv run mfos exp check E007 --rows experiments/drafts/E007.dev_rows.json
  exists: null
  timeout_s: 900
- cmd: uv run python -c "from mfos.store import Store; from mfos import models as m; from mfos.evaluate
    import load_rows, null_check; s = Store(); spec = s.read_yaml(s.spec_path('E007', draft=True), m.ExperimentSpec);
    lines, bad = null_check(s, spec, load_rows(s.root / spec.dev_rows)); print(chr(10).join(lines)); assert
    not ({'A1', 'A4'} & set(bad)), bad"
  exists: null
  timeout_s: 900
- cmd: uv run python -c "import json; d = json.load(open('experiments/drafts/E007.dev_rows.json')); mt
    = d['meta']; assert mt['smoke'] is False; f = mt['f2_nulls']; assert {'die_position', 'stratum_mean',
    'isolated_die'} <= set(f), sorted(f); assert all(v['A1_point_K'] > 0.5 for v in f.values()), f; assert
    all(v['A4_point'] > 0.5 for v in f.values() if 'A4_point' in v), f; cov = mt['f3_dev']['coverage'];
    assert all(x >= 0.95 for by in cov.values() for x in by.values()), cov; assert mt['l1_eval_s_p50']
    > 0"
  exists: null
  timeout_s: 120
- cmd: uv run python experiments/runners/e007_run.py --selftest
  exists: null
  timeout_s: 900
- cmd: uv run python experiments/runners/e007_run.py --verify-freeze
  exists: null
  timeout_s: 300
- cmd: uv run ruff check experiments/runners
  exists: null
  timeout_s: 300
- cmd: test "$(shasum -a 256 src/moduleforge/solvers/thermal_fem.py | cut -c1-16)" = a216d5fe3209bcee
  exists: null
  timeout_s: 60
