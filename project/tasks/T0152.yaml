description: 'Implement src/moduleforge/solvers/thermal_fem.py with scikit-fem trilinear hexahedra and
  pyamg; do not edit solvers/__init__.py. Independence (A3) requires that it never imports thermal_fv
  or thermal_layout and builds its own mesh, materials and boundary conditions. (a) Box-stack mode: laterally
  uniform layers, rectangular isoflux surface sources, h at the bottom, adiabatic sides. E006''s F1 checks
  need it for Muzychka Case 2 and for the laterally uniform default stack at a 60-110 K rise. (b) Layout
  mode, implementing docs/thermal_model.md: a conforming hexahedral mesh with nodes on every die, die-attach,
  copper, backside-Cu and baseplate edge, and void elements removed; its own Picard loop for k(T), stopping
  when max |dT| < 1e-4 K; per-die Tj max (maximum over die-top surface nodes) and mean; energy balance;
  its own refinement rule with a constant ratio over three levels; and the per-die Roache GCI, using the
  same formula as O006 A4. Document the largest DOF count this Mac supports (about 7.7 kB per DOF, D0006).
  Tests in tests/unit/solvers/test_thermal_fem.py: 1D slab series resistance, energy balance, mirror symmetry,
  mesh conformity to die and copper edges, and a 1D k(T) Kirchhoff case. Benchmark benchmarks/thermal_fem_convergence.py:
  the two A3 layouts (the first DRC-valid side_by_side layout with 6 dies per switch and the first u_shaped
  layout with 2 dies per switch, generate_layouts dev seed 20261101), 65 C coolant, h = 5000 W/(m2 K),
  k(T), per-die power giving a 60-110 K Tj max rise (record it). Write benchmarks/results/thermal_fem_convergence.json
  with the schema {mode, layouts: [{name, fingerprint, power_per_die_W, levels: [{level, dofs, wall_s,
  peak_rss_mb, energy_balance, status}], dies: [{id, tj_max_K: [3 values or null], gci_K, p_obs}]}]}.
  Set mode to ''full'' for the real run. A level that does not fit in memory gets status ''skipped: memory'',
  with its estimated DOFs and memory and null values, never invented values. This is A3''s kill shot:
  scikit-fem''s own GCI must be at most 0.025 K.'
