description: "Implement item 1 of the founder's model-fix list (2026-11-12, founder session; D0018, whose\
  \ record is being\ncommitted separately): E008 drops the measured minimum gate-wire length from its\
  \ per-reference rules. This reads O003\nscope_in's enumerated rules as the complete meaning of \"design\
  \ rules at least as strict as the reference's own\": its\nbondability rule bounds gate and Kelvin wires\
  \ only from above (objective.yaml lines 61-63; review T0315 finding 2).\nBackground: T0314 (research/notes/o003-twin-coverage.md,\
  \ section 1, variant R1) showed this lower bound,\nwhich drc.rules.measure_rules sets to the reference's\
  \ shortest signal wire (rules.py line 587), is the only rule that\nstops a twin whose gate wires run\
  \ to the nearest gate copper.\n\nLimits: generator layouts and 2D_Case_4 only. Do not load 2D_Case_2R,\
  \ 2D_Case_6, customer data or any other module's\ngeometry; do not search the web for module layouts.\
  \ Do not change src/ or tests/acceptance: the change lives in\nexperiments/runners/e008_run.py. Do not\
  \ edit src/moduleforge/solvers/thermal_fem.py (sha256 a216d5fe...). Keep every\nupper bound (max_gate_wire_length,\
  \ max_kelvin_wire_length, max_signal_wire_length) and every other measured rule. Do not\nwiden any tolerance,\
  \ relax any other gate or change the cost model. L0/L1 only. Keep T0316's work (the D0018 yardstick\n\
  and exclusion) intact.\n1. One runner function builds a reference's E008 rules from measure_rules with\
  \ min_signal_wire_length set to None, and\n   records that it did so in the rules record. Every place\
  \ the runner builds a reference or dev spec uses it, and the\n   judged-reference loader added later\
  \ must use it too (say so in the spec).\n2. Selftest: on a planted reference, a twin gate wire shorter\
  \ than the reference's shortest gate wire passes the DRC\n   under E008's rules, and one longer than\
  \ the reference's longest still fails.\n3. Spec (experiments/drafts/E008.yaml) and research/notes/e008-design.md:\
  \ state the rule, its basis (D0018 item 1, O003\n   scope_in, T0314, T0315) and that candidates lose\
  \ the lower bound too. Re-stamp every hash the runner edit changes.\n   Re-run the 2D_Case_4 L0/L1 fail-fast\
  \ record and the gen2_0 smoke prep, update experiments/drafts/E008.dev_rows.json,\n   and report the\
  \ shortest gate wire among the dev twins and DRC-clean smoke samples. Report, do not gate, any shorter\n\
  \   than DesignRules.min_wire_length (1.5 mm, a placeholder default).\nThe registered path (full(),\
  \ judged-reference loading) and the reference set stay out of scope.\n\nADDED from review T0318 of T0316\
  \ (project/reviews/T0316/T0318.json; read it first), same limits as above:\n4. Solver failures are not\
  \ exclusions (T0318 finding 0). Run.d_definition treats a NaN band of D or W as a miss, which\n   excludes\
  \ the reference (D_misses_1p25_in_L_sub), so a numerical failure is relabelled \"no valid D exists\"\
  . Make a\n   non-finite L or e_R in D's or W's band solves, or a band solve that did not converge (check\
  \ the l2_layout result's\n   GMRES flags or equivalent convergence record), fail F1b_D_definition for\
  \ that reference, which makes the run INVALID\n   as before T0316. Only a finite, converged ratio below\
  \ 1.25 at the conservative end excludes. Selftest: a planted NaN\n   band and a planted non-converged\
  \ band each give INVALID, not an exclusion.\n5. Selftest gaps (T0318 finding 4): a TwinError exclusion\
  \ case; a D-definition miss on the only reference (INVALID);\n   exclusions at mixed stages (prepare\
  \ and drive) in one run. Fix the walk_steps field in\n   research/o003/e008_dev/case4_prep.py (it prints\
  \ the number of keys of the walk record, 5, not the 7 steps)."
