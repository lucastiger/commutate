  report:
    summary: 'EV-O006-01 came back INCONCLUSIVE: A1 = 0.0206 against a 0.01 threshold, A2 = 0.143 K against
      0.05 K, A4 = +inf against 0.5 K; A3 = 0.72 is met and kill criteria K1/K2 are not triggered. The
      run itself is valid: all 26 sanity checks pass and every evaluator provenance check is ok. I found
      no evidence that the L2 solver is wrong. There are two separate causes, each confirmed by a cheap
      local test.


      (1) A1/A2. Every row over 0.05 K is in Muzychka Cases 1a or 2, which are single 10 mm plates. The
      frozen grid rule always puts 2 cells in each layer, whatever its thickness, so at level 2 the cells
      are 1.25 mm thick. Doubling only the through-thickness (z) cells cuts the Case 2 error from 0.143
      to 0.040 K, and quadrupling them cuts it to 0.010 K. Doubling only the lateral cells changes nothing
      (0.150 K). Case 1a behaves the same way: 0.025 K with 16 z-cells even at 1 mm lateral cells. The
      solver converges to the validated reference at second order, with no bias above about 0.01 K.


      (2) A4 = inf. All three divergent values are ''reference max'' points that are bilinearly interpolated
      at a fixed (x, y) position. With each refinement, that point''s relative position inside the interpolation
      stencil jumps around (ξ → (2ξ+½) mod 1). The interpolation error therefore has no C·h^p form, which
      the GCI assumes. Filling the production stencil with the exact field shows the FV error at those
      points is identical to the centroid''s and falls by exactly 4.0 per level. With the interpolation
      part removed, the GCIs become 0.06–0.18 K instead of inf or 0.595 K. On the five generator layouts
      alone, A4 is 0.303 K. The pre-registration smoke run had already shown a divergent manufactured-case
      max point.


      Primary class: model (the frozen grid rule''s per-layer z count fails on thick layers). Secondary:
      an experimental defect in how A4 measures point values. The pre-registered decision for this outcome
      is ''same as fail'' (switch to the scikit-fem fallback), and O006''s only evaluation has been used,
      so the next step is the founder''s.'
    failure_class: model
    root_cause: 'A1/A2: the frozen thermal grid rule sets Z_CELLS = 2 cells per layer regardless of thickness.
      On the 10 mm single-layer Muzychka Cases 1a and 2 this gives dz = 1.25 mm at level 2 and leaves
      0.12–0.14 K of through-thickness discretisation error at the source means. The verified solver converges
      to the validated reference at second order in dz with no bias above about 0.01 K. A4 = +inf: the
      three-grid GCI is applied to bilinear interpolants at fixed off-lattice ''reference max'' points.
      Their position inside the cell-centre stencil changes non-monotonically between levels (ξ → (2ξ+½)
      mod 1), so the interpolation error -½ξ(1-ξ)h²T'''' has no C·h^p expansion. The estimator therefore
      reports ''divergent'' even though the FV field there converges monotonically at order 2.'
