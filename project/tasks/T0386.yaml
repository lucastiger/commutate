    when their starts move. A rigid variant (power and signal wires moved with the die, same copper growth,
    same measured rules) gives 19 DRC-clean shifts on 2D_Case_6. The test also asserts the negative outcome,
    so it would fail on a fix and locks the defect in before the rules are hashed and frozen into E004.

    - [major] Frozen ranges cannot reach O004''s registration span or 6 % coverage on the development
    reference: On Case 4 (seed 1, 12 moves per type), the L1 ratios at 20 MHz are: die_row_shift 0.897
    to 1.013, trace_width 0.961 to 1.030, terminal_copper 0.998 to 1.003, wire_landing 0.964 to 1.069.
