    inert (at most 0.33 %) and trace_width tops out near 4 %. The strict xfail already acknowledges that
    r <= 0.75 (F7(c) and the scope_in span [0.75, 0.98]) is unreachable. It does not mention that two
    move types cannot meet the 6 % coverage threshold on the development reference. The docstring calls
    the ranges ''wide'', but in practice they do not support O004''s pre-registration checks.

    - [major] rules_sha256 does not cover all rule-relevant code: The hash covers 15 named functions and
    the ranges. It leaves out _mm (the rounding of die bounds and terminal windows), _box_mm, _polygon
    (the rejection of split copper), _net_poly, _replace_trace, _int, the MM constant, and the DRC source
    (check, measure_rules) that decides which draws a sealed seed accepts. Any of these could change the
    drawn pairs without changing the hash, which weakens the F2 freeze.

    - [minor] trace_width and terminal_copper results alias the reference''s wires, signal wires and terminals:
    These two moves return layouts that share the wires list, the BondWire objects, the signal_wires list
    and the terminals dict with the reference. die_row_shift and wire_landing copy them. The test that
    apply does not modify the reference only compares fingerprints, so it cannot catch aliasing.

    - [minor] draw can return moves with different parameters but identical layouts: draw only deduplicates
    on the parameter JSON. Two terminal_copper moves (PHASE, S, margin 3, delta 4 and delta 5) produced
    identical geometry, which would duplicate a registered pair.'
