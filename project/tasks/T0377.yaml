    concerns:
    - 'Reach is wider than the packet text. Slot attachment and the column outer edge were not enough
      for in_domain(W, reach=True) to hold on 2R and Case 4. I also had to widen: column v extents (only
      need to cover the pad, within the outline limit), slot free ends (up to the limit), die row start
      (anywhere up to the free limit), and the landing line (0.125 mm grid, margin = wire_landing_margin
      + 0.05, at most 0.5). Each is drawn only with probability 0.5 and only in reach mode, and the legacy
      domain remains a subset. Please confirm this is the intended meaning of ''reach''.'
    - T0349's attached-form variant of 2R is outside the legacy domain for a second reason it did not
      check. Even with the PHASE edge at 45.5 mm, the LS die row starts 11 mm from the PHASE column's
      inner edge, and the legacy draw allows at most dem + 6 mm. in_domain reports row_LS_u0 for it with
      reach off, and reach covers it. A test records this.
    - 'The 2R reach-on DRC-valid yield is low: about 15 of 208 non-None raw draws pass _quick_ok, against
      61 of 232 with reach off. Reach makes the 2R twin drawable, but search power on 2R has not been
      measured here.'
    - 'in_domain''s side handling: a net''s column side is not a parameter. The predicate tries both sides
      and reports the failure of the reading the geometry shows. A reach-off or hand-made vector could
      therefore get a different reason under the other reading, though the True/False verdict is unaffected.
      The stack check allows one 0.5 mm grid step of slack on the upper window limit, so the predicate
      can be slightly looser than the sampler''s exact support.'
    - degrade() calls _walk with the legacy five-argument form when reach is off, because research/scripts/o003_twin_coverage.py
      wraps _walk with that signature. I did not touch the script, since it is outside my write scope.
    - The reach moves in _walk_candidates and _moves use the outline limit only. A free-end jump to the
