  report:
    status: completed
    summary: "I added an opt-in reach mode to the derivative sampler, an `in_domain` predicate, and reach\
      \ moves in twin.py. All DoD commands pass and the work is committed as ec441ba2.\n\n**What changed**\n\
      - **Reach mode:** `generate(..., reach=False)` and `_Ctx(spec, reach=False)` carry the flag, and\
      \ `_sample` reads it from the context. With reach off, the raw `_sample` streams and the `generate`\
      \ fingerprints are bit-identical to the unmodified code. The test constants were recorded before\
      \ editing, and the check is repeated after moving the die-window code into `_die_windows`.\n- **What\
      \ reach draws:** each extension is drawn with probability 0.5, otherwise the legacy draw. The reach\
      \ domain contains the legacy one.\n  - Column outer edges go out to the outline edge-margin limit.\n\
      \  - Slot attached ends can lie anywhere from the column's inner edge across the column to that\
      \ limit, so slots can straddle or overlap their column.\n- **`in_domain(spec, params, reach, ctx=None)`:**\
      \ it replays `_sample`'s sequential construction and returns `(bool, reason)` with the first failing\
      \ constraint. It also requires the layout to build, pass `_quick_ok`, and be DRC-clean. Soundness\
      \ is tested, and the converse is not claimed.\n- **twin.py:** the twin construction is unchanged.\
      \ `_moves(reach)`, `_walk_candidates(p, spec, reach)`, `_walk` and `degrade` take a `reach` flag,\
      \ default False, so the legacy order is unchanged. The new moves are slot attached-end jumps (column\
      \ outer edge, inner edge, outline limit), slot free end to the limit, and column outer edge to the\
      \ limit or back to its pad edge. Both docstrings describe the change.\n\n**Results**\n- 2R twin:\
      \ `in_domain(reach=True)` is True. With reach off it is False, first failing at `col_PHASE_outer_edge`,\
      \ which matches T0349's PHASE edge at 47 mm.\n- Case 4 twin: `in_domain(reach=True)` is True. Both\
      \ twins rebuild to their own fingerprint and are DRC-clean under their own rules.\n- Rate on 2R's\
      \ spec, seed 3770001, 20000 raw draws: with reach off, 232 non-None draws, 0 straddling slots and\
      \ 0 far outer edges. With reach on, 208 non-None draws, 188 with a straddling slot (0.94 %) and\
      \ 93 with an outer edge beyond pad + 1.5 mm (0.47 %). Of 40 DRC-clean layouts from `generate(reach=True)`,\
      \ 35 straddle and 13 have a far outer edge.\n- Soundness: a wider scratch run found no failure with\
      \ reach on or off (600 draws each on the housing at k=1 and k=3, 40 on Case 4, 150 on 2R). The tests\
