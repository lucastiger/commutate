  summary: Done, committed as 25ca190e. (1) `_best_split` now scores against the band's own copper, via
    the new `_band_copper`. That is the net's copper clipped to the v-strip of the two slots, minus the
    u-ranges where the copper continues past the strip's lower or upper edge (probed 0.25 mm beyond).
