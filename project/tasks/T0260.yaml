      with no thermal solves, resume, and determinism. The slow test runs the real generator and real
      L1 on the 70 x 40 housing with 300 candidates.


      Judgment calls where the packet was ambiguous:

      - **Streaming:** `generate()` returns a list, so the driver calls it in chunks of 250 with sub-seeds
      from `SeedSequence([seed, k])`. The chunk size changes the candidate stream, so it should be frozen
      in E008''s spec.

      - **Thermal contract:** `thermal(layout, P)` returns `{"tj": 3 x n_die, "gci": n_die}`. The conservative
      test uses the level-2 (last) Tj row.

      - **e_R and w_ind:** `e_R((candidate, other))` is called once, for (inductance-only best, twin),
      and `w_ind = 2*e_R + s_ref`. The pair formulation and the `2*e_R + s_ref` band are from objective.yaml''s
      A1/K1 description.

      - **Control mode:** `run_control` takes D as the reference, and `e_R` is called for (best, D).

      - **Levelling flag:** this is reported as `levelled` next to the two L1 minima. The driver does
      not apply the h = +inf rule.

      - **Slow test:** its `l_sub` and thermal solvers are stand-ins, so it exercises the driver with
      real L1 and the real generator only.


      I did not run a 20,000-candidate real run.


      <br>


