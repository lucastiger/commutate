      - **Search and checkpoint:** all solvers are injected through `Solvers`, and layouts are touched
      only through `fingerprint()`. Every solve goes to an append-only JSONL checkpoint keyed `<fingerprint>:<kind>`.
      A rerun on the same directory re-solves nothing, and a torn last line is skipped. Only the 16 shortlisted
      layouts are kept in memory, not all 20,000.

      - **Tests:** they cover batch-and-stop and the cap of 8, ascending L_sub order, the null''s reuse
