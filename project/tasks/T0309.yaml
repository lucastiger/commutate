id: T0309
objective: O003
title: 'E008 runner: admissible spot-check references, per-die thickness in stack type, NaN-safe F6(c)
  with FV Picard record, thermal-report selftest (reviews T0307, T0308)'
type: design_experiment
agent: scientist
status: todo
depends_on:
- T0306
description: "Follow-up to T0306 from its reviews T0307 (physics) and T0308 (numerics), both accept_with_caveats\n\
  (project/reviews/T0306/T0307.json and T0308.json; read both first). It lands before T0263 loads the\
  \ judged references\n(F3). Develop on generator layouts and 2D_Case_4 only; never load 2D_Case_2R, 2D_Case_6\
  \ or customer data. Do not edit\nsrc/moduleforge/solvers/thermal_fem.py (sha256 a216d5fe...). Do not\
  \ widen any tolerance, relax any gate, change a frozen\nvalue or the cost model. The founder decisions\
  \ the spec lists stay listed; do not decide them.\n1. Spot-check reference (T0307 finding 1, T0308 finding\
  \ 2). Run.drive takes the first reference of each non-default stack\n   type, admissible or not, so\
  \ an inadmissible first reference fails F6e for that type although a later admissible one\n   exists.\
  \ Take the first admissible reference of each type; a type with no admissible reference gets no spot\
  \ check and\n   is reported as such (say how in the spec), not failed. Selftest: a type whose first\
  \ reference is planted\n   inadmissible and whose second is admissible gets its spot check on the second.\n\
  2. Stack type and per-die thickness (T0308 finding 1). The solvers take die and attach thickness from\
  \ each Die\n   (Die.thickness, Die.attach_thickness), which the signature ignores. Add the sorted set\
  \ of (Die.thickness,\n   Die.attach_thickness) per layout to the stack-type signature. Selftest: two\
  \ references that differ only in die\n   thickness each get their own spot check.\n3. F6(c) on the spot\
  \ checks (T0307 finding 0, T0308 findings 4 and 5). Record picard_dT from the finite-volume\n   ThermalResult\
  \ meta in child_fv and fold it into the Picard check, so the gate is shown, not implied by the solver's\n\
  \   default tolerance. Make the energy-balance and Picard maxima NaN-aware: a NaN or infinite value\
  \ fails F6(c).\n   Selftest: a planted NaN energy balance on a spot-check solve fails F6(c).\n4. Dev\
  \ thermal report content (T0307 finding 3, T0308 finding 0). Protect thermal_report_from_rows with literal\
  \ hand\n   values in the selftest: a twin's per-die GCIs, its width and self margin; a candidate with\
  \ a divergent die (GCI inf,\n   counted in n_gci_inf) and one with off-window node growth (flagged);\
  \ planted hot candidates with passes_vs_twin False\n   and margin_vs_twin_K above 2 K. Show that a version\
  \ marking every layout attainable fails the selftest.\n5. Small fixes: re-stamp rule_strictness_refresh.runner_sha256\
  \ in experiments/drafts/E008.dev_rows.json after the last\n   runner edit, or record that later edits\
  \ left rule_strictness unchanged (T0307 finding 2); the empty-report guard's\n   pattern does not match\
  \ die_spacing (T0307 finding 4).\nThe registered path (full(), judged-reference loading) stays out of\
  \ scope; it is added after T0263 and re-reviewed."
