rationale: Reviews T0307/T0308 found that F6(e) can fail a stack type on an inadmissible first reference,
  that the stack type ignores the per-die thicknesses the solvers use, that F6(c) on the spot checks rests
  on a solver default and drops NaNs, and that the dev thermal report behind a founder decision is not
  protected by the selftest. Fixed before T0263 loads the judged references, under the session review
  policy.
