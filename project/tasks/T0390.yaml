description: 'Add the reported, non-gating diagnostics to experiments/runners/e004_run.py and declare
  them in experiments/drafts/E004.yaml. None may change A1, A2, K1 or K2, which are judged on raw values.
  F3: attribute the solver difference per conductor group (traces, wires, terminals) by a method stated
  in the spec. Include the round-versus-square wire cross-section term: an equal-GMD square tends to a
  high-frequency limit about 0.6 % below a round wire''s partial self-inductance (review T0364). A model
  choice that changes L by more than 1 % is flagged for a founder decision. F6: on both judged references,
  rerun with the exporter''s die_model=''distributed'' and terminal_model=''tab'' variants, at a level
  the spec fixes, and report the change in L and in each pair ratio. A shared choice that moves a pair
  ratio by more than 2 % is flagged for a founder decision before O009 relies on l2_layout. F8: report
  the L1 ratio''s agreement with FastHenry beside l2_layout''s on the same pairs, and record whether L1
  alone would meet A1. Put the extra solves'' cost in the spec''s cost plan. `--smoke --diagnostics` runs
  the three diagnostics at the coarsest level on one Case 4 development pair.'
