description: 'D0006 primary L2, steady part only (transient is out of scope). Implement src/moduleforge/solvers/thermal_fv.py;
  do not edit solvers/__init__.py. Inputs: tensor grid lines x, y, z (non-uniform); a material id per
  cell, with void allowed (void cells are excluded and their faces adiabatic); materials with k(T) from
  geometry.stack. Discretisation: cell-centred FV with face conductance from the two half-cells in series,
  which is exact for 1D piecewise-constant k with interfaces on grid lines. Boundary and source data are
  the contract the manufactured reference (n6) relies on; document them in the module docstring: (a) Robin
  at z = 0 with h and T_inf, each a scalar or a callable of (x, y); (b) prescribed normal flux, as a callable
  or a per-face array, on any exterior or void-bounding face (default 0); rectangular top-surface isoflux
  sources are a special case; (c) volumetric source, given per cell or as a callable integrated per cell
  with tensor Gauss-Legendre of at least 3 points per direction. k(T): Picard iteration with half-cell
  k evaluated at the cell temperature; stop when max |dT| < 1e-4 K (F2), and report the iteration count.
  Linear solve: scipy.sparse plus pyamg smoothed-aggregation-preconditioned CG, tight enough that the
  energy balance |Q_out/Q_in - 1| <= 1e-9 (F2 gates at 1e-6). Outputs: cell temperatures; the reconstructed
  top-surface temperature T_c + q dz/(2k) per top face (O006 A1); second-order bilinear interpolation
  of that surface field at arbitrary (x, y); area mean and maximum over a rectangle; energy balance; meta
  (n_cells, picard_iters, linear residual, energy_balance, wall time). Tests in tests/unit/solvers/test_thermal_fv.py:
  1D multilayer slab with h against the cited series-resistance closed form (relative 1e-10); energy balance
  <= 1e-9; mirror symmetry; observed order in [1.8, 2.2] for a smooth single-material 3D test field of
  your own (not E006''s) on three non-uniform grids; 1D k(T) slab against the cited Kirchhoff-transform
  closed form, within the Picard tolerance plus the discretisation error; void faces are adiabatic. One
  slow-marked test: 1e6 cells solve in under 60 s on this Mac. Start from benchmarks/infra/thermal_bench.py.'
