      6. **Checkpoint store:** loading now repairs a torn trailing line, so a later append is no longer\
      \ lost. A complete line missing only its newline is kept. Tested across two reloads.\n7. **Duplicates:**\
      \ the shortlist is de-duplicated by fingerprint, and near ties are compared by fingerprint.\n8.\
      \ **Tests:**\n   - Replaced the three vacuous assertions.\n   - Added tests for each defect.\n \
