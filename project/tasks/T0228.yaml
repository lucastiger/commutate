description: 'Pre-registered development study on the production graded rule (n1). It replaces T0207''s
  infeasible freeze and is the last check before E009 is designed. Write research/scripts/o007_dev_study2.py,
  reusing o007_dev_study.py and o007_probe.py by import: load_refs, box_problem, mms_extra, dev_layout,
  the child-process worker, the memory gate, and the ''cg_only'' counter or thermal_fem meta[''cg_iterations'']
  (T0222). Outputs go under research/o007_dev2/. Make no production code change.


  (1) Pre-registration. Write section 0 of research/notes/o007-dev-study2.md and commit it before any
  solve; only grid construction is allowed beforehand. Record the commit hash in dev_study.json as preregistration_commit.
  Section 0 fixes:

  - Candidates, at most two. Candidate 1 is exactly T0225''s a_q1h4_graded, built through production GridRule:
  Q1, h0 4 mm, near_margin 2 mm, dz_max 1 mm, nz_min 1, min_cells 2, edge_grading (1e-4, 2.5, 4e-3, 0.5),
  production mandatory lines and SNAP_FRACTION, linear_rtol 1e-11, CG cap 400, Picard 1e-4 K, levels [0,
  1, 2]. Candidate 2 is optional. It is chosen from a grid-only cost survey, its E009 peak must be at
  most 217.6 GB, and its rationale must name the kill risk it targets.

  - Eligibility: T0207 note section 0.2, criteria 1-4, unchanged. That means the gates; CG at most 300
  iterations on every L0-L2 solve; A1 at most 0.008; A2 at most 0.040 K; A4 at most 0.40 K on the cases
  and at most 0.25 K on the dev-layout dies; and every E009 finest solve within 217.6 GB, with fresh layouts
  at 1.5 x the larger dev layout. All of it is measured at level 2 on all six cases and both dev layouts.

  - Choice: the cheapest eligible candidate by E009 finest-level peak memory.


  (2) Problems, as in T0207:

  - Cases 1a, 1b, 2 and 3 and the N-layer DBC case in box-stack mode, and the manufactured case in layout
  mode, all with O006''s frozen references (check the sha256 befc5efa... and ca05847b... first).

  - Dev seed 20261101: side_by_side with dies_per_switch = 6 and u_shaped with dies_per_switch = 2. Assert
  the E006 fingerprints. Use no other seed, no fresh layouts and no data/holdout.

  - Calibrated operating point (hottest die 60 +/- 1 K above 65 C coolant, h = 5000) and k(T).

  Record per point and per die what T0207 recorded:

  - the three level values, |T - T_ref|, scaled error, gci_capped (floor 1e-3 K), branch, p_obs, d1 and
  d2;

  - the stencil;

  - argmax_xyz per level and the move count;

  - a constant-k column;

  - node_count_ratio per case;

  - cg_max_per_level for every case and layout.

  As a diagnostic only (not eligibility), also record the three-level GCI of each die''s value at a fixed
  persistent node, the die-centroid node. This separates argmax movement from non-convergence (T0207 alternative
  explanation 3).


  (3) Run under the T0207/T0225 local memory rule. Add a --full mode. Write its burst command, scripts/burst_gcp.sh
  --cmd "uv run python research/scripts/o007_dev_study2.py --full" research/o007_dev2, to research/o007_dev2/plan.json
  as burst_command; the mode ends by running --report. Cached T0225 probe solves may be reused only where
  the grid is asserted line-identical.


  (4) --report is deterministic. It applies the pre-registered rule to the cached solves and writes dev_study.json
  and frozen_config.json.

  - frozen_config.json keeps T0207''s keys (element_order, h0_m, near_margin_m, dz_max_m, nz_min, mandatory_lines,
  quadrature, linear_rtol, picard_tol_K, levels, feasible, rationale) and adds edge_grading {first_offset_m,
  ratio, max_offset_m, min_gap_fraction}.

  - feasible is true only when every criterion is measured at level 2.

  - Before the founder''s burst, the expected state is feasible: false, with levels_run showing what is
  missing. That is a valid completion, not a failure.


  (5) Write an E009 cost table covering every scikit-fem solve, plus the FV L2 levels 1-3 cost from T0204''s
  preview: peak memory, CPU-hours and a recommended timeout. The note also records the dev A1/A2/A4 values
  for E009''s K1/K2 regression guard. Label every post-data change as such.'
