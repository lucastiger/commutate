id: T0229
objective: O007
title: 'E009 design: draft spec and runner (scikit-fem at the frozen graded rule against O006''s frozen
  references, and against the L2 at levels 1-3 on five layouts; A1-A4, K1/K2, F1-F5)'
type: design_experiment
agent: scientist
status: proposed
depends_on:
- T0227
- T0228
description: 'Replaces T0208 for path (a) (I0115, I0118). Carries over the I0110 amendment and the I0099
  F5 mechanism.


  Start only if research/o007_dev2/frozen_config.json has feasible: true, with every case and dev layout
  measured at levels 0-2 (n2 plus its founder burst). Otherwise stop and report; do not design around
  an infeasible or provisional configuration.


  Write experiments/runners/e009_run.py and experiments/drafts/E009.yaml. Reuse E006''s machinery by import
  from e006_run.py, e006_series.py and e006_mms.py, all unchanged: load_refs, series_checks, mms_checks,
  Checks, Stats, dev_layouts, fresh_layouts and preflight. Swap the roles: scikit-fem is under test and
  the L2 is the cross-check. Every scikit-fem solve goes through production thermal_fem, with a GridRule
  built from the frozen config, including edge_grading=(first_offset_m, ratio, max_offset_m, min_gap_fraction).
  Use no research-side grid emulation.


  Config:

  - fem_rule copied verbatim from research/o007_dev2/frozen_config.json (the done-check tests equality);

  - the reference paths and sha256 values (befc5efa..., ca05847b...);

  - gci_floor_K 1e-3, energy_tol 1e-6, picard_tol_K 1e-4;

  - coolant 338.15 K, h 5000, target rise 60 K with operating_point_tol 1 K;

  - the dev seed and the two dev fingerprints;

  - l2_levels [1, 2, 3], f5_max_K 0.25;

  - the dev-study A1/A2/A4 values from research/notes/o007-dev-study2.md, recorded at freeze;

  - sealed_seed true;

  - honest cpu_hours_est and timeout_min from n2''s E009 cost table and T0204''s L2 preview.


  Rows:

  - Case rows (kind=case, is_finest): T_fem, T_ref, case_scale, fem_lv0..fem_lv2, d1, d2, p_obs, a4_branch,
  a non-asymptotic flag (p_obs outside [0.5, 2]), the stencil per level, and dT_const_k. Box-stack mandatory
  lines come from the frozen references; the manufactured points are nodes.

  - Crosscheck rows (kind=crosscheck, is_finest), one per die of the five layouts: the two dev layouts
  plus the first DRC-valid layout per family from E009''s sealed seed. Columns: fem_lv0..2, l2_lv1..3,
  both GCIs and branches, convergence directions with a same_side flag, layout_set (dev or fresh), the
  Tj-max node per level and its move count, power_w, calibration rise, dT_const_k and its A3 ratio against
  the L2.

  - Power is calibrated per layout on scikit-fem level 0, then used unchanged by both solvers on every
  grid.

  - Every row records, for each of its three grid solves, cg_max_iterations and linear_rel_residual_max
  (thermal_fem meta, T0222; the L2''s too where it reports them).


  Metrics and recompute entries, exactly as the objective states:

  - max_case_scaled_err: max_scaled_abs_err, T_fem against T_ref, scale case_scale, where kind=case and
  is_finest;

  - max_abs_err_K: max_abs_err on the same rows;

  - max_l2_consistency: max_gci_consistency with pred_levels [fem_lv0, fem_lv1, fem_lv2], ref_levels [l2_lv1,
  l2_lv2, l2_lv3], floor 0.001 and ref_gci_cap 0.25, where kind=crosscheck. The cap is F5 (founder I0099):
  an F5 failure gives +inf, so A3 is not met, with no redraw.

  - max_conservative_gci_K: max_gci_capped with levels [fem_lv0, fem_lv1, fem_lv2], floor 0.001, where
  is_finest.

  Secondary metrics: A3 and A4 on the fresh and the dev subsets, the constant-k A3 ratio, F5 per die,
  n_oscillatory, n_non_asymptotic, n_same_side, and the count of solves above 300 CG iterations. Null
  baseline: dT_const_k for A1/A2 (F3).


  Gated sanity checks:

  - F1: reference_sha256, series_converged, case3_printed_values, nlayer_reduces_to_two_layer, mms_numeric_check;

  - node_persistence (stencils reported);

  - node_count_growth (8 +/- 15 % per level);

  - constant_refinement_ratio (x, y and z, both solvers);

  - energy_balance (manufactured case also against 64.648 W);

  - picard_converged, operating_point, layout_fingerprints (F4);

  - linear_solver_headroom: no solve feeding a reported value has cg_hit_maxiter True (I0110).

  F5 must NOT be a gated check.


  Also:

  - code_under_test: thermal_fem.py, thermal_fv.py, thermal_layout.py, geometry/stack.py, e006_series.py,
  e006_mms.py and e009_run.py;

  - a memory preflight per solve (FV at 1500 B/cell, scikit-fem at n2''s measured bytes per DOF);

  - a --smoke mode on coarsened rules that uses a non-sealed dev seed for its ''fresh'' layouts.

  State in research/notes/o007-e009-design.md which dev values were measured and which extrapolated.'
