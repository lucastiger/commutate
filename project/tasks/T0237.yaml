description: 'Founder I0124 (c), step 3. Start only if research/o007_sliver/discriminator.json has verdict
  ''slivers'' and n2 is merged; otherwise stop and report. This study replaces T0228''s infeasible freeze.
  Write research/scripts/o007_dev_study3.py, reusing o007_dev_study2.py by import (Runner2, worker, memory
  gate, reuse logic, report and e009_table machinery). Outputs go under research/o007_dev3/. Make no production
  code change.


  (1) Pre-registration. Write section 0 of research/notes/o007-dev-study3.md and commit it before any
  solve; only grid construction is allowed beforehand. Record the hash in dev_study.json as preregistration_commit.
  Section 0 fixes:

  - One candidate, a_q1h4_graded_sp: exactly T0228''s candidate 1 (research/o007_dev2/frozen_config.json)
  plus sliver_policy = benchmarks/o007_sliver_grids.json recommended_sliver_policy, copied verbatim with
  no tuning.

  - Eligibility: T0228 note sec. 0.2 criteria 1-4, unchanged. That means the gates; CG at most 300 on
  every L0-L2 solve, the calibration and constant-k solves included (founder I0124: keep the 300 rule);
  A1 at most 0.008; A2 at most 0.040 K; A4 at most 0.40 K on the cases and 0.25 K on the dev-layout dies;
  every E009 finest solve at most 217.6 GB, fresh layouts at 1.5 x the larger dev layout. All measured
  at level 2 on all six cases and both dev layouts. feasible is true only if every criterion is measured
  at L2 and holds.

  - Reuse. A cached T0228 or T0225 solve is reused only where the production grid under the new rule equals
  the cached grid line for line (np.array_equal on the x, y and z lines and the material map) at that
  level, and a fresh L0 re-solve under current code reproduces the cached L0 values within 1e-9 K. Otherwise
  it is re-solved.


  (2) Problems, records and checks are as T0228. Also record, per case, every snap: requested, used, distance
  and the reported point it moves. Keep the die-centroid-node diagnostic GCI.


  (3) Local runs follow T0228''s memory rule. --full mode with burst_command ''scripts/burst_gcp.sh --cmd
  "uv run python research/scripts/o007_dev_study3.py --full" research/o007_dev3'' in research/o007_dev3/plan.json,
  listing which L2 solves the burst must run and which are reused.


  (4) --report is deterministic. It writes dev_study.json, with the same keys as T0228, and frozen_config.json,
  with T0228''s keys (cg_eligibility_limit 300 included) plus sliver_policy (list). Before the founder''s
  burst the expected state is feasible: false with levels_missing. That is a valid completion.


  (5) Update the E009 cost table. Record the dev A1/A2/A4 values at L2 for E009''s K1/K2 regression guard.
  Label every post-data change as such.'
