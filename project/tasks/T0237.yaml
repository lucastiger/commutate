definition_of_done:
- cmd: null
  exists: research/o007_dev3/frozen_config.json
  timeout_s: 60
- cmd: uv run python -c "import json; from moduleforge.solvers import thermal_fem as F; c = json.load(open('research/o007_dev3/frozen_config.json'));
    b = json.load(open('benchmarks/o007_sliver_grids.json')); g = c['edge_grading']; assert c['levels']
    == [0, 1, 2] and c['picard_tol_K'] == 1e-4 and c['cg_eligibility_limit'] == 300 and isinstance(c['feasible'],
    bool) and c['element_order'] in (1, 2); assert list(c['sliver_policy']) == list(b['recommended_sliver_policy']);
    assert set(g) == {'first_offset_m', 'ratio', 'max_offset_m', 'min_gap_fraction'}; assert all(k in
    c for k in ('h0_m', 'near_margin_m', 'dz_max_m', 'nz_min', 'mandatory_lines', 'quadrature', 'linear_rtol',
    'rationale')); F.GridRule(h0=c['h0_m'], near_margin=c['near_margin_m'], dz_max=c['dz_max_m'], element_order=c['element_order'],
    edge_grading=(g['first_offset_m'], g['ratio'], g['max_offset_m'], g['min_gap_fraction']), sliver_policy=tuple(c['sliver_policy']))"
  exists: null
  timeout_s: 120
- cmd: uv run python -c "import json; d = json.load(open('research/o007_dev3/dev_study.json')); c = json.load(open('research/o007_dev3/frozen_config.json'));
    ch = d['chosen']; cs, ls = ch['cases'], ch['layouts']; assert {'case1a', 'case1b', 'case2', 'case3',
    'nlayer_dbc', 'mms'} <= set(cs) and {'side_by_side_6', 'u_shaped_2'} <= set(ls); assert all('node_count_ratio'
    in v and 'snaps' in v for v in cs.values()); allv = list(cs.values()) + list(ls.values()); assert
    all(len(v['levels_run']) >= 2 and len(v['cg_max_per_level']) == len(v['levels_run']) for v in allv);
    assert all(len(x['argmax_xyz']) == len(ls[k]['levels_run']) and 'gci_K' in x for k in ('side_by_side_6',
    'u_shaped_2') for x in ls[k]['dies']); assert (not c['feasible']) or all(v['levels_run'] == [0, 1,
    2] and max(v['cg_max_per_level']) <= 300 for v in allv); assert len(d['preregistration_commit']) >=
    7"
  exists: null
  timeout_s: 120
- cmd: uv run python -c "import subprocess, sys; f = 'research/o007_dev3/frozen_config.json'; a = open(f).read();
    subprocess.run([sys.executable, 'research/scripts/o007_dev_study3.py', '--report'], check=True); assert
    open(f).read() == a, 'report is not deterministic'"
  exists: null
  timeout_s: 900
- cmd: uv run python -c "import json; p = json.load(open('research/o007_dev3/plan.json')); assert 'o007_dev_study3.py
    --full' in p['burst_command']"
  exists: null
  timeout_s: 60
- cmd: null
  exists: research/notes/o007-dev-study3.md
  timeout_s: 60
- cmd: uv run ruff check research/scripts/o007_dev_study3.py
  exists: null
  timeout_s: 300
