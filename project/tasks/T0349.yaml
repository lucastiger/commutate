  report:
    summary: 'EV-O003-01 is INVALID for two independent reasons. The decisive one is experimental: the
      F1(b) planted-headroom control failed on 2D_Case_2R, the only counted reference (2D_Case_6 was excluded
      with TwinError, as predicted). The control''s best candidate has L_sub = 1.0755 × L_sub(twin W);
      passing needed ≤ 1.0172 × W. The main search''s best is also 6.1 % above W. The driver and the check
      are computed correctly: I recomputed every number from the raw checkpoints and they match to 1e-12.
      The cause is that the frozen generator sampler plus the 20,000-draw random screen cannot reach the
      level of 2R''s own design. W is a valid, DRC-clean point of the parameter space, but `_sample` cannot
      produce it: it builds slots only from a column''s inner edge outward, while W''s DC+ and DC− slots
      straddle their columns. W rewritten in the sampler''s form is DRC-clean at L1 = 0.998 × W, but it
      needs a PHASE column edge at 47 mm that the sampler cannot draw (largest drawn value 45.5 mm). With
      that edge at 45.5 mm the layout gives L1 = 1.018 × W, which still beats all 40,000 drawn candidates
      (best +3.05 % main, +6.2 % control). So the sampler''s reach near W and its thin low-inductance
      tail both stand in the way. This is the outcome the frozen O003 F1(b) text anticipates ("if the
      reference is near-optimal, (b) may fail … INVALID"). The control did its job: K1 would otherwise
      have fired a kill (headroom_max_hi_ind 0 < 0.10, search levelled) from a search that never reached
      the reference designer''s level. The second problem is an independent implementation/plumbing defect.
      evaluation_report.json is intact (sha256 matches) but sits at work/evaluation_report.json under
      a bare artifact name. The evaluator only looks at the run-dir root or the main checkout''s .mfos/artifacts,
      and the burst script never fetched the VM''s artifact store. E008''s runner has the same pattern.
      Notes: research/diagnoses/T0349.md. Commands run: reads and inline python3 (exit 0); sampler_support.py
      smoke and full runs (0); recompute_f1b.py (0); attached_twin.py (0); ruff (1 for 6 style errors,
      then 0 after fixes, outputs re-verified identical); uv run mfos gate --fast (0, all gates passed).
      Peak memory under 100 MB.'
