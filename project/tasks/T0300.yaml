  failure_output: '- [blocker] Regression: a side column with any strip copper beyond it is reclassified
    as a ''neck'' and brings back the T0297 bias: The new rule in `_band_copper` takes a crossing u-range
    for a neck when `a0 > u_min` and `a1 < u_max`, where `u_min`/`u_max` are the bounds of the whole strip.
    That is a global test. Any copper of the net inside the band''s v-range on the far side of a side
    column puts that column strictly inside the bounds, so the column is kept as band copper. Examples
    are a 1 x 0.5 mm nub, a column 2 mm wider inside the band than at the probe line, or a disconnected
    island of the net. The kept column then pulls the minimum off the step exactly as in T0297 finding
    0. The pre-change code gives the correct boundary (13) on every one of these geometries, so the change
    itself causes the regression. It contradicts the docstring''s guarantee that ''a column of any width
    does not move the minimum (T0297 finding 0)''. The only restriction the docstring lists is the side
    column lying inside [lo, hi]. This matters for the decision: the twin is applied to the judged references
    of O003 (customer NDA layouts, or PowerSynth 2D_Case_2R/6). Those are not generator-built layouts,
    so irregular column outlines are in scope, and a wrong split changes the twin''s slot rectangles.

    - [major] Flush end-necks (L-junctions) still flatten the L-band to a rectangle; the neck tests''
    flush positions do not tell the old and new code apart: A neck joining the band''s lower edge flush
    with the u-end of the wider slot is still classified as a side column. For example u 30-40 or 28-40
    at v 0-10, which lies under the die slot and beside the narrower landing slot. Removing it across
    the full [lo, hi] notches the die slot back to the landing slot''s u-extent, so the band turns rectangular,
    every candidate ties, and the midpoint 14.5 wins instead of 13. This is the same failure mode as T0299
    finding 0, and the docstring does not list it as a restriction. In `test_best_split_keeps_t_junction_necks_from_below_and_above`,
    the positions (0,3), (5,10) and (35,40) also pass under the pre-change code: the flush ones are removed
    as columns and survive only because they are narrower than the 10 mm gap. (35,40) from above (v 20-30)
