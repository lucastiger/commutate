description: 'Make the thermal L2''s own discretisation estimate (meta[''solver_tol'']) use O006''s A4
  estimator, so that

  code_must_match carries the verified estimator to O003 (O006 scope_in and decision_if_pass, D0013 addendum).


  (1) src/moduleforge/solvers/thermal_layout.py: gci_three_grid(f_coarse, f_mid, f_fine, r=2) implements
  exactly the

  branches of O006''s A4 (project/objectives/O006/objective.yaml; the reference implementation is

  tools/mfos/mfos/metrics.py gci_capped, as amended by D0013 addendum 2): d1 = f_mid - f_coarse, d2 =
  f_fine - f_mid,

  each set to 0 when below floor (keyword argument, default 1e-3 K: ten times the Picard tolerance), rho
  = d2/d1;

  d1 = d2 = 0 -> 0; |rho| >= 1 or d1 = 0 < |d2| -> +inf; -1 < rho < 0 -> 3 max(|d1|, |d2|) (Roache''s
  factor for

  oscillatory sequences); 0 <= rho < 1/4 -> 1.25 max(|d2|, |d1|/4);

  1/4 <= rho < 1 -> 1.25 |d2| / (2^p - 1), p = min(log2(1/rho), 1). Keep the returned dict keys (gci,
  p_obs, monotone,

  Fs, p) and add ''branch'' (''exact'', ''divergent'', ''oscillatory'', ''fast'', ''monotone''). r other
  than 2 raises ValueError

  (the frozen rule refines by 2). Product code must not import mfos: implement the rule in moduleforge
  and cite O006 A4

  and Roache (1998, ch. 5) in the docstring. Update the module docstring''s GCI paragraph and the FS_*/P_*
  constants it

  no longer uses.


  (2) src/moduleforge/solvers/thermal_fem.py: _gci uses the same rule (call thermal_layout.gci_three_grid
  or share one

  helper), so the scikit-fem cross-check reports the same estimator.


  (3) Tests (tests/unit/solvers/test_thermal_layout.py): replace the superseded-rule assertions with hand-computed

  values for every branch, including the two re-review examples: (410.0, 410.25, 410.75) -> inf, and the
  lucky grid

  (410.0, 410.3, 410.31) -> 1.25 * 0.3 / 4, the oscillatory (410.0, 410.4, 410.2) -> 3 * 0.4, and noise
  below the

  floor: (410.0, 410.4, 410.4 -/+ 4e-5) -> 1.25 * 0.4 / 4 for both signs. Add tests/unit/solvers/test_thermal_gci_matches_evaluator.py
  asserting

  gci_three_grid(..., floor=1e-3)[''gci''] == mfos.metrics.gci_capped(..., floor=1e-3) (rel 1e-12, inf
  == inf) on a grid of at least 2000

  sequences covering every branch and both signs, and that thermal_fem''s estimator agrees too. This is
  a change of the

  decided estimator (D0013), not a weakened tolerance: the old rule was shown non-conservative (T0181).


  (4) docs/thermal_model.md: the GCI section states the A4 rule and cites D0012/D0013.


  Do not touch tools/mfos (protected), O006''s objective, or any benchmark result file. The committed
  benchmark JSONs keep

  their recorded values; they are not regenerated.


  If this branch already implements the earlier rule (oscillatory 1.25, no floor), change it to the rule
  above: main''s

  mfos.metrics was amended after this task was first written, and the loop merges current main into the
  branch before

  merging.


  Review T0192 of the first attempt: compute p_obs exactly as gci_capped does (math.log2(1.0 / rho), not
  -math.log2(rho)),

  so the two are bit-identical; remove any ZeroDivisionError path the evaluator does not have; and restore
  the box

  test''s assertion that an exactly grid-independent case gives solver_tol 0 (with the 1e-3 K floor it
  does again).'
