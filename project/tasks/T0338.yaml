  report:
    status: completed
    summary: 'The sampler can now place a slot stack across split free windows, and 2D_Case_2R''s own
      topology is in its support. The dev streams I checked are unchanged. Everything is committed as
      `[T0338]`.


      **What split the region.** On 2R the fixed gate bars (GATE_LS and GATE_HS, u 7..33, v 25..35) cut
      the orientation-0 free region into v windows (7, 23) and (39, 53). The old rule needed the whole
      stack inside one window, and the smallest stack is taller than either, so every orientation-0 draw
      returned None.


      **New rule.** `_Ctx` now computes `split[o]` for each orientation. It is true when no `vwin` window
      holds the smallest possible stack: the sum of minimal slot heights and smallest gaps, minimised
      over all eight sequences. `_Ctx` also holds per-net `bands`, plus `_v_windows` and `reach`.

      - **Placement:** where `split` is true, `_place_split` puts each slot in a window of its own net,
      and die slots also stay inside their gate/Kelvin reach window. A backward pass gives each slot''s
      latest feasible start. A forward pass then draws the starts. With probability 0.7 it takes the first
      feasible start at or after the drawn gap, which jumps over the obstruction. Otherwise it draws uniformly.

      - **Slot ends:** in split orientations `limit()` also clips a slot''s u end at the net''s free region
      through `_Ctx.reach`, so slots come out narrower where a keepout or column requires it.

      - **Judges:** `build`, `_quick_ok` and the DRC are unchanged and still decide what is returned.


      **Why dev draws don''t move.** The new code is entered only where `split[o]` is true, which is exactly
      where the old rule returned None on every draw. Elsewhere the draws and their order are the old
      ones. `split` is false for both orientations of 2D_Case_4, housing70x40_gen2_0 and `halfbridge_housing_spec`
      with k=1..3. I did not enumerate every `e008_run` variant that builds a dev spec from changed rules,
      such as the `d_spec` floors or `e008_rules`. I only confirmed the split flags for the specs listed.


      **Results.**

      - **2R candidates:** generate returned 1500 DRC-clean candidates over seeds 101, 102 and 103, and
      the twin configuration (0, 0, 1, 0) was drawn 1500 times. This is the only configuration drawn:
      1028 of 1028 clean draws in the feasibility run. The other seven sequences fail on gate-wire reach,
      and orientation 1 produced no clean draw in 300 000 draws.

      - **E008 streams:** the gen2_0 main and control streams (2 × 20 000 candidates) are byte-identical
      in fingerprint and family. I did not compare 2D_Case_4 streams against the saved E008 ones. No saved
      case4 streams were present, so for 2D_Case_4 I only compared fingerprints against the parent commit,
      which matched.

      - **Feasibility script:** acceptance rate p is 3.43e-3 (99.9 % Wilson lower bound 3.11e-3). That
      is about 292 draws and 13.3 ms per candidate, roughly 8.9 minutes for 2 × 20 000 candidates. The
      chance a 20 000-candidate screen hits 20 000 consecutive failures is at most 1.7e-23, and the script
      asserts it is below 1e-6.

      - **Tests:** I added 6 tests to `tests/unit/generate/test_derivative.py`. They cover a synthetic
      housing with two gate bars, and layouts that straddle the bars and are DRC-clean. They also pin
      2D_Case_4 and the generator housing to the parent commit''s fingerprints. All 110 tests in `tests/unit/generate`
      pass.


      The notes with the feasibility output and the short paragraph are in `research/notes/e009-generator.md`.'
