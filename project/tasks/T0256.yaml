objective: O003
title: Per-net design rules, gate/Kelvin signal wires, bondability DRC and rule measurement
type: implement
agent: builder
status: done
depends_on: []
description: 'Extend DesignRules/DRC and Layout so that O003''s design-rule strictness (scope_in) can
  be stated, measured on a reference and enforced. Develop and test only on generator layouts and synthetic
  fixtures. Never read or download PowerSynth 2D_Case_2R/2D_Case_6 files or any customer data (F3).

  (a) DesignRules (src/moduleforge/drc/rules.py): add optional per-net-pair minimum spacing (pairs DC+/PHASE,
  PHASE/DC-, DC+/DC-, each with its own value, plus one value for every other net pair), and minimum width
  per net class (power nets DC+, PHASE, DC- vs other nets). The defaults must reproduce today''s behaviour
  exactly: existing tests unchanged, generate_layouts output byte-identical.

  (b) Layout (src/moduleforge/geometry/layout.py): add an optional field for gate and Kelvin-source wires
  (each with its die index, die pad name ''gate'' or ''kelvin'', and landing net) and allow a ''kelvin''
  pad in Die.pads. These wires are excluded from to_conductors(), because ideal die shorts would join
  them to the power path (scope_in). Layout.fingerprint() must cover them when present and must give unchanged
  digests for layouts without them. Record the fingerprints of generate_layouts(12, seed=0) before the
  change and assert them in a regression test under tests/regression/.

  (c) DRC check(): enforce per-pair spacing and per-class width. Bondability (scope_in): each die''s gate
  pad must be within max_gate_wire_length of the fixed gate copper, and its Kelvin pad within max_kelvin_wire_length
  of the fixed Kelvin copper. Each gate/Kelvin wire must start on its die pad and land on copper of its
  net. No gate or Kelvin wire may cross, in plan view, any wire (power or signal) of another net. Wire
  pitch applies to signal wires too.

  (d) measure_rules(layout) -> (DesignRules, record dict). It measures on a given (snapped) layout: the
  minimum gap of each power-net pair; the smallest gap over all other pairs; the minimum power-net width
  and the minimum other-net width (bisection to 1 um with the same opening test the DRC uses); the smallest
  wire pitch; die_spacing; die_edge_margin; edge_margin; the longest gate wire and the longest Kelvin
  wire. Property test: every generator layout (seeds 0..19, plus layouts with synthetic gate/Kelvin copper
  and wires) is DRC-clean under its own measured rules. Tightening any measured value by 1 um below what
  was measured must keep the layout clean, and loosening the spacing check must not be possible. Unit
  tests for each new rule, with hand-built pass and fail fixtures.'
