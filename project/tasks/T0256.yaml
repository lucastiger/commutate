  report:
    status: completed
    summary: 'Attempt 2 builds on attempt 1 (178eb740) and fixes the review''s blocker and its minor findings.
      Commit: 5747b710.


      **Blocker fixed: gate and Kelvin nets are now per switch position.** There are four nets: GATE_HS,
      GATE_LS, KELVIN_HS and KELVIN_LS. A new map, SIGNAL_NET, gives the net from the die pad and the
      die''s switch, e.g. (gate, HS) is GATE_HS. The DRC now checks three things against the die''s own
      switch only:

      - each signal wire must carry its die''s own net;

      - each wire must land on copper of that net;

      - bondability is measured to that net''s copper alone, so the other switch''s copper no longer counts.


      The existing rule that each net''s copper is one connected island now accepts separate HS and LS
      islands. The new hand-built fixture (four separate signal islands, each wire on its own switch''s
      copper) is clean under the default rules. A test builds a gate or Kelvin island shared by HS and
      LS, which is a short, and tries all 12 combinations of island net and wire nets. Every combination
      is flagged. Other tests show that a die cannot count as bondable through the other switch''s copper,
      and that an HS gate wire landing on LS gate copper is flagged.


      **Minor findings addressed:**

      - **Mixed pad sets:** bondability skips dies that lack the pad. If a die has the pad but the layout
      has no copper of its net, `measure_rules` leaves that limit unset and records the reason in `record[''signal_unmeasured'']`.
      Tests cover both cases.

      - **Wire pitch:** `measure_rules` no longer sets `wire_pitch_diameters` to 0. It sets it to the
      smallest measured ratio of pitch to wire diameter. When the tightest pitch is between thin signal
      wires, thick power wires keep the layout''s own ratio. A test shows a layout passes on pitch alone
      but fails on the ratio.

      - **Fingerprint coverage:** the fingerprint docstring now lists `SignalWire.loop_height` as not
      covered. The pin, swap and rounding tables in `test_layout.py` now include `SignalWire`. The `g2`
      test fixture gained gate wires, and all existing pins still run on it.


      **Unchanged from main:**

      - The fingerprints of `generate_layouts(12, seed=0)`. I recomputed them with main''s code (exported
      with `git archive` to a temp dir); they match the regression test byte for byte.

      - `to_conductors()` copper handling. Attempt 1 had also dropped gate/Kelvin copper from the model;
      I reverted that, so only the signal wires are left out, as the task says. Signal copper stays in
      as floating copper, as main did and as the O006 pilot P3 did for 2D_Case_4.


      **Property tests:** all hold under the measured rules, with each value 1 um on the safe side. Pushing
      any value past the layout''s own feature (1 um, 3 um for widths, 1e-5 relative for the pitch ratio)
      makes the layout fail. They run on:

      - generator seeds 0..19;

      - 20 random variants of the hand-built fixture;

      - 15 generator layouts with synthetic strips for all four signal nets and 126 kept wires, covering
      every net.


      The test file has 97 tests; the DoD pytest set runs 325 and the fast unit suite 636. Nothing read
      PowerSynth 2D_Case_2R/2D_Case_6, customer data or `data/holdout`.'
