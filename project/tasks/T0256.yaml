    any other label, and the existing net_split rule requires each net''s copper to be one connected island.
    In a half-bridge the HS gate/Kelvin source (Kelvin at PHASE potential) and the LS gate/Kelvin source
    (Kelvin at DC- potential) are different electrical nets on separate copper. The 2D_Case_4 reconstruction
    notes, for example, list four separate signal traces: T1 and T2 by the LS dies, T7 and T8 by the HS
    dies. Three consequences follow.

    (a) The test fixture lands the HS and LS Kelvin wires on the same KELVIN strip, which electrically
    shorts PHASE to DC-, and lands both gate wires on one GATE strip. The DRC reports this layout clean,
    and test_fixture_is_clean_under_defaults asserts it.

    (b) An electrically correct layout with separate HS-gate and LS-gate copper fails net_split. So no
    faithful reconstruction of a half-bridge reference with gate/Kelvin copper (2D_Case_2R, 2D_Case_6,
    customer references) can be DRC-clean. The generator filters candidates with `if not check(lay)`,
    so it cannot honour such a reference either.

