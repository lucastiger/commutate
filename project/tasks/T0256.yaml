    - 'Signal copper stays in to_conductors(): attempt 1 had excluded it, and I reverted that to main''s
      behaviour because the task only says the wires are excluded. So gate/Kelvin copper is modelled as
      floating copper, as in O006 pilot P3 (M3). Whether it should be in the l2_layout model is a planner
      or founder decision.'
    - The existing net_split rule (each net one connected island) still applies to the signal nets. A
      reference with several separate copper islands for one signal net, for example per-die gate traces
      joined outside the substrate, would fail DRC. The 2D_Case_4 notes have one island per net; I did
      not inspect 2D_Case_2R or 2D_Case_6 (F3).
    - Bondability compares the plan distance from the pad to the copper, as the objective words it. It
      ignores the bond-foot and landing margins and the loop. When signal wires are drawn, the per-wire
      length limit closes that gap; for a pad with no wire the check stays optimistic.
    - When a die has a gate or Kelvin pad but the layout has no copper of its net, measure_rules leaves
      that limit unset and records why in record['signal_unmeasured']. Whoever writes E008's spec must
      read that field, or the rule is silently not enforced for that reference.
    - Signal wires are not checked for diameter range, landing keep-out from dies and terminals, or whether
      their pads lie on the die (the review's note). None of these is in the task.
    - 'The measured wire_pitch_diameters is stricter than ''the reference''s smallest wire pitch'' alone,
      by design (review minor #4). On a sparse reference with mixed diameters it could cut the candidate
      pool more than the pitch rule would.'
