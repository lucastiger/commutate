- cmd: 'uv run python -c "import sys; sys.path.insert(0, ''research/scripts''); import numpy as np, o007_probe
    as P, o007_dev_study as DS; from moduleforge.solvers import thermal_fem as F; ser = DS.load_refs()[0];
    r = F.GridRule(h0=4e-3, nz={}, default_nz=1, zrefine=True, near_margin=2e-3, element_order=1, dz_max=1e-3,
    edge_grading=(1e-4, 2.5, 4e-3, 0.5)); B = {p: DS.box_problem(ser, p) for p in (''nlayer_dbc'', ''case1a'',
    ''case1b'', ''case2'', ''case3'')}; G = lambda p, lv: F.box_stack_grid(B[p][''a''], B[p][''b''], B[p][''layers''],
    B[p][''h''], B[p][''Tc''], B[p][''srcs''], rule=r, level=lv, extra_lines=(list(B[p][''extra''][0]),
    list(B[p][''extra''][1]), None)); same = lambda u, v: u.shape == v.shape and np.allclose(u, v, rtol=0.0,
    atol=1e-12); bad = [(p, lv) for p in B for lv in (0, 1) if not all(same(getattr(G(p, lv), a), getattr(P.box_grid(''a_q1h4_graded'',
    p, lv, ser), a)) for a in ''xyz'')]; assert not bad, bad; print(''box-stack grids identical to the
    T0225 emulation'')"'
  exists: null
  timeout_s: 900
- cmd: 'uv run python -c "import sys; sys.path.insert(0, ''research/scripts''); import o007_dev_study
    as DS; from moduleforge.solvers import thermal_fem as F; r = F.GridRule(h0=4e-3, nz={}, default_nz=1,
    zrefine=True, near_margin=2e-3, element_order=1, dz_max=1e-3, edge_grading=(1e-4, 2.5, 4e-3, 0.5));
    r0 = F.GridRule(h0=4e-3, nz={}, default_nz=1, zrefine=True, near_margin=2e-3, element_order=1, dz_max=1e-3);
    n = lambda g: g.x.size * g.y.size * g.z.size; L = {k: DS.dev_layout(k) for k in (''side_by_side_6'',
    ''u_shaped_2'')}; q = [n(F.layout_grid(L[k], 1.0, DS.H_OP, DS.COOLANT_K, r, 1)) / n(F.layout_grid(L[k],
    1.0, DS.H_OP, DS.COOLANT_K, r, 0)) for k in L]; assert all(6.8 <= v <= 9.2 for v in q), q; assert
    all(F.layout_grid(L[k], 1.0, DS.H_OP, DS.COOLANT_K, r, 0).x.size > F.layout_grid(L[k], 1.0, DS.H_OP,
    DS.COOLANT_K, r0, 0).x.size for k in L); print(q)"'
