rationale: scope_in requires the one frozen grid rule to come from thermal_fem's own code, for E009 and
  for O003. T0207 identified the N-layer source edges as the binding case (A2/K2), and T0225 showed that
  grading fixes it (provisional_go). The line-for-line check against the emulation makes T0225's measured
  N-layer values transfer to production.
