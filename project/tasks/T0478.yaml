    - 'The mesh parameter follows the existing design in which `l1` is passed in: `l1_hmax_mm` applies
      only when `l1` is None, and passing both raises ValueError. Today''s runner passes `twin._l1` explicitly,
      so a 2 mm run means changing the runner to pass None plus `l1_hmax_mm` (or `twin.l1_screen(2.0)`).
      That runner change is outside my write scope.'
    - 'Coupled retries apply only to single and line moves, as the packet asks (not to reach jumps, joint
      moves or perturbations). They go one rule deep: if the retry fails on a second, different rule,
      it is not chained further. They also move partners only in the same direction as the original move.
      All four 2R walls are covered within those limits.'
