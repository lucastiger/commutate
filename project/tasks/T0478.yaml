    status: completed
    summary: "T0478 is done and committed as 134f87a1. Every DoD command passes: the optimize/generate\
      \ tests (323 passed), ruff, and the fast gate (run twice, the second time after the commit).\n\n\
      **What changed (all new behaviour is off by default):**\n- **Line moves (`local.py`):** `LocalConfig.line_steps`\
      \ offers each die-row parameter at ±n grid steps every iteration. `line_search_stuck` line-searches\
      \ every movable parameter before the random perturbation.\n- **Coupled moves:** with `coupled_moves`,\
      \ a single or line move that `in_domain` rejects for a slot free-end or die-row rule is retried\
      \ with the other parameters that rule binds. The new `rule_binds` reads those parameters off the\
      \ replay's own inequalities, so no case is hard-coded. The retry tries the same displacement first\
      \ (smallest group of partners first), then up to `coupled_extra_steps` further grid steps. The first\
      \ valid retry replaces the rejected move, so it costs at most one L1 evaluation. A new `neighbourhood()`\
      \ function returns the candidate set exactly as the search builds it.\n- **Config hash:** the four\
      \ new fields enter `LocalConfig.hash()` only when they are not at their defaults. The default config\
      \ still hashes to `bdefe640d8cac683`, and a test pins that.\n- **L1 mesh as a parameter:** `twin._l1`\
      \ takes `hmax_mm` (default 4.0). New helpers `twin.l1_screen` and `twin.resolve_l1` build the screen\
      \ at a given mesh. `l1_hmax_mm` is now accepted by `proxy_descent`, `proxy_alone`, `degrade_draw`\
      \ and `draw_degradations` in `control.py`, and by `LocalSolvers`. `LocalSolvers` drives the search's\
      \ default score and ablation (c). In each case the mesh applies when no `l1` callable is passed.\
      \ A non-default mesh gets its own checkpoint keys (`l1@2mm`), so a work directory never mixes meshes.\n\
      \n**What the tests check:**\n- **Bit-identity:** with the default config, three runs match digests\
      \ I recorded from the code before any change: two on the 70x40 housing (one goes through a perturbation)\
      \ and one on the 2R twin. The same holds with the new fields passed explicitly at their defaults.\n\
      - **Determinism:** with all new moves on, two runs with the same seed are identical and a different\
      \ seed differs.\n- **The walls at the 2R end points** (vectors embedded, each rebuild checked against\
      \ its recorded fingerprint):\n  - Draws 0 and 4: the new neighbour set reaches `row_LS_u0` below\
      \ 14.0 mm, with `slot1_u0` moved alongside. Today's set does not.\n  - Draws 2 and 3: the new set\
      \ contains the (`col_PHASE_u0`, `row_HS_u0`, `slot2_u1`) −0.5 mm triple. Today's set has no downward\
      \ `col_PHASE_u0` move.\n- **A search past the wall:** from draw 4, with a score that rewards only\
      \ `row_LS_u0`, the default search never gets below 14.0 mm and the new one reaches 11.0 mm.\n- **Validity:**\
      \ every layout the new moves return passes `in_domain` and is DRC-clean under the reference's rules.\
      \ Across 244 rejected moves on the u axis, the moved parameter was always among the ones `rule_binds`\
      \ reports.\n- **Further grid steps:** a constructed case on the 70x40 housing with 3 dies per switch\
      \ shows that path working.\n- **L1 mesh:** at 4 mm, `twin._l1(W*)` equals today's 1.0206874855971848e-08\
      \ exactly. At 2 mm it differs by −0.95 % and matches a direct `loop_inductance` call.\n\n**Not included:**\
      \ E011's runner (`experiments/runners/`) is outside my write scope, so it still uses today's defaults.\
      \ Turning the new moves or the 2 mm screen on there is a later step and a founder decision. Changing\
      \ `local.py`, `control.py` and `twin.py` also changes their recorded code hashes, which the diagnosis\
      \ already expected."
