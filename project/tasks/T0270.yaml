    summary: 'Done and committed as 63bd6773. Signal-to-power spacing is now its own DRC rule class, one
      value per power net: `spacing_signal_dcp`, `spacing_signal_phase` and `spacing_signal_dcm` on `DesignRules`.
      `measure_rules` measures them from the reference. `spacing_other` now covers only the remaining
      pairs (signal-signal, and split copper of one net). When a signal-power field is unset it falls
      back to `spacing_other`, then `min_spacing`, so default verdicts don''t change. A new test shows
      a gate trace 1.0 mm from DC+ fails against the reference''s 2.0 mm signal-to-DC+ gap. Signal wires
      now get a diameter range check (`signal_wire_diameter`) and a length range check, with `min/max_signal_wire_diameter`
      and `min/max_signal_wire_length`. `measure_rules` reports the reference''s own ranges, and it no
      longer divides by a zero diameter (tested with zero and negative diameters). The fingerprint hashes
      `int(sw.die)`, so `np.int64(0)` and `0` give the same digest. `check()` builds the shrunk outline
      once instead of once per trace.'
