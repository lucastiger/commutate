  \ a signal net (GATE_HS, GATE_LS, KELVIN_HS, KELVIN_LS) and a power net (DC+, PHASE,\n   DC-) is its\
  \ own rule class, measured from the reference as its minimum signal-to-power gap (per power net if the\n\
  \   reference distinguishes them); spacing_other keeps only the remaining pairs. measure_rules reports\
  \ it; tests with\n   hand-computed layouts show that a gate trace closer to DC+ copper than the reference's\
  \ signal-to-power gap fails.\n2. Signal wires: diameter and length range checks as for power wires (from\
  \ the reference's measured signal wires);\n   measure_rules handles layouts with signal wires without\
  \ crashing and returns physical values (tests).\n3. T0267's notes: make the fingerprint independent\
  \ of the Python type of SignalWire.die; skip the redundant work in\n   check() if trivial.\nKeep every\
  \ existing test passing; do not weaken any test or tolerance."
