description: 'Draft experiments/drafts/E008.yaml and experiments/runners/e008_run.py on mfos.evidence.ExperimentRun,
  following experiments/specs/E009.yaml and experiments/runners/e009_run.py.

  The spec carries:

  - requires_passed [O007] and code_must_match on src/moduleforge/solvers/thermal_fem.py with O007 (sha256
  a216d5fe..., the bytes EV-O007-01 evaluated); l2_layout as code_under_test without code_must_match (D0009).

  - GridRule key for key from research/o007_dev3/frozen_config.json (sha256 0226b770...0e9a).

  - Sealed seeds for candidate generation and for the F1(b) control.

  - A freeze block with sha256 of the derivative generator, twin and degradation rule, search driver,
  snapping rule, DRC and stack.py (F3).

  - The operating-point rule: P_ref from level-0 solves of the reconstruction, hottest die 60 +/- 1 K
  over 65 C coolant, h = 5000.

  - The L_term rule (7 nH public / customer vault value), the admissibility fields, and the reference-set
  rule of D0010.

  - Rows exactly as research/o003/e008_row_contract.md (n6) and the objective notes list them. F5: no
  geometry in rows.

  - Recompute entries for headroom_min_lo and headroom_max_hi_ind, the twin null column (kind column),
  and the reported L1-only null.

  - Gated sanity checks: F1(a1), (a2), (b), (c); F6(a) own three grids with 8x (+/-15 %) node growth;
  F6(b) GridRule and code hashes; F6(c) energy balance 1e-6 and Picard 1e-4 K; F6(d) 60 +/- 1 K calibration;
  F6(e) the stack-type spot check (max_gci_consistency, scikit-fem levels 0-2 against thermal_fv levels
  1-3, cap 0.25 K, floor 1e-3, <= 1 on every die, on one AlN reference).

  The runner drives src/moduleforge/optimize/search.py with real solvers. Band levels: per-process l2_layout
  overrides as research/scripts/o006_p3_em_convergence.py does. Every l2_layout and thermal solve runs
  in a subprocess with checkpointing.

  Modes:

  - --selftest: fake solvers, full row assembly and recompute with research/o003/headroom_metrics.py.

  - --verify-freeze: recomputes the frozen hashes, exit 0 iff all match.

  - --dev: development geometry only, generator housings and 2D_Case_4, never a judged reference. It produces
  experiments/drafts/E008.dev_rows.json, including the pre-registration band check (e_R on at least 4
  twin-versus-random-candidate pairs) and Case 4''s twin gates.

  - --plan: lists every solve with memory and time estimates.

  Run --dev locally only at levels that fit 9 GB: 0.5 mm EM, thermal levels 0-1, reduced candidate budget,
  marked as smoke rows. Write the full-fidelity dev run (0.25 mm, thermal level 2) as a script for the
  founder''s burst VM; agents never launch VMs.

  Record cpu_hours_est and the peak memory per reference in the spec, from P3''s measured timings (Case
  4: 0.25 mm about 2 h wall, about 16 GB per solve) scaled by the --plan unknown counts. State whether
  320 CPU-hours and 2026-11-24 are reachable, and if not, which budget item breaks. Do not load 2D_Case_2R,
  2D_Case_6 or customer data.


  FOUNDER CONSTRAINT (2026-11-09): burst compute is a Google Cloud free-trial account capped at 8 vCPUs
  running at once (one 8-vCPU VM at a time; memory via N2D extended memory up to ~150+ GB). The founder
  declined a paid upgrade. E008''s cost estimate and run plan must fit this cap: per-solve wall time and
  memory on 8 vCPUs, total VM-hours and $ against the remaining free credit, and the resulting E008 date.
  State plainly if the 2026-11-24 date is unreachable and what the earliest date is.


  RUN PLAN (founder, 2026-11-09; replaces the one-solve-at-a-time premise above). P3''s 0.25 mm VM solves
  (research/o006_p3/solves/*__lat0.25.json) logged ~62,000-64,000 CPU-s for ~7,000 s wall: about 9 busy
  cores per solve, two solves on an n2-highmem-32. Linux numpy''s OpenBLAS starts one busy-waiting thread
  per vCPU in every process. Pinned to one thread, the 0.5 mm Case 4 base solve gives L equal to P3''s
  to 8e-15 with the same GMRES iterations (founder session, Mac). The runner therefore: (1) starts every
  l2_layout and thermal subprocess with OPENBLAS_NUM_THREADS, OMP_NUM_THREADS and MKL_NUM_THREADS set,
  and MF_L2_FFT_WORKERS, at the per-solve thread count research/l2_thread_calib/summary.txt found best
  (1 if that file is absent), and records them in each solve''s provenance; (2) runs solves concurrently
  on the one 8-vCPU VM, as many as fit in 0.85 x RAM by their --plan peak estimates, mixing EM, band,
  thermal and control solves and both references, so that no stage waits for an unrelated one; thermal
  checks wait only for the shortlist''s L_sub order; (3) takes per-solve wall and memory from research/l2_thread_calib/summary.txt
  (four 0.25 mm Case 4 solves at once on n2d-custom-8-81920-ext) when it exists, else from P3 with the
  thread waste stated. --plan reports the schedule''s VM-hours, $ and the machine type (memory sized to
  the concurrency). The registered run goes on a regular VM; the full-fidelity dev run may use MF_GCP_SPOT=auto
  and runs while T0263 builds the reconstructions.


  CALIBRATION RESULT (founder session, 2026-11-09; research/notes/l2-thread-calibration.md, research/l2_thread_calib/summary.txt):
  on n2d-custom-8-81920-ext (AMD EPYC 7B13, 78 GB usable), four 0.25 mm Case 4 solves at once took 6,268-6,519
  s pinned to one thread and 5,678-5,862 s with two threads each (OPENBLAS_NUM_THREADS = OMP_NUM_THREADS
  = MKL_NUM_THREADS = MF_L2_FFT_WORKERS = 2, MF_L2_THREADS = 1), peak 15.9 GB, L equal to P3''s to <=
  6.3e-14 with identical GMRES iterations. Use two threads each, four 0.25 mm solves at once, as the default
  schedule; scale time and memory by the --plan unknown counts (Case 4: 4.1 M unknowns at 0.25 mm). A
  0.5 mm Case 4 solve took 846 s pinned alone. Per-solve cost about $0.24 at the regular $0.612/h; the
  founder''s projection for two public references is about 40-48 h and $24-29 including thermal, to be
  replaced by --plan.


  REPORTING (review T0280, 2026-11-09): measure_rules gives one minimum gap per signal-to-power class,
  which can be stricter than O003''s frozen minimum (''every other net pair at least the reference''s
  smallest gap''). The spec records, per reference, each measured class value beside the reference''s
  smallest full-DC-link gap, and flags any class more than 2x stricter, because it narrows the search
  (reported, not gated).


  SPEC CHECKS (reviews T0283/T0284, 2026-11-09): the metric guards reject only non-finite or wrong-sign
  floor and tj_limit_K, so the spec states floor = 1e-3 K and tj_limit_K = 2.0 K explicitly and --verify-freeze
  asserts those exact values. The runner''s thermal callable returns the record fields the driver whitelists
  (per level and die: Tj max and its node, node count, fingerprint, energy balance, Picard convergence).


  L1 SCREEN THROUGHPUT (review T0288, 2026-11-10): the generator yields DRC-valid candidates at about
  35 per s (Case 4, measured rules, 1 wire per die) but only 2-2.5 per s with 3 wires per die (machine
  under load). A 20,000-candidate screen can therefore take minutes or 2-3 h per search. --plan measures
  the rate on each reference''s spec and schedules every screen (main and control, both references) at
  the start of the run, beside the reference, snapping-variant, twin and D solves, so the shortlist solves
  are not delayed; the sealed candidate sequence must not depend on the schedule.


  DEGRADATION, NEAR TIES AND PRE-CHECK (reviews T0296 of T0293, T0292, T0295; session with founder permission,
  2026-11-10):

  - D must meet its definition (review T0296 finding 3). F1(b) defines D by L_sub(D) >= 1.25 L_sub(twin),
  but the degradation rule reaches it in L1 (target 1.25 x 1.11), and its fallback walk climbs on L1 itself,
  ending just above the target (median L1 ratio 1.394 on the 2 mm stress); the 0.11 margin was derived
  from generator layouts, not walk outputs. Gate, do not only record: for every reference, compute L_sub(D)
  / L_sub(twin) from the band solves the driver already stores (no new solve), judged at the conservative
  end of its band with the same band estimator as everywhere else, before K1 is read. Record per reference
  whether the walk ran (rec[''walk'']) and its steps.

  - Failure consequences are not for the agent to choose. O003 states the response for (b) failing and
  for twin-gate exclusion, but not for a D that misses 1.25 in L_sub or for a reference where degrade()
  raises DegradeError (T0293: 9 of 72 layouts at a 2 mm minimum width still do). Write in the spec the
  consequence the objective''s text implies; where it leaves the case open, list it under a ''founder
  decisions before registration'' heading in the spec rather than deciding it.

  - Fail fast: build the twin W and the degraded copy D of every reference (L1 only, seconds to about
  85 s per layout with the walk) before the first l2_layout solve, so a twin-construction failure or DegradeError
  stops the run before any VM spend and records the reason.

  - Near-tie union (T0292): the driver band-solves every shortlisted candidate inside the union of w_ind
  and w_ind_recon, a count unknown until the run. --plan reports a range for it (from the dev rows'' e_R
  values and the shortlist''s L_sub spread), and the cost, VM-hours and E008 date at the upper end of
  that range as well as the expected one.

  - Pre-check false rejections (T0295): _quick_ok was shown to reject no DRC-clean candidate only on Case
  4, measured rules, one seed. Per reference, the run reports how many DRC-clean samples _quick_ok rejects
  over a fixed sealed sample (L0 only), flagged when non-zero because it narrows the search (reported,
  not gated).

  - Midpoint convention (review T0297 note 2): on rectangular merged bands the copper does not fix the
  slot boundary and the twin''s midpoint-of-needs rule decides it, which degradation move 1 depends on.
  Record per reference whether the midpoint rule decided any split, and which.

  - Twin copper (review T0299, session with founder permission, 2026-11-10): the twin''s band split has
  needed three fixes (T0293, T0298, T0300), and the twin gates catch a wrong split only through L and
  Tj. Report per reference the symmetric difference between the twin W''s copper and the snapped reconstruction''s,
  per net in mm2 and as a fraction of that net''s area, with the twin mode (exact or fit); reported, not
  gated.

  - Twin limitations (review T0302, session with founder permission, 2026-11-10): the spec lists the twin
  construction''s documented restrictions, each with the review that found it: rectangular merged bands
  are split by the midpoint convention (T0297); a column that fills the gap beside the narrower slot leaves
  no step, so the tie rule decides (T0300); a neck from below or above that covers a slot''s probe u enters
  the band''s v-interval and counts as band copper, so the split can be wrong end to end (T0302 finding
  0); copper is assumed axis-parallel. The twin-copper report above and T0263''s twin-space check are
  read against this list; the code is not changed after the freeze.'
