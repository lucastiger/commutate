    - I recalled the k(T) laws and their sources from memory and did not check them against the sources.
      The Cu and Al2O3 laws use Incropera Tables A.1 and A.2 values. The SAC305 law is a Wiedemann-Franz
      estimate with alpha = 4.2e-3/K, medium-low confidence, and no primary SAC305 k(T) data were consulted.
      The 4H-SiC T^-1.49 law comes from TCAD material files and Levinshtein et al. 2001. Si3N4 follows
      Slack's 1/T law. The confidence is noted in the `stack.py` docstring, and a reviewer should check
      the citations before O006 relies on them.
    - The choice of SAC305 as die attach keeps one material law. Sintered Ag is the usual SiC alternative
      and is noted in the docstring, but not modelled.
    - '`die_attach` and `die` are separate `LayerStack` fields. They are not in `layers` or `LAYER_ORDER`,
      so `total_thickness` and the existing layer tests are unchanged.'
    - '`Die.thickness` and `Die.attach_thickness` stay per-die and default to the shared constants `DIE_THICKNESS`
      and `DIE_ATTACH_THICKNESS` in `stack.py`. A test checks that generated layouts agree with the stack''s
      die layers. If a layout''s dies disagree, `thermal_model.md` says the dies'' values rule.'
    - In `test_layout.py` I replaced the assertion `'thermal' not in doc`, which said there was no thermal
      model to cover. It now asserts that the fingerprint docstring names the die layers. That assertion
      was a statement about the old state, not a coverage check, and I did not weaken any coverage or
      tolerance test.
    - The `LayerStack` dataclass swap test exchanges whole `die_attach` and `die` layers, so I did not
      add layer-name validation in `__post_init__`. The layer names are hashed, so a swap is still detected.
