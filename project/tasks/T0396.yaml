    alternative_explanations:
    - explanation: The selected coverage depends on the generative model. Strata other than the two n1
        measured are interpolated, families are assumed alike, the between-load error correlation of 0.9
        is assumed, and the stratum bias is fixed. Real L1 errors could cluster more strongly within layouts
        or have heavier tails than t3.
      how_to_discriminate: Re-run stats_sim.py with error and reference scales taken from the development
        rows of every (family, band) cell once the L1 is frozen, and with rho = 0 and rho = 1. A coverage
        drop below 0.95 would refute this design.
    - explanation: The power shortfall at m ≤ 16 might come from the conservative 97 % level and the Bonferroni
        ratio rather than from the sample size, so a less conservative calibrated bound could reach power
        0.8 with fewer layouts.
