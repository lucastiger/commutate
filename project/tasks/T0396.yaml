    **Selected bound (variant V4).**

    - It is a Woodruff quantile bound: the empirical CDF at the p95, with its variance from a delete-one-layout
    jackknife. Deleting a layout deletes every term that involves it, so A1''s pair terms are handled.

    - It uses a t critical value with K−1 degrees of freedom and takes the order statistic rounded outward.

    - For A4/K3, the ratio bound is upper(numerator) / lower(denominator), each at α'
