      Grid (from thermal_fem.py, no solve): the levels nest exactly in x, y and z. The 1 um layer and
      the die each get 1/2/4 cells through their thickness at levels 0/1/2. The edge grading stops 0.625
      mm inside each edge of the 4 x 6 mm die, so the 2.75 x 2.875 mm interior gets 2 x 2 cells at level
      0. The die centre, where the peak sits, is the corner node of the die''s four largest cells.


      Local levels 0-1 (V0-V4, Case 4 twin): V0 matches the saved values to 6e-12 K. V4 (2R''s recorded
      stack) is exactly V1, with bitwise-equal results. Every variant keeps a negative first step on every
      die:

      - Removing the 1 um layer (V2) changes it by at most 3e-4 K, so H2 is ruled out.

      - The 50 um die attach (V1) shrinks it by 25-31 % but does not flip it, so H1 is ruled out for the
      first step.

      - The die-area mean rises about 0.5 K at the same step, as the Galerkin method guarantees.


      This points to an in-plane effect at the die centre (H3 or H4). Telling H3 from H4, and the second
      step for V1/V4, needs level 2. The launcher burst_tj_osc.sh runs it: about 1 VM-hour, about $0.6.
      It needs T0325 merged to main first.'
