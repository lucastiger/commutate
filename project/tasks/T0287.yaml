description: "Follow-up to T0259, from review T0286 (project/reviews/T0259/T0286.json; read it first).\
  \ Lands before E008's code freeze\n(T0262). A frozen degradation rule that raises on a judged reference\
  \ makes F1(b), and so E008, INVALID. Do not edit\nsrc/moduleforge/solvers/thermal_fem.py (sha256 a216d5fe...).\
  \ Develop only on generator layouts and Case 4 (F3); never load\n2D_Case_2R, 2D_Case_6 or customer data.\n\
  1. Degradation that reaches its target (T0286 findings 1 and 2). DEGRADE_MARGIN must cover the stated\
  \ L1 bias spread: with\n   L1 5-14 % below L2 the ratio can be overstated by up to 0.95/0.86 - 1 = 10.5\
  \ %, so the margin is at least 0.11 (state the\n   derivation). When narrowing the landing slots leaves\
  \ L1(D)/L1(W) below 1.25 (1 + margin), apply further deterministic\n   geometric moves in a fixed, documented\
  \ order until it is met, each keeping DRC: for example lengthening the commutation\n   path by moving\
  \ the landing bands or the die rows apart, or lengthening the columns, within the outline and the spec's\n\
  \   rules. Dies, die count, wires per die and terminals stay as the generator space allows. Raise DegradeError\
  \ only when no\n   move in the order reaches the target. No solver beyond L1. Test on the population\
  \ T0286 used (generator housing layouts,\n   n = 2, 3, 4 dies, 1, 2, 3 wires per die, 6 seeds each:\
  \ 54 layouts) and Case 4: every layout reaches the target and is\n   DRC-clean; report the ratio distribution\
  \ (min, median, max) in the test and docstring. Determinism.\n2. Merged PHASE bands (finding 0). Probe\
  \ the landing slot where the docstring says (the mean wire landing u), split two\n   slots of one net\
  \ that overlap in one band on the grid, and record the correct topology label ('merged'). Tests on merged\n\
  \   generator layouts in orientation x and y: fingerprint-level recovery where the generator built them,\
  \ correct label, no\n   overlapping slots, and degrade() effective on them.\n3. Exact-mode shortcut\
  \ (finding 3): run check(lay, spec.rules) before returning mode 'exact'; raise TwinError on violations.\n\
  4. Docstring and evidence (finding 4): make the docstring match the code; put the exploration of alternative\
  \ degradation\n   moves (what was tried, the L1 effect) in the module docstring or research/notes/o003-degradation-rule.md.\n\
  Keep every existing test passing; do not weaken any test or tolerance."
