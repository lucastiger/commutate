rationale: 'scope_in requires one frozen scikit-fem configuration used unchanged by every E009 case and
  by O003. A solver setting is part of that configuration, so the smoother must be a production, rule-selected
  option before any re-freeze. It is opt-in, so T0228''s grids and every existing test stay reproducible.
  The benchmark is the cheapest kill shot: it ties the production option to the founder''s measured diagnostic
  before any study money is spent.'
