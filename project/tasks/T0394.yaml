title: 'Generator option: one fixed die size per stratum (die_size_mm), random stream and default output
  unchanged'
type: implement
agent: builder
status: needs_founder
depends_on: []
description: 'This is build item (3) of the objective notes (scope_in: one die size per (family, dies)
  stratum).


  In src/moduleforge/generate/halfbridge.py:

  - Add `die_size_mm: float | None = None` to generate_layouts and _build. When set, every die of every
  layout has that size. s is still drawn and then replaced, so for a given seed every other parameter
  draw is identical until the first DRC-driven divergence.

  - None must give byte-identical layouts to today''s code. Capture the fingerprints (Layout.fingerprint)
  of several seeded layouts across families and die counts before changing anything, and pin them in a
  regression test.

  - Raise ValueError unless die_size_mm is a multiple of DESIGN_GRID_MM within the generator''s own draw
  range, 4.0-5.5 mm.

  - Add `draw_die_size_mm(rng)`, returning a draw from the same snapped distribution as _build''s s, so
  runners can draw one size per stratum.

  - Update the module docstring.


  Unit tests in tests/unit/generate/test_halfbridge.py:

  - the fixed size on every die, across the three families and 2-6 dies, including 6 dies at 5.5 mm;

  - the None regression;

  - the validation errors;

  - determinism in the seed;

  - draw_die_size_mm''s support.'
