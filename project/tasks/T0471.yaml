  report:
    summary: "I built E011's development rows from the I0205 burst results with no new solves (e011_run.py\
      \ --dev-rows). The result: E011 is not ready to register as designed. On the dev draws the frozen\
      \ design gives A1 = 0.25 and A3 = 0, which is an INCONCLUSIVE verdict. O008 F1 requires A3 to be\
      \ met on development rows at registration, so E011 would fail its own registration check. The draft\
      \ now says so, and the founder decisions are listed in it and in the note.\n\nFacts, all traceable\
      \ to research/o008_e011_dev/dev_l2/dev_rows.json:\n- **W\\*.** At 0.25 mm the proxy choice keeps\
      \ the descent on both layouts, so the provisional W* holds. L_sub(W*)/L_sub(W) is 0.9376 on 2R and\
      \ 0.7176 on Case 4.\n- **R_D (a1).** At 0.25 mm, 2R ranges 1.209 to 1.406 (7 of 8 in [1.25, 1.60])\
      \ and Case 4 ranges 1.279 to 1.305 (8 of 8). The out-of-window rate is 1/16. Review item 7 is confirmed:\
      \ L2 sees 0.68 to 0.79 of the L1 headroom, so the L1 target 1.3875 lands near 1.28, just above the\
      \ 1.25 floor. Redraws aim at the same target and do not correct this.\n- **Band bound (a2).** It\
      \ holds for the search: 2R median 0.0034, max 0.0061; Case 4 median 0.0023, max 0.0027. Compact\
      \ would also hold. Widen would not (median 0.012 to 0.019), but widen's s values are far from the\
      \ line. Bound unchanged.\n- **Gated metrics (a3).** A1 = 0.25: 2R passes 2 of 8, Case 4 passes 8\
      \ of 8. A2 = 0. A3 = 0: compact on 2R has 6 resolved failures and 6 paired wins, below the 7 needed;\
      \ Case 4 compact sits exactly at the 4-resolved line. K1 = 0.0297, so it does not fire. 2R is the\
      \ A1 risk (review item 6). Its misses come from L1 and L2 disagreeing near the optimum: within-shortlist\
      \ Spearman is -0.95 to 0.25, and late L1 gains were under 1 %, so budget is not the limit.\n- **Ranking\
      \ stability (a4).** The burst solved only each shortlist's best at 0.25 mm, so a direct comparison\
      \ is impossible. The extra jobs would be 231 solves, about 129 solve-hours and about $25 to $30;\
      \ not run. The level ratio q = L(0.25)/L(0.5) spans 0.25 % (2R) and 0.49 % (Case 4). That bounds\
      \ the selection error at 0.25 and 0.48 percentage points. Every dev search s is an upper bound on\
      \ the registered rule's s, because the registered rule takes the minimum over the same shortlist.\n\
      - **Joint operating characteristic (b).** I defined c_k as the relative re-solve error of the single\
      \ W* solve. W* is deterministic, so c_k ~ U(±solver tolerance), about 2e-5. The estimand is P(verdict)\
      \ over the sealed seed as the evaluator judges it, not against exact inductance. Results: P(PASS)\
      \ = 0, P(A1) = 0.0003, P(A3) = 0.23, P(INCONCLUSIVE) = 1. I report Clopper-Pearson and Bonferroni\
      \ bounds beside these numbers because the bootstrap is degenerate with 8 draws.\n- **Registered-run\
      \ size (d).** Measured 0.25 mm walls are 925 s (2R) and 3046 s (Case 4), 0.53 to 0.66 of the old\
      \ model. Peak memory is 6.4 GB and 16.5 GB. Options, with a full-load sensitivity in brackets:\n\
      \  - A: current 8-vCPU, 80 GB shape, 105 to 122 h, $65 to $75 (144 to 170 h, $89 to $104).\n  -\
      \ B: 8 vCPUs with 96 GB, 92 to 105 h, $69 to $79.\n  - C: 16 vCPUs, 53 to 63 h, $66 to $78; only\
      \ possible when no other burst runs.\n  The draft now has timeout_min 10800, which covers A in every\
      \ scenario, and cpu_hours_est 495. The choice is left open.\n\nReview items:\n- **4, 5, 9: fixed\
      \ in the runner.** The R_D placeholder is now recorded as None with a provisional flag. changed_from_D\
      \ uses movable_indices. freq_hz comes from the spec. The Tj fallback is now reachable in dev mode;\
      \ it is not due on either layout (Tj difference -1.62 K and -2.02 K).\n- **8: not done.** The research/o008_e011_dev/work\
      \ checkpoints and the run log no longer exist anywhere on this machine. I recorded the hashes of\
      \ what does exist (the manifest, dev_summary.md, the results tree).\n\nThe only change to the frozen\
      \ block is filling band_bound.development_value, so frozen_sha256 was refreshed. Every design value\
