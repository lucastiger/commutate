description: "The E011 development burst is done (I0205; the founder ran it on GCP, 2026-11-18 and 19):\
  \ 743 EM solves, all ok and L2-converged, none missing. Results: research/o008_e011_dev/dev_l2 (dev_solve_summary.json\
  \ complete true; code_stamp.json matches the manifest experiments/drafts/E011.dev_jobs.json). This is\
  \ the dev L2 analysis that T0382 deferred until after the burst, plus the revision of experiments/drafts/E011.yaml\
  \ for registration. Development data only: no registered seeds, no network, no VM, no new solves.\n\n\
  (a) Measure from the dev L2 results, per counted layout (2D_Case_2R, 2D_Case_4; gen2_0 reported, not\
  \ counted):\n  1. R_D = L_sub(D_j) / L_sub(W*) at 0.25 mm for every dev draw, against the window [1.25,\
  \ 1.60], and the redraw rate\n     it implies. Compare it with the L1 target 1.3875 (review item 7:\
  \ a systematic L2/L1 offset).\n  2. b_j for the search and for nulls (b) and (d) by the draft band rule\
  \ (b_j = 2 e_R, mfos.metrics.\n     ratio_band_estimate; D0008 P3), and whether the frozen band bound\
  \ holds (median b_j <= 0.01, max b_j <= 0.02). Report it; do not change the bound.\n  3. s_j, A1, A3\
  \ (null_beaten_min) and K1 on the dev draws, written as dev rows through the runner with e011_metrics.\n\
  \  4. Ranking stability between lat0.5 (dev selection and the four sensitivity proxies) and lat0.25\
  \ (the registered\n     rule), from shortlist members the burst solved at both levels (review item 3).\
  \ If the burst did not solve enough\n     of them at 0.25 mm, say so and list the extra jobs with a\
  \ cost estimate; do not run them.\n(b) The joint operating characteristic (review item 1, T0462 major):\
  \ define c in s*_kj = (1+s_kj)/(1+c) - 1 and the\n    method before computing anything, state exactly\
  \ what the result estimates (it is not P(PASS) against the true\n    L_sub ratios unless the method\
  \ shows that), include the common-mode error of the single L_sub(W*) solve per\n    layout, then fill\
  \ the numbers into the draft.\n(c) Fix the other open review items (O008 state log, 2026-11-18) in the\
  \ draft and runner: (4) replace the per-draw\n    r_d = 1.425 placeholder with the measured R_D, or\
  \ flag it; (5) changed_from_D must use movable_indices as\n    changed_from_Wstar does, and em_job must\
  \ take freq_hz from the spec; (6) expected_outcome must agree with the dev\n    L2 evidence on which\
  \ layout is the A1 risk; (8) record the sha256 of the research/o008_e011_dev/work stage\n    checkpoints\
  \ and log in the repository, so the improvement-curve brackets can be checked; (9) state why the Tj\n\
  \    fallback cannot fire in dev mode, or make it reachable.\n(d) Registered-run size (review item 2):\
  \ correct registered_run_usd, cpu_hours_est and timeout_min from the solve\n    times and memory measured\
  \ in the burst. Compute is capped at 16 vCPUs across all regions (Google Cloud free\n    trial; no quota\
  \ increase), and another burst may hold 8 of them. Give two or three options (VM shape, timeout,\n \
  \   or a split into runs), each with hours and cost. The founder chooses; leave the choice open in the\
  \ draft.\n(e) In the note, brief each founder decision this prepares, with the evidence and a recommendation:\
  \ the L1 search\n    budget (research/notes/e011-dev-run.md section 4), the no_moves rule (review T0444,\
  \ proposed), the registered-run\n    option from (d), and O008's VM budget.\n\nDeliverables: research/notes/e011-dev-l2-analysis.md\
  \ (facts and inferences kept apart; every number traceable to a\nfile under research/o008_e011_dev/dev_l2);\
  \ research/o008_e011_dev/dev_l2/dev_rows.json; the updated\nexperiments/drafts/E011.yaml; the runner\
  \ changes in experiments/runners/e011_run.py, with the selftest passing.\n\nDo not register E011, and\
  \ do not edit experiments/specs or any frozen objective. Never read data/holdout/. Do not open\nNC State\
  \ PREES, 2D_Case_5 or customer geometry (leakage rule). Do not change frozen design values (degradation\
  \ family,\nwindow, band bound, step limits) yourself: list any change you think is needed as a founder\
  \ decision.\n"
