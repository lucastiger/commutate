  \ Near-tie band window (note 4): band-solve every shortlisted candidate inside the union of the twin-based\
  \ window\n   (L_sub <= (1 + w_ind_twin) L_sub(ind best)) and the reconstruction-based window the evaluator's\
  \ secondary column uses\n   (w_ind_recon = 2 e_R(ind best, reconstruction) + s_ref; research/o003/e008_row_contract.md\
  \ item 9), so the evaluator never\n   finds a missing band column. Test with fakes where e_R(ind, recon)\
  \ > e_R(ind, twin): the extra candidate is band-solved.\n3. Thermal record checks (caveats): the record's\
  \ fingerprint must equal the layout's; tj, tj_max_node and nodes must have one\n   entry per level and\
  \ per die (no ragged tj, no silently dropped die); cap the total serialised size of one record (for\n\
  \   example 1 MB) including mappings and nesting. Raise naming the field.\n4. Checkpoint robustness\
  \ (findings 1 and 2): a torn tail split inside a UTF-8 character is repaired like any other torn\n \
  \  line; make the multibyte test distinguish byte from character offsets; make the no-rewrite test also\
  \ block\n   path.open('w').\nKeep every existing test passing; do not weaken any test or tolerance."
