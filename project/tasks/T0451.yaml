description: 'Follow-up source fixes before E004 freezes its perturbation-rules hash (O004), from review
  T0446 of T0438 and review T0445 of T0442. It starts after T0438 and T0442 have merged (same files).
  Each fix comes with a test; never weaken an existing test.


  src/moduleforge/generate/perturb.py and tests/unit/test_perturb.py (T0446):

  1. Hash coverage: rules_sha256() hashes Die.box''s getter, which only returns box(*self.bounds); the
  geometry comes from Die.bounds, which is not hashed, and nor is geometry.layout._ring_ints (Layout.fingerprint''s
  normalise-and-round helper, used for the distinctness key). Add both to _rule_sources, with a test that
  monkeypatches Die.bounds (and one for _ring_ints) and asserts the hash changes.

  2. Silent redraws: _draw_single now catches every ValueError from _draw_params, so a real reference
  defect (e.g. _net_poly''s ''must have exactly one trace'') becomes a silent redraw or a misleading ''no
  new DRC-clean move in 2000 draws''. Catch only the long-side (both-sided edge) error, and let other
  errors fail loudly, with a test.

  3. long_sides merges collinear vertices with shapely.simplify(poly, 0.0), which needs exact float collinearity,
  while require_whole_mm accepts 1e-6 mm of noise. Round the vertices to whole mm before merging, and
  test it on a reference whose coordinates are built as k/1000.

  4. Update the docstrings of draw and measured_rules (the whole-mm ValueError) and of _rule_sources (NETS,
  SIGNAL_NET, SIGNAL_PADS and the property sources now hashed).


  src/moduleforge/solvers/fasthenry_run.py and tests/unit/test_fasthenry_run.py (T0445, minor):

  5. test_self_test_bound_is_the_exact_hoer_love_value compares two module constants: assert SELF_TEST_HOER_LOVE_NH
  == pytest.approx(bar_self_L(10e-3, 1e-3, 1e-3) * 1e9, abs=1e-6) with the file''s own quadrature.

  6. Add ''killed_external'' to the Attempt and FHResult status docstrings, fill FHResult.log on failure
  as well, and drop the stale ''0.3 % closed-form bound'' comment in test_self_test_raises_on_a_wrong_build_and_on_a_crash.


  Report the new rules_sha256() value; T0389 refreezes E004''s hash from it (once, after this task).

  '
