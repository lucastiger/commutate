id: T0257
objective: O003
title: AlN k(T) law in stack.py and the frozen grid-snapping rule
type: implement
agent: builder
status: proposed
depends_on: []
description: 'Two inputs needed to bring a reference into the model: AlN thermal conductivity and grid
  snapping.

  (a) Add a cited AlN k(T) law to K_LAWS in src/moduleforge/geometry/stack.py (OD-7: never in thermal_fem.py),
  normalised as the other laws and valid over K_T_MIN..K_T_MAX. Cite a primary source in the module docstring
  (for example Slack et al., J. Phys. Chem. Solids 48, 641 (1987), or an equivalent table for polycrystalline/sintered
  AlN) with the exponent or table and its confidence, as for Si3N4. Tests in tests/unit/geometry/test_stack.py:
  f(300 K) = 1, monotone decreasing, and the law reproduces its cited points within a stated tolerance.
  A Layer(''ceramic'', ''AlN'', ...) k_at works, and thermal_fem.layout_grid accepts a Layout with an
  AlN ceramic at level 0. src/moduleforge/solvers/thermal_fem.py must stay byte-identical.

  (b) New src/moduleforge/geometry/snap.py implementing scope_in''s snapping rule for a parameter grid
  (0.5, 0.25 and 0.125 mm). Each copper, outline, terminal-pad and die-footprint edge moves to the nearest
  grid line. Non-rectangular copper is staircased on the grid. Die footprints are snapped identically
  wherever the same die geometry appears: same input, same output, for the reference and every candidate.
  Wire end points move with their pads only as far as needed to stay on them. Every snap is recorded (element,
  before, after, displacement), and the record is returned with the snapped Layout. After snapping, net
  spacing and die enclosure are re-checked with drc.check under caller-given DesignRules and returned
  as violations, never silently repaired. Ties at exactly half a grid step resolve by one documented rule.
  Tests: identity (unchanged fingerprint) on generator layouts, which are already on the 0.5 mm grid;
  idempotence; every displacement at most half a grid step; staircase area error bounded on a diagonal
  and a triangular fixture; nets never merged; the snapped layout is exact on the l2_layout lattice at
  0.5 and 0.25 mm (the same check research/scripts/o006_case4_layout.py uses). Develop on generator layouts
  and 2D_Case_4 only (F3).'
