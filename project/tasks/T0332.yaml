  report:
    summary: 'E008 can now compute h_lo_vj on a real run. After the frozen driver finishes, the runner
      finds the layout that A1''s formula picks on T_vj (the "die-average best"). If that layout has no
      band yet, it solves the band for the report only. Nothing gated changes, and every definition-of-done
      command exits 0 except one I could not run.


      How it works:

      - **Finding the layout.** `vj_best_layouts` calls `mfos.metrics.headroom_per_reference` (unchanged)
      on the same T_vj copy of the rows that `virtual_junction_report` reads. It parses no exception text.
      In a separate probe copy, a layout with no band gets placeholder band values. These cannot change
      `best_id`, because the formula uses the band only for e_R, after it has chosen the best layout.
      The probe''s h_lo is thrown away.

      - **Solving the band.** `vj_band_step` runs after `Run.drive` returns. In the dev path it also runs
      after the band-check pairs. It builds the jobs with `Driver.em_jobs(Stub(fp, family), BAND)` on
      that reference''s main Driver and runs them on the run''s own Scheduler, so job keys, levels and
      the smoke em_map are the same as for every other band solve. Leftover prefetch hints are set aside
      meanwhile and put back afterwards.

      - **Failures.** A solver error, a killed job or NeedsLargerMachine (phase stop) is caught and recorded
      as `h_lo_vj_reason`, with h_lo_vj null. It never raises and writes no `phase_b_needed.json`. `--replay-only`
      submits nothing: a missing band gives null with a reason.

      - **What is reported.** The band values go only into the report''s own row copy. The report gives
      h_lo_vj, best_id_vj and a `die_average_best` record: the layout, its fingerprint, the Tj-max and
      inductance-only bests, where its band came from ("solved for this report only" or "gated rows")
      and the number of new solves.

      - **Where it runs.** In `registered_run`, `evaluate()` runs first, then `rep["virtual_junction"]`
      is replaced before anything is recorded (`vj_bands=False` turns the step off). In `--dev`, `meta.virtual_junction`
      comes from the same function.


