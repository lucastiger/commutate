    concerns:
    - 'A4 as measured: the frozen rule (1/0.5/0.25 mm lateral, 2 z-cells per layer) gives a max GCI of
      0.448 K (side_by_side_6) and 0.668 K (u_shaped_2) against the 0.025 K threshold, about 18-27x too
      large. Observed orders are only about 1.1-1.9, and monotone convergence is not clean for some values,
      such as the spread. Reported as-is in benchmarks/results/thermal_l2_convergence.json; I did not
      tune the rule to the benchmark. As things stand A4 is not met.'
    - Level 2 is cheap (1.7 M cells, about 75 s, about 1.7 GB), so the founder could afford a finer rule,
      for example LAT_FRAC 0.5 (about 14 M cells at the finest level, which probably needs a burst VM)
      or more z-cells in the thin layers. I did not do this because the task says not to tune the rule
      beyond what it documents. The current constants (LAT_FRAC 1, Z_CELLS 2) are the ones to revisit.
    - The rule defines the lateral feature size as the smallest interval between consecutive feature lines
      (die, trace and box-source edges, box walls). For a box stack whose source side equals f_min, level
      0 puts a single cell across the source. My box test therefore runs its three-level study from level
      1 (`level0=1`), where convergence is monotone and about second order. E006 box cases should pick
      `level0` accordingly.
    - peak_rss_mb is the child process's ru_maxrss, which is bytes on macOS and is converted accordingly.
      The values are not comparable to Linux runs without the same conversion, which the script does.
    - --smoke runs levels 0 and 1 only and writes to a temporary file, so it never overwrites the committed
      full result.
