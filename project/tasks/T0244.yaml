  report:
    summary: 'I drafted the E009 spec and runner, and all six definition-of-done commands exit 0.


      **Precondition (checked first, met):** `frozen_config.json` is `feasible: true` with no level missing,
      all eight problems were measured at levels 0-2, and the founder burst is on main as commit e803141b.


      **What E009 does:** scikit-fem is now the solver under test. It runs through production `thermal_fem`
      with one rule built from `config.fem_rule`, which is the frozen JSON copied verbatim, including
      `edge_grading` and `amg_gs_sweeps`. There is no research-side grid or solver code. After every solve
      the runner stops with an error if the solver reports a sweep count other than 2. Before any solve,
      a gated check confirms that `config.fem_rule` equals the file on disk and that thermal_fem''s constants
      equal the frozen ones. It also reruns E006''s reference checks (hashes, series convergence, manufactured
      case).


      The in-house FV solver is the cross-check, at levels 1-3 on five layouts: two dev layouts and three
      from the sealed seed.


      **Rows:**

      - Case rows give the three grid values per point, where each point snapped (requested, used, distance),
      its grid position per level, and the CG maximum and linear residual of each grid solve.

      - Cross-check rows give both solvers'' three values per die, both convergence estimates and directions,
      the per-die F5 flag, where the hottest node sits per level and how often it moves, power, the constant-k
      column, and both solvers'' linear-solver data.

      - Power is calibrated per layout on scikit-fem level 0 with a 0.25 K tolerance. The dev-study histories
      confirm this gives the same powers as the dev study.


      **Metrics and checks:** the four metrics and their recompute entries are exactly the objective''s.
      A3 is `max_gci_consistency` with `ref_gci_cap` 0.25, so F5 acts only through A3 and is not a gated
      check. A4 is `max_gci_capped`. All the brief''s gated checks are present. The CG count above 300
      is reported, not gated; the gate is the 400-iteration cap.


      **Smoke run (coarsened copies of both rules, dev seeds 20261101 and 7; not evidence):** 6.5 min,
      peak 3.6 GB, exit 0.

      - All integrity, reference, node, energy, Picard, operating-point and linear-solver checks pass.

      - Three things miss only because the smoke grids are coarse: node-count growth at the coarsest step
      (6.71-6.79 against 6.8), A3/A4 are +inf from diverging sequences, and F5 fails.

      - The constant-k null comes out at 2.52 K (scaled 0.025), so it fails A1 and A2 and `mfos exp check`
      raises no null problem.


      **Cost:** I estimate about 18.5 CPU-hours (set as `cpu_hours_est: 20`, `timeout_min: 2700`). The
      burst-measured walls are used where they exist; the fresh layouts are extrapolated at 1.5 × side_by_side_6.
      Peaks: measured 42 GB (scikit-fem) and 70 GB (FV); extrapolated about 71 GB and 105 GB on fresh
      layouts. That needs an n2-highmem-32; an n2-highmem-16 is too small.


      **One edit outside E009:** the DoD lint command failed on an existing T0076 file, `research/scripts/e002_runner_harness.py`.
      Ruff lints explicitly named paths even though the config excludes `research`. I made a lint-only
      reformat; its statements and their order are unchanged.


      Committed as f6d6d723 on the task branch.'
