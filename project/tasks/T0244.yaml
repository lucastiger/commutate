id: T0244
objective: O007
title: 'E009 design: draft spec and runner (scikit-fem at the re-frozen graded Q1 rule with amg_gs_sweeps
  = 2 against O006''s frozen references, and against the L2 at levels 1-3 on five layouts; A1-A4, K1/K2,
  F1-F5)'
type: design_experiment
agent: scientist
status: review
depends_on:
- T0242
- T0243
description: 'Replaces T0238 (cancelled). The brief in project/tasks/T0229.yaml applies unchanged except
  for the frozen configuration. That brief covers: E006''s machinery reused by import, with the solver
  roles swapped; config keys; rows; metrics and recompute entries exactly as the objective states (max_gci_consistency
  with ref_gci_cap 0.25 and floor 1e-3; max_gci_capped); secondary metrics; the gated sanity checks (F1
  checks, node_persistence, node_count_growth, constant_refinement_ratio, energy_balance, picard_converged,
  operating_point, layout_fingerprints, linear_solver_headroom; F5 NOT gated); code_under_test; the memory
  preflight; the --smoke mode with a non-sealed dev seed; and the design note.


  Start only if research/o007_dev3/frozen_config.json has feasible: true, with every case and dev layout
  measured at levels 0-2 (n2 plus its founder burst). Otherwise stop and report. Do not design around
  an infeasible or provisional configuration. The first done-check enforces this.


  Changes against T0229:

  - fem_rule is copied verbatim from research/o007_dev3/frozen_config.json. Every scikit-fem solve goes
  through production thermal_fem with a GridRule built from it, including edge_grading=(first_offset_m,
  ratio, max_offset_m, min_gap_fraction) and amg_gs_sweeps. Use no research-side grid or solver emulation.

  - The runner asserts, per solve, that result meta[''amg_gs_sweeps''] equals fem_rule''s value. This
  is one configuration, used unchanged by every case (scope_in).

  - Case rows record every snap (requested, used, distance) of their reported points.

  - Every row records, per grid solve, cg_max_iterations and linear_rel_residual_max (T0222).

  - The dev A1/A2/A4 regression-guard values, the cost table (cpu_hours_est, timeout_min, VM size) and
  the CG maxima come from research/notes/o007-dev-study3.md and research/o007_dev3/dev_study.json. State
  which were measured and which extrapolated.'
