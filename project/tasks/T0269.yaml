description: "Follow-up to T0261 (merged), from review T0266 (project/reviews/T0261/T0266.json; read it\
  \ first). These metrics decide\nO003's verdict; the founder applies research/o003/headroom_metrics.patch\
  \ to tools/mfos only after this task. Do not edit\ntools/mfos (protected) or src/moduleforge/solvers/thermal_fem.py\
  \ (sha256 a216d5fe..., OD-7).\n1. Tests with NONZERO band terms: hand-computed cases with e_R > 0 for\
  \ the A1 best, the twin/reconstruction gates F1(a1)\n   and F1(a2), the levelling pair and the K1 near-ties,\
  \ so that each of T0266's 11 surviving mutants fails a test.\n2. research/o003/check_mutants.py: applies\
  \ each mutant (at least T0266's 11 survivors, listed by name, plus any you add)\n   to an in-memory\
  \ copy of research/o003/headroom_metrics.py, runs research/o003/test_headroom_metrics.py against it,\n\
  \   and exits 0 only if EVERY mutant makes at least one test fail (print a table: mutant, killed yes/no).\n\
  3. tj_bounds / both metrics: every thermally checked layout must carry exactly the twin's die count\
  \ (scope_in fixes the\n   die count); otherwise raise (fail closed). Test it.\n4. Fail-closed tests:\
  \ one per metric, each calling only that metric, so each is shown to fail closed on its own inputs.\n\
  5. research/o003/e008_row_contract.md: list T0266's two interpretation choices (levelling threshold\
  \ under the twin\n   rule; switches in the reconstruction-based secondary) in section 5 for the founder,\
  \ and make the null-column\n   contract explicit for every row kind the metrics receive (degraded, control_best,\
  \ L1-only null rows, any runner\n   additions): which value L_sub_null_H takes, or which where-filter\
  \ excludes them.\n6. Regenerate research/o003/headroom_metrics.patch with make_patch.py; it must still\
  \ apply cleanly.\nDo not weaken any test or tolerance."
