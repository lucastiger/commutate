- T0451
description: 'Extend experiments/runners/e004_run.py and experiments/drafts/E004.yaml with: (1) the l2_layout
  ladder 1.0 / 0.5 / 0.25 mm on every layout at 10 and 20 MHz, using E010''s mesh-constant pattern for
  1.0 and 0.5 mm and the unpatched refinement 1 for the judged 0.25 mm value; l2_layout''s thickness and
  filament terms as O006 P3. (2) FastHenry through moduleforge.solvers.fasthenry and fasthenry_run: three
  lateral levels at ratio 2, the coarsest plane pitch at most 2 mm, the wire cross-section refined with
  the traces; the thickness ladder (3 / 5 / 9 filaments) at the middle lateral level on every layout;
  binary sha256 and self_test recorded on each VM; up to 10 multipole retries; no direct fallback. (3)
  Estimators: gci_capped for every L and ratio sequence of both solvers, the finest value''s estimate,
  with thickness terms added to L and to ratios. Ratio sequences whose steps are all below 0.1 % get 3
  max|d| through the mfos.metrics function the founder is adding. Registered mode refuses to run without
  it; smoke mode may use a labelled runner-local copy tested on P3''s 0.007 % / 0.025 % example. (4) The
  criteria exactly as frozen. A1: max |r_L2 / r_FH - 1| over pairs and both frequencies, raw values; an
  F1-excluded pair (l2 estimate > 0.5 %, FastHenry estimate > 1 %, or +inf) counts as not met. A2: |L_L2
  - L_FH| / (E_L2 + E_FH) with each E/L capped at 0.05; over the cap or +inf means unresolved, not met.
  K1: on all completed pairs, excluded ones included. K2: absolute L over 15 %. A missing coarser-level
  or thickness solve makes that estimate +inf. The run is INVALID only if some pair lacks a finest value
  and no completed pair fires K1; no check that depends on solver values may make it INVALID. Report coverage
  after exclusion, per-move-type counts and one-sided zero-failure bounds. (5) Write research/o004_f7/vm_jobs_fasthenry.json,
  the F7(a) job list for the founder''s burst VM: FastHenry ladder and thickness ladder on the Case 4
  development pairs with r <= 0.75 and on a trace-edge move with the refined wire section, run by this
  runner''s development mode, with memory, time and cost projections. These projections set E004''s cost
  plan. (6) `--smoke` runs the full pipeline at the coarsest levels only, on one Case 4 development pair
  (development seed), through the metrics. No 2R or Case 6 FastHenry solve before registration (F2).


  Review T0417/T0418 of T0384 (founder session, 2026-11-16): the only FastHenry-vs-l2_layout agreement
  on record is on 2D_Case_4. On a generated layout (thin-ceramic stack: 0.3 mm trace, 0.3 mm backside
  Cu, 0.38 mm ceramic) FastHenry at one thickness filament gave 13.932 nH against l2_layout''s 11.220
  nH (+24 %), against about +8 % on Case 4 at the same level and about +3 % at P4''s k1 level. Before
  E004 relies on any non-Case-4 deck: (1) the F7(a) FastHenry job list (research/o004_f7/vm_jobs_fasthenry.json)
  adds a thickness ladder (nh 1, 3, 5 at cell 0.5 mm, plane 2 mm, wire_sub 2) on gen2_0, development geometry
  under F2, and states what result counts as the gap closing (it must fall to Case 4''s few percent with
  the thickness term inside the 1 % ratio estimate); no FastHenry on 2D_Case_2R or 2D_Case_6 before registration
  (F2). (2) E004''s frozen FastHenry level is a converged thickness level from that ladder, never nh =
  1. (3) Write in the spec which stack each judged reference has, so a reader can tell whether the thin-stack
  result applies to it.


  T0385''s report (FastHenry adapter, founder session, 2026-11-16): (1) FastHenry returned NaN impedance
  with exit code 0 on a small layout at wire_n = 1 with wire_sub = 1; wire_n = 2, or wire_n = 1 with wire_sub
  = 2, solved normally. The adapter reports NaN as parse_error, so a ladder level with wire_n = 1 and
  wire_sub = 1 could leave a pair without a value: no E004 level and no job in vm_jobs_fasthenry.json
  uses that combination, and the job list records each job''s wire_n and wire_sub. (2) solve_layout()
  refuses multipole on die_model=''distributed'' decks (the T0409 segfault): say which die model each
  job uses, and project memory and time for direct solves wherever it is distributed. (3) FastHenry reports
  its post-refinement filament count only once a run has started, so multipole memory is limited by the
  adapter''s watchdog alone: the memory projections in the job list carry a stated margin, and the runner
  records each attempt''s peak RSS.



  Reviews T0427 (physics) and T0428 (numerics) of T0385 (both accept with caveats; founder session, 2026-11-17):

  A. The thickness ladder. T0428 found a deterministic multipole crash: the test''s mini_layout at cell
  0.5 mm, plane cell 1.0 mm, nh_trace = nh_plane = 5 (2896 filaments) crashed with SIGSEGV on 11 of 11
  attempts, each in about 0.35 s, in ''Forming sparse matrix preconditioner''. Direct mode solves the
  same deck, and multipole solves it at nh 3 and 9. Retries therefore cover random crashes only. Before
  writing vm_jobs_fasthenry.json, run every multipole ladder deck you plan (Case 4 development pairs and
  gen2_0) far enough to see whether it gets past the preconditioner: locally where the deck fits in memory,
  otherwise as the first VM job. Record each deck that crashes on every attempt, and state in the job
  list and in E004''s draft what happens to such a deck (direct mode where memory allows, or a missing
  value that F1 turns into an exclusion). Never substitute another level silently.

  B. The E004 runner: (1) calls fasthenry_run.self_test() once on each host and stores its record, keyed
  by binary_sha256, beside every FHResult; (2) passes explicit timeout_s and mem_cap_mb for every level
  (the defaults, 3600 s and 6000 MB, are below P4''s projection of about 2.4 h and 10 GB for the judged
  level, and a timeout or memory kill is not retried); (3) records each attempt''s peak_mem_mb and wall_s.

  C. Small adapter fixes in src/moduleforge/solvers/fasthenry_run.py and tests/unit/test_fasthenry_run.py:
  (1) SIGKILL not sent by the watchdog (e.g. the Linux OOM killer) and a non-zero exit code repeated identically
  on consecutive attempts are not retried (T0428 confirmed both are retried 10 times with fake binaries),
  with tests; (2) _freqs_match requires a 1 x 1 Zc.mat with R > 0 and Im Z > 0 at every frequency, else
  parse_error (a negative Im Z and a 2 x 2 matrix were both accepted), with tests; (3) self_test() requires
  the version banner ''FastHenry 3.0wr'' and ''mod 031424'' in the run log, so a different build (e.g.
  FastHenry2, which D0002 rejected on licence grounds) fails it; (4) the self-test''s closed-form check
  is implied by the 1.5e-3 nH check and can never fire: compare instead with the exact uniform-current
  value of the D0002 bar, 5.704254 nH (Hoer-Love), or drop it; (5) set MEM_MARGIN from peak_mem_mb / direct_mem_est
  on two or three direct runs above 5k filaments (T0428 measured ratios of 1.24 to 1.26 to the estimate,
  so the effective margin of about 1.18 is too small), and state the fit in the code comment.



  T0387''s report (founder session, 2026-11-17): (1) an l2_layout 0.25 mm solve on 2D_Case_4 peaks at
  15.8-15.9 GB per process (research/notes/l2-thread-calibration.md; research/o006_p3/solves/case4_base__lat0.25.json),
  not the 8 GB earlier briefs assumed: E004''s cost plan and VM sizing use the measured figure. (2) F7(b)
  passed locally: the 2D_Case_6 0.25 mm solve has 1,095,080 unknowns and took 595 s and 4.75 GB, with
  GMRES converged. (3) L1 overstates large effects: l2_layout at 0.5 mm minus L1 ranges from -0.017 to
  +0.046 over the 11 Case 4 development pairs (the stand-in is 0.7616 at L1 and 0.8074 at 0.5 mm). The
  range the solvers judge is therefore narrower than the registered L1 span; beside the L1 span, the spec
  reports the covered range on the solvers'' ratios, as O004 states.



  Founder decision 2026-11-17T01:41:03+00:00 (recorded by the founder session, review T0429 of T0387):
  F1''s caps are relative to the ratio. A counted pair needs E_R / r <= 0.5 % for l2_layout and E_R /
  r <= 1 % for FastHenry, with E_R the gci_step_floor estimate of the three-level ratio sequence (ratio
  units) and r the finest ratio. E004''s F1 exclusion check, its smoke mode and its tests use this reading,
  and the spec states it. (T0387''s pilot_l2.py used the absolute reading E_R <= 0.005; it is corrected
  before burst 1''s results are assembled.)



  Founder session, 2026-11-17: T0438 (a builder) makes the perturb.py fixes T0388 could not (reviews T0416,
  T0387). After it merges, refreeze E004.yaml''s config.freeze: perturb_rules_sha256 (T0438 reports the
  new value), the perturb.py file hash, the commit, and the supplement hash if it changes; rerun the registration
  smoke and the dev-span simulation.



  Reviews T0440 (physics) and T0441 (numerics) of T0388, both accept with caveats (founder session, 2026-11-17).
  In experiments/drafts/E004.yaml and experiments/runners/e004_run.py:

  1. Freeze coverage: config.freeze.files hashes only physics/peec/model.py for L1, but kernels.py (the
  partial-inductance kernels), geometry/conductors.py (decompose_polygon, RectCell, used by on_lattice),
  geometry/units.py and the package __init__ files are on the executed path and hashed nowhere. Hash every
  moduleforge module present in sys.modules after the registration and solve imports (or list them all),
  and pin scipy in config.freeze.packages beside numpy and shapely (l2_layout uses scipy.sparse, scipy.sparse.linalg
  and scipy.fft).

  2. Gate the reference lattice check together with references_whole_mm in step 3, before any sealed draw;
  re-check DRC on every compound intermediate in pair_records (the stagewise rule); make a ValueError
  from measured_rules on a judged reference a RegistrationRefused that names the cause.

  3. Checks that cannot fail: seed_provenance compares the seed with the value just set from it; compare
  instead with the sealed seed ExperimentRun records from the registry, and re-derive each slot''s draw
  seed and moves from it. layouts_drc_clean_distinct repeats draw''s own check; say so, or make it independent.

  4. Smoke mode: the proxy record is appended to per[''2D_Case_2R''], but smoke slot ids are ''2D_Case_2R<-dev:2D_Case_4''
  (latent KeyError once the proxy pair is built): key it by slot id.

  5. L1 resolution: L1 runs at DEFAULT_HMAX = 4 mm, where r_L1 moves by up to about 0.005 between hmax
  4, 2 and 1 mm (T0441). Record hmax in config, report r_L1 at hmax/2 beside each gate value, and flag
  pairs within 0.005 of 0.75, 0.90, 0.98 or |1 - r| = 0.06.

  6. O004 scope_in asks that the development-seed ratio distribution be reported at L1 and at l2_layout
  0.5 mm before registration: cite T0387''s l2_layout 0.5 mm values for the 11 Case 4 development pairs
  (research/o004_f7/f7c_local.json) in the spec.

  7. The span and allocation (finding 2 of both reviews: 0 of 200 pooled draws pass; the binding term
  is ''at least 3 below 0.90'') are a founder decision, taken after burst 1''s F7(c) results. Do not change
  the allocation or the span; keep the registration check as O004 states it.

  8. The founder decisions the spec cites (F1''s relative caps, I0207, I0217) are recorded in O004''s
  state log, which blinded critics do not see; the founder will record them as decision records before
  registration. Cite them as ''founder decision, O004 state log, <date>'' until then.



  Correction (founder session, 2026-11-17): item C of the T0427/T0428 note above (the five fasthenry_run.py
  adapter fixes) is not this task''s: a scientist may not write src/ or tests/unit/. A builder makes them.
  This task still measures what C(5) needs: peak_mem_mb / direct_mem_est on two or three direct FastHenry
  runs above 5k filaments, reported with the job list, so the builder can set MEM_MARGIN from the fit.



  Founder session, 2026-11-17: the founder accepted decision record D0024 (project/decisions/, commit
  9a54cdb0). The spec and notes cite D0024 for the pre-registration decisions it records, instead of the
  objective''s state log.



  T0438''s report (founder session, 2026-11-17): the new perturb.rules_sha256() is 24d12d8062c55f798c8410b1dee333dbf05e47bd05142c84b9d1119ac10fea73
  (commit 98d23862). Draw output changes for the same seed: the net is now drawn uniformly over NETS first,
  and _draw_single silently redraws when that net''s long sides raise (a both-sided edge). Rerun the development
  span simulation under the new rules. In registered mode, record per judged reference how many draws
  were redrawn for this reason and which nets can never yield a trace_width move, and say in the registration
  report if a move type''s draws are restricted on a reference. A redraw that changes coverage must not
  be silent.



  Review T0444 of T0437 (founder session, 2026-11-17): proxy_descent(step_mm=1) is not on the 1 mm lattice
  by construction when reach=True. The reach jumps (twin._walk_candidates) go to outline limits or pad
  edges, which may sit at x.5 mm. When you wire the 2D_Case_2R proxy pair (D0024 item 3), check that every
  visited layout and the end point are on the 1 mm lattice, and report the result. If a jump leaves the
  lattice, stop and say so: the fix is a builder change in control.py (filter the jumps to multiples of
  step_mm), and D0024''s ''by construction'' wording would need an amendment.



  Review T0445 of T0442 (founder session, 2026-11-17): T0442 set MEM_MARGIN = 1.30 from T0428''s figures,
  which are not in the repository; the only in-repo direct runs (research/o006_p4/runs.jsonl) give peak/estimate
  ratios of 1.094 (8344 filaments) and 1.011 (14364). Commit your direct-run measurements as research/o004_f7/fh_direct_mem.json,
  with filaments, direct_mem_est_gb, peak_mem_mb and the ratio per run, so that MEM_MARGIN can be refitted
  on an in-repo basis.



  Founder session, 2026-11-17: T0451 (a builder, after T0438 and T0442) completes the perturbation-rules
  hash coverage (Die.bounds, _ring_ints; review T0446). Refreeze E004''s perturb_rules_sha256 once, from
  the value T0451 reports, not from T0438''s 24d12d80....



  Reviews T0447 (physics) and T0448 (numerics) of T0388 attempt 2, both accept with caveats (founder session,
  2026-11-17), beyond what is already listed above: (1) add geometry/layout.py and geometry/stack.py,
  which build the conductor model both solvers read, to code_under_test and the freeze; (2) the mesh-shift
  flag uses |r_4mm - r_2mm| with a 0.005 floor, which underestimates the 4 mm error: flag on the larger
  of that and a three-level estimate, or say why not; (3) the smoke stage crashes instead of recording
  when no pair is drawn: record it as a failed draw; (4) seed_provenance: see item 3 of the T0440/T0441
  note.



  Founder decision 2026-11-17T15:58:20+00:00 (span and allocation; recorded by the founder session, O004
  state log; D0024''s open item, decided in principle): implement a frozen banded-acceptance rule in E004''s
  registration stage.

  - Pairs are drawn from E004''s sealed seed exactly as now. A frozen rule accepts or redraws each slot
  so that the pooled registered pairs fill L1-ratio bands: at least 3 below 0.90 and at least 1 at or
  above 0.98, at both frequencies. Every move type keeps at least one pair per reference.

  - Redraws stay within a frozen limit, and registration refuses if a band cannot be filled within it.
  Record every redraw and its reason (the band, or T0438''s both-sided-edge redraw).

  - L1 is the only quantity consulted. No pair is seen at l2_layout or FastHenry before its solves (F2).

  - Simulate the rule on 2D_Case_4 with at least 200 development seeds under the current rules, after
  T0438 and T0451. Report the fraction of draws that pass the registration check for lower ends 0.76,
  0.78, 0.80, 0.82 and 0.85, the distribution of each draw''s lowest r_L1, the mean and maximum redraws
  per slot, and per-type coverage under the 6 % rule.

  - The founder then picks the lower end and amends O004''s span text, which is frozen and re-approved;
  keep 0.75 in the code until then.

  - Burst 1''s F7(c) result for context: 0 of 13 development pairs excluded, largest E_R/r 0.349 % (research/notes/o004-f7-l2-pilot.md).



  T0451''s report (founder session, 2026-11-17): the rules hash it computed is 2dbd9977efa56bec0a4317f1adf14bd0ffc4b172520a707e2c6890ea9888b8cd
  (commit f6bdaf7a). Recompute perturb.rules_sha256() on main after T0451 merges and freeze that value,
  not this one, if they differ. LongSideError now marks the legitimate redraws (a both-sided edge, or
  a net with no long side), and other _draw_params errors fail loudly. apply''s ValueErrors are still
  redrawn, so the registration report must record every redraw with its exception type and message, per
  reference and move type, so that a reference defect cannot pass as a silent redraw.

  '
