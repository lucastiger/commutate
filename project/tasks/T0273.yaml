    - I changed test_every_lateral_parameter_on_the_design_grid. It still asserts the 0.5 mm grid for
      copper, dies and landing lines (now `vec[4:N_COPPER_PARAMS]`). Wire feet and landings are asserted
      on the finer 0.125 mm grid as absolute positions, because the reference's own bond points are on
