  report:
    status: completed
    summary: 'All four items are done and committed as fc44e5a6. Every DoD command passes: generate+drc
      tests, the fast unit suite (691 passed), ruff, the thermal_fem.py sha check and `mfos gate --fast`.


      (1) Wire feet are now parameters. `Params` gains `feet` (per row: fu0, fud, pitch, fv, land_du,
      land_dv) and `sigfeet` (gate/Kelvin foot offsets within their pads). The sampler draws feet and
      landings on a 0.125 mm grid, with a clear-of-signal-wires placement. A new test builds the Case
      4 reference from a Params vector and asserts every wire''s start and end within 1e-6 m, plus the
      copper, the die centres and DRC cleanliness. Another test shows the old fixed-foot rule misses the
      reference wires by more than 0.9 mm.


      (2) Multi-wire dies on Case 4. With 2 and 3 wires per die under the default rules, `generate` returns
      DRC-valid candidates with no RuntimeError. To get there I also tightened the sampler''s gate/Kelvin
      window: it now uses the pad-centre offset instead of the die centre, so it no longer rules out feasible
      layouts by about 5 mm. With a 2 mm minimum wire pitch, 1 or 2 wires per die are geometrically infeasible,
      and a test shows why:

      - A power foot can be at most (Kelvin_max − gate_min)/2 = 1.35 mm from the nearer signal wire, which
      is under 2 mm.

      - 3 wires need 4 mm of a 3.2 mm pad, so the spec raises ValueError.

      - `generate` raises RuntimeError for 1 and 2 wires at 2 mm.

      - The limit is in the module docstring.

      - No DRC rule was relaxed.


      (3) Diversity under `measure_rules(Case 4 reference)`. Values used: edge margin 5 mm, power width
      5 mm, die spacing 6 mm, die edge margin 2 mm, spacings 3/3/5/2 mm. Replaced where measure_rules
      has nothing meaningful:

      - Max power wire is the reference''s longest wire, 16.151 mm (measure_rules leaves the 15 mm default,
      which the reference itself violates).

      - Wire pitch stays at the defaults 0.6 mm / 2 diameters, because the measured 10 mm is the distance
      between different dies'' wires.

      - Signal limits stay at the assumed 25 mm.


      Exactly 2 of the 8 sequences are feasible, both split and in orientation x:

      - The reference''s own [PHASEd, DC-l, PHASEl, DC+d], with 5.75 mm slack on the LS dies and 9.35
      mm on the HS dies.

      - [PHASEd, DC-l, DC+d, PHASEl], with only 1.35 mm slack on the HS dies.


      The 6 excluded sequences, by rule and margin:

      - LS pair [DC-l, PHASEd] (2 sequences): max_kelvin_wire_length, short by 2.25 mm.

      - HS pair below the LS pair (4 sequences): max_kelvin_wire_length, short by 24.9 mm.

      - Orientation y (all 8): excluded by sampling, not a closed form. No sampled candidate passes the
      copper rules, and the best one has a signal wire at least 5 mm over the limit. A scratch run of
      60,000 draws gave 14.9 mm over.


      This is recorded in the test docstrings and the module docstring as a limit of the search space
      on this housing and these rules.


      (4) Minor findings. The housing test is renamed `test_housing_feasible_set_is_exactly_five_sequence_variants`
      and asserts the exact set of 5 variants. `test_drc_clean_under_spec_rules` now says it only checks
      that the filter is applied. A new cross-process test checks identical fingerprints for the same
      seed.'
