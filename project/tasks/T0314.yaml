  report:
    summary: 'I reproduced all three recorded R0 outcomes using E008''s own construction:

      - 2D_Case_2R: TwinError on signal_wire_length (4.597 mm is outside [5.344, 10.396] mm).

      - 2D_Case_6: TwinError, no (orientation, sequence) fits.

      - 2D_Case_4: twin mode fit+signal_feet, then DegradeError at 1.232 after a 75-step walk that stops
      at a local maximum.


      Each layout fails for a different reason.

      - **2D_Case_2R** fails on one rule, min_signal_wire_length. Without it (R1) the twin is exact on
      the power copper (symmetric difference 0 on every net), L1(W)/L1(ref) = 1.0000, and D reaches L1(D)/L1(W)
      = 1.395, above the 1.388 target. O003 scope_in bounds gate wires only from above. The lower bound
      comes from measure_rules, which E008 uses unmodified, so it is E008''s choice, not an O003 requirement.

      - **2D_Case_6** fails on its structure, not on a rule. All 21 single-rule relaxations still fail
      at twin.py''s candidate filter. The two switch blocks sit side by side with wires running in opposite
      directions, so the HS pair (v 15.5–22.0) and LS pair (18.0–24.5) overlap and no slot order fits.

      - **2D_Case_4** fails on min_width_power = 5 mm, the reference''s own minimum power-net width, which
      O003 requires. Relaxing that rule alone reaches 1.421, the value twin.py records, which was measured
      under the default 1 mm rule. No other single relaxation gets there (best 1.293). My two prototype
      changes to the degradation rule reached only 1.260 and 1.240.


      R2 is skipped: I found no citable minimum length for 0.30 mm aluminium gate wires (one search; the
      Tyndall design-rule PDF returned 404).


      Deliverables: the script research/scripts/o003_twin_coverage.py, research/o003/twin_coverage/results.json
      (a second run reproduced it byte for byte), and the note research/notes/o003-twin-coverage.md covering
      items 1–6.'
    failure_class: none
    root_cause: 'Three different causes, one per layout.

      - 2D_Case_2R: the lower gate-wire length bound that measure_rules derives from the reference''s
      shortest gate wire (5.344 mm). O003 does not require it. The generator always runs a gate wire to
      the nearest point of its gate copper, so a twin gate wire is the shortest wire possible from its
      foot. The reference''s wires land 1.13–1.91 mm beyond that point. The twin''s repair step cannot
      lengthen a wire: the 0.5 mm gate pad allows only one foot position.

      - 2D_Case_6: twin.py''s candidate filter requires one total order of the four slots across the die
      rows (twin.py lines 412-414). Case 6''s side-by-side switch blocks interleave in that direction.
      In the other orientation the dies of each switch are not in one row (_rows_of returns None).

      - 2D_Case_4: the O003-required minimum power-net width of 5 mm. The twin''s landing bands are already
      5 mm wide, so the first degradation move cannot narrow them. The keep-out strips block every spread
      move at the 2 mm spacing. The walk ends with every power feature at its rule minimum.'
