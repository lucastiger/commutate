  \ config.f3_declared_deviation.statement and rules_changed overstate.\n   Make them exact, and the same\
  \ everywhere the statement is copied (rows, evaluation report, notes, design note): no\n   design rule\
  \ of the reference, the twin or the candidates on power copper, power wires or dies changed; the power-width\n\
  \   floor of the yardstick D (D0018 decision 1, T0316) did; the change prompted by 2R removed the lower\
  \ bound on gate and\n   Kelvin wire length (T0317). This matches D0019 Context and item 2.\n2. T0321\
  \ finding 2: a selftest case where config.freeze holds a wrong sha256 for the reconstruction script,\
  \ registered_run\n   raises before any reference is loaded, and a counting fake build()/snapped() is\
  \ never called. --check-references runs\n   freeze_checks first and refuses on any mismatch.\n3. Founder\
  \ decision: an admissible reference excluded by TwinError, DegradeError or D's definition contributes\
  \ no rows;\n   if it is the only reference of a non-default stack type, that type is REPORTED, NOT GATED:\
  \ no spot check; the\n   evaluation report lists F6e.<type> with reference null and status 'only reference\
  \ excluded: <reason>', and the detail\n   of F6e_stack_type_spot_check lists it; the aggregate is not\
  \ failed by it. Selftest case. Record the decision in the\n   spec (founder_decisions_settled) and keep\
  \ the separate F6(e) reading for all-inadmissible types as a founder item.\n4. Launch procedure for\
  \ the registered run, as a script for the founder: research/o003/e008_dev/burst_full.sh, in the pattern\
  \ of burst_dev.sh, using\n   scripts/burst_gcp.sh unchanged where it can (read how it mints the run,\
  \ passes the sealed seed and never seeds a\n   registered experiment with earlier results). Constraints:\
  \ one 8-vCPU N2D VM at a time (free trial); phase A on\n   config.compute.vm's machine; any job above\
  \ phase A's usable memory (today only F6(e) on 2R) runs alone after the same\n   VM is stopped, resized\
  \ to the machine type --plan names for it and restarted, and the same run resumes from its own\n   workdir\
  \ on the same disk (no copy of earlier results into a registered run). If burst_gcp.sh cannot do this\
  \ unchanged,\n   write the procedure in research/o003/e008_dev/burst_full.sh with plain gcloud commands.\
  \ --dry-run prints every command in order and runs none.\n   Write the founder's exact commands, the\
  \ expected output and the failure modes (zone out of capacity, resize refused,\n   preemption) in research/notes/e008-design.md.\n\
  5. Re-stamp every hash the runner edit changes (dev prep scripts, L0/L1 on dev layouts only, as T0320\
