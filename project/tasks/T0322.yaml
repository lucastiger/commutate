      (1) **Deviation wording (finding 0).** `config.f3_declared_deviation.statement` and `rules_changed`
      are now exact. No design rule of the reference, the twin or the candidates on power copper, power
      wires or dies changed. The power-width floor of the yardstick D did (D0018 decision 1, T0316). The
      change prompted by 2R removed the lower bound on gate and Kelvin wire length (T0317). Rows now carry
      the full statement instead of ''D0019 item 2''. The evaluation report, the notes and design-note
      section 11 carry the same text verbatim. The selftest checks the spec''s own statement word for
      word in rows, report and notes, and checks that the old wording is gone.


      (2) **Freeze checked before loading (finding 2).** `--check-references` now runs `freeze_checks`
      first and refuses on any mismatch. New selftest case: the reconstruction script''s sha256 in `config.freeze`
      is set to zeros. `registered_run` then raises the freeze error and records `freeze_hashes` as failed,
      `check_references` returns 1, and a counting fake `snapped()`/`build()`/`l2_unknowns()` is never
      called.


      (3) **Founder decision on F6(e).** A non-default stack type whose references were all excluded (TwinError,
      DegradeError or D''s definition), at least one of them admissible, is reported and not gated. The
      report lists it as `F6e.<type>` with reference null and status ''only reference excluded: <reason>''.
      It is listed in the detail of `F6e_stack_type_spot_check`, gets no spot check, and does not fail
      the aggregate. Selftest covers three exclusion cases plus the full registered-path case. The decision
      is recorded in `founder_decisions_settled` and the old item is removed. The all-inadmissible reading
      stays a founder item.


      (4) **Launch script `research/o003/e008_dev/burst_full.sh`.** `scripts/burst_gcp.sh` deletes its
      VM on every exit and never resumes a registered run, so it cannot stop, resize and restart one VM.
      The script therefore uses plain gcloud and calls `burst_gcp.sh` unchanged only for the quota check.
      It keeps its rules: the run is minted once on this machine, only the seed file and a git bundle
      of main reach the VM, the VM is regular (not Spot), and no earlier result is ever uploaded.

      - The runner now has a phase A stop. In the registered run, jobs larger than the VM''s memory are
      held back while everything else runs. When only those remain, the runner writes `work/phase_b_needed.json`
      and exits 75 without writing a result.

      - Phase B: the script stops the same VM, resizes it to the machine `--plan` names (n2d-custom-8-499712-ext)
      and starts it again. It sets `E008_SOLO_RAM_GB`, which the runner refuses if it exceeds the machine''s
      real memory. The same run then resumes from its own workdir on the same disk.

      - A child process killed without a result file (for example out of memory) now stops the run instead
      of being relaunched in a loop.

      - A selftest covers the phase A stop and the phase B resume.

      - The script keeps state across interruptions and never mints twice. `--dry-run` prints all 30 commands
      in order and runs none.

      - Design-note section 11 has the founder''s commands, the expected output and the failure modes.


      (5) **Re-stamped hashes.** The new runner sha256 (8b46e380…) is in `E008.dev_rows.json` in 3 places.
      I re-ran the three dev prep scripts on dev layouts only. The results equal T0320''s: Case 4 twin
      fit+signal_feet, walk 7 steps, 33/2000 DRC-clean; gen2_0 smoke_rows_match true. `--plan` output
