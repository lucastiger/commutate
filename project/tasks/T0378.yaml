  report:
    status: completed
    summary: 'Added src/moduleforge/optimize/local.py with the shared descend primitive and the seeded
      local_search, plus 16 tests. They are committed as bedff0e8. All DoD commands and the fast gate
      exit 0.


      **descend:**

      - Steepest single-parameter descent, with `step_mm` and `dies_fixed`.

      - Every candidate must build, be DRC-clean under spec.rules and satisfy in_domain(reach=True).

      - Ties go to the first in Params.NAMES order. The neighbourhood is ±step per parameter plus the
      twin''s reach jumps.

      - It returns local_optimum or step_limit, the step count and the trajectory. At step_limit the neighbourhood
      is not examined once more.


      **local_search:**

      - Signature is (spec, seed_layout, seed, solvers, cfg, workdir, score). No input can carry W or
      W*.

      - Each iteration screens the single-parameter neighbourhood plus seeded joint moves through the
      injected score. The default score is L1.

      - It perturbs when stuck. The budget is counted in distinct-fingerprint L1 evaluations.

      - At the end the K lowest-score distinct layouts go to l_sub, and the best is the lowest L_sub.

      - Randomness comes from SeedSequence([seed, kind, counter]). The config is a frozen dataclass with
      a stable hash.

      - Solves are appended to a JSONL Store (reusing search.Store), so a rerun re-solves nothing.

      - Per run it records steps, L1 evaluations, whether it stopped at the budget, whether it was still
      improving in the last 10 %, moves, changed parameters, Manhattan distance from the seed, Spearman
      rank correlation of L1 and L_sub, the L2/L1 ratio range, and the yield per move kind.


      **Domain:** every candidate the search moves to satisfies in_domain(reach=True), so the moves are
      kept inside it. The seed layout only has to build and be DRC-clean, because a degraded copy can
      lie outside the domain. `stats[''seed_in_domain'']` records whether it did. The docstring says this.
      The 2R test checks that every layout visited after the seed is in the reach domain and DRC-clean.


      **Yield (valid / proposed, Case 4, real L1, 800 evaluations):**

      - Single ±step moves: 68 %.

      - Reach jumps: 52 %.

      - Joint moves: 22 %.

      - Perturbations on the 70x40 housing with a synthetic score: 6 %.


      **Wall time per L1 evaluation on Case 4:** 0.013–0.016 s (800 evaluations: 12.7 s of L1 in 15.9
      s wall). This is in the module docstring.


      **Scope calls:**

      - Movable parameters are the columns, slots, die rows and landing lines (Params.NAMES[4:38]) plus
      the wire-landing foot parameters `foot_*_land_du` and `foot_*_land_dv`, which move in 0.125 mm steps.
      I read "wire landings" in the packet as these. If the founder meant only the landing lines, drop
      `_FOOT_LAND` in `movable_indices`, so that the proxy rule and the nulls use the same set.

      - I added a `LocalSolvers(l1, l_sub)` dataclass rather than reusing `search.Solvers`, which also
      requires band and thermal callables this search does not use.'
