description: "Build item (2) of the objective notes. Create src/moduleforge/optimize/local.py beside search.py\
  \ and reuse search.py's Store, checkpointing and solver-injection pattern.\n\n(a) A shared primitive\
  \ descend(spec, params, score, movable, step_mm=0.5, step_limit, dies_fixed=False):\n   - steepest single-parameter\
  \ descent over the movable parameters (columns, slots, die rows, landing lines and wire landings: the\
  \ parameters the hypothesis names);\n   - every candidate must build, be DRC-clean under spec.rules\
  \ (a hard constraint) and satisfy in_domain(reach=True);\n   - ties go to the first in Params.NAMES\
  \ order;\n   - it stops at a local optimum or at step_limit, and returns the terminal kind (local_optimum\
  \ or step_limit), the step count and the trajectory.\n   The proxy rule (n3) and the nulls (n4) reuse\
  \ this primitive with other scores.\n(b) local_search(spec, seed_layout, seed, solvers, cfg, workdir):\
  \ the seeded search.\n   - Its only inputs are the spec, the layout it is seeded at and a seed. It has\
  \ no argument through which W, W* or their values could reach it.\n   - Moves: the DRC-valid single-parameter\
  \ neighbourhood, plus a seeded sample of joint moves (several parameters, grid steps) over the whole\
  \ reach domain.\n   - L1 screen through an injected score (default: L1 of the commutation loop; the\
  \ hook takes the layout and solver outputs, so thermal and current-sharing terms can be added later).\n\
  \   - Seeded perturbation when stuck.\n   - Fixed budget counted in L1 evaluations.\n   - At the end,\
  \ a fixed shortlist of K distinct lowest-score visited layouts goes to the injected l_sub (l2_layout\
  \ at 0.25 mm in the runner); the best is the lowest L_sub.\n   - All randomness comes from numpy SeedSequence([seed,\
  \ ...]); there is no global state.\n   - The config is a frozen dataclass with a stable hash.\n(c) Record\
  \ per run (F1, F4):\n   - steps, L1 evaluations, whether it stopped at the budget, and whether it was\
  \ still improving in the last 10 % of the budget;\n   - move count and changed-parameter count against\
  \ the seed;\n   - parameter-space (Manhattan) distance from the seed;\n   - Spearman rank correlation\
  \ of L1 and L_sub within the shortlist, and the L2/L1 ratio range.\n   Store every solve append-only,\
  \ so a rerun re-solves nothing.\n   Measure and record the wall time per L1 evaluation on Case 4.\n\n\
  Tests, in tests/unit/optimize/test_local_search.py, with injected cheap solvers:\n- on the 70x40 housing,\
  \ a synthetic separable score with a known DRC-feasible optimum is reached;\n- determinism for a given\
  \ seed, and different trajectories for different seeds;\n- every visited layout is DRC-clean and in_domain;\n\
  - the L1 budget is respected exactly, and l_sub is called exactly K times on distinct fingerprints;\n\
  - the signature exposes no W or W* input;\n- descend stops at a true local optimum: no single DRC-valid\
  \ move improves the score;\n- a resumed run from its checkpoint gives an identical result.\n\nFounder\
  \ session, 2026-11-16 (from T0377's reviews T0402 and T0403, both accept with caveats): T0377's in_domain\
  \ is a superset test (no upper bound on stack gaps), and its docstring calls it the local search's domain\
  \ although the walk can leave it. Keep the search's moves inside in_domain, or state plainly in the\
  \ docstring and the report that they are not kept inside; test it on the 2R spec, the only split-free-region\
  \ spec. Reach mode yields 3-5x fewer DRC-clean draws per raw draw; report the yield of your moves."
