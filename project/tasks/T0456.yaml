    summary: 'Nothing gated was changed: L1, c(s), criteria, thresholds, bound and m are untouched. These
      are development rows and design-time simulation only, not evidence.


      **1. u_shaped/6 (A4 0.951 on T0398''s 3 layouts)**

      - **Cause:** the ratio is 0.0950 / 0.0998 K. T0398''s three layouts have almost the same reference
      spread (about 10 K, sd 0.089 K, CV 0.9 %). The same dies (die_index 2 hottest, 5 coldest) set every
      spread, so the leave-one-out stratum-mean null is almost exact. No single layout or die position
      dominates.

      - **L1''s error is systematic:** −0.086 to −0.099 K (about −0.9 %) in all 18 rows on 9 layouts.

      - **Calibration:** recalibrating to the stratum''s implied factor changes A4 only from 0.951 to
      0.924. But the form of the calibration accounts for most of the error. The raw coarse-FV spread
      is +0.07 K high, and the fixed rise factor c = 0.98402 shrinks a 10 K spread by 0.16 K.

      - **Grid rule:** a finer L1 grid lowers the raw error (+0.04 K) but makes the calibrated error worse
      (−0.12 K), so the grid rule does not explain it.

      - **Reference:** the level-0 to level-1 spread change is only +0.012 to +0.019 K, so the reference''s
      own error is far below 0.09 K.

      - **Comparison with u_shaped/2** (calibrated family): A4 0.254. Its spreads are small and vary between
      layouts (sd 0.28 K). Its errors are grid-sensitive, and its reference changes by up to 0.10 K between
      levels.

      - **New layouts:** two of the 6 new layouts have spreads of 9.3–9.4 K and 11.1 K. The null''s error
      p95 rises to 1.0 K and A4 falls to 0.092 (new 6) and 0.096 (all 9).

      - **Inference:** T0398''s 0.951 was a small-denominator artefact; the numerator is a real but small
      bias.


      **2. Six more layouts per stratum** (seed 20261456, added to `seeds.forbidden`)

      - 36 level-1 solves, 1.15 CPU-h, peak 4.75 GB, P_ref reused from T0398 to within 1e-12. All checks
      passed except `allocation_fixed`, which fails by design (3 strata, not 15).

      - Per-stratum results (A4 at P_ref, A2 at the max over loads; V4 upper bound in brackets where reported):


      | stratum | A4, all 9 layouts / 18 switch rows (new 6 only) | A2, all 9 | A4 > 0.3? |

      |---|---|---|---|

      | interleaved/2 | 0.286 (0.272) | 0.0085 | no |

      | side_by_side/2 | 0.223 (0.243) | 0.0066 | no |

      | u_shaped/6 | 0.096 (0.092) | 0.0059 [0.0075] | no |


      - No per-stratum A4 upper bound is finite.

      - interleaved/2 is 0.014 below the 0.3 line. The corrected model gives about a 0.25–0.28 chance
      of exceeding 0.3 at 9 layouts.

      - HS/LS bias at P_ref (K): interleaved/2 +0.085 / **+0.364**; side_by_side/2 +0.216 / −0.103; u_shaped/6
      −0.020 / +0.041. Each roughly halves at 0.5 P_ref.

      - isolated_die A4 on the extra layouts: 1.06 / 1.99 / 10.19 on the new 6, 1.08 / 2.07 / 10.74 on
      all 9.

      - Of the three A4 nulls only isolated_die is informative: stratum_mean is A4''s own denominator
      (exactly 1) and die_position is about 1 by construction (measured 0.99999999999995).


      **3. Corrected power simulation**

      - **Model:** die deviations around the (layout, switch) mean with fixed die-position profiles; HS/LS
      offsets as fixed effects; reference variation measured and pooled per cell.

      - **Consistency check** (declared before running, gating): **pass**. Simulated median A4 is 0.108
      (normal) and 0.107 (t3) against 0.107 measured, inside the 5–95 % range.

      - **Not gated, but the model falls short here:** it over-predicts A3 (0.127 K simulated vs 0.091
      K measured, outside the range). It matches the per-stratum A4 at m = 9 only for interleaved/2; side_by_side/2
      and u_shaped/6 fall outside.

      - **Power, m = 20 / 24 / 32 / 40:**


      | errors | joint power | A4 alone | min V4 coverage over all 7 statistics |

      |---|---|---|---|

      | normal | 1.000 at every m | 1.000 / 1.000 / 0.999 / 0.997 | 0.974–0.987 |

      | t3 | 0.998 / 1.000 / 1.000 / 1.000 | 1.000 at every m | 0.971–0.981 |


