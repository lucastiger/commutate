    root_cause: 'u_shaped/6''s A4 of 0.951 is mainly a small-denominator artefact: T0398''s three layouts
      had nearly the same 10 K reference spread (sd 0.089 K), so the stratum-mean null''s error was only
      0.10 K. On top of that sits a small, systematic L1 spread bias of −0.09 K (−0.9 %), mostly from
      applying the rise-proportional calibration c(s) to a large inter-die spread. On 9 layouts the null''s
      error is 1.0 K and A4 is 0.096. The 2-die trips (0.352, 0.340) fall to 0.286 and 0.223 on 9 layouts.'
