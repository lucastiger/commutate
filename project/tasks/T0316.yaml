id: T0316
objective: O003
title: 'E008: degraded copy as a yardstick under a frozen power-width floor; exclusion when no valid D
  exists (founder decision D0018)'
type: design_experiment
agent: scientist
status: needs_founder
depends_on: []
description: "Implement founder decision D0018 (2026-11-12, founder session; the record is being committed\
  \ separately). Its\ntwo decisions are restated here in full:\n1. D is a yardstick. When E008's degradation\
  \ rule builds D, it may make D's power-net copper (DC+, PHASE, DC-) narrower\n   than the reference's\
  \ own minimum power-net width, down to a floor that E008's spec states and freezes. The floor is\n \
  \  at least the generator's default minimum width (1 mm), and wide enough that D's band solves resolve\
  \ the strip, so\n   that narrowing does not inflate e_R(control best, D) and with it w_ctrl. Every other\
  \ rule applies to D unchanged.\n   The main and control searches keep every O003 scope_in rule for their\
  \ candidates.\n2. Fallback: exclusion. If no D meets F1(b)'s definition for a reference (degrade() raises\
  \ DegradeError, or\n   L_sub(D)/L_sub(twin) is below 1.25 at the conservative end of its band), that\
  \ reference is excluded and reported\n   with the reason, like a twin-gate failure, and E008 is INVALID\
  \ only if no reference remains. A control that runs and\n   misses h_plant - w_ctrl is still INVALID\
  \ (O003 F1 response). A TwinError or DegradeError stops that reference, not\n   the run.\nBackground:\
  \ T0314 (research/notes/o003-twin-coverage.md, review project/reviews/T0314/T0315.json). On 2D_Case_4,\
  \ E008's\ndegrade() stops at 1.232 against 1.388 because min_width_power (5 mm) is the binding rule;\
  \ relaxing it alone gives\n1.421. The control search builds candidates from the reference's spec (search.run_control\
  \ -> _screen(spec, ...)); D is\nused only for L_sub(D), its band solves and w_ctrl.\n\nLimits: develop\
  \ on generator layouts and 2D_Case_4 only. Do not load 2D_Case_2R, 2D_Case_6, customer data or any other\n\
  module's geometry; do not search the web for module layouts. Do not change src/ (generate, drc, optimize,\
  \ solvers) or\nany test under tests/acceptance: make the change in experiments/runners/e008_run.py,\
  \ for example by passing degrade() a\nspec whose rules have min_width_power replaced by the floor. If\
  \ that is impossible without a src change, stop and say\nwhy. Do not edit src/moduleforge/solvers/thermal_fem.py\
  \ (sha256 a216d5fe...). Do not widen any other tolerance, relax\nany other gate, or change the cost\
  \ model. Do not decide the founder items the spec lists. L0/L1 only, except as allowed\nin item 2.\n\
  \n1. Runner. prepare() builds D with the floor rule of decision 1. The record says that D was built\
  \ under it and gives\n   D's narrowest power strip. W, the candidates, and both searches keep the reference's\
  \ rules. Decision 2 runs through\n   prepare(), Run.drive, assemble_rows and evaluate(): an excluded\
  \ reference has no rows and is reported with its reason;\n   at_least_one_counted_reference decides\
  \ INVALID. Selftest:\n   - a planted DegradeError on one of two references: excluded, the other counted;\n\
  \   - the same on the only reference: INVALID;\n   - a planted L_sub(D)/L_sub(twin) below 1.25 at the\
  \ band's conservative end: excluded;\n   - a planted control miss: still INVALID;\n   - D on a planted\
  \ layout whose power bands sit at the reference minimum narrows below it, but not below the floor.\n\
  2. The floor, with evidence. On 2D_Case_4 and at least 6 generator housing layouts with a 2-5 mm power-width\
  \ rule,\n   report for floors of 1.0, 1.5 and 2.0 mm (and the reference minimum): the L1 ratio degrade()\
  \ reaches, the moves, the\n   walk's terminal kind, and the number of lattice cells across D's narrowest\
  \ strip at the band-solve cell size and at\n   0.25 mm. Say whether e_R on such strips is expected to\
  \ be larger than on rule-width strips. Use existing evidence\n   first: E006/P3, O006/O007 notes, and\
  \ T0291's Case 4 figures (L1 1.421, L2 1.325, twin bias 15.3 %, D bias 9.2 %).\n   If the evidence does\
  \ not settle it, run l2_layout band solves on at most two generator layouts no larger than\n   gen2_0,\
  \ at 0.5 mm, comparing D at the candidate floor with D at the rule width. No Case-4-size L2 solve. Choose\
  \ the\n   smallest floor the evidence supports, freeze it in the spec with the reason, and report what\
  \ was measured.\n3. Spec (experiments/drafts/E008.yaml) and design note:\n   - failure_consequences\
  \ for DegradeError and D_misses_1p25_in_L_sub follow D0018;\n   - fail_fast_twin_and_D says \"stop the\
  \ reference\";\n   - remove the first founder_decisions_before_registration item (settled by D0018)\
  \ and cite D0018 where it was;\n   - state the floor, its evidence and the yardstick reasoning;\n  \
  \ - re-stamp every hash the runner edit changes.\n   Re-run the 2D_Case_4 L0/L1 fail-fast record (research/o003/e008_dev/case4_prep.py)\
  \ and update\n   experiments/drafts/E008.dev_rows.json and research/notes/e008-design.md with the new\
  \ facts. Say whether D now reaches\n   1.388, with its moves.\nThe registered path (full(), judged-reference\
  \ loading) and the reference set stay out of scope."
