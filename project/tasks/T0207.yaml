id: T0207
objective: O007
title: 'O007 development study: choose and freeze the scikit-fem configuration (element order, h0, near
  margin, dz_max, mandatory lines, tolerances) on the reference cases and the two dev layouts; E009 memory
  and cost plan'
type: investigate
