description: "The objective requires one scikit-fem configuration, frozen before E009 is registered and\
  \ then used unchanged for every E009 case and by O003, with the element order chosen by a development\
  \ study on dev data. Use the production thermal_fem only (after the assembly and grid-rule tasks). Script:\
  \ research/scripts/o007_dev_study.py.\n\nBefore running anything, state in research/notes/o007-dev-study.md:\n\
  \  - the candidate list: Q1 and Q2, with a few (h0, near_margin, dz_max) settings, at most about 4 candidates\
  \ in all;\n  - the selection criterion: the cheapest configuration by finest-level peak memory that\
  \ meets A1, A2 and A4 with a margin you state, on every reference case, and A4 on the two dev layouts,\
  \ with E009's finest solves fitting the burst VM you state.\nNo outcome-dependent changes after that\
  \ without recording them as such.\n\nReference cases (frozen O006 references research/e006_refs/series_values.json,\
  \ sha256 befc5efa..., and mms_values.json, sha256 ca05847b...; verify the hashes first):\n  - Muzychka\
  \ Cases 1a, 1b, 2 and 3, and the N-layer DBC case, in box-stack mode. Mandatory lines go through each\
  \ source centroid and through the frozen reference's maximum location over each source.\n  - The manufactured\
  \ case in layout mode (geometry as e006_run.mms_layout, data from e006_mms.build_case). Its frozen point\
  \ coordinates are made nodes by the same mandatory-line mechanism.\n  - Per reported point (O006 A1\
  \ points: centroid, source mean, reference maximum; manufactured: its frozen points), record: the three\
  \ level values, |T - T_ref|, the scaled error (O006 A1 scale), mfos.metrics.gci_capped (floor 1e-3 K),\
  \ branch, p_obs, d1, d2 and the stencil per level.\n  - Per case, record the DOF growth ratio per level\
  \ (8 +/- 15 %), the energy balance (manufactured: against 64.648 W) and the Picard residual.\n  - Also\
  \ record the F3 null: constant k at the layer-mean temperature must fail A1 and A2.\n\nDev layouts only:\
  \ dev seed 20261101, side_by_side with dies_per_switch = 6 and u_shaped with dies_per_switch = 2; assert\
  \ the fingerprints of experiments/specs/E006.yaml. Never use another seed, E006's fresh layouts or data/holdout\
  \ (F4).\n  - Operating point: equal power per die calibrated on scikit-fem level 0, hottest die 60 +/-\
  \ 1 K above 65 °C coolant, h = 5000, k(T).\n  - Per die, record: three-level Tj max, GCI, branch, p_obs,\
  \ the Tj-max node coordinates per level and how often they move (T0198 rec. 3, T0202), and a constant-k\
  \ column.\n  - Count the sequences that are divergent or oscillatory.\n\nRecord per solve: DOFs, wall\
  \ time and peak RSS. Report Q2 bytes per DOF and an E009 table: all solves, peak memory, CPU-hours and\
  \ a recommended timeout.\n\nLocal memory rule: solve only within 0.85 x physical memory. For any level\
  \ that does not fit, record `levels_run`, label extrapolations explicitly, and provide a `--full` mode\
  \ with the exact command (scripts/burst_gcp.sh --cmd \"uv run python research/scripts/o007_dev_study.py\
  \ --full\" research/o007_dev) for a founder-run dev burst.\n\nOutputs:\n  - research/o007_dev/frozen_config.json\
  \ with keys element_order, h0_m, near_margin_m, dz_max_m, nz_min, mandatory_lines (the policy), quadrature,\
  \ linear_rtol, picard_tol_K (1e-4), levels ([0, 1, 2]), feasible (bool), rationale;\n  - research/o007_dev/dev_study.json\
  \ with every candidate's values and, under 'chosen', {'cases': {case: {..., 'node_count_ratio': [...],\
  \ 'levels_run': [...]}}, 'layouts': {name: {'levels_run': [...], 'dies': [{'gci_K', 'argmax_xyz': [one\
  \ per level run], ...}]}}};\n  - the note, with the dev A1/A2/A4 values that E009's spec will record\
  \ at freeze (K1/K2 regression guard).\nIf no candidate is feasible, set feasible: false and say so plainly.\
  \ That is a finding, not a failure of the task.\n\nFounder note (2026-11-03, diagnosis T0218): on grids\
  \ with near-threshold kept lines, scikit-fem's AMG-CG used 362 of its\n400 iterations at level 2 and\
  \ reached the cap at level 3. For every candidate configuration and every solve of the\nstudy, record\
  \ the CG iteration count and the final relative residual. Flag any solve above 300 iterations. A\nconfiguration\
  \ where any level-0 to level-2 solve of the reference cases or development layouts exceeds 300 iterations\n\
  is not eligible for freezing. Report this in the note and in dev_study.json; do not change the solver\
  \ or its limits\nhere."
