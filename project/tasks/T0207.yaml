  report:
    summary: 'None of the four pre-registered scikit-fem configurations can be frozen for E009, so frozen_config.json
      has feasible: false. The pre-registration was committed as df40ac9 before any solve. The four candidates
      were Q1 with h0 4 mm / dz_max 1 mm, Q1 with 2 mm / 0.5 mm, Q2 with 4 mm / 5 mm, and Q2 with 4 mm
      / 2 mm, all with near_margin 2 mm. Q1 misses on accuracy, measured at level 2. q1_h4 is 1.389 K
      off at the N-layer d3 source mean, against the 0.040 K margin and the 0.05 K of A2. Its A4 on the
      reference cases is 3.67 K, and the GCI is +inf on both dev layouts because some Tj-max sequences
      diverge. q1_h2 is 0.680 K off at the N-layer level 2. Q2 is much more accurate (Case 1a at level
      2: error 0.0115 K, GCI 0.042 K), but it fails the founder''s CG rule. It needs 359 and 352 iterations
      at level 1 on Case 1a and reaches the 400-iteration cap at level 2 on Cases 1a and 2. Q2 is also
      still 0.48 K off on the N-layer case at level 1. The gates hold everywhere: energy balance at most
      2.4e-11, node-count growth 7.04 to 7.77 per level, every reported point a node on all levels, reference
      hashes and dev fingerprints verified. The F3 null discriminates: constant k gives a 2.51 K error,
      failing A1 and A2. ''chosen'' in the JSON files is q1_h4. It is listed for the record only, as the
      cheapest candidate with complete three-level data, and is not a recommendation. That display choice
      was not pre-specified and is labelled as made after the data. Measured Q2 memory is 3.0 to 6.0 kB
      per DOF, falling with size. The E009 tables per candidate range from a 4.7 GB peak and 0.4 h (q1_h4)
      to 18.3 GB and 3.7 h (q2_h4z2). All fit the n2-highmem-32 burst VM. The local run stayed under 5.64
      GB peak, one solve at a time. Separately, I found and fixed a flaw in my own instrumentation. pyamg''s
      preconditioner calls the same solve object, so my first counter recorded 2n+1 instead of n CG iterations.
      Old entries were converted by (n-1)/2, and a re-solve confirmed it: 154 predicted, 154 counted,
      bit-identical residual. Commands and exit codes: the --plan run exited 0. The first study launch
      exited 1 on a cache bookkeeping bug (no solve affected); after the fix the study exited 0. --report
      exited 0, ruff exited 0, both DoD python checks exited 0, and `mfos gate --fast` reported ''all
      gates passed''.'
    failure_class: planning
    root_cause: 'Two measured obstacles. (1) The N-layer DBC reference case is badly under-resolved. Its
      die-sized flux patches sit on thin layers (0.18 mm die, 0.05 mm attach, 0.3 mm Cu, 0.38 mm ceramic).
      The source-mean error converges slowly, at observed order about 1.2 for Q1, so reaching 0.05 K needs
      lateral cells near the source edges far below what h0 with near_margin''s x1/x2/x4 steps gives.
      Refining by r = 2 in x, y and z over three levels then puts the 300 mm Muzychka plates at tens of
      millions of DOF. (2) Q2''s AMG-CG uses up its iteration headroom on the weak-Robin 10 mm plates
      (Cases 1a and 2): over 300 iterations at level 1 and the 400 cap at level 2. Neither is an implementation
      defect in the configurations tested. The objective''s A2/K2 pair, the r = 2 three-level rule, and
      the affordable grid budget do not fit together for the N-layer case with this grid rule.'
