    assert all(len(x['argmax_xyz']) == len(ch['layouts'][k]['levels_run']) and 'gci_K' in x for k in ('side_by_side_6','u_shaped_2')
    for x in ch['layouts'][k]['dies'])"
  exists: null
  timeout_s: 120
