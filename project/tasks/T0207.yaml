    alternative_explanations:
    - explanation: The frozen N-layer reference value of the source mean is wrong, or it means something
        other than the solver's Galerkin face mean.
      how_to_discriminate: 'Three facts argue against it: the error moves monotonically toward the reference
        under refinement for both Q1 and Q2; Cases 1b and 3 and the manufactured case agree to 0.0003-0.008
        K through the same code; and the series'' own convergence is gated in E006. A direct test would
        be one Q2 level-2 N-layer solve on the burst VM (3.06 M DOF, about 12-14 GB): an error that stalls
        near a nonzero value would point to the reference.'
    - explanation: The large CG counts come from slivers created by the reference-maximum mandatory lines,
        not from the weak Robin coupling.
      how_to_discriminate: Re-run Case 1a and Case 2 at level 1 without the maximum lines (centroid lines
        only) and compare the iteration counts. Not run here, to stay within the brief (no solver changes)
        and the budget.
    - explanation: Q1 divergent or oscillatory Tj-max sequences on the layouts are caused by the argmax
        node moving between levels, not by a lack of grid convergence.
      how_to_discriminate: Compare the Tj value at a fixed node that persists across levels with Tj max.
        The argmax node already moves on 14 of 16 dies (recorded per level in dev_study.json).
