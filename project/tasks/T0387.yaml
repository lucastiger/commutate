      \ filament term alone is 0.0018 / 0.0023 (10 / 20 MHz), about half of F1's 0.005 cap.\n  - Its 1.0\
      \ to 0.5 mm step is 0.106 %, just above the 0.1 % step floor, so F1's estimate falls back to the\
