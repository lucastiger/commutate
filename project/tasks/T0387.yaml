description: 'This tests the cheapest likely failure before any E004 design spend: P3''s l2_layout ratio
  estimates are 12.6 % (die shift) and 3.5 % (trace width) of the effect, so large-effect pairs may exceed
  F1''s 0.5 % cap. Research only, not evidence; development geometry (2D_Case_4) and development seeds
  only (F2). Steps: (1) With moduleforge.generate.perturb on Case 4, draw the F7(c) set on development
  seeds: every move type, at least one pair with r <= 0.75 and one with r >= 0.98 at L1. Write research/o004_f7/dev_pairs.json
  (seeds, parameters, layout fingerprints, L1 ratios at 10 and 20 MHz). (2) Run l2_layout at 1.0 and 0.5
  mm on every development layout locally. Reach 1.0 mm by E010''s mesh-constant pattern (CELL[0] set at
  refinement 0, experiments/runners/e010_run.py); 0.25 mm is the unpatched refinement 1. Report the ratio
  distribution at L1 and at 0.5 mm (scope_in). (3) Run the full 1.0 / 0.5 / 0.25 mm ladder, with the thickness
  and filament terms as O006 P3 defines them, on the base and on the largest-effect pair with r <= 0.75.
  Run the 0.25 mm solves locally and one at a time (about 8 GB each). Compute the pair''s ratio estimate
  with mfos.metrics.gci_capped plus the ratio-step rule (steps all below 0.1 % -> 3 max|d|, scope_in).
  The mfos.metrics version is not on main yet, so use a clearly labelled research copy of that rule. Write
  research/o004_f7/f7c_local.json. (4) Write research/o004_f7/vm_jobs_l2.json, a manifest of the remaining
  0.25 mm ladder solves on every development pair (F7(c)) and the l2_layout 0.25 mm solve of the 2D_Case_6
  reconstruction (F7(b); l2_layout only, no FastHenry, no 2R). Give per-job memory and time projections
  and the exact command for the founder''s burst VM. Agents never start VMs. (5) In research/notes/o004-f7-l2-pilot.md,
  state the exclusion rate so far and whether F7''s response trigger already fires (any excluded development
  pair with r <= 0.90, or more than one in all), and report the chance of no exclusion among 13 judged
  pairs that this rate implies. Add research/o004_f7/pilot_l2.py with a `--check` mode that validates
  the JSON outputs against each other without solving.


  Founder decision 2026-11-16 on T0386''s partial result (recorded by the founder session): the frozen
  rules, compounds included, reach no Case 4 pair with r <= 0.75 at L1; the lowest found is the three-move
  compound at 0.7616 (20 MHz; 0.7613 at 10 MHz), pinned in T0386''s tests. (i) Wherever this brief or
  O004''s F7(a)/(c) says ''the pair with r <= 0.75'', use that lowest compound, labelled everywhere as
  ''lowest reachable, r = 0.7616, stands in for r <= 0.75''; do not search further for a lower one. (ii)
  Add a span-reachability report for the founder''s span decision: on 2D_Case_2R and 2D_Case_6, draw the
  frozen rules (single moves and compounds) on development seeds and report the lowest and highest L1
  ratio reached at 10 and 20 MHz, per move kind, with the same structured search T0386 used for Case 4
  (exhaustive single scans, then coordinate descent over the 2- and 3-type compounds). L1 only on these
  two references: no l2_layout and no FastHenry on 2R, and on Case 6 only the F7(b) l2_layout solve already
  in this brief. Write research/o004_f7/span_reach.json and a section of research/notes/o004-f7-l2-pilot.md
  stating, per reference, whether [0.75, 0.98] with at least 3 pairs below 0.90 is reachable and, if not,
  the lowest reachable lower end. Do not change O004 or its span; the founder decides from these numbers
  before E004 registers. (iii) mfos.metrics.gci_step_floor is on main now (the ratio-step floor rule):
  use it instead of a research copy.


  Correction, founder decision 2026-11-16 17:55 UTC (O004''s F2): this replaces part (ii) of the note
  above. O004''s frozen F2 says development work uses 2D_Case_4, gen2_0 and development seeds only, so
  draw NOTHING on 2D_Case_2R or 2D_Case_6 except the F7(b) l2_layout solve of Case 6''s reconstruction
  that this brief already names: no L1 ratios, no draws, no reachability scan on the judged references.
  Instead, research/o004_f7/span_reach.json reports the lowest and highest L1 ratio the frozen rules (single
  moves and stagewise compounds) reach on 2D_Case_4 and on gen2_0, per move kind, at 10 and 20 MHz, by
  the structured search T0386 used on Case 4. The note''s section states, per development layout, whether
  [0.75, 0.98] with at least 3 pairs below 0.90 is reachable and, if not, the lowest reachable lower end.
  The judged references are first checked by the registration-time L1 span check O004 already requires.
  Parts (i) and (iii) of the note above stand.'
