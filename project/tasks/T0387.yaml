      \ per move kind, plus the stand-in. The stand-in is T0386's pinned compound, labelled \"lowest reachable,\
      \ r = 0.7616, stands in for r <= 0.75\"; its L1 ratio recomputes to 0.7616 / 0.7613 at 20 / 10 MHz.\
      \ Every move kind is present, four pairs have r >= 0.98, and every layout is DRC-clean and on all\
      \ three lattices.\n- **(2) Ratios at 1.0 and 0.5 mm, F7(d):** l2_layout ran at 1.0 and 0.5 mm on\
      \ all 12 Case 4 layouts. L1 overstates large effects: the stand-in is 0.7616 at L1 but 0.8074 at\
      \ 0.5 mm, and dev03 and dev00 are off by 0.017 and 0.013. The L1 span checked at registration is\
      \ therefore wider than the range l2_layout and FastHenry will actually judge.\n- **(3) Ladder on\
      \ the base and stand-in (partial):** the base ladder is complete. P3's 0.25 mm and thk_f files are\
      \ reused because this task reproduced P3's values to within 1.4e-14. For the stand-in, the 1.0,\
