  report:
    summary: 'I wrote my own versions of E011''s four acceptance metrics, A1, A2, A3 and K1, in experiments/runners/e011_metrics.py
      before reading the founder''s versions. The module also has the reported helpers, the per-draw row
      schema and the recompute entries E011''s spec should declare. On well-formed rows, mfos.metrics
      (commit 2fea4a6e, already merged into this checkout''s HEAD cf4827c7) gives exactly the same values
      as mine. I ran 400 random row sets, seeded with 20261116, through the evaluator''s own `metric_value`
      and `_where` path, plus every analytic case, and all matched. They disagree in three edge cases.
      Each is recorded as a non-strict xfail test, so it is documented without failing the suite, and
      each xfail fails on the mfos.metrics assertion, not on mine.

      (1) K1 with a NaN shortfall: np.median gives NaN for that layout, and Python''s max over a list
      containing NaN depends on order. One NaN draw on layout A hid layout B''s median of 0.10, so K1
      returned NaN; with B first it returned 0.10. Since NaN > 0.05 is False, a kill would not fire. I
      treat NaN or None as +inf, a failed draw.

      (2) A3 with a null shortfall of inf and a finite band: mfos.metrics counts it as a resolved failure
      and as a paired win (my test case gave 1.0 there against my 0.0). I count a draw where the null
      returned no candidate as neither, so A3 cannot be met through missing results.

      (3) A counted layout with a draw dropped from every role: mfos.metrics averages over the draws present
      (7/7 = 1.0). Mine raises an error, because a counted layout must have 8 draws and F6 says to exclude
      a layout that cannot supply them.

      There is also a configuration risk. In mfos.metrics, `null_beaten_min`''s `capped` parameter defaults
      to None. If E011''s spec leaves out `params.capped: capped`, runs that stopped at their step limit
      count as resolved failures; a test shows A3 = 1.0 instead of 0.0 in that case.

      The verdict tests use the objective''s pass_all and fail_any criteria, loaded from O008/objective.yaml
      and judged with `mfos.evaluate.judge`. The founder''s case, a null that recovers W* on one layout
      and fails on the other, gives A1 = 1, A2 = 0, A3 = 0, K1 = 0.005 and so INCONCLUSIVE. A case with
      every criterion met gives PASS, so the INCONCLUSIVE result is not automatic. A seed null meeting
      A1 is detected (F1: INVALID). The A1 operating-characteristic figures quoted in the objective are
      reproduced exactly.

      I did not commit; the files are untracked in the worktree.

      Commands and exit codes: `uv run pytest -q tests/acceptance_drafts/test_e011_metrics.py` exit 0
      (39 passed, 3 xfailed); `uv run ruff check experiments/runners/e011_metrics.py tests/acceptance_drafts/test_e011_metrics.py`
      exit 0 (it failed once on an unused import, which I fixed); `uv run mfos gate --fast` exit 0 ("all
      gates passed"); `uv run pytest ... --runxfail -k <the three xfails>` failed 3, as expected, each
      on the mfos.metrics line.'
