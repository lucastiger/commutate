description: 'Port research/scripts/o006_p4/fh_export.py into a new module src/moduleforge/solvers/fasthenry.py
  that takes any Layout (via Layout.to_conductors(), the conductor model l2_layout reads), not only P4''s
  Case 4 script. Keep and update the docstring that lists every modelling difference from l2_layout (traces,
  planes, dies, wires, contacts, port, materials, not-modelled items). Requirements: (1) `.units m` only,
  never `.units mm` (D0002: it scales impedance by 1000); `.default sigma`; `.freq` at 1e7 and 2e7 Hz;
  one `.external` between the DC+ and DC- terminal nodes, PHASE open. (2) An `FHLevel` with trace lattice
  pitch `cell_mm` on the same absolute lattice origin as l2_layout.layout_lattice; a separate plane pitch
  `plane_cell_mm` (E004''s coarsest level must allow <= 2 mm, F7(a)); thickness filaments `nh_trace`/`nh_plane`
  with grading `rh` (the 3 / 5 / 9 thickness ladder must be expressible); `nw_trace`; `wire_n` (filaments
  per side of the equal-GMD square, a = 0.8711 d, Grover 1946) and `wire_sub`, so the wire cross-section
  refines with the traces (review T0362). Do not freeze levels here; E004 freezes them. (3) Refuse a rectangle
  off the lattice and a cell holding two nets (ValueError), as l2_layout does. (4) Dies are ideal shorts
  by `.equiv` by default. Add a `die_model=''distributed''` variant for O004''s F6 diagnostic: the footprint
  is no longer one node, and the die and attach are a conductor block of the footprint and the stack thicknesses
  joining the drain cells to the source-pad wire feet. State the model and cite it in the docstring. (5)
  Terminals are point contacts by default (nearest cell, ties merged, as P4). Add a `terminal_model=''tab''`
  variant for F6: the port at the top of a physical post with the terminal footprint and post height,
  whose foot joins every cell under the footprint. Take the footprint and height as arguments if the Layout
  does not carry them (T0263''s facts: power_lead.part 3 x 3 mm, post 2 mm). (6) Deterministic deck text.
  Tests in tests/unit/test_fasthenry.py: header and units checks; the exported trace area per net equals
  the conductor model''s copper area (relative 1e-12) at 1.0 / 0.5 / 0.25 mm on the Case 4 reconstruction
  (research/scripts/o006_case4_layout.py) and on one generator layout; segment counts scale as expected
  per halving; the wire square side is 0.8711 d with wire_n^2 filaments; die `.equiv` groups hold every
  footprint cell of the bottom net; off-lattice input raises; and a faithful-port regression: for Case
  4 base at P4''s k0 knobs, the deck equals research fh_export.py''s deck node for node and segment for
  segment (differences only where this task changed behaviour on purpose, each listed in the test). Both
  F6 variants produce a well-formed deck on Case 4. Do not run FastHenry here (that is the next task)
  and do not touch 2D_Case_2R or 2D_Case_6 (F2).


  Founder guidance (I0218, 2026-11-16, attempt 3, the last): fix review T0408''s blocker. FastHenry 3.0wr
  reads lines of about 1000 characters at most; at cell_mm=0.25 the default model''s per-die .equiv lines
  reach 3474-4026 characters (and tab_terminal adds post-top lines). Split every long .equiv into several
  lines of at most 900 characters, each starting with the group''s first node so the group stays one equivalence.
  Add the line-length limit to read_errors, and a test that every deck line is at most 900 characters
  for the default and tab variants at cell_mm=0.25 on Case 4, 2D_Case_2R and 2D_Case_6; run one such deck
  through the pinned binary if it fits. Also: validate die_sigma and FHLevel''s counts (positive ints,
  no bools); check die and tab footprints against the lattice as l2_layout does; state in solver_notes
  that the distributed-die deck crashes the multipole solver and must use the direct solver or a coarser
  level (reviews T0408, T0409).'
