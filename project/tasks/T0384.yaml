    The F6 die variant, half of the claimed ''F6 model variants'', therefore cannot produce any result.
    The tab variant and the default models do run.

    - [blocker] die_model=''distributed'' decks are rejected by FastHenry (segments use nodes defined
    later in the file): In the distributed branch, each footprint cell''s die-top node `Nd…`, its column
    `Ev…` and its lateral segments `Edx/Edy…` are written together, in sorted cell order. Each lateral
    segment therefore names the +x or +y neighbour node before that node''s line appears. FastHenry 3.0wr
    reads decks in a single pass and refuses any segment whose node it has not read yet. So both F6 die-model
    decks (point and tab terminals) cannot be read at all, and the F6 die variant in the claim does not
    work. The test `test_f6_variants_are_well_formed_together` only checks that every referenced node
    exists somewhere in the deck, not that it was defined first, so it passes on a broken deck. The fix
    is to emit all `Nd` node lines for a die before its `Ev`/`Ed` segments.

