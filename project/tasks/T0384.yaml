    checks only that each node referenced by a segment, .equiv or .external exists somewhere in the parsed
    deck (a dict). It ignores the order in which FastHenry requires nodes to be defined. So it passes
    a distributed deck that FastHenry refuses. No test runs FastHenry or checks definition order, so the
