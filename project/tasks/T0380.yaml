description: "Build item (3b) of the objective notes. Create src/moduleforge/optimize/nulls.py, built\
  \ on local.descend and moving the search's own parameters (F1).\n\n(a) null_seed: returns D_j unchanged.\n\
  (b) null_widen: widen every power band toward its DRC limit. The blind score is power copper area only,\
  \ as in the probe's widen mode. No inductance model.\n(d) null_compact: more power copper and shorter\
  \ power wires (probe.py's compact score: power copper area in mm^2 minus power-wire length in mm, keeping\
  \ only moves that do not reduce copper or lengthen wires), review T0354. No inductance model.\n    (b)\
  \ and (d) each run to their own local optimum within a generous frozen step limit. They record the terminal\
  \ kind (local_optimum or step_limit), because a run capped at the limit is not a resolved failure (A3,\
  \ review T0359).\n(c) ablation_random_screen: the D0008 random screen alone over the reach sampler (n1),\
  \ with the search's L1 budget and shortlist, reusing search.candidate_stream.\n\nEvery null records\
  \ its step count, changed-parameter count and Manhattan distance from D_j.\n\nTests, in tests/unit/optimize/test_nulls.py:\n\
  - (a), (b) and (d) never call any inductance solver: inject l1 and l_sub that raise;\n- outputs are\
  \ DRC-clean and in_domain;\n- (b) ends where no single widening move is DRC-feasible, or at the step\
  \ limit with that terminal kind;\n- (d)'s blind score is monotone non-decreasing along its trajectory;\n\
  - determinism;\n- (c) respects the L1 budget and calls l_sub exactly shortlist times;\n- on the 70x40\
  \ housing, a capped run reports step_limit."
