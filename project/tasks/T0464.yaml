      \ on a level-2 rate that has never been measured on this code; the founder's level-2 burst below\
      \ measures it.\n\nWhat was done:\n1. **Allocation.** A new file, research/o002_e007/allocation_m32.json,\
      \ sets 32 layouts in each of the 15 strata, the unchanged V4 bound, and the T0456 evidence with\
      \ its sha256. T0396's f3_simulation.json and its disclosure are kept unchanged as history. E007.yaml's\
      \ config.allocation now points to the new file. The runner's freeze check confirms the file hash,\
      \ the per-stratum counts and the bound. The selftest drew exactly 32 layouts in each stratum from\
      \ the seed (j00 to j31), and its allocation_fixed check passed.\n2. **Power and coverage evidence\
      \ at m = 32.** This is T0456's a4_strata/sim_corrected.json (1000 repetitions per cell; its consistency\
      \ check passed, simulated median A4 0.108 / 0.107 against 0.107 measured). Ranges in brackets are\
      \ Wilson 95 % Monte Carlo intervals:\n   - Joint power and A4 power are 1.000 [0.996, 1] under both\
      \ normal and t3 errors.\n   - Minimum V4 coverage is 0.974 [0.962, 0.982] (normal) and 0.981 [0.971,\
      \ 0.988] (t3). It is at least 0.971 in every simulated cell from m = 20 to 40.\n   - At 1.2 x each\
      \ kill threshold: K1 fires with probability 0.812 [0.787, 0.835] (normal) and 0.581 [0.550, 0.611]\
      \ (t3). K2 fires with probability 1.0. K3 fires with probability 0.576 [0.545, 0.606] (normal) and\
      \ 0.354 [0.325, 0.384] (t3).\n   - These intervals cover Monte Carlo error only. The simulation\
      \ over-predicts A3 by 30-40 %, so the kill-side rates are approximate.\n3. **Cost plan.** 1077 reference\
      \ solves and 2413 L1 evaluations. The level-2 subset solves are 26.2 CPU-h (29.8 upper) of the total,\
      \ priced at T0243's rate, which has not been measured on this code. The total stays within 100 CPU-h\
      \ unless level 2 turns out more than 1.99 x slower (1.71 x in the upper case). The VM cost is $16.92\
      \ packed (option A; $19.15 upper) or $15.43 if what fits locally runs here first (option B). I raised\
      \ cpu_hours_est from 57.0 to 74.1. m = 32 adds 17.4 CPU-h over m = 20, not D0027's \"about 14\"\
      : the plan uses the spec's conservative level-1 rate of 0.195 ms/DOF, while the measured median\
      \ is 0.136.\n4. **Level-2 burst.** This is a founder burst, needed before registration. It runs\
      \ two solves one at a time: job.json (side_by_side_2_j00, about 3.48 M DOF and 20.2 GB) and a new\
      \ job_interleaved_2_j01.json (about 4.19 M DOF and 24.2 GB). I picked interleaved_2_j01 by a fixed\
      \ rule before any level-2 result exists: it is the interleaved/2 development layout whose reference\
      \ spread moved most from level 0 to level 1 (-0.078 / -0.084 K).\n5. **Seed 20261456** was already\
      \ in seeds.forbidden. The design note now has a §9 for this finalisation and cites D0025 and D0027.\n\
      \nFixes from review T0463:\n- **(1)** In e007-a4-strata.md, the normal-error 'A4 alone' row showed\
