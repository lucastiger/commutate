description: 'E007 pre-registration finalisation (O002), after T0456 merges. Founder decisions 2026-11-18
  (O002 state log; decision record D0027, amending D0025 items 2 and 4):

  - The per-stratum A4 check counts as passed on 9 development layouts (T0456: interleaved/2 0.286, side_by_side/2
  0.223, u_shaped/6 0.096). The per-stratum A4 is a reported diagnostic.

  - m = 32 layouts per (family, dies) stratum, 480 in all.

  Do not change the L1, its calibration, the criteria, thresholds or the bound.

  1. Set allocation.layouts_per_stratum 32 and n_layouts 480 in experiments/drafts/E007.yaml, and record
  the fixed allocation where the runner reads it (f3_simulation.json''s allocation, or a new allocation
  entry that cites T0456). Check that the runner draws 32 per stratum from the sealed seed.

  2. Name T0456''s corrected simulation (research/o002_e007/, its consistency check passed) as the registration''s
  power and coverage evidence at m = 32: joint power, A4 power, minimum V4 coverage, and kill-side rates
  at 1.2 x each kill threshold. Keep T0396''s m = 20 simulation and its disclosure as history.

  3. Regenerate `e007_run.py --plan` at m = 32. Set cpu_hours_est and the cost plan from it, and check
  the total against O002''s 100 CPU-hours (process CPU time, D0025 item 3). If it exceeds 100, stop and
  report.

  4. List the level-2 timing job (research/o002_e007/l2_timing/job.json, one level-2 solve, cpu_s and
  wall_s) as a founder burst in your report, with the command; it is needed before registration (D0025
  item 3).

  5. Add T0456''s development seed 20261456 to seeds.forbidden if it is not there. Update research/notes/e007-design.md,
  and cite D0025 and D0027.



  Review T0463 of T0456 (founder session, 2026-11-18), fix with the finalisation:

  (1) In research/notes/e007-a4-strata.md, the normal-error ''A4 alone'' row shows A4 coverage (0.999,
  0.997), not A4 power, which is 1.0 at every m. Correct it.

  (2) The note says isolated_die''s A4 is near 1 in both 2-die strata. That holds for interleaved/2 only
  (1.06 / 1.08); side_by_side/2 is 1.99 / 2.07. Correct it.

  (3) The spec''s memory source text says 4.29 kB/DOF. Recomputed from E007.dev_rows.json, the maximum
  is 4.98 kB/DOF with base RSS included and 4.32 kB/DOF with it excluded. State which convention bytes_per_dof
  = 4400 uses, and check that the runner''s memory admission applies that same convention.

  (4) dev_rows_a4_strata.json''s meta.reference_cpu_wall uses pre-rename layout names that collide with
  T0398''s keys, and reports new_solves = 0. Rename the keys to the *_t456jNN names and record the 36
  solves.

  (5) In the 2-die strata the reference is not converged at the scale of L1''s errors: interleaved/2''s
  reference spread moves by 0.044-0.084 K from level 0 to level 1, while L1''s spread errors are 0.019-0.055
  K. Add one interleaved/2 development layout''s level-2 reference solve to the level-2 burst job list
  (item 4), so the founder''s burst also checks this.

  '
