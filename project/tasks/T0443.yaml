description: 'Thermal L1 test and doc items from reviews T0423 (physics) and T0424 (numerics) of T0395
  (O002), before E007 freezes the model. T0397 (E007 design, a scientist) could not make them: they are
  in tests/unit/ and docs/. Change nothing in src/moduleforge/thermal/ (its hash is about to be frozen);
  if a test can only be written by changing source, stop and say why.

  1. A unit test of the k(T) path against the exact 1D Kirchhoff limit, in tests/unit/thermal/test_l1.py:
  a 1D column with all seven layers on their K_LAWS, against the exact per-layer Kirchhoff integral (brentq
  on the integral of k dT = q t). T0423 found agreement to 1.6e-5, 3.8e-5 and 2.4e-4 relative at 20, 40
  and 60 W with h = 5e4; set the tolerance from the discretisation, not from those numbers.

  2. A test that pins GRID_RULE and the CALIBRATION values together, with a failure message saying a grid-rule
  change needs a refit of c(s).

  3. docs/thermal_l1.md: energy balance is at most 2.85e-13 over all cached solves (not 2.1e-13), and
  the speed maximum is about 0.79 s under load (median 0.41-0.48 s, T0423/T0424).



  Founder session, 2026-11-17: the founder accepted decision record D0025 (project/decisions/, commit
  9a54cdb0). The spec and notes cite D0025 for the pre-registration decisions it records, instead of the
  objective''s state log.

  '
