caveats:
- Within the claim's stated scope, (c) (A4 ≤ 0.5 K for every reported value) is shown only for the six
  reference cases and five generator layouts in E009. On held-out layouts A4 reached 0.4385 K, 3.5× the
  development value, because the per-die Tj-max node moves between levels. O003 must recompute A4 for
  each layout and cannot assume 0.5 K.
- 'On generator geometry the error bound rests on the fact that FEM and FV converge monotonically from
  opposite sides on all 40 dies (largest finest-level gap 0.126 K) and on the 0.5 K envelope. It does
  not rest on each per-die GCI: 3 of 40 FEM GCIs are 3-26 % smaller than the distance to the L2''s Richardson
  limit.'
- Part (a) re-runs, deterministically, the references the rule was developed against (regression guard
  matches to about 1e-11 K). The out-of-sample evidence is limited to three fresh layouts, one per generator
  family, at a single operating point (65 °C, h = 5000 W/(m² K), 60 K rise).
- I did not re-run the burst-VM finest-level solves. I relied on the code-verified provenance and metric
  recomputation, and checked the physics on a small independent analytic case. A sandbox denial blocked
  one attempt to recompute the manufactured case's ceramic k-variation (0.3227) independently; the runner's
  sanity check and the frozen self-check both report it.
