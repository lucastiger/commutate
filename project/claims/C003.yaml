id: C003
statement: moduleforge.canary.harmonic2(n) returned the generalized harmonic number H_n^(2) = sum_{k=1}^{n}
  1/k^2 as a float64 with relative error at most 1e-13 (observed maximum 1.11e-16) against a 50-significant-digit
  decimal reference, for every n in one sealed, decade-stratified sample of 60 draws (56 distinct integers,
  n from 1 to 925925) from [1, 10^6] (run E901-20261031T170104-5b1d, evaluation EV-O901-01).
scope: 'The 56 distinct n of sealed run E901-20261031T170104-5b1d (rows.json): n in [1, 925925], in all
  six decade strata ([10^0,10^1): 6 distinct n; each other decade: 10). Pure-Python float64 implementation
  in src/moduleforge/canary.py at the evaluated commit. Not established: n outside the sample, n > 925925,
  or n above about 9.49e7, where k*k exceeds 2^53. Not evidence of correctly rounded summation: naive
  float64 summation also meets 1e-13 (max 2.75e-14 for n <= 10^6).'
status: supported
objective: O901
evaluation: EV-O901-01
reviews:
- T0120
caveats:
- The result's git commit d743a57 is not present in this review worktree, and a guard hook blocked the
  git ancestry command, so I could not check ancestry myself. I relied on the evaluator's on_main ok and
  on the matching file hashes.
- A permission denial stopped my direct comparison of the stored 50-digit strings in reference_decimal.json
  against exact sums. The float64-rounded ref column was verified independently.
- The evidence covers this pure-Python float64 implementation for n <= 1e6. Beyond n of about 9.49e7,
  k*k exceeds 2^53 and the per-term error argument needs rechecking.
