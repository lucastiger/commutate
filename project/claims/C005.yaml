caveats:
- A1-A4 are pooled 95th percentiles over 15 strata. Per stratum, interleaved/2 at P_ref is at the 0.5
  K A1 threshold (point p95 0.503 K, max 0.60 K), so the 0.5 K pair-difference accuracy is not established
  for every (family, dies) stratum a derivative re-layout would search in.
- For 2-die switches, L1's spread error is about 0.42-0.47 of the stratum-mean null's (point estimates),
  and in u_shaped/2 it is comparable to the spread itself. The pooled A4 margin comes from 3-6 die strata,
  whose large spreads are mostly set by family and die count.
- The yardstick is the die average. The reference hottest node exceeds the die average by more than 2
  K in all 15 strata (up to 5.9 K), so under O002 F6 a founder decision is due before a search relies
  on die-average Tj alone; the claim says nothing about the hottest node.
- Agreement is with the level-1 reference, which sits about 0.3 K (about 0.7 % of rise) below its level-2-plus-estimate
  value in absolute die averages. L1 was calibrated to level 1 and inherits this bias. Relative and pairwise
  quantities are much less affected (checked on the subset).
- Both models share the stack and k(T) laws, so E007 validates L1's numerical approximation of the reference,
  not the material physics. The result also holds only at this operating point (Tj up to 130 °C, h = 5000,
  the default DBC stack) and for the random generator layouts drawn. L1-selected layouts reached 0.51
  K pair error (F7, reported).
- A5 is the median on the burst VM recorded in the run; other hosts need their own timing.
- Every criterion holds pooled over strata. Per stratum, A1 is not met in interleaved/2 (p95 0.503 K,
  bootstrap upper about 0.57 K), and A4 is near 0.5 in side_by_side/2 (0.47) and u_shaped/2 (0.42). The
  claim must not be read as a per-stratum guarantee.
- The claim covers die-average Tj only. L1's hottest node reads 0.86 K high on average (max 2.0 K) and
  the reference's hottest node is not converged on 9 subset rows. The yardstick depends on founder decision
  5 at the 11-27 thesis review, which has not happened yet.
- A5 (0.60 s median) was measured on the single gcp n2d burst host; other hosts need their own timing
  (spec scope_limits).
- The reference's level-1 discretisation error is measured only on the 12-layout level-2 subset (max 0.089
  K for pair differences). Elsewhere it is inferred, though the A1 margin (0.263 bound vs 0.5) absorbs
  it.
- 'This was a numerics review: I verified the reference''s reproducibility, not its physics against analytic
  or experimental values (that rests on C004/O007).'
