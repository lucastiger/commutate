      every moduleforge source file the registration stage loads (e004_run.FREEZE_IMPORTS, the reconstruction script and
      the whole stage; reviews T0440 / T0441: L1's kernels.py, geometry/conductors.py and units.py, l2_dd.py and the package
      __init__ files were missing): the exporter (solvers/fasthenry.py, T0384) and run adapter (solvers/fasthenry_run.py,
      T0385); the proxy rule's sources (optimize/control.py, local.py, search.py, generate/twin.py, derivative.py; refrozen
      once T0437 lands); the perturbation rules, DRC, geometry, snapping and stack; L1 (physics/peec). The stage refuses if
      a loaded moduleforge file is not listed here (freeze_hashes_match at the start, freeze_covers_loaded_sources at the
      end, which catches lazy imports).
  perturbation_rules_text: >-
    Frozen rules: moduleforge.generate.perturb at the hash above (die_row_shift, trace_width, terminal_copper,
    wire_landing, and compounds of 2 or 3 distinct types, I0217), drawn by perturb.draw with each reference's own measured
    rules (perturb.measured_rules, no overrides on a judged reference). Stagewise rule (founder, 2026-11-16 17:55 UTC):
    every step of a compound is DRC-clean, changed and drawn on the layout the earlier steps left, not only the final
    layout (D0024 item 4). Representation dependence (review T0416 item 2, stated rather than fixed): long_sides reads the polygon's
    vertex list, so collinear vertex splits change the trace_width edge set and edge index for the same copper; after a
    compound component the net is canonicalised (perturb._canonical), so a later trace_width index counts the canonical
    polygon's long sides. Whole-mm rule (T0416 item 3): perturb rounds absolute coordinates to whole mm, so the
    registration stage requires every reference coordinate it rounds to be whole mm and every layout on the 1.0, 0.5 and
    0.25 mm lattices before any solve. Redraws (T0451, restated by T0457): inside perturb.draw a
    LongSideError (a net with no readable long side, e.g. 'edge has copper on both sides') and apply's ValueErrors are
    redrawn; every such redraw is recorded with move type, reference, exception type and message (registration.json
    redraws), the move types a reference restricts are named (restrictions), and a reference defect ('must have exactly one
    trace in the reference', 'no HS/LS die', 'dies are not on one row') or an unclassified exception fails
    redraws_classified, which refuses the registration. A draw that raises out of perturb.draw refuses the design and names
    the net.
  allocation: {die_row_shift: 1, trace_width: 1, terminal_copper: 1, wire_landing: 1, compound: 2}
  allocation_rationale: >-
    Pre-registered (T0388), fixed before the development span simulation was run: the minimum single moves for per-type
    coverage on each reference (one per type; I0217: single moves keep per-type coverage, and only single pairs count for
    'each move type on each reference' and for the coverage rule), and the remaining two of the six slots to compounds,
    which I0217 allows toward the span (on 2D_Case_4 only compounds reach below 0.873, span_reach.json).
  seed_rule: >-
    registered: the sealed seed s from `mfos exp run` (MFOS_SEED); reference slot k (references order) draws with
    perturb.draw(reference, allocation, SeedSequence(entropy=s, spawn_key=(k,)).generate_state(1, uint64)[0]). Smoke and
    development modes use e004_run.DEV_SEED only and never read the sealed seed.
  proxy:
    reference: 2D_Case_2R
    rule: >-
      Founder decision I0207 (2026-11-16), recorded as D0024 item 3: the designer-proxy pair uses O008's proxy descent (optimize.control.proxy_descent)
      from the 2R twin in 1 mm steps (on the 1 mm lattice by construction), the step exposed as a parameter of O008's
      implementation, not a copy of its code; its ratio is against the frozen 2R reconstruction, as O004 defines r.
    scope_note: >-
      Declared scope note: this is not exactly O008's 0.5 mm proxy rule; the pair is deterministic and shared with O008,
      so its l2_layout ratio may be known before registration (review T0363); no FastHenry solve on 2R or Case 6 is made
      before registration.
    step_mm: 1.0
    step_limit: 400
    step_limit_meaning: >-
      a cap, not a target: the descent stops at a local optimum (the in-domain pins of tests/unit/optimize/test_control.py
      end after 25 and 73 steps at 0.5 mm with step_limit 400); reaching it is recorded in the pair's params.end
    lattice_rule: >-
      review T0444 (T0457): every visited layout (rebuilt from the trajectory, fingerprint checked) and the end point must
      pass perturb.on_lattice at 1 mm (end point also 0.5 and 0.25 mm), sanity check proxy_on_lattice; registered mode
      refuses otherwise (the fix is a builder change in optimize/control.py and a D0024 amendment). Reported beside it:
      steps that are not whole multiples of step_mm (reach jumps) and the twin-start parameters off whole mm. Development
      result (Case 4 twin, T0457): 39 states, all on the lattice; land_HS / land_LS are off whole mm from the twin start
      (wire landing points, which on_lattice does not test), so D0024 item 3's 'on the 1 mm lattice by construction' holds
      for the l2_layout lattice, not for every generator parameter
    context: >-
      E010's judged_reference(2D_Case_2R) (in smoke, F2, E010's dev_reference('case4')), then twin.twin(with_l1=False); the
      descent's score is twin._l1
    smoke_mode: records the pair as pending, with the reason
  banded_acceptance:
    decision: >-
      founder decision 2026-11-17T15:58:20 UTC (O004 state log; D0024's open item, decided in principle; implemented T0457)
    rule: >-
      e004_run.band_fill. After the first draw of every slot (perturb.draw with the allocation and reference_seed, as
      before), while a band has a deficit: take the next redrawable slot in cyclic slot order (config.references order,
      then perturb.draw's order) whose redraw count is below max_redraws_per_slot; redraw it with perturb.draw(reference,
      {kind: 1}, redraw_seed(s, slot, pos, n)), the slot keeping its kind (every move type keeps its pair on each
      reference, compounds stay compounds); accept the new pair only if its geometry is new on that reference and it lies
      in a band with a deficit, else keep the old pair. A slot is redrawable iff every band its pair is in keeps its
      minimum without it and (protect_sole_coverer) it is not the only single pair covering its move type on its
      reference under the 6 % rule. Registration refuses (banded_acceptance_filled) when no slot can be redrawn or
      max_redraws_total is reached with a deficit. L1 at config.l1.hmax_m is the only quantity consulted (F2); the proxy
      pair counts toward the bands and is never redrawn. Every redraw is recorded (registration.json banded_acceptance.log:
      slot, seed, parameters, r_L1, accepted, reason; redraws: perturb.draw's internal rejections with move type,
      reference, class, exception type and message)
    bands_meaning: >-
      at least span.n_below pairs below span.below and at least n_at_or_above_upper at or above span.upper_end (both read
      from O004's span sentence), a pair counting for a band only if it is in it at both frequencies. The lower end is not
      a band: the l1_span check still requires min r <= span.lower_end (0.75 until the founder amends O004)
    n_at_or_above_upper: 1
    max_redraws_per_slot: 100
    max_redraws_total: 600
    protect_sole_coverer: true
    limits_meaning: >-
      fixed by T0457 before the development simulation was run (research/o004_f7/band_sim_case4.json reports the
      redraws a fill needed, so the founder can set them); each redraw costs two L1 solves (seconds)
    statistics_note: >-
      with the rule the registered sample is drawn from the sealed seed but conditioned on the bands, so the zero-failure
      bounds describe the band-conditioned population of re-layouts, not a simple random sample of the rules' draws
  min_references: 2
  min_pairs_per_reference: 6
  span: {lower_end: 0.75, upper_end: 0.98, n_below: 3, below: 0.90}
  l1:
    model: moduleforge.physics.peec.model.loop_inductance
    hmax_m: 4.0e-3
    hmax_check_m: 2.0e-3
    hmax_fine_m: 1.0e-3
    hmax_fine_meaning: >-
      reviews T0447 / T0448 item 2 (T0457): the near-threshold flag uses the larger of |r_hmax - r_check| and the
      three-level estimate |r_4mm - r_1mm| + gci_capped(r_4mm, r_2mm, r_1mm) of the gate value's mesh error (reported)
    near_threshold_abs: 0.005
    meaning: >-
      the F4 gates and the coverage rule are decided on L1 at hmax_m (its default mesh; deterministic, frozen; L1 is not the
      tool under test). Review T0441 measured ratio shifts up to about 0.005 between 4, 2 and 1 mm, so the ratios at
      hmax_check_m are reported beside every gate value, and every value within max(near_threshold_abs, |r_hmax - r_check|)
      of a span or coverage threshold, or on its other side at hmax_check_m, is flagged (reported, not checked)
  span_meaning: >-
    O004 scope_in, read by the runner from the objective's text (e004_run.objective_span, one place); this block asserts
    the value at registration and the runner refuses if the two differ. Checked on L1 (moduleforge.physics.peec), pooled
    over every registered pair of every reference (the proxy pair once built), at 10 and at 20 MHz: min r <= lower_end,
    max r >= upper_end, at least n_below pairs with r < below. A founder amendment changes the objective's sentence and
    this line only.
  coverage_min_effect: 0.06
  coverage_meaning: >-
    review T0366, reported not checked: a move type is covered by a pass only if one of its counted single pairs has
    |1 - r| >= 6 % at L1 at both frequencies; compounds containing the type are reported apart
  frequencies_hz: [1.0e+7, 2.0e+7]
  loop: DC+ terminal to DC- terminal, dies as ideal shorts (module-internal commutation loop)
  l2_layout_ladder_m: [1.0e-3, 0.5e-3, 0.25e-3]
  judged_level: l2_layout 0.25 mm; FastHenry its finest level
  f1_rule: >-
    D0024 item 1 (founder, 2026-11-17T01:41 UTC; review T0429 of T0387; decided before any F7(c) burst result): F1's caps are relative to the ratio: a counted pair needs
    E_R / r <= 0.005 for l2_layout and E_R / r <= 0.01 for FastHenry, E_R the mfos.metrics.gci_step_floor estimate of the
    three-level ratio sequence (ratio units, step_floor 1e-3 relative) plus the thickness terms, r the finest ratio. A
    pair failing a cap or with +inf is excluded (A1 not met; it stays in K1 on its raw value). Implemented in T0389.
  f1_caps: {l2_layout: 0.005, fasthenry: 0.01}
  f1_caps_meaning: E_R / r caps of F1 (D0024 item 1), E_R the ratio estimate including the thickness terms, r the finest ratio
  kill: {K1: 0.05, K2: 0.15}
  pass: {A1: 0.02, A2: 1.0}
  solve:
    meaning: >-
      T0389. Every registered layout (2 references, 12 drawn pairs, the 2R proxy pair) is solved by both tools on the
      identical Layout (fingerprint) at 10 and 20 MHz. Estimators (O004 scope_in): gci_capped for every L sequence; for every
      ratio sequence mfos.metrics.gci_step_floor (steps all below 0.1 % of the finest ratio -> 3 max|d|), registered mode
      refuses without it; thickness terms added to L and to ratios: l2_layout's ratio_middle_term(thk_c, lat0.5, thk_f)
      plus its filament term 3 |fil_f - lat0.5| (O006 P3); FastHenry's |f(nh_lateral) - f(9)| + gci_capped(f3, f5, f9) of
      the 3 / 5 / 9 ladder at the thickness level (the ratio-step rule for ratios; T0368). A missing coarser-level or
      thickness solve, an l2_layout GMRES flag, or a FastHenry deck without a value (retries exhausted, killed, parse
      error) makes that estimate +inf; a missing finest value goes to the INVALID rule (F1). No check that depends on solver
      values makes the run INVALID. Smoke: the coarsest level of each ladder only, labelled, every estimate +inf.
    mem_budget_gb_default: 5.0
    mem_budget_meaning: child solves are packed by projected peak memory within MF_E004_MEM_GB (default 5 GB, the Mac policy); never by CPU count
    l2_layout:
      levels:
        lat1.0: {cell_mm: 1.0, cell_mm_patch: 1.0, refinement: 0, layers: [10, 6, 6], annuli: [0, 0.35, 0.6, 0.8, 0.93, 1]}
        lat0.5: {cell_mm: 0.5, cell_mm_patch: null, refinement: 0}
        lat0.25: {cell_mm: 0.25, cell_mm_patch: null, refinement: 1}
        thk_c: {cell_mm: 0.5, cell_mm_patch: 0.5, refinement: 0, layers: [5, 3, 3], annuli: [0, 0.35, 0.6, 0.8, 0.93, 1]}
        thk_f: {cell_mm: 0.5, cell_mm_patch: 0.5, refinement: 0, layers: [20, 12, 12], annuli: [0, 0.35, 0.6, 0.8, 0.93, 1]}
        fil_f: {cell_mm: 0.5, cell_mm_patch: 0.5, refinement: 0, layers: [10, 6, 6], annuli: [0, 0.175, 0.35, 0.475, 0.6, 0.7, 0.8, 0.865, 0.93, 0.965, 1]}
      levels_meaning: >-
        O006 P3 / E010 child_em's mesh-constant pattern (research/o004_f7/pilot_l2.py LEVELS): lat1.0 patches CELL[0] to 1.0 mm
        at refinement 0; lat0.5 is the unpatched refinement 0; the judged lat0.25 is the unpatched refinement 1 (no patch);
        the child refuses if CELL[refinement] is not cell_mm
      peak_gb: {lat1.0: 2.0, lat0.5: 5.4, lat0.25: 16.1, thk_c: 2.3, thk_f: 9.0, fil_f: 5.0}
      wall_s: {lat1.0: 140, lat0.5: 340, lat0.25: 6600, thk_c: 480, thk_f: 2000, fil_f: 1250}
      sizing_source: max over T0387's 11 Case 4 development pairs (research/o004_f7/solves; 0.25 mm 15.8-16.1 GB, T0387 report) with the 0.25 mm wall time pinned (6,519 s, research/notes/l2-thread-calibration.md)
    fasthenry:
      pinned_binary_sha256: eaa6d6fc62957c3bce5cd605a10e9f2724641d127bd692a99cafeb3233ae2d14
      pinned_meaning: D0002's provisioned FastHenry 3.0wr (research/o006_p4/binary_check.json); self_test() once per host, its record stored keyed by binary_sha256 beside every FHResult
      self_test_exact_nH: 5.704254
      self_test_exact_tol_nH: 3.0e-4
      mode: multipole
      order: 4
      tol: 1.0e-4
      max_retries: 10
      no_direct_fallback: O004 F1. Direct LU needs 8 F^2 bytes (P4), about 41 GB at k0's 72k filaments on Case 4
      die_model: short
      terminal_model: point
      rh: 2.0
      nw_trace: 1
      nh_lateral: 5
      nh_lateral_meaning: >-
        the lateral ladder's thickness filaments (traces and planes), a level of the 3 / 5 / 9 ladder and never 1 (founder,
        T0417/T0418: nh = 1 is +24 % on a thin-ceramic stack). PROVISIONAL: F7(a)'s thickness ladder decides it before
        registration (founder); 5 is the middle of the ladder, so its thickness term is the error of the value judged
      lateral:
        k0: {cell_mm: 1.0, plane_cell_mm: 2.0, wire_n: 2, wire_sub: 1}
        k1: {cell_mm: 0.5, plane_cell_mm: 1.0, wire_n: 4, wire_sub: 2}
        k2: {cell_mm: 0.25, plane_cell_mm: 0.5, wire_n: 8, wire_sub: 4}
      lateral_meaning: >-
        three levels at ratio 2 in every lateral knob: trace cell, plane pitch (coarsest 2 mm, F7(a); P4's 4 mm plane cell
        caused its k0-to-k1 ratio step), and the wire section refined with the traces (wire_n filaments per side and
        wire_sub pieces per polyline segment, review T0362); wire_n = wire_sub = 1 is never used (T0385: NaN impedance)
      thickness: {at: k1, nh: [3, 5, 9]}
      sizing: {kb_per_filament: 31.1, mem_margin: 1.3, cap_factor: 1.5, t_ref_s: 1246, f_ref: 102192, exponent: 1.4,
        exponent_uncertainty: 0.3, timeout_factor: 10.0, min_timeout_s: 1800, min_mem_cap_mb: 2000}
      memory_cap_policy: >-
        review T0455 / T0457 item 11: cap = projection x cap_factor (1.5), the projection being kb_per_filament x exporter
        filaments x mem_margin 1.30 (the adapter's MEM_MARGIN; research/o004_f7/fh_direct_mem.json: direct-mode peaks
        1.01-1.09 x the dense estimate in-repo, 1.24-1.26 in T0428's runs; T0457's four local multipole solves of
        the Case 4 k0 nh5 decks in research/o004_f7/fh_local_probe.json (case4_base twice, dev03_trace_width,
        standin_compound) peaked at 0.91-1.21 x the projection = 1.18-1.58 x the raw 31.1 kB/filament figure, so a cap at
        the projection would have killed three of the four; cap_factor 1.5 leaves 24 % over the largest measurement for
        the extrapolation to the k1 / k2 decks, which are not measured locally). A run killed at its cap (killed_memory) is retried ONCE, alone, at the
        machine's full budget (0.97 x MF_E004_MEM_GB) before its value is recorded as missing, so a mis-projected cap cannot
        by itself turn a judged value into a missing one and the run into INVALID; both attempts are recorded
      timeout_rule: >-
        review T0453 / T0457 item 10: at plan time every FastHenry job's timeout, doubled for its full-memory retry, must fit
        the spec's timeout_min (assert_timeouts_fit); the stage refuses before any solve otherwise
      sizing_meaning: >-
        explicit mem_cap_mb and timeout_s per job (reviews T0427/T0428 B(2)): projected peak = 31.1 kB per exporter
        filament (P4's largest per-filament multipole peak, 0.78 GB at 25,056) x 1.3 margin for FastHenry's own refinement
        (the post-refinement count is known only once a run starts, T0385 (3)); time = 1,246 s x (F / 102,192)^1.40 (P4 k1
        and its k0 -> k1 exponent), timeout 10 x that (T0389: gen2_0 reached the preconditioner only after 15 x the
        projected total, so the time rule is layout-dependent; F7(a) recalibrates it per reference before registration).
        A timeout or a memory kill is not retried and leaves a missing value
      always_crash_rule: >-
        review T0427/T0428 A: a deck that crashes on every multipole attempt has no value; no direct fallback, no other level
        substituted; F1 makes the estimate it feeds +inf (exclusion) and a missing finest value goes to the INVALID rule.
        Decks probed before registration: research/o004_f7/fh_probe.json and vm_jobs_fasthenry.json (precond_probe)
  stacks:
    meaning: >-
      founder T0417/T0418 (3): the stack of each judged reference and development layout (Layout.stack, read by both solvers
      through the exporter; layer thicknesses in mm), so a reader can tell whether the thin-stack FastHenry gap applies. The
      gap was seen on gen2_0 (thin: 0.3 mm Cu, 0.38 mm ceramic): FastHenry nh 1 +24 % against l2_layout, against about +8 %
      on Case 4 at the same level. 2D_Case_2R has Case 4's stack exactly; 2D_Case_6's ceramic (0.64 mm) lies between Case 4's
      and gen2_0's, so until F7(a)'s gap rule (research/o004_f7/vm_jobs_fasthenry.json gap_rule) closes the gap, Case 6's
      FastHenry values are not known to behave as Case 4's
    2D_Case_2R: {kind: PowerSynth_2D_Case_2R, top_cu: 0.2, ceramic: 0.835, backside_cu: 0.2, solder: 0.001, baseplate: 1.0, judged: true, same_as: 2D_Case_4}
    2D_Case_6: {kind: PowerSynth_2D_Case_6, top_cu: 0.2, ceramic: 0.64, backside_cu: 0.2, solder: 0.001, baseplate: 1.0, judged: true, thinner_ceramic_than_case4: true}
    2D_Case_4: {kind: PowerSynth_2D_Case_4, top_cu: 0.2, ceramic: 0.835, backside_cu: 0.2, solder: 0.001, baseplate: 1.0, judged: false}
    gen2_0: {kind: DBC, top_cu: 0.3, ceramic: 0.38, backside_cu: 0.3, solder: 0.1, baseplate: 3.0, judged: false, thin_stack: true}
  stand_in: >-
    D0024 item 2: wherever F7(a)/(c) or a brief names "the pair with r <= 0.75", the lowest compound found on 2D_Case_4 is
    used, labelled "lowest reachable, r = 0.7616, stands in for r <= 0.75" (a start-dependent search minimum, not a proven
    floor). If r <= 0.75 is unreachable on a judged reference, that is reported and the span is not changed on that account
  development_geometry: >-
    D0024 item 5 / O004 F2: span-reach, rule-range and pilot work use 2D_Case_4, gen2_0 and development seeds only; nothing
    is drawn and no inductance is computed on 2D_Case_2R or 2D_Case_6 before registration, except F7(b)'s l2_layout 0.25 mm
    solve of 2D_Case_6's reconstruction
  a2_cap_rel: 0.05
  f7_status: >-
    research/notes/o004-f7-l2-pilot.md (T0387): F7(b) passed (Case 6 0.25 mm solve completed); F7(c) exclusion rate 0 of
    2 complete pairs with 11 pending (VM), trigger not fired and undecided; F7(a) not yet run. Registration waits on the
    founder's reading of the assembled F7 results.
sealed_seed: true
metrics:
- {name: max_ratio_diff_vs_fasthenry, description: 'A1: max over pre-registered pairs and both frequencies of |r_L2 / r_FH
    - 1|, l2_layout 0.25 mm vs FastHenry finest; +inf if any pair is excluded by F1 (solve stage, T0389)'}
- {name: max_abs_consistency, description: 'A2: max over layouts and frequencies of |L_L2 - L_FH| / (E_L2 + E_FH), each
    estimate capped at E/L <= 0.05 (+inf if above its cap or infinite) (solve stage, T0389)'}
- {name: max_ratio_diff_vs_fasthenry_all, description: 'K1: max over every pre-registered pair with a finest value, excluded
    ones included, of |r_L2 / r_FH - 1| on raw values (solve stage, T0389)'}
- {name: max_rel_diff_vs_fasthenry, description: 'K2: max over layouts and frequencies of |L_L2 / L_FH - 1| (solve stage,
    T0389)'}
- {name: n_counted_pairs, description: 'solve: pairs counted after F1 exclusion (coverage after exclusion; per move type with
    one-sided zero-failure bounds in solve.json diagnostics)'}
- {name: pooled_zero_failure_bound95, description: 'solve: one-sided 95 % zero-failure bound 1 - 0.05^(1/n) over counted pairs
    (the clustered bound by reference beside it in solve.json)'}
- {name: l1_max_ratio_diff_vs_fasthenry, description: 'F8, reported: max |r_L1 / r_FH - 1| over pairs with a FastHenry finest
    value'}
- {name: n_l2_gmres_flagged, description: 'solve: l2_layout solves with a GMRES flag, treated as missing values'}
- {name: n_fh_decks_crashed_every_attempt, description: 'solve: FastHenry decks that crashed on every multipole attempt,
    treated as missing values (no direct fallback, no other level)'}
- {name: n_registered_pairs, description: registration - pairs drawn plus the proxy pair if built}
- {name: l1_ratio_min, description: registration - lowest L1 ratio at 20 MHz over the drawn pairs}
- {name: l1_ratio_max, description: registration - highest L1 ratio at 20 MHz over the drawn pairs}
- {name: l1_n_below_0p90, description: registration - drawn pairs with L1 ratio below 0.90 at 20 MHz}
- {name: l1_ratio_std, description: 'registration - diversity statistic: sample standard deviation of the L1 ratios at 20 MHz'}
- {name: l1_n_near_threshold, description: 'registration - pairs with an L1 ratio near a span or coverage threshold
    (config.l1, reported)'}
- {name: n_move_types_covered_l1, description: 'registration - move types with a single pair of |1 - r_L1| >= 6 % (coverage
    rule, reported)'}
sanity_checks:
- {name: seed_provenance, description: 'registered: pairs drawn from run.seed (the sealed seed ExperimentRun records),
    and a replay of every slot''s draw from MFOS_SEED, read independently, reproduces every move and geometry; smoke: the
    same with the development seed, the sealed seed never read (reviews T0440/T0441: the check can now fail)'}
- {name: freeze_hashes_match, description: 'F2: reconstruction script sha256 first, then every config.freeze hash, the
    perturbation-rules hashes, l2_layout source_sha256, numpy/scipy/shapely versions, every loaded moduleforge file
    frozen, the pinned commit an ancestor of HEAD whose blobs carry the frozen hashes'}
- {name: references_fingerprints_match, description: 'F2: both judged references rebuilt by the frozen T0263 script with the
    frozen fingerprints (depends on no solve)'}
- {name: no_powersynth_files_in_tree, description: 'F5 / D0007: no tracked file named like a PowerSynth sample file'}
- {name: references_whole_mm, description: 'T0416 item 3: every reference coordinate the whole-mm construction rounds is
    whole mm'}
- {name: references_on_lattice, description: 'F4: each reference on the 1.0, 0.5 and 0.25 mm lattices, gated before
    any draw (reviews T0440/T0441)'}
- {name: draws_complete, description: 'the frozen allocation drawn on every reference; a draw that raises refuses and names
    the net (T0387)'}
- {name: n_references, description: 'F4: at least two references'}
- {name: pairs_per_reference, description: 'F4: at least 6 pairs per reference'}
- {name: move_type_per_reference, description: 'F4: each of the four single move types on each reference'}
- {name: layouts_on_lattice, description: 'F4: every reference and re-layout on the 1.0, 0.5 and 0.25 mm lattices'}
- {name: layouts_drc_clean_distinct, description: 'every re-layout and every compound intermediate DRC-clean under its
    reference''s measured rules (stagewise rule, D0024 item 4), every step changing the geometry, the stepwise result equal
    to perturb.apply''s, all distinct; re-run on the materialised layouts with the same drc.check (not an independent DRC)'}
- {name: l1_span, description: 'F4: pooled L1 ratios span [lower_end, 0.98] with at least 3 below 0.90 at both frequencies'}
- {name: proxy_on_lattice, description: 'review T0444: every layout proxy_descent visited and the end point on the 1 mm
    lattice (end point also 0.5 and 0.25 mm); registered mode refuses otherwise (config.proxy.lattice_rule)'}
- {name: banded_acceptance_filled, description: 'founder 2026-11-17T15:58 UTC: the frozen banded-acceptance rule filled
    every band within config.banded_acceptance limits; registration refuses otherwise'}
- {name: redraws_classified, description: 'T0451 / reviews T0446, T0452: every redraw inside perturb.draw recorded with
    move type, reference, exception type and message; fails (refuses) on a reference defect or an unclassified exception,
    so a reference defect never passes as a silent redraw; restricted move types are named in the detail'}
- {name: proxy_pair_built, description: 'the 2D_Case_2R designer-proxy pair built (I0207); registered mode refuses without
    it'}
- {name: freeze_covers_loaded_sources, description: 'F2: at the end of the stage, before any solve, every moduleforge
    source file loaded (lazy imports included) is in config.freeze.files'}
- {name: ratio_step_rule_validated, description: 'solve stage: the ratio-step rule used (mfos.metrics.gci_step_floor; registered
    mode refuses without it; smoke only may use the labelled runner-local copy) gives exactly 3 max|d| on P3''s trace-width
    example (relative steps 0.007 % and 0.025 %) where gci_capped gives +inf, and still defers to gci_capped when a step
    exceeds 0.1 %'}
- {name: fasthenry_binary_pinned, description: 'solve stage: fasthenry_run.self_test() passed once on this host (record
    stored keyed by binary_sha256), its binary is config.solve.fasthenry.pinned_binary_sha256, and every FHResult carries
    that sha256'}
- {name: fasthenry_closed_form_validated, description: 'solve stage: the self-test bar''s L at 1 kHz within 3e-4 nH of the
    exact uniform-current (Hoer-Love) 5.704254 nH, recomputed from the self-test record'}
- {name: exported_geometry_identical, description: 'solve stage: every l2_layout and FastHenry solve read the registered
    layout (fingerprint equal to the registration record), and every solved FastHenry deck re-exports to the same sha256'}
- {name: finest_values_present, description: 'solve stage, missing-data rule of F1: fails (INVALID) only if some pair lacks
    a finest value of either solver and no completed pair fires K1. An l2_layout GMRES flag or a FastHenry deck without a
    value is a missing value (+inf estimate or missing finest), reported, never an INVALID check of its own (review T0364:
    no check that depends on solver values makes the run INVALID)'}
timeout_min: 6000
cpu_hours_est: 518.2  # T0457 a2: e004_cost_plan.cpu_h of research/o004_f7/vm_jobs_fasthenry.json (k0 factor 1.83; k1/k2 x m1 = 5.08, a lower bound from the local k1-lateral timeout; upper envelope 2575.5 CPU-h)
code_under_test:
- src/moduleforge/geometry/layout.py
- src/moduleforge/geometry/stack.py
- src/moduleforge/solvers/l2_layout.py
- src/moduleforge/solvers/l2_core.py
- src/moduleforge/solvers/fasthenry.py
- src/moduleforge/solvers/fasthenry_run.py
- src/moduleforge/generate/perturb.py
- src/moduleforge/geometry/conductors.py
rows: {artifact: rows.json}
recompute:
- metric: max_ratio_diff_vs_fasthenry
  fn: max_rel_err_or_inf
  pred: r_l2
  ref: r_fh
  params: {excluded: excluded_f1}
  where: {row_kind: pair}
- metric: max_abs_consistency
  fn: max_consistency_capped
  pred: L_l2
  ref: L_fh
  params: {e_pred: E_l2, e_ref: E_fh, cap_rel: 0.05}
  where: {row_kind: layout}
- metric: max_ratio_diff_vs_fasthenry_all
  fn: max_rel_err
  pred: r_l2
  ref: r_fh
  where: {row_kind: pair, finest_complete: true}
- metric: max_rel_diff_vs_fasthenry
  fn: max_rel_err
  pred: L_l2
  ref: L_fh
  where: {row_kind: layout, finest_complete: true}
null_baselines: []
recompute_exempt: {}
