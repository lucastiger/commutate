id: E004
title: 'l2_layout 0.25 mm against the pinned FastHenry on the inductance ratios and absolute loop inductance of sealed-seed
  re-layouts of the frozen PowerSynth 2D_Case_2R and 2D_Case_6 reconstructions (O004 A1/A2/K1/K2, F1-F8). Draft parts 1
  (T0388: references, freeze, allocation, registration checks) and 2 (T0389: solve stage, estimators, metrics)'
objective: O004
status: draft
runner: uv run python experiments/runners/e004_run.py
config:
  design_status: >-
    DRAFT, NOT REGISTRABLE YET (T0457, 2026-11-17). Done in T0389: the solve stage, estimators, F1, A1/A2/K1/K2, the
    INVALID rule, the F7(a) job list and the refreeze at 3f60b2f4 (perturb.rules_sha256 = 2dbd9977...). Done in T0457: the
    founder's banded-acceptance rule (config.banded_acceptance) and its 200-seed development simulation
    (research/o004_f7/band_sim_case4.json), the redraw record and restriction census (redraws_classified), the 2D_Case_2R
    proxy pair (build_proxy; T0444 lattice check proxy_on_lattice), seed_provenance against the registry's minted
    commitment with a replay of every draw and redraw, reference fingerprints against the registration record in the
    solve stage, the solve-stage review fixes (T0453-T0455) and the runner's --selftest. Open before registration: (i) the
    founder picks the span's lower end from the simulation and amends O004 (0.75 stays in the code until then); (ii) F7(a)
    results (founder burst) fix nh_lateral (provisional 5) and the thin-stack gap; (iii) the F3 per-conductor-group and F6
    diagnostics are not yet in the runner (reported, not judged); (iv) refreeze: the proxy context imports
    experiments/runners/e010_run.py and reads experiments/specs/E010.yaml (their sha256 are recorded in the proxy record;
    to be added to config.freeze at the refreeze before registration).
