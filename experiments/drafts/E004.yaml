id: E004
title: 'l2_layout 0.25 mm against the pinned FastHenry on the inductance ratios and absolute loop inductance of sealed-seed
  re-layouts of the frozen PowerSynth 2D_Case_2R and 2D_Case_6 reconstructions (O004 A1/A2/K1/K2, F1-F8). Draft part 1
  (T0388): references, freeze, allocation, registration checks; the solve stage is T0389'
objective: O004
status: draft
runner: uv run python experiments/runners/e004_run.py
config:
  design_status: >-
    DRAFT, NOT REGISTRABLE YET (T0388 attempt 2, 2026-11-17). Open before registration: (i) T0438 (perturb.py fixes of
    review T0416 items 1, 2, 4 and T0387's long_sides fix; in review): when it lands, perturb.rules_sha256(), perturb.py's
    file hash and the pinned commit are refrozen here (`e004_run.py --print-freeze`), and rules_supplement_sha256 may be
    retired if rules_sha256 then covers its inputs; (ii) T0437 (proxy_descent step_mm; needs founder): the 2D_Case_2R proxy
    pair is wired and the proxy rule's sources refrozen; (iii) D0024 "Open": the span's lower end and the allocation are
    the founder's after burst 1's F7(c) results (I0209); as drafted, F4 refuses a sealed draw almost surely
    (research/notes/o004-e004-registration-design.md section 3); (iv) F7(a) and F7(c) are not assembled, so F7's response
    trigger is undecided (not fired); (v) T0389's solve stage. O004 scope_in's development distribution at L1 and at
    l2_layout 0.5 mm is T0387's F7(d) (research/o004_f7, 11 Case 4 development pairs).
  decisions:
  - {id: D0024, items: '1 F1 caps relative to the ratio; 2 the 0.7616 compound stands in for "r <= 0.75"; 3 the 2R proxy
      pair at 1 mm against the reconstruction (I0207); 4 compounds (I0217) under the stagewise rule; 5 development geometry
      under F2', open: span lower end and allocation}
  - {id: D0007, items: no GPL (PowerSynth) file read or committed}
  - {id: D0002, items: the pinned FastHenry build and its self-test}
  references:
  - reference_id: 2D_Case_2R
    kind: public
    reconstruction_fingerprint: 66cb1e191c9f88396125cfd87227865d209ea6cf4c5f4306082c5ccee2ad696a
    meaning: Layout.fingerprint() of what the frozen T0263 script's snapped('2D_Case_2R') returns (E010 config.references)
    has_twin: true
  - reference_id: 2D_Case_6
    kind: public
    reconstruction_fingerprint: 71e07ae149b42bcd5efa243edc51730c208556e66fdf8c9d3356dc54ce574cb7
    meaning: Layout.fingerprint() of what the frozen T0263 script's snapped('2D_Case_6') returns (E010 config.references)
    has_twin: false
  reconstruction_script: research/scripts/o003_powersynth_references.py
  licence_rule: >-
    D0007 / F5: the reconstructions are ModuleForge geometry transcribed by hand (T0263); no PowerSynth (GPL-3.0) file is
    read, copied or committed; the registration stage checks that no tracked file carries one of the script's
    FORBIDDEN_NAMES and records the script's sha256 (its SOURCES_SHA256 record the files T0263 read)
  freeze:
    rule: >-
      F2: every hash below is recomputed by the registration stage before any draw; the reconstruction script's sha256 is
      checked first and nothing is imported from it before that. A mismatch refuses the run (registered mode) before any
      solve. A change after registration voids the run (new experiment id, freshly drawn pairs).
    commit: 42db7eb51b76a986a6c35847a8558c925ff61ba1
    commit_meaning: >-
      a main commit the hashes below were taken at (src/ identical to this branch's HEAD); the registration stage requires
      it to be an ancestor of HEAD and every frozen file's blob at it to carry the frozen sha256
    reconstruction_script_sha256: aa96880cf38b2597e8a5927254ddc047d8de98b5b5d7ccdc5cf0fe6b19fd206a
    perturb_rules_sha256: 70307210174b4f0beb725238d7a000de55b6b378d821d99071fbf051b7fa33b2
