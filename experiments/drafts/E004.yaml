    perturb_rules_supplement_meaning: >-
      e004_run.rules_supplement_sha256(): review T0416 item 1's inputs that perturb.rules_sha256() does not yet cover
      (NETS in order, SIGNAL_NET, SIGNAL_PADS, the sources of Die.bounds, Die.box, BondWire.length, SignalWire.length)
    l2_layout_source_sha256: ed0288b6744de1289c60e7057abc3fbe7c9c8b0f6da3bf04efce60260e458a8e
    packages: {numpy: 2.5.3, scipy: 1.18.1, shapely: 2.1.2}
