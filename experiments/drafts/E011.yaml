id: E011
title: 'O008 control: from sealed degraded copies D_j of a designer proxy W* (2D_Case_2R, 2D_Case_4; gen2_0 reported),
  the seeded local search returns a candidate within 2 % of L_sub(W*) at 0.25 mm on >= 7 of 8 draws per layout and beats
  the inductance-blind nulls (widen, compaction) by a resolved margin (A1, A2, A3, K1; F1-F7)'
objective: O008
status: draft
runner: uv run python experiments/runners/e011_run.py
sealed_seed: true
config:
  design_task: 'T0382 (scientist, 2026-11-16); revised by T0471 (2026-11-19) from the development L2 burst (I0205):
    dev rows, band bound, joint operating characteristic, measured sizing, review items 1-9 of 2026-11-18.
    Development-only draft; nothing here has seen a sealed draw. NOT READY TO REGISTER: on the development draws the
    frozen design gives A1 0.25 and A3 0 (config.dev_l2), and O008 F1 requires A3 met on development rows before
    registration; the founder decisions are listed in config.founder_decisions_before_registration'
  layouts: [2D_Case_2R, 2D_Case_4, gen2_0]
  counted_layouts: [2D_Case_2R, 2D_Case_4]
  reported_not_counted: [gen2_0]
  layout_index: {2D_Case_2R: 1, 2D_Case_4: 2, gen2_0: 3}  # nonzero, enters every sub-seed of its layout
  layout_sources:
    2D_Case_2R: 'e010_run.judged_reference (frozen T0263 reconstruction script, fingerprint first) on E010.yaml
      config.references; development geometry under D0023 (its E010 values are known), never a judged reference'
    2D_Case_4: e010_run.dev_reference('case4', E010 config), O006 pilot geometry
    gen2_0: e010_run.dev_reference('gen2_0', E010 config), generator housing 70 x 40 mm, dev seed 20261110
  W: twin.twin(reference, spec) (T0349, T0377); the reference's spec carries e010_run.e008_rules
  rules: each layout's own e008_rules (drc.rules.measure_rules with min_signal_wire_length dropped, D0018 item 1); no
    relaxed floor (E010's 1.5 mm D power-width floor, D0018 decision 1, is not used anywhere in E011)
  parameter_set: 'Params.NAMES[twin.WALK_FIRST:twin.WALK_END] = indices 4-39 (columns, slots, die rows, landing lines),
    local.movable_indices(); the four power-wire foot offsets foot_{HS,LS}_land_{du,dv} do not move (D0026 item 1,
    founder decision 2026-11-16). The proxy descent, the degradation family, the search and nulls (b), (d) all move exactly this set, die
    rows included (no dies-fixed arm except the Tj fallback of the proxy, which then holds the die rows of the proxy
    only; O008 scope_in). Every row records movable_indices() in its provenance column movable_indices'
  levels:
    production: lat0.25  # L_sub: l2_layout at 0.25 mm cells, 10/6/6 layers (E010 EM_LEVELS, P3)
    band: [lat0.25, lat0.5, thk_c, thk_f, fil_f]  # D0008 / P3 band order (e010_run.BAND)
    freq_hz: 2.0e+7
  frozen:
    n_draws: 8
    tolerance: 0.02
    proxy:
      rule: 'control.proxy_descent(spec, params_of(W), twin._l1, step_limit, reach=True): steepest single-parameter L1
        descent from W over local.movable_indices(); the neighbourhood is the search''s own single-parameter moves:
        +-0.5 mm steps of every movable parameter and the twin''s reach jumps (twin._walk_candidates(reach=True): a slot
        end to the column edge or the outline limit, a column edge to the limit or back to its pad); every state built,
        DRC-clean under the layout''s e008_rules and inside derivative.in_domain(reach=True); a step must lower L1 by
        more than min_gain; to a local optimum or step_limit. W* = control.choose_proxy(W, result, L_sub at 0.25 mm):
        the descent''s end only if its L_sub is strictly lower than W''s (F3). D0026 item 2 (founder decision 2026-11-16
        20:30 UTC, reviews T0421/T0422): the reach jumps and the in-domain test are part of the rule because O008 makes the target
        an optimum of the search''s own domain (review T0358); O008''s text says 0.5 mm steps'
      reach: true
      step_mm: 0.5
      min_gain_H: 1.0e-12  # control.MIN_GAIN_H (T0379 finding 2; confirmed by the founder at T0379's merge)
      step_limit: 500
      dies_fixed: false
      tj_fallback: 'if Tj(W*) - Tj(W) > 2 K (hottest die, thermal reference level 0) the proxy is the same descent with
        die rows held fixed (dies_fixed=True), then choose_proxy again'
      dc_minus_reading: 'frozen: twin._net_side as built (2D_Case_2R reads (-1, -1, 1)). The proxy descent is
        deterministic (no seed): frozen reading on 2R 25 steps, L1(W*)/L1(W) 0.9138, on 2D_Case_4 73 steps, 0.6533
        (T0437 regression pins, tests/unit/optimize/test_control.py); 2R with DC- read +1 gave 23 steps, 0.9149, a
        different layout (T0382 attempt 1). Why the built reading is frozen: it is the code under test as hashed
        (twin.py) and it gives the deeper proxy on 2R (the harder control target). The development run on T0437''s code
        reports both readings for the proxy and for the search of draw 0 on both layouts (config.dev_run and
        research/notes/e011-dev-run.md); the L2 comparison of the two W* and the two bests is in the dev L2 run (burst
        VM). A reversal there reopens this entry before registration'
    tj_fallback_K: 2.0
    degradation:
      family: 'control.draw_degradations / degrade_draw: stochastic L1 ascent from W* by joint moves of k_lo..k_hi
        parameters of movable_indices(), each by +-mags_mm, a move accepted if the result builds, is DRC-clean, lies in
        in_domain(reach=True) and has a higher L1; stops at target_ratio (L1(D)/L1(W*)) or after max_proposals. Uses L1
        only; l2_layout is called once per attempt, only to accept or reject it (window, at the production level). A D_j
        outside in_domain(reach=True) is a defect of the family (T0414): reported, treated as out of window and redrawn
        within the limit, never scored'
      target_ratio: 1.3875  # control.FROZEN_L1_TARGET = 1.25 x 1.11 (twin.DEGRADE_RATIO, DEGRADE_MARGIN)
      max_proposals: 400
      k_lo: 2
      k_hi: 4
      mags_mm: [0.5, 1.0, 1.5, 2.0]
      window: [1.25, 1.60]  # R_D = L_sub(D_j) / L_sub(W*) at 0.25 mm (O008)
      redraw_limit: 4  # at most 5 attempts per draw; a draw that exhausts it is excluded (F6)
    search:  # local.LocalConfig, every field (its hash below is LocalConfig.hash())
      budget: 2000
      shortlist: 8
      step_mm: 0.5
      n_joint: 12
      joint_k_max: 4
      joint_steps_max: 4
      perturb_k_max: 6
      perturb_steps_max: 8
      perturb_tries: 200
      max_iters: 100000
      dies_fixed: false
    search_cfg_hash: bdefe640d8cac683
    nulls:
      step_limit: 200  # nulls.NULL_STEP_LIMIT; a capped null run is never a resolved failure (A3)
      no_moves_rule: 'review T0444 (proposed; the founder confirms with this spec): a null (b)/(d) run that ends with
        terminal nulls.NO_MOVES (its first neighbourhood held no DRC-clean in-domain move, so it returned D_j unchanged)
        is recorded with terminal_kind no_moves and capped true: it is never a resolved failure for A3 (the null never
        moved, like a capped run), it may still be a paired win, and it is reported per layout and draw. The search''s
        stop_reason no_moves (local.py: the perturbation found no valid layout in perturb_tries proposals) maps the same
        way (terminal_kind no_moves, capped true); capped does not enter A1 or K1. e011_metrics refuses no_moves,
        step_limit or budget with capped false'
      gating: [widen, compact]
      dies_fixed: false  # both nulls move movable_indices(), die rows free, as the search (T0426 item 3)
    ablation_c: {budget: 2000, shortlist: 8}  # nulls.ablation_random_screen: budget counted in sampler draws
    ablation_e: {budget: 2000, step_limit: 100000}  # control.proxy_alone: only the L1 budget ends it
    seeds:
      rule: 'sub_seed(seed, purpose, *k) = SeedSequence([tag, seed, *k]).generate_state(1)[0] with a nonzero tag first
        (numpy drops trailing zero words, so [s, li, j, 0] == [s, li, j]; founder 2026-11-16 item 4). degradation:
        draw_degradations(sealed_seed = sub_seed(seed, degrade), layout_index, ...), attempt a of draw j on
        SeedSequence(control.degrade_entropy(that, layout_index, j, a)) = SeedSequence([control.DEGRADE_TAG =
        0x4D460D01, that, layout_index, j, a]) (T0437, on main); search of draw j: sub_seed(seed, search, layout_index, j); ablation (c)
        of draw j: sub_seed(seed, random_screen, layout_index, j). The search''s seed is never the degradation''s'
      tags: {degrade: 0x0E011D01, search: 0x0E011D02, random_screen: 0x0E011D03}
    band_rule: 'b_j = 2 e_R(best_j, W*), e_R = mfos.metrics.ratio_band_estimate over the five band levels of best_j and
      W* (D0008, P3); each role''s own solves'
    band_bound:
      median_max: 0.01
      max_max: 0.02
      applies_to: per counted layout, the search's b_j over its draws (sanity check band_bound)
      development_value: {2D_Case_2R: {median: 0.00336, max: 0.00607}, 2D_Case_4: {median: 0.00229, max: 0.00269},
        holds: true, source: 'research/o008_e011_dev/dev_l2/dev_rows.json band_bound (T0471); search b_j, 8 dev draws
          per layout'}
    f2_pool_n: 2000  # draws per sampler (legacy and reach) for the coordinate-range test and the L1 lower tail
  frozen_sha256: 5f540d0aed1574d79854533241bb217763e6622eae460542a09438a0b5bcbda9  # T0471: changed only by band_bound.development_value (a measurement); every design value unchanged
  code_sha256:
    src/moduleforge/generate/derivative.py: 2be5db7e37217427c944c8dfa849de10b18222eb0c24903a359d30ee0fb9ea22
    src/moduleforge/generate/twin.py: 26a77a60130d95e4b5e087f30806ff2e26086757668d7d7e7fdecbb681a123e5
    src/moduleforge/optimize/local.py: 0da8d2c4efd8e4aa5af211875b9de9cd67d9edf126a1237abea7ea0af9205085
    src/moduleforge/optimize/control.py: de00f8c97342e1f6ff2b4d5b34292e76bc16e5e17086d56c9c2951074ab7a0a1
    src/moduleforge/optimize/nulls.py: da30f8e613c90f296131e82c2f6a62f7bb9920c19a42b7211aeeedd32dce36e7
  joint_operating_characteristic:
    status: 'method defined before the numbers (T0471, review item 1, T0462 major); values from the development rows'
    estimand: 'pi = P(the registered run''s verdict is PASS), and P(A1 met), P(A3 met), P(K1 not firing), P(INCONCLUSIVE),
      P(FAIL), over the sealed seed''s randomness (degradation draws, search and random-screen seeds), judged exactly as the
      evaluator judges (s and b from L_sub at 0.25 mm, e011_metrics), with W*, the code and the solver fixed. It is NOT
      P(PASS) against continuum-exact inductance ratios: O008 defines L_sub as l2_layout at 0.25 mm, and the method below
      does not model the discretisation error of the ratios (the band b_j reports it per draw)'
    c_definition: 'c_k = L_sub,run(W*_k) / L_sub,dev(W*_k) - 1, the relative difference between the registered run''s one
      production-level solve of W*_k and the development solve of the same layout, which every s on layout k shares
      (common mode): s*_kj = (1 + s_kj)/(1 + c_k) - 1 is the s the registered run would record for the development
      draw j. W* is deterministic (frozen descent, frozen code; dev_l2 confirms the development W* at L2), so c_k is
      zero up to the iterative solve''s error: c_k ~ U(-tau_k, tau_k), tau_k = solver_tol_rel_L_max of the W* solve
      (2R 1.85e-5, Case 4 2.65e-5), one draw per layout per replicate, applied to the search and both nulls. The earlier
      draft''s sigma_k = median b / 3.92 treated the fixed discretisation offset as a fresh draw, which no registered run
      experiences; it is replaced by the fixed-shift stress rows below'
    method: 'e011_run.joint_oc (selftest: planted 4-of-8 case gives 9/256 per layout; vectorised form equals e011_metrics on
      every checked replicate). Per counted layout independently, resample 8 development draws with replacement, each as
      its whole tuple (search, widen, compact: s, b, capped; paired on D_j), B = 20000, seed 20261119; c_k as above;
      A1, A3, K1 and the verdict per replicate. Uncertainty: e011_run.oc_lower_bounds, one-sided Clopper-Pearson lower
      bounds on each per-draw event rate (A1 s <= 0.02; resolved; paired; s <= 0.05 for K1) and the binomial tails they
      imply, singly and with a Bonferroni union bound on pi. With 8 draws per layout the plug-in bootstrap is degenerate
      at 0/8 and 8/8 (it cannot represent rates the sample did not show), so the bounds are reported beside it'
    values:
      source: research/o008_e011_dev/dev_l2/dev_rows.json (joint_oc, oc_lower_bounds)
      P_PASS: 0.0  # 0 of 20000 replicates
      P_A1: 0.0003
      P_A3: 0.226
      P_K1_not_fired: 1.0
      P_INCONCLUSIVE: 1.0
      P_FAIL: 0.0
      per_layout: '2R: P(A1) 0.0003 (2 of 8 dev draws pass; analytic 0.0004 at p = 0.25), P(compact beaten) 0.36 (paired 0.36,
        resolved 0.97), P(widen beaten) 1.0; Case 4: P(A1) 1.0 (8 of 8; at the one-sided 95 % lower bound p_L = 0.69 the
        A1 tail is only 0.23), P(compact beaten) 0.63 (resolved failures exactly 4 of 8, at the line), P(widen beaten) 1.0'
      bonferroni_lower_bound_P_PASS: 0.0
      reading: 'planning figure from 8 development draws per layout, not evidence. The registered run with this frozen
        design is expected to be INCONCLUSIVE (A1 missed on 2R, compaction not beaten on 2R), not PASS'
  sensitivity_rows_dev:
    - 'proxy without the gain threshold (min_gain 0): steps, L1 ratio, L_sub at the development resolution'
    - 'the probe''s DRC-only proxy (reach=False): known limit of the search: on 2D_Case_2R it lies outside the domain
      (in_domain fails at row_LS_gap, the die-row gap cap gmin + 2 mm); recorded for O009 and the thesis review'
    - the dies-fixed descent (the Tj fallback candidate) with its level-0 Tj
    - the proxy and the search of draw 0 under the other DC- reading (T0379 finding 1)
    - per null and draw, steps and terminal kind (NULL_STEP_LIMIT 200; T0425/T0426 asked whether Case 4 nulls reach a
      local optimum)
  dev:
    rule: development seeds and development draws only; never the sealed draws; L1 stages locally, L2 on a burst VM
    dev_seed: 20261116
    layouts: [2D_Case_2R, 2D_Case_4]
    screen_level: lat0.5  # T0379: development shortlist and R_D screening at 0.5 mm; keys carry the level
    manifest: experiments/drafts/E011.dev_jobs.json
    provisional: 'locally W* is taken as the descent''s end (T0376: lower than W at 0.5 mm on both layouts) and each
      draw''s attempt 0 as accepted; the dev L2 analysis confirms or redoes both'
    registration_check: 'mfos exp check E011 --rows <dev rows>: A3 met on development draws against this in-domain
      proxy (the probe''s null margins were measured against the deeper reach=False proxy and do not carry over)'
    workdir_stamp: 'every work directory carries code_stamp.json (sha256 over src/moduleforge/**/*.py, e010_run.py and
      e011_run.py, and the config blocks frozen, levels, dev, smoke, layout_index, layouts, counted_layouts); the runner
      refuses a directory whose stamp differs or whose checkpoints have no stamp (founder 2026-11-17 item 3), so no
      development row mixes stages from two code versions'
    manifest: 'schema e011.dev_jobs/2: one job per (fingerprint, level), with every purpose that asked for it and, for
      shortlist members, the L1 rank inside each shortlist; the code_stamp of the L1 stages; totals.jobs_wave1,
      jobs_by_level and shortlist_groups'
    dev_solve: 'refuses a manifest whose status is not complete or whose code_stamp differs from the checkout; submits
      every job (count asserted equal to totals.jobs_wave1 and to the number of distinct (fingerprint, level) outputs);
      rebuilds each shortlist group from all purposes, so a layout in two shortlists belongs to both; selects each
      best by local_search''s rule (lowest L at screen_level, ties by L1 rank); bands each best at the five levels;
      writes dev_solve_summary.json and exits 3 unless every job has a result that passes l2_converged''s predicate.
      With --dry-run it makes the same refusals, rebuilds and count checks and solves nothing
      (dev_solve_dryrun.json)'
    r_d_placeholder: 'review item 4 (T0471): in record mode (dev) the degradation''s R_D callback returns the window
      midpoint only to keep the attempt (control flow); the runner now records r_d None with r_d_provisional true
      (draw records, attempt logs, rows'' R_D and R_D_provisional) and --dev-rows fills the measured R_D at 0.25 mm and
      0.5 mm from the burst''s solve of D_j. The committed manifest predates this and still carries 1.425: read it as
      the placeholder'
    search_budget_curve: 'per counted layout and draw, the share of the search''s final L1 gain made in the last 10 %
      and the last 25 % of its 2000-evaluation budget, and the medians per layout (e011_run.improvement_curve). Exact
      when last_improve_eval is at or before the cut (share 0) or when a shortlist member was evaluated by the cut
      (the shortlist holds the K lowest-L1 visited layouts, and LocalResult.visited gives each one''s evaluation
      index); otherwise reported as a bracket between the shortlist''s highest L1 and the trajectory''s running
      minimum, with exact false. Reported for the founder''s budget decision before registration; this design does
      not change the budget'
  dev_l2:
    status: 'T0471 (2026-11-19): development rows from the burst''s 740 converged results used (743 solved; I0205),
      e011_run.py --dev-rows experiments/drafts/E011.dev_jobs.json --workdir research/o008_e011_dev/dev_l2, no new solve.
      The burst''s code stamp (dev_l2/code_stamp.json, tree 33dac5c7...) equals the manifest''s; the checkout''s stamp
      differs after T0471''s runner edits, as it must; rows record both. Facts and inferences:
      research/notes/e011-dev-l2-analysis.md'
    rows: research/o008_e011_dev/dev_l2/dev_rows.json  # {'rows': [...]}: 96 rows, 2 layouts x 6 roles x 8 draws
    proxy_choice: 'choose_proxy at 0.25 mm keeps the descent on both layouts (the provisional W* holds): L_sub(W*)/L_sub(W)
      2R 0.9376 (L1 0.9138), Case 4 0.7176 (L1 0.6533); the ratio moves by at most 7e-4 across the five band levels'
    R_D: 'R_D at 0.25 mm: 2R 1.209-1.406 (median 1.289), 7 of 8 in [1.25, 1.60] (draw 1 at 1.209); Case 4 1.279-1.305
      (median 1.288), 8 of 8. Review item 7 confirmed: (R_D - 1) / (L1 ratio - 1) is 0.68-0.79, so the L1 target 1.3875
      maps to about 1.28 at L2, 0.03 above the window floor; out-of-window rate 1 of 16. Redraws from the same family aim
      at the same L1 target, so a systematic offset is not corrected by redrawing (founder decision 2)'
    gated_on_dev_rows: 'A1 0.25 (2R 2 of 8, Case 4 8 of 8); A2 0; A3 0 (2R compact: 6 resolved, 6 paired < 7; Case 4
      compact: 4 resolved, at the line; widen beaten on both); K1 0.0297 (2R median; Case 4 0.0069), not firing. Verdict
      on dev rows: INCONCLUSIVE. mfos exp check E011 --rows: A1 not satisfied, A3 not satisfied. A1 risk is 2R, as the
      L1 indicator said (review item 6)'
    band_bound_by_role: 'search: 2R median 0.0034 max 0.0061; Case 4 median 0.0023 max 0.0027 (bound holds). Nulls, not
      gated by the bound: compact 2R 0.0032 / 0.0068, Case 4 0.0023 / 0.0048 (would hold); widen 2R 0.0118 / 0.0171,
      Case 4 0.0189 / 0.0250 (would fail; widen''s s is 0.08-0.20, so its resolved failures are not near the band)'
    ranking_stability: 'review item 3: the burst solved only each shortlist''s best at 0.25 mm (1 member per group at both
      levels; 0 groups with 2), so the direct measure is not possible from these data. Over the 51 (2R) and 50 (Case 4)
      layouts solved at both levels, q = L(0.25)/L(0.5) spans 0.25 % (2R) and 0.49 % (Case 4), sd 0.06 % and 0.12 %;
      screen-level gaps best to runner-up 0-0.13 %, so a different 0.25 mm best is possible in most groups, with s''s
      selection error bounded by 0.25 % (2R) and 0.48 % (Case 4). The production-level best has L_sub no higher than the
      screen-selected member''s, so every dev search s is an upper bound for the registered rule on the same shortlist.
      A direct measure needs 113 (2R) + 118 (Case 4) shortlist members at 0.25 mm: about 29 h of 2R and 100 h of Case 4
      solve time, about $30 at the burst''s measured walls; not run'
    dc_minus_reading_l2: 'the other DC- reading''s proxy has L(0.5 mm)/L(W*) = 1.0000 on both layouts; the search of draw 0
      under it: 2R s 0.0193 (frozen reading 0.0220, a different best), Case 4 the same best (0.0148). No reversal of W*;
      the 2R draw-0 difference (0.27 points) straddles the 2 % line'
    sensitivity_proxies_l2_screen: 'L(0.5 mm)/L(W*): threshold-free 1.0001 / 1.0001; reach=False probe 0.990 / 0.973
      (deeper, outside the domain); dies-fixed 1.022 / 1.069 (2R / Case 4)'
    tj_fallback: 'review item 9: in dev mode W* is provisional, and the old runner skipped the fallback silently. The
      runner now evaluates tj_fallback_due in every mode and, when it is due on the provisional W*, records the dies-fixed
      descent''s band jobs for the burst (selftest plants 3 K). On the development layouts it is not due: Tj(W*) - Tj(W)
      = -1.62 K (2R), -2.02 K (Case 4)'
    work_checkpoints: 'review item 8: research/o008_e011_dev/work (stage checkpoints, .wall files) and work_dev.log are not
      on this machine (not in this worktree, main or any other worktree; never committed), so their sha256 cannot be
      recorded. Recorded instead: manifest sha256 17bd0a76... (its layouts.*.search_improvement.per_draw holds every
      bracket end), dev_summary.md 44d24cc6..., dev_l2 results tree (dev_rows.json provenance). The brackets can be
      read, not re-derived; re-deriving needs a deterministic --dev rerun on the stamped code (founder decision 5)'
  prerequisites:
    status: 'satisfied in this branch (T0382 attempt 4, 2026-11-17): the founder merged main into it (commit 8a8b8fc1),
