    proxy_reach_true: '2D_Case_2R 25 steps, L1(W*)/L1(W) 0.9138; 2D_Case_4 73 steps, 0.6533; both local optima, W*
      DRC-clean and in in_domain(reach=True); W* provisional (= the descent''s end) until the L2 choice'
    proxy_sensitivity: '2R: threshold-free 35 steps 0.9136; reach=False (probe) 27 steps 0.8979; dies-fixed 17 steps
      0.9302; DC- read +1 23 steps 0.9149 (a different layout). Case 4: threshold-free 81 steps 0.6532; reach=False
      120 steps 0.6280; dies-fixed 63 steps 0.7014; DC- read +1 73 steps 0.6533, the same layout as the frozen reading'
    dc_minus_search_draw0: 'on both layouts the search of draw 0 under the other DC- reading reaches the same lowest L1
      (relative difference 0) with a different shortlist; the L2 comparison waits for the burst'
    tj_level0_K: '2R: W 398.10, W* 396.49 (fallback not fired); Case 4: W 398.08, W* 396.05 (not fired)'
    degradation: '2R: 8 attempts, L1(D_j)/L1(W*) 1.309-1.538 (median 1.403), 7 of 8 reached the 1.3875 L1 target (one
      stalled at 1.309 and still costs an L2 call); Case 4: 8 attempts, 1.390-1.421, 8 of 8 reached it; no draw
      outside in_domain(reach=True). R_D at L2 and the redraw rate are pending (every draw is provisionally accepted
      locally)'
    search_budget_curve: 'all 16 searches stop at the 2000-evaluation budget and improve after evaluation 1800 (last
      improving evaluation 1860-2000). Share of the final L1 gain made in the last 10 % / 25 % of the budget (upper
      end of each bracket; no draw is exact): 2R median 0.001 / 0.013, max 0.009 / 0.030; Case 4 median 0.028 / 0.109,
      max 0.060 / 0.162. The founder decides the budget before registration; unchanged here'
    l1_indicator_not_evidence: 'L1(search lowest-L1 layout)/L1(W*) = L1(D_j)/L1(W*) x (1 - L1 gain): 2R 0.9965-1.0552
      (5 of 8 at or below 1.02); Case 4 0.9938-1.0142 (8 of 8). A1 is judged on L_sub at L2, which the burst decides'
    nulls: 'all 32 null runs (widen and compact, 8 draws, 2 layouts) end at local_optimum, seed_in_domain true; none
      capped, none no_moves. Steps: 2R widen 14-26, compact 21-36; Case 4 widen 30-58, compact 53-73 (NULL_STEP_LIMIT
      200 not approached); valid neighbours at step 0: 56-74'
    ablations: '(c) random screen: l1_evals 2000 and n_draws 2000 on every draw; (e) proxy alone: 2R 28-42 steps (4
      budget, 4 local_optimum), Case 4 29-35 steps (all budget)'
  smoke:
    level: thk_c  # 0.5 mm cells, 5/3/3 layers: E010's cheapest frozen level; 0.5 mm is the coarsest cell the grid allows
    n_draws: 1
    window: [0.0, 1.0e+9]  # smoke only: any R_D accepted
    frozen_overrides:
      proxy: {step_limit: 3}
      search: {budget: 25, shortlist: 1}
      ablation_c: {budget: 15, shortlist: 1}
      ablation_e: {budget: 25}
      nulls: {step_limit: 3}
      degradation: {max_proposals: 40, redraw_limit: 0}
      f2_pool_n: 10
  reporting:
    per_draw: changed-parameter count and Manhattan distance from D_j and from W* (over movable_indices) for the search
      and every null; the search's steps, moves, L1 evaluations, whether it stopped at its budget and was still
      improving in the last 10 %; F4's Spearman rank correlation L1 vs L_sub within the shortlist and the L2/L1 range
    per_layout: W, W* and each best_j hottest-die Tj at the thermal reference's level 0 (E010's scikit-fem GridRule and
      operating point, P_ref calibrated on the reference); L1(W*)/L1(W) and L_sub(W*)/L_sub(W); W*'s DRC; the L1 stop
      distribution of the degradations, the rate of reaching the L1 target, the redraw and exclusion counts (F6), and
      the attempts that missed the L1 target but still cost an L2 call; the search's improvement curve
      (dev.search_budget_curve)
    ablations: (c) random screen (l1_evals beside n_draws) and (e) proxy alone, each with its A1, A3 and K1 computed as
      if it were the search (e011_metrics), beside the search's
    reported_not_gated: conservative A1 (s + b <= 0.02), draws within their band of the line, the pooled one-sided 95 %
      Clopper-Pearson bound, the per (layout, null) resolved and paired counts
  cost_estimate:
    basis: 'E010 cost model (e010_run.em_unknowns / em_cost; n2d-custom-8 VM at 0.612 $/h, four 0.25 mm Case 4 solves
      at once); unknowns at 0.25 mm: 2D_Case_2R 1.49 M (about 6.2 GB), 2D_Case_4 4.11 M (15.8 GB), gen2_0 about 0.33 M'
    registered_run_solves_per_layout: 'W and W* bands (10); R_D at 0.25 mm per attempt (8 x (1 + redraw rate)); the
      search and the random-screen shortlists at 0.25 mm (2 x 8 x 8 = 128); widen, compact and proxy-alone end points
      (24); the four 0.5 mm band levels of six scored layouts per draw (192): about 360 solves, 170 of them at 0.25 mm'
    registered_run_usd_superseded_T0471: 'Case 4: 170 x 0.25 mm at about $0.24 (four at once) = $41 plus 190 x 0.5 mm at about $0.04 =
      $8; 2R about 40 % of Case 4 ($20); gen2_0 about $5: about $75 of VM, within O008''s $50-100. Development run: the
      manifest''s own totals (experiments/drafts/E011.dev_jobs.json)'
    sizing_measured_T0471: 'review item 2. Measured on the burst (dev_rows.json measured_sizing): 0.25 mm walls median
      925 s (2R) and 3046 s (Case 4), 0.53-0.66 of E010''s model; peak RSS max 6.4 GB and 16.5 GB (1.00-1.05 of the
      model); CPU/wall 1.25-1.46 at 2 threads. The burst VM''s shape is not in the repository, and the 2026-11-09
      calibration measured 5700-5900 s for Case 4 at 0.25 mm with four at once on the 8-vCPU N2D, so a full-load
      sensitivity (Case 4 0.25 mm at 5900 s) is given beside each figure. Model: registered_model''s solve counts per layout
      (P 10, D 8 + redraws, S1 152 at 0.25 mm, S2 192), phases and layouts in sequence as run_all runs them, list
      scheduling (E010.simulate) at p90 walls and 1.1 x max peak; gen2_0 from E010''s model x 2R''s measured ratios;
      redraws: none / the measured out-of-window rate 1/16 / every draw in all 4 waves. Pricing: 0.612 $/h at 8 vCPU
      80 GB (founder''s figure), extended memory 0.0086 $/GB-h (E010 config, unchecked), 16 vCPU taken as 2 x 0.612
      (assumption to check in the console)'
    registered_run_options:  # the founder chooses; makespan h / USD as (measured walls; full-load sensitivity)
      A_n2d_custom_8_80GB: 'current shape, 3 Case 4 0.25 mm solves at once: 105-122 h, $65-75 (full load 144-170 h,
        $89-104). Needs timeout_min of about 10800 (180 h)'
      B_n2d_custom_8_96GB_ext: '+16 GB extended memory, 4 at once: 92-105 h, $69-79 (full load 121-140 h, $91-105).
        timeout_min about 9000 (150 h)'
      C_n2d_custom_16_160GB_ext: 'all 16 vCPUs of the free-trial cap, so only when no other burst holds 8: 53-63 h,
        $66-78 (full load 71-87 h, $87-107). timeout_min about 6000 (100 h)'
      split: 'a split into runs (e.g. Case 4 alone) needs a layout-subset flag and a merge of work directories that the
        runner does not have; not offered as an option for this registration'
    registered_run_usd: '$65-107 of VM by option and load (above); plus the development burst (I0205; manifest estimate
      $38-44). O008''s notes expected $50-100 of VM in all'
    cpu_hours_est: 495  # process CPU-hours of the registered solves, measured walls x CPU/wall (662 at full load)
    sizing_check_attempt2: 'T0382 attempt 2, from E010''s cost model (e010_run.em_unknowns / em_cost and
      cost_model.em_level_mem_prior) on each layout''s area. These are model figures, not measurements. Usable memory
      on the VM is 0.85 x 78 GB = 66.3 GB. 2D_Case_4: lat0.25 4.11 M unknowns, 1.60 h, 15.8 GB model, 25.3 GB with the
      level prior 1.6, 2 at once; thk_f 2.05 M, 0.90 h, 14.9 GB, 4 at once; fil_f 1.03 M, 0.46 h, 11.8 GB, 5 at once;
      lat0.5 1.03 M, 0.22 h, 7.3 GB, 9 at once; thk_c 0.51 M, 0.11 h, 4.0 GB. 2D_Case_2R: lat0.25 1.54 M, 0.39 h,
      10.3 GB, 6 at once; the other levels are 2.3-6.5 GB. Inference: E010''s Scheduler admits a job by the
      prior-inflated figure until it has measured a ratio, so 2, not 4, Case 4 0.25 mm solves run at once at first.
      At about 170 such solves (272 solve-hours) that is about 136 h of makespan and about $83 for that part alone,
      above timeout_min (7200 min = 120 h) and pushing the registered run to about $105. If the measured memory
      matches the model (x 1.1 = 17.4 GB), 3 run at once: about 91 h and $55 for that part, about $80 in total. The
      registered_run_usd line above assumed 4 at once at 15.8 GB. The founder decides the VM shape and the timeout
      before registration; this design does not change them. The development manifest''s vm_sizing block states the
      same per (layout, level) from the jobs it lists'
    sizing_check_attempt4: 'T0382 attempt 4, from the complete development manifest (E011.dev_jobs.json vm_sizing,
      e011_run.vm_sizing / registered_model; E010 cost model on each layout''s unknowns, list scheduling with E010''s
      simulate). Facts: the founder''s VM calibration (research/l2_thread_calib/summary.txt) measured 15.8-15.9 GB peak
      RSS for 2D_Case_4 at 0.25 mm (4.11 M unknowns; 6268-6360 s pinned) and 4.1 GB at 0.5 mm, i.e. 1.007 and 0.90 of
      E010''s model. The 25.3 GB figure is E010''s scheduling prior (model 15.8 GB x em_level_mem_prior 1.6), applied
      only until the first Case 4 0.25 mm solve finishes; then the Scheduler admits at model x 1.1 x 1.007 = 17.5 GB.
      On n2d-custom-8-81920 (66.3 GB usable, 8 vCPUs, 2 threads per solve, so at most 4 solves by vCPUs): Case 4 at
      0.25 mm runs 2 at once under the prior and 3 after learning; every other (layout, level) runs 4 (vCPU-bound). This
      attempt''s smoke measured gen2_0 at thk_c with 228,567 unknowns against the model''s 281,064 (model 23 % high),
      about 1.8 M at 0.25 mm, so the 0.33 M in the basis line above is wrong. Development burst: 611 wave-1 + 170 wave-2
      jobs, makespan 61.4 h (learned) to 71.5 h (prior), $38-44 with the 0.5 h overhead. Registered run (model: phases
      P, D, L1, S1, S2 in order and layouts one after another, as run_all executes them): 170 h (learned memory, no
      redraws) to 246 h (prior memory, every draw redrawn in all 4 redraw waves), $104-151 (170.2 / 198.0 / 212.3 /
      246.4 h for learned / learned with redraws / prior / prior with redraws); no scenario fits timeout_min
      7200 (120 h). Case 4 alone is about 109 h under the learned figure, 81 h of it for its 152 shortlist and end-point
      solves at 0.25 mm, 3 at a time. Inference: the registered_run_usd line above (four Case 4 solves at once,
      phases overlapped) understates both time and cost. The founder decides the timeout, the VM shape or a split of
      the run before registration; this design changes none of them'
  expected_outcome:
    note: 'expectations, not criteria; they say what a wrong model would look like. Updated by T0471 from the dev L2 rows
      (review item 6)'
    A2: 'met (0): both twins are in in_domain(reach=True) (T0377 tests; dev rows A2 0); F2 shows 2R false under the legacy
      generator'
    A1: 'expected NOT met with this frozen design: on the development draws 2R passes 2 of 8 (s 0.022-0.050 on the
      misses), Case 4 8 of 8. 2R is the A1 risk, as the L1 indicator said (5 of 8 within 2 % at L1, 2 of 8 at L2); the
      earlier text naming Case 4 is withdrawn. A miss is an L1/L2 disagreement near the optimum first (F4: within-shortlist
      Spearman L1 rank vs L(0.5 mm) -0.95 to 0.25 on 2R), not budget (2R made under 1 % of its L1 gain in the last 10 %)'
    A3: 'expected NOT met: compaction is not beaten on 2R on the dev draws (6 resolved failures, 6 paired wins < 7) and
      sits at the resolved-failure line on Case 4 (4 of 8); widen is beaten on both. Joint P(A3) 0.23'
    K1: 'not expected to fire: medians 0.030 (2R) and 0.007 (Case 4) against 0.05'
    joint: 'expected verdict INCONCLUSIVE (joint OC P(PASS) 0, P(INCONCLUSIVE) 1 on 20000 replicates of the dev draws)'
    what_would_prove_the_design_wrong: 'the seed null meeting A1 (s computed against D_j, not W*); a draw scored with
      D_j outside the domain; a band median above 0.01 (the resolution cannot judge a 2 % line)'
  founder_decisions_before_registration:
    - '1 (blocking). Register as is, or redesign first. As is, the dev rows give A1 0.25 and A3 0, and O008 F1 requires
      A3 met on development rows at registration, so E011 cannot pass its own registration check. Options: (a) a
      pre-registration redesign of the proxy rule, the degradation family or the search''s L2 shortlist (frozen values
      the session may not change; each would need new dev rows); (b) accept that the control fails on 2R and go to the
      objective''s inconclusive/stop path without spending the registered run. Recommendation in the T0471 note'
    - '2. The degradation''s L1 target 1.3875 lands R_D at about 1.28 at L2 (window floor 1.25; 1 of 16 out). Keep it,
      or move the target so R_D centres in the window (frozen value; founder only)'
    - '3. Search budget (research/notes/e011-dev-run.md section 4): keep 2000; the dev L2 rows show the 2R misses are not
      budget-limited'
    - '4. no_moves rule (review T0444, proposed): adopt as written; it did not bind on any dev run (0 of 32 null runs, 0 of
      16 searches)'
    - '5. Review item 8: the work checkpoints are gone; rerun --dev deterministically on the stamped code (about 2 h local,
      includes local level-0 thermal solves) to commit their hashes, or accept the manifest''s recorded brackets'
    - '6. Registered-run option A, B or C (cost_estimate.registered_run_options) and timeout_min to match; O008''s VM
      budget ($65-107 for the run plus the dev burst)'
metrics:
  - {name: control_layout_pass_min, description: 'A1: min over counted layouts of #(search s_j <= 0.02) / 8; CI = the
      min of the Bonferroni-simultaneous per-layout Clopper-Pearson 95 % intervals'}
  - {name: reach_outside_max, description: 'A2: max over the development layouts of 1 - in_domain(W) (reach); a
      deterministic predicate, CI = the point'}
  - {name: null_beaten_min, description: 'A3: 1 if widen and compact are each beaten on every counted layout (>= 4 of 8
      resolved failures s - b > 0.02, not capped, where step_limit and no_moves are capped; >= 7 of 8 paired wins by more than b_search + b_null), else 0; CI =
      the point (an indicator), the counts are reported'}
  - {name: control_shortfall_median_max, description: 'K1: max over counted layouts of the median search s_j; CI = (max
      of the per-layout minima, max of the per-layout maxima): the order-statistic interval (x(1), x(8)) of each median,
      coverage 1 - 2 x 0.5^8 = 0.992 per layout (binomial order statistics; Conover 1999, Practical Nonparametric
      Statistics, 3rd ed., section 3.2)'}
sanity_checks:
  - {name: F1a_seed_null_fails_A1, description: 'null (a), D_j returned unchanged, must fail A1 (s_j = R_D - 1 >= 0.25 by
      construction); meeting it is INVALID'}
  - {name: F2_W_rebuild, description: 'every layout: W rebuilt from params_of(W) is DRC-clean under its rules and
      reproduces its fingerprint'}
  - {name: F2_in_domain_reach, description: 'every layout: in_domain(W, reach=True) (A2 is then 0)'}
  - {name: F2_legacy_outside_2R, description: 'in_domain(W) is false for 2D_Case_2R under E010''s generator (legacy
      domain, reach=False), so A2 is not met by construction'}
  - {name: F2_symdiff_reported, description: 'the twin-versus-reconstruction power-copper symmetric difference (mm2) is
      computed for every layout (twin.difference_record)'}
  - {name: F2_coordinate_range_attached_form_2R, description: 'T0349 section 2.2 on 2R: W lies outside the legacy pool''s
      drawn range in at least one coordinate and has slots that straddle or overlap their column (the sampler''s
      attached form cannot produce it)'}
  - {name: F2_l1_lower_tail_reported, description: 'per layout and sampler (legacy, reach), the L1 lower tail of a
      2000-draw pool relative to L1(W) (min excess, counts within 0-15 %), D0023'}
  - {name: F6_two_counted_layouts, description: 'at least 2 counted layouts supply 8 draws with R_D in [1.25, 1.60]
      within the redraw limit; else INVALID'}
  - {name: Wstar_drc_clean, description: 'W* of every layout is DRC-clean under its rules and in in_domain(reach=True)'}
  - {name: draws_seed_in_domain, description: 'every scored D_j has the search''s stats[seed_in_domain] true (T0414)'}
  - {name: seed_streams_distinct, description: 'on the streams this run used (T0432): the integer sub-seeds of every
      purpose, layout and draw are pairwise distinct; the SeedSequence state of every degradation attempt''s recorded
      entropy list is distinct from every other and from the first streams of every search (local.py [seed, 1, it],
      [seed, 2, n]) and random screen (search.candidate_stream [seed, k]); the runner''s domain tags are nonzero and
      distinct. Reported: whether control.py''s entropy lists start with a domain tag (T0414 item 4)'}
  - {name: metrics_agree, description: 'the runner''s values (e011_metrics, n7) equal mfos.metrics on the same rows'}
  - {name: recompute_agrees, description: 'every recompute entry, evaluated as mfos.evaluate does, equals the runner''s
      value'}
  - {name: l2_converged, description: 'every l2_layout result passes E010''s predicate (e010_run.band_solve_failures,
      T0318 finding 0): L_H finite, a convergence record with every GMRES flag 0, solver_tol_rel_L_max finite; a missing
      key or a failed solve record fails closed'}
  - {name: band_bound, description: 'per counted layout, median b_j <= 0.01 and max b_j <= 0.02 over the search''s draws
      (frozen.band_bound): the resolution can judge the 2 % line'}
  - {name: F5_frozen_and_code, description: 'canonical sha256 of config.frozen equals frozen_sha256; LocalConfig.hash()
      equals frozen.search_cfg_hash; the sha256 of derivative.py, twin.py, local.py, control.py, nulls.py equal
      config.code_sha256'}
  - {name: artifacts_resolve, description: 'every registered artifact resolves as tools/mfos/mfos/evaluate.py resolves it:
      <run_dir>/<name> with its sha256 (run-dir-relative names; T0349 finding 2)'}
timeout_min: 10800  # option A (current shape) incl. full load and max redraws; B 9000, C 6000: the founder chooses
cpu_hours_est: 495
code_under_test:
  - src/moduleforge/generate/derivative.py
  - src/moduleforge/generate/twin.py
  - src/moduleforge/optimize/local.py
  - src/moduleforge/optimize/control.py
  - src/moduleforge/optimize/nulls.py
rows: {artifact: rows.json}
recompute:
  - {metric: control_layout_pass_min, fn: control_layout_pass_min, pred: s, group: layout,
     where: {role: search, counted: true}, params: {tol: 0.02, n_draws: 8}}
  - {metric: reach_outside_max, fn: max_col, pred: reach_outside}
  - {metric: null_beaten_min, fn: null_beaten_min, pred: s, group: layout, role: role, where: {counted: true},
     params: {nulls: [widen, compact], search: search, draw: draw, b: b, capped: capped, tol: 0.02, k_resolved: 4,
              k_paired: 7, n_draws: 8}}
  - {metric: control_shortfall_median_max, fn: control_shortfall_median_max, pred: s, group: layout,
     where: {role: search, counted: true}, params: {n_draws: 8}}
null_baselines: []
recompute_exempt: {}
