    workdir: research/o008_e011_dev/work (code_stamp tree 33dac5c7b2fc7a5e..., config 96d37c745505fde9...)
    manifest: 'experiments/drafts/E011.dev_jobs.json, status complete: 611 wave-1 jobs (lat0.5 339, lat0.25 / thk_c /
