id: E008
objective: O003
status: draft
title: Module-level loop-inductance headroom of the D0010 references inside their own housing at <= +2 K Tj (frozen D0008
  search, l2_layout 0.25 mm band, scikit-fem C004 thermal reference; O003 A1/K1, F1-F6)
runner: uv run python experiments/runners/e008_run.py
config:
  fem_rule_path: research/o007_dev3/frozen_config.json
  fem_rule_file_sha256: 0226b7709e2554013008a05f05d952bf646711edc0eb5967498864417a120e9a
  fem_rule:
    amg_gs_sweeps: 2
    amg_seed: 20261103
    candidate_id: a_q1h4_graded_gs2
    cg_eligibility_limit: 300
    cg_maxiter: 400
    dz_max_m: 0.001
    edge_grading:
      first_offset_m: 0.0001
      max_offset_m: 0.004
      min_gap_fraction: 0.5
      ratio: 2.5
    element_order: 1
    feasible: true
    h0_m: 0.004
    levels:
    - 0
    - 1
    - 2
    levels_missing: {}
    linear_rtol: 1.0e-11
    mandatory_lines: 'box-stack mode: x and y lines through every source centroid (built in) and through the frozen reference
      maximum of every source (extra_lines); layout mode (manufactured case): x and y lines through every frozen reported
      point and maximum, z lines at their (interface) heights; generator layouts: none (Tj max = max nodal value on the die
      top face). Snapping: production SNAP_FRACTION 1e-2 of the level-0 cell; every snap recorded and the node at the snapped
      coordinate reported. Edge grading: production GridRule.edge_grading in both modes; in layout mode the fixed set also
      holds every layout geometry line (T0227/T0231).'
    min_cells: 2
    near_margin_m: 0.002
    nz_min: 1
    picard_tol_K: 0.0001
    quadrature:
      faces: 3x3 Gauss (intorder 4)
      manufactured_data: 4x4x4 / 4x4 Gauss (intorder 7)
      stiffness: 2x2x2 Gauss (Q1)
    rationale: 'candidate a_q1h4_graded_gs2 verified eligible on every criterion at level 2 (sec. 0.2); only candidate. Pre-registered
      rule: research/notes/o007-dev-study3.md sec. 0 (commit 1cd23ad8); T0228 candidate 1 (research/o007_dev2/frozen_config.json)
      key for key plus amg_gs_sweeps = 2.'
    refinement_ratio: 2
    snap_fraction: 0.01
    zrefine: true
