metrics:
- name: headroom_min_lo
  unit: ''
  description: 'A1. min over counted references of h_lo = a (1 - r (1 + w)), twin rule first, conservative interval Tj test
    against the twin (mfos.metrics.headroom_min_lo). The band is inside the value (interval form; objective uncertainty: point),
    level 0.0, no CI.'
- name: headroom_max_hi_ind
  unit: ''
  description: K1. max over counted references of h_hi from the inductance-only best, levelling first, twin rule, near ties
    (mfos.metrics.headroom_max_hi_ind). May be +inf.
- name: headroom_min_lo_Lterm0
  unit: ''
  description: 'secondary: headroom_min_lo with L_term = 0'
- name: headroom_min_lo_Lterm17p5
  unit: ''
  description: 'secondary: headroom_min_lo with L_term = 17.5 nH'
- name: headroom_min_lo_recon
  unit: ''
  description: 'secondary: headroom_min_lo with the reconstruction as comparator (row contract item 9)'
- name: headroom_max_hi_ind_Lterm0
  unit: ''
  description: 'secondary: headroom_max_hi_ind with L_term = 0'
- name: headroom_max_hi_ind_Lterm17p5
  unit: ''
  description: 'secondary: headroom_max_hi_ind with L_term = 17.5 nH'
- name: headroom_max_hi_ind_recon
  unit: ''
  description: 'secondary: headroom_max_hi_ind with the reconstruction as comparator (row contract item 9)'
- name: null_twin_as_best_h_lo
  unit: ''
  description: 'declared A1 null: L_sub_null_H in place of L_sub_H; -a s_ref <= 0 by construction'
- name: l1_only_null_h_lo
  unit: ''
  description: 'reported null (F1, not gated): min over counted references of h_lo of the L1-only search (top 8 by L1 checked
    in L1 order, batch-and-stop, the first candidate meeting the conservative test), against the twin, twin rule first; w
    from its own band if F3 solved one, else the A1 best''s w (stated per reference). Expected at or below headroom_min_lo'
- name: n_counted_references
  unit: ''
  description: admissible references passing both twin gates
- name: stack_type_a3
  unit: ''
  description: 'F6(e): max over the non-default stack types of max_gci_consistency on that type''s spot-check reference'
sanity_checks:
- name: freeze_hashes
  description: 'F3: every freeze file sha256 equals config.freeze; checked before any reference is loaded'
- name: grid_rule_frozen
  description: 'F6(b): the GridRule file sha256 0226b770...0e9a and key for key equal config.fem_rule'
- name: thermal_fem_sha256
  description: 'F6(b): thermal_fem.py has the bytes EV-O007-01 evaluated (a216d5fe...)'
- name: metric_params_exact
  description: floor = 1e-3 K and tj_limit_K = 2.0 K exactly (T0283/T0284)
- name: fail_fast_twin_and_D
  description: W and D of every reference built (L1 only) before the first l2_layout solve; TwinError / DegradeError stop
    the run with the reason
- name: F1b_D_definition
  description: 'per reference: L_sub(D)/L_sub(W) (1 - 2 e_R(D, W)) >= 1.25 from the stored band solves, before K1 is read'
- name: F1a1_F1a2_twin_gates
  description: 'per reference (exclusion, not INVALID): inductance and thermal twin gates as headroom_per_reference computes
    them'
- name: at_least_one_counted_reference
  description: 'F1(a): E008 INVALID if no reference remains'
- name: F1b_control
  description: h_ctrl >= h_plant - w_ctrl per reference (new sealed seed, same budget, inductance only)
- name: F1c_band_width
  description: w <= 0.05 for the A1 best and w_ind for the inductance-only best, every reference
- name: F6a_own_three_grids
  description: 'per thermal solve: fingerprint of the layout, node counts x8 +/- 15 % per level, every GCI recomputed by gci_capped'
- name: F6c_energy_balance
  description: '|Q_out/Q_in - 1| <= 1e-6 on every thermal solve: scikit-fem levels 0-2, the calibration and the F6(e) finite-volume
    spot-check solves (T0305 finding 5)'
- name: F6c_picard
  description: last Picard max|dT| <= 1e-4 K on every thermal solve
- name: F6d_operating_point
  description: the reconstruction's level-0 hottest-die rise at P_ref within 60 +/- 1 K before any candidate solve
- name: F6e_stack_type_spot_check
  description: max_gci_consistency (scikit-fem L0-2 vs thermal_fv L1-3, cap 0.25 K, floor 1e-3 K) <= 1 on every die of one
    reference per non-default stack type (AlN). Stack type = the substrate layers, the die attach and the die, each by name,
    material, thickness and k (T0305 finding 0). One check F6e_stack_type_spot_check:<type> per non-default type, every one
    gated; this declared check passes only if all of them pass
- name: driver_s_ref_matches_rows
  description: 'per reference: the s_ref the frozen driver was given (its near-tie window and w) equals snapping_bias of the
    reference row, so the band solves the metric needs exist (T0304 finding 3)'
- name: recompute_agrees
  description: runner metrics equal mfos.metrics and research/o003/headroom_metrics.py (rel 1e-9)
