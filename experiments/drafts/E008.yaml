      (frozen rule) so that its hottest die rises 60 +/- 1 K above the 65 C coolant at uniform h = 5000 W/(m2 K); then used
      unchanged on every layout and grid of that reference, twin included; the same rule for every reference; a customer''s
      own operating point is not judged'
