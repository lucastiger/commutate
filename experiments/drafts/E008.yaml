      src/moduleforge/geometry/snap.py: d75da78fba20d0be52e1f736b4e0a6910673f5044c4d4b26ce75ab08bce6b1de
      src/moduleforge/drc/rules.py: 19a32c767757434bb0e417c8987b0a80e60549514ea4ab9f63d5da927da64fc5
