        ''thermal levels 0-1''), 64 candidates, one thread per solve. Not evidence; does not decide the band check or the
        twin gates.'
  reporting:
    rule_strictness: 'T0280: per reference each measured spacing class beside the reference''s smallest DC-link gap; a class
      more than 2x stricter is flagged (narrows the search). Reported, not gated.'
    quick_ok: 'T0295: DRC-clean samples _quick_ok rejects over a fixed sealed sample (quick_ok_draws, L0 only), flagged when
      non-zero. Reported, not gated.'
    midpoint: 'T0297 note 2: whether the twin''s midpoint-of-needs rule decided a merged-band split, and which.'
    twin_copper: 'T0299: symmetric difference twin W vs snapped reconstruction per net, mm2 and fraction of the net''s area,
      with the twin mode. Scalar areas only (F5). Reported, not gated.'
    degradation: 'T0296: per reference whether the walk ran (rec[''walk'']) and its steps; D''s L_sub ratio gated.'
    near_ties: 'T0292: the near-tie union count is reported; --plan gives the cost at its expected and upper end.'
  twin_limitations:
  - rectangular merged bands are split by the midpoint-of-needs convention; the copper does not fix the boundary (T0297)
  - a column that fills the gap beside the narrower slot leaves no step, so the tie rule decides the split (T0300)
  - a neck from below or above that covers a slot's probe u enters the band's v-interval and counts as band copper, so the
    split can be wrong end to end (T0302 finding 0)
  - copper is assumed axis-parallel (non-rectilinear copper is staircased by the snapping rule first)
  failure_consequences:
    F1a_twin_gate_fails: 'objective: the reference is excluded and reported; INVALID only if no reference remains'
    F1b_control_fails: 'objective: experimental failure, E008 INVALID'
    D_misses_1p25_in_L_sub: 'implied by the objective: D does not meet F1(b)''s definition, so (b) cannot be completed for
      that reference and F1''s response applies: INVALID. Open: exclusion of only that reference (see founder decisions)'
    DegradeError: 'implied: no D exists, (b) cannot run, INVALID by the same reading; detected before any VM solve (fail fast).
      Open: see founder decisions'
    F1c_band_too_wide: 'objective: INVALID'
    F6a_to_d: 'objective: INVALID'
    F6e_spot_check_fails: 'objective: no verdict (INVALID), diagnosis and a founder decision'
  founder_decisions_before_registration:
  - 'D below 1.25 L_sub(twin) at the conservative end of its band, or DegradeError: INVALID for E008 (implied reading) or
    exclusion of that reference only (the objective gives exclusion only for the twin gates)'
  - the band check (e_R on >= 4 twin-vs-random pairs) and Case 4's twin gates come from the full-fidelity dev run on the VM
    (research/o003/e008_dev/burst_dev.sh); the local rows are smoke rows and do not decide either
  - 'before registration the same full-fidelity dev run (burst_dev.sh: gen2_0 with the full frozen search, 2D_Case_4 twin
    gates) answers reviews T0304 (findings 0, 1) and T0305 (finding 4): Run.drive, assemble_rows and evaluate run once end
    to end on real solvers, and meta.thermal_report gives, for every dev layout at the frozen rule, F6(a)''s node growth per
    level step, the per-die GCI with the count of gci_capped returning +inf, and whether the conservative +2 K test is attainable
    (own interval width <= 2 K). If it is not attainable on the twin or most candidates, A1 may be unreachable by construction:
    the founder decides before registration. No local full-fidelity run is needed (T0306)'
  - 'if any dev e_R exceeds 0.02, or either Case 4 twin gate fails: the founder decides (objective notes)'
  - the snapping check (0.125 mm, ~61 GB and ~12 h per solve at Case 4 size, two solves per off-grid reference)
  - 'config.references: the D0010 set with admissibility per reference, L_term, the reconstruction loader and hashes (T0263);
    --plan re-run on the real reconstructions (sizes here are Case 4 proxies)'
  - 'twin-copper areas of a customer reference in the rows (F5: scalar areas, no geometry) or vault-only'
  - 'T0262 finding: on 2D_Case_4 the frozen twin fails the DRC under the reference''s own measured rules (power-wire length
    a few um over the measured longest wire; measure_rules'' min_wire_pitch is the pitch between different dies). Which rule
    values apply to judged references (measured, with a stated tolerance, or the defaults for wire pitch) must be decided
    before registration, since a TwinError stops the reference'
  - row contract interpretations 1-9 (research/o003/e008_row_contract.md section 5)
  - 'budget: cpu_hours 320 holds for E008 only as process CPU time (234.6-308.3 h); as billed vCPU-hours E008 needs 339.2-450.8
    (phase B at the measured FV rate, T0306) and all VM work about 611-739 (cost_estimate.statement): which reading applies,
    or raise it'
  - 'F6(e) at Case 4 size: the finite-volume level-3 grid has 235 M cells (~350 GB at E009''s 1,500 B/cell); it fits only
    on the same 8-vCPU VM resized to ~416 GB of N2D extended memory (N2D allows 768 GB). This is above the ''~150+ GB'' the
    founder''s constraint (2026-11-09) names. If the account cannot exceed ~150 GB, F6(e) cannot run on a Case-4-sized AlN
    reference and E008 gives no verdict (F6e: INVALID). Choose: confirm ~416 GB is allowed; or a smaller AlN spot-check reference
    (FV level 3 <= ~85 M cells, i.e. 0.85 x 150 GB at 1,500 B/cell) once T0263''s reconstructions exist (the objective requires
    one reference per non-default stack type, not a particular one); or a memory-lean FV level 3 under a new spec'
  - 'EM memory model (T0262 attempt 5, fact): on 5 gen2_0-housing layouts at 0.5 mm cells the measured peaks were 1.1-2.6x
    the per-unknown model that --plan uses (fil_f 2.3-2.6x, thk_f up to 1.8x); on P3''s Case 4 they were 0.86-1.04x. The runner
    schedules with per-level priors until a solve of the same reference and level is measured, then by the measured ratio
    (Scheduler.learn), so packing is safe; but --plan''s concurrency (four 0.25 mm solves at once) holds only if the public
    references behave like Case 4. Re-run --plan on T0263''s reconstructions with their measured 0.5 mm peaks before registration'
  - '_quick_ok report (T0295) power: on 2D_Case_4 the smoke sample (100 draws) gave 0 DRC-clean samples; the registered 2,000
    draws gave 33, none rejected, so the false-rejection rate is <= 8.7 % (exact one-sided 95 % bound, now reported by the
    runner; research/o003/e008_dev/case4_prep.log). Whether quick_ok_draws should instead fix the number of DRC-clean samples
    (e.g. 100 clean -> bound 3 %) is a design choice for registration (reported, not gated, either way)'
  - '2D_Case_4 fail-fast facts (dev, L0/L1 only, attempt 5): twin mode fit+signal_feet with zero copper symmetric difference
    on DC+, DC- and PHASE, L1(W)/L1(reconstruction) = 1.0017; degrade() raises DegradeError (L1 ratio 1.232 < 1.388 after
    the walk reached a local maximum). Case 4 is a PowerSynth layout like both public references, so a DegradeError on them
