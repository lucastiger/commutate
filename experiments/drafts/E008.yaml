    rule: 'sealed seed s (orchestrator); per reference index i (order of config.references): candidate stream SeedSequence([s,
      0, i]), F1(b) control SeedSequence([s, 1, i]), _quick_ok sample SeedSequence([s, 2, i]); the stream is chunked by the
      driver (SeedSequence([seed, chunk])) and never depends on the schedule'
    purposes:
      main: 0
      control: 1
      quick_ok: 2
  quick_ok_draws: 2000
  per_reference_rules:
    rule: 'D0018 model-fix list item 1 (T0317): E008''s design rules of a reference are drc.rules.measure_rules on the snapped
      reconstruction with min_signal_wire_length set to None (the measured minimum gate/Kelvin-wire length, which measure_rules
      sets to the reference''s shortest signal wire, src/moduleforge/drc/rules.py line 587). Every upper bound (max_gate_wire_length,
      max_kelvin_wire_length, max_signal_wire_length) and every other measured rule is kept. One runner function builds them,
      e008_run.e008_rules, and writes info.rules_record (the dropped field, the value measure_rules gave it, the upper bounds
      kept, the fields changed). Every place the runner builds a reference or dev spec uses it (dev_reference: 2D_Case_4 from
      measure_rules plus its dev overrides; generator housing layouts from their generator spec''s rules, where the field
      is already None); the judged-reference loader judged_reference (T0320, D0019) uses it with no override, and prepare()
      refuses any spec without its rules_record or with min_signal_wire_length set (review T0319 finding 0). The twin, D (through
      d_spec) and every main and control candidate get the reference''s spec built from these rules, so the candidates lose
      the lower bound too.'
    basis: 'D0018 (project/decisions/D0018-o003-e008-degraded-copy-yardstick.md, model-fix list item 1, fixed before any candidate
      reference was screened) reads O003 scope_in''s enumerated rules as the complete meaning of "design rules at least as
      strict as the reference''s own"; the scope_in bondability rule bounds gate and Kelvin wires from above only (project/objectives/O003/objective.yaml
      lines 61-63; review T0315 finding 2, which flagged this as an interpretation for the founder). T0314 (research/notes/o003-twin-coverage.md
      section 1, variant R1) found this lower bound to be the only rule that stops a twin whose gate wires run to the nearest
      gate copper (2D_Case_2R: twin LS gate wires 4.597 mm against the reference''s 5.344-10.396 mm).'
    dropped:
    - min_signal_wire_length
    reported_not_gated: 'info.gate_wires: the shortest gate wire of the reference, W, D and the DRC-clean _quick_ok samples,
      and how many are shorter than DesignRules.min_wire_length (1.5 mm, a placeholder default that bounds power wires only;
      no cited minimum gate-wire length was found, T0314 R2). T0317 dev record: 2D_Case_4 W and D shortest 5.122 mm, its 33
      DRC-clean samples of 2,000 draws 5.734 mm (132 gate wires), none below 1.5 mm; the Case 4 reconstruction and the generator
      housing layouts (gen2_0, its W, D and smoke samples) carry no gate wires.'
    dev_effect: 'none on the dev references: 2D_Case_4''s reconstruction has no signal wires (measure_rules gives no lower
      bound) and generator housing specs set none, so the rules, W, D and samples are unchanged (Case 4 D fingerprint 6d63ff8f...,
      gen2_0 twin aade6489... as in the stored smoke rows)'
  degrade_power_width_floor_m: 0.0015
  degrade_power_width_floor_reason: 'D0018 decision 1 (T0316). D is a yardstick: it sets only L_sub(D), its band solves and
    w_ctrl = 2 e_R(control best, D); the control candidates come from the reference''s spec (search.run_control). So D''s
    power-net copper (DC+, PHASE, DC-) may be narrower than the reference''s own minimum power-net width, down to this floor:
    degrade() gets the reference''s spec with min_width_power = min(reference minimum, floor) (e008_run.d_spec); every other
    rule applies to D unchanged; W, the candidates and both searches keep the reference''s rules. Why 1.5 mm, the smallest
    floor the evidence supports: (a) the generator''s default minimum width is 1.0 mm (DesignRules.min_trace_width); (b) at
    1.0 mm D''s narrowest strip has 2 cells across at the band solves'' 0.5 mm levels (4 of the 5 levels), both edge cells,
    where the 20 MHz current crowds; at 1.5 mm it has 3 (one interior cell) and 6 at 0.25 mm. The lateral term of e_R(control
    best, D) on such strips could not be measured within T0316''s limits (no 0.25 mm solve; a 1.0 mm level cannot run on 0.5
    mm-grid layouts), so excluding 1.0 mm rests on this resolution argument (inference); the 0.5 mm thickness-term check is
    in research/o003/e008_dev/d_floor/l2_strip_check_gen2x1_w2_s11.json; (c) L0/L1 (research/o003/e008_dev/d_floor/floor_study.json,
    2D_Case_4 and 7 generator housing layouts with 2-5 mm power rules): D reaches the L1 target 1.3875 on 8/8 at 1.0 mm, 7/8
    at 1.5 mm, 6/8 at 2.0 mm and 3/8 at the reference minimum; on 2D_Case_4 1.421 (1.0 mm), 1.391 (1.5 mm: narrow_landing
    and 7 walk steps), 1.390 (2.0 mm), 1.232 (5 mm, DegradeError). Frozen: --verify-freeze checks this value against the runner
    constant DEGRADE_POWER_WIDTH_FLOOR_M and that it is >= 1 mm'
