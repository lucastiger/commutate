  - kind (customer|public)
  - vault_id
  - vault_sha256 or reconstruction_sha256
  - sic_mosfet_half_bridge (bool)
  - separate_antiparallel_diode_dies (bool; true -> excluded)
  - nda_permits_cloud_vm (bool, customer only)
  - admissible (bool)
  - reason
  - decided_at
  - L_term_H and its source
  - on_grid_0p5mm (bool)
  - snapping check values
