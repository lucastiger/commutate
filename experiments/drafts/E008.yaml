- name: null_twin_as_best_h_lo
  unit: ''
  description: 'declared A1 null: L_sub_null_H in place of L_sub_H; -a s_ref <= 0 by construction'
- name: l1_only_null_h_lo
  unit: ''
  description: 'reported null (F1, not gated): min over counted references of h_lo of the L1-only search (top 8 by L1 checked
    in L1 order, batch-and-stop, the first candidate meeting the conservative test), against the twin, twin rule first; w
    from its own band if F3 solved one, else the A1 best''s w (stated per reference). Expected at or below headroom_min_lo'
- name: n_counted_references
  unit: ''
  description: admissible references passing both twin gates
- name: stack_type_a3
  unit: ''
  description: 'F6(e): max over the non-default stack types with a spot check (first admissible reference of the type) of
    max_gci_consistency on that type''s spot-check reference; NaN if any is NaN'
- name: n_excluded_references
  unit: ''
  description: references excluded and reported (TwinError, DegradeError, D_misses_1p25_in_L_sub; D0018); D0019 expects 1
    (2D_Case_6, TwinError)
sanity_checks:
- name: freeze_hashes
  description: 'F3: every config.freeze file sha256 (the T0263 reconstruction script included, D0019) equals config.freeze,
    and the D0018 power-width floor equals the runner constant; checked before any reference is loaded (registered_run: a
    failure voids the run)'
- name: grid_rule_frozen
  description: 'F6(b): the GridRule file sha256 0226b770...0e9a and key for key equal config.fem_rule (both grid_rule_file_sha256
    and grid_rule_key_for_key)'
- name: thermal_fem_sha256
  description: 'F6(b): thermal_fem.py has the bytes EV-O007-01 evaluated (a216d5fe...)'
- name: metric_params_exact
  description: floor = 1e-3 K and tj_limit_K = 2.0 K exactly (T0283/T0284)
- name: fail_fast_twin_and_D
  description: W and D of every reference built (L1 only, D under the D0018 power-width floor) before the first l2_layout
    solve; a TwinError or DegradeError stops the reference (excluded and reported with the reason, D0018), not the run; passes
    iff every reference that reaches Run.drive has W and D and every excluded reference carries reason, detail and stage
- name: F1b_D_definition
  description: 'per reference: L_sub(D)/L_sub(W) (1 - 2 e_R(D, W)) >= 1.25 from the band solves of D and W, which Run.drive
    runs before any search, spot check or K1 read; a reference whose finite, converged ratio misses is excluded and reported
    (D0018 decision 2), so the per-reference checks run on the remaining references and the declared check passes iff all
    of them pass. A non-finite L or e_R or a non-converged band solve of D or W fails it (INVALID, T0318 finding 0), never
    an exclusion'
- name: F1a1_F1a2_twin_gates
  description: 'per reference (exclusion, not INVALID): inductance and thermal twin gates as headroom_per_reference computes
    them; the declared check passes iff both gates were computed (booleans) for every reference that reached the rows, a failed
    gate excludes that reference (F1(a)) and is listed in the detail (declared_sanity, T0320)'
- name: at_least_one_counted_reference
  description: 'F1(a): E008 INVALID if no reference remains'
- name: F1b_control
  description: 'h_ctrl >= h_plant - w_ctrl per reference (new sealed seed, same budget, inductance only) (declared check:
    all of the per-reference checks ''F1b_control:<reference>'', one for every reference that reached the rows, a missing
    one fails; declared_sanity, T0320)'
- name: F1c_band_width
  description: 'w <= 0.05 for the A1 best and w_ind for the inductance-only best, every reference (declared check: all of
    the per-reference checks ''F1c_band_width:<reference>'', one for every reference that reached the rows, a missing one
    fails; declared_sanity, T0320)'
- name: F6a_own_three_grids
  description: 'per thermal solve: fingerprint of the layout, node counts x8 +/- 15 % per level, every GCI recomputed by gci_capped
    (declared check: all of the per-reference checks ''F6a_own_three_grids:<reference>'', one for every reference that reached
    the rows, a missing one fails; declared_sanity, T0320)'
- name: F6c_energy_balance
  description: '|Q_out/Q_in - 1| <= 1e-6 on every thermal solve: scikit-fem levels 0-2, the calibration and the F6(e) finite-volume
    spot-check solves (T0305 finding 5); NaN-aware maximum, a NaN or infinite value fails (T0308 finding 5) (declared check:
    all of the per-reference checks ''F6c_energy_balance:<reference>'', one for every reference that reached the rows, a missing
    one fails; declared_sanity, T0320)'
- name: F6c_picard
  description: 'last Picard max|dT| <= 1e-4 K on every thermal solve: scikit-fem levels 0-2, the calibration and the F6(e)
    finite-volume spot-check solves, whose picard_dT child_fv records from the ThermalResult meta (T0307 finding 0), so the
    gate is shown, not implied by solve_layout_level''s default tolerance. F6(c) maxima are NaN-aware: a NaN or infinite energy
    balance or Picard residual fails F6(c) (T0308 finding 5); a spot-check record without picard_dT counts as NaN (declared
    check: all of the per-reference checks ''F6c_picard:<reference>'', one for every reference that reached the rows, a missing
    one fails; declared_sanity, T0320)'
- name: F6d_operating_point
  description: 'the reconstruction''s level-0 hottest-die rise at P_ref within 60 +/- 1 K before any candidate solve (declared
    check: all of the per-reference checks ''F6d_operating_point:<reference>'', one for every reference that reached the rows,
    a missing one fails; declared_sanity, T0320)'
- name: F6e_stack_type_spot_check
  description: 'max_gci_consistency (scikit-fem L0-2 vs thermal_fv L1-3, cap 0.25 K, floor 1e-3 K) <= 1 on every die of one
    reference per non-default stack type (AlN). Stack type = the substrate layers, the die-attach and die layers, each by
    name, material, thickness and k (T0305 finding 0), and the sorted set of per-die (Die.thickness, Die.attach_thickness)
    of the reference layout and of its derivative spec''s die, the thicknesses the thermal solvers use (T0308 finding 1);
    default = C004''s Al2O3 DBC stack with dies of the default thicknesses. Rounding rule (T0310 finding 3): every thickness
    in the signature as integer nanometres (round half to even of t / 1 nm), every k to 9 significant digits, so a difference
    by float rounding alone does not make a new type (a NaN or infinite thickness raises: no type, the reference stops). A
    NaN or infinite Tj in any of the six levels of a spot-check die gives that die A3 = NaN, which fails the per-type check
    and the aggregate (T0310 finding 2). The spot-check reference of a type is its first ADMISSIBLE reference in config.references
    order (T0307 finding 1, T0308 finding 2). A non-default type with no admissible reference gets no spot check and no per-type
    check: it is reported in the evaluation report under F6e.<type> with reference null and status ''no admissible reference'',
    and in this check''s detail (no_admissible_reference), not failed (reading of scope_in''s ''every stack type'' as every
    type of the D0010 reference set, which holds admissible references only; an inadmissible reference contributes no rows).
    One check F6e_stack_type_spot_check:<type> per type with a spot check, every one gated (a NaN or infinite A3 fails); this
    declared check passes only if all of them pass'
- name: driver_s_ref_matches_rows
  description: 'per reference: the s_ref the frozen driver was given (its near-tie window and w) equals snapping_bias of the
    reference row, so the band solves the metric needs exist (T0304 finding 3) (declared check: all of the per-reference checks
    ''driver_s_ref_matches_rows:<reference>'', one for every reference that reached the rows, a missing one fails; declared_sanity,
    T0320)'
- name: recompute_agrees
  description: runner metrics equal mfos.metrics and research/o003/headroom_metrics.py (rel 1e-9)
