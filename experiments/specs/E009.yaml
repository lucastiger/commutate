metrics:
- name: max_case_scaled_err
  description: 'A1/K1. max over the reference cases (Muzychka 2003 Cases 1a, 1b, 2, 3; N-layer default
    stack; the manufactured case) and their reported points (per source: centroid node, Galerkin source-face
    mean, node at the frozen reference maximum; manufactured: its nine frozen points) of |T_fem - T_ref|
    / case_scale, finest grid (level 2) of the frozen rule; every point value is a nodal value at a node
    present on all three grids (no interpolation). Deterministic maximum over the full set: point value,
    no CI, level 0.0.'
  unit: ''
- name: max_abs_err_K
  description: A2/K2. max |T_fem - T_ref| over the same rows, K. Point value, level 0.0.
  unit: K
- name: max_l2_consistency
  description: 'A3. max over every die of the five layouts (2 dev, 3 fresh from the sealed seed) of |fem_lv2
    - l2_lv3| / (gci_capped(fem_lv0..2) + gci_capped(l2_lv1..3)), floor 1e-3 K (mfos.metrics max_gci_consistency);
    +inf if either sequence diverges, if the summed estimate is zero with a nonzero difference, or if
    any die''s L2 GCI exceeds ref_gci_cap = f5_max_K = 0.25 K (F5, I0099: A3 not met, no redraw). Point
    value, level 0.0.'
  unit: ''
- name: max_conservative_gci_K
  description: A4. max over every reported scikit-fem value (finest case rows and every die of the five
    layouts) of mfos.metrics.gci_capped(fem_lv0, fem_lv1, fem_lv2, floor 1e-3 K) (O006's A4 estimator,
    D0012/D0013, unchanged); +inf if any diverges. Point value, level 0.0.
  unit: K
- name: null_dT_const_k_scaled_err
  description: F3 null in A1 form on dT_const_k (constant k per material at its volume-mean temperature
    of the finest k(T) solve; equals T_fem on the constant-k series cases); must exceed 0.01.
  unit: ''
- name: null_dT_const_k_abs_err_K
  description: F3 null in A2 form; must exceed 0.05 K.
  unit: K
- name: a3_fresh
  description: secondary. A3 on the three fresh (held-out) layouts only.
  unit: ''
- name: a3_dev
  description: secondary. A3 on the two development layouts only.
  unit: ''
- name: a4_fresh_K
  description: secondary. A4 on the fresh-layout dies only.
  unit: K
- name: a4_dev_K
  description: secondary. A4 on the dev-layout dies only.
  unit: K
- name: a4_cases_K
  description: secondary. A4 on the reference-case points only.
  unit: K
- name: max_a3_ratio_const_k
  description: secondary null. max over dies of |dT_const_k - l2_lv3| / (GCI_fem + GCI_L2) (the constant-k
    scikit-fem column at level 2 in place of fem_lv2); informational.
  unit: ''
- name: max_l2_gci_K
  description: F5 (NOT gated). max over every die of gci_capped(l2_lv1..3, 1e-3 K); above 0.25 K makes
    A3 +inf.
  unit: K
- name: n_f5_fail_dies
  description: F5. number of dies whose L2 GCI exceeds 0.25 K (per-die f5_ok in the rows).
  unit: ''
- name: n_oscillatory_values
  description: F2. reported values in the oscillatory A4 branch (informational).
  unit: ''
- name: n_non_asymptotic_values
  description: F2. reported values with p_obs outside [0.5, 2] or undefined (informational).
  unit: ''
- name: n_same_side_dies
  description: A3 context. dies whose two solvers converge from the same side (a weak A3 pair).
  unit: ''
- name: n_fem_solves_cg_over_300
  description: count of scikit-fem solves (any level, calibration or constant-k) with more than 300 CG
    iterations in a Picard step (informational; the gate is linear_solver_headroom).
  unit: ''
sanity_checks:
- name: reference_sha256
  description: F1. canonical sha256 of both frozen reference payloads equals config (series befc5efa...,
    manufactured ca05847b...), checked before any solve; a mismatch stops the run
- name: series_cases_match_frozen_parameters
  description: F1. the series generator's cases equal the frozen JSON parameters (the cases are built
    from the JSON)
- name: series_converged
  description: F1. doubling every series knob changes every frozen value by < 1e-7 of its rise (e006_run.series_checks)
- name: case3_printed_values
  description: F1. own Muzychka implementation at the paper's 50 terms reproduces the printed Case 3 values
- name: nlayer_reduces_to_two_layer
  description: F1. N-layer series with layers sharing two conductivities equals the two-layer series (rel
    1e-9)
- name: mms_numeric_check
  description: F1. e006_mms self-checks all pass, generator sha256 equals the frozen file, ceramic k_max/k_min
    - 1 >= 0.30 (e006_run.mms_checks)
- name: fem_rule_frozen
  description: config.fem_rule equals research/o007_dev3/frozen_config.json, feasible true with no level
    missing, and thermal_fem's production constants equal the frozen ones (SNAP_FRACTION, LINEAR_RTOL,
    CG_MAXITER, AMG_SEED, PICARD_TOL_K, REFINEMENT_RATIO, LEVELS, DATA_INTORDER 7); checked before any
    solve, a mismatch stops the run. Per solve the runner also asserts result meta amg_gs_sweeps == fem_rule
    amg_gs_sweeps (an error, never a verdict)
- name: layout_fingerprints
  description: F4. the two dev fingerprints equal config; the three fresh sealed-seed layouts are one
    per family and the five fingerprints are distinct (all recorded in the detail and the domain)
- name: node_persistence
  description: F2. every reported case point (all but the Galerkin means) is a DOF at the same used (snapped)
    coordinates and on the same grid lines at levels 0, 1 and 2; snaps (requested, used, distance) and
    stencils per level are in the rows (T0198)
- name: node_count_growth
  description: F2. scikit-fem node (DOF) count and L2 cell count grow by 8 +/- 15 % from each level to
    the next (r = 2 in x, y and z), for every case and layout
- name: constant_refinement_ratio
  description: F2. every level-l grid line is kept and every level-l cell is bisected in x, y and z at
    level l+1, both solvers (e006_run.Stats.lines on the production grid lines)
- name: energy_balance
  description: F2. |Q_out/Q_in - 1| <= 1e-6 in every solve of both solvers (calibration and constant-k
    included); the manufactured case also against the integrated reference outflow (64.648 W)
- name: picard_converged
  description: F2. last Picard max|dT| < 1e-4 K in every k(T) solve of both solvers
- name: operating_point
  description: O003 point. every layout's scikit-fem level-0 hottest-die rise within 60 +/- 1 K at the
    recorded equal power per die (the rise computed at exactly that power; calibration raises if 0.25
    K is not met in 10 solves)
- name: linear_solver_headroom
  description: I0110/T0222. no scikit-fem solve (every level, calibration and constant-k solve, all feeding
    reported values or nulls) has cg_hit_maxiter True; per-solve cg_max_iterations and linear_rel_residual_max
    are in the rows
